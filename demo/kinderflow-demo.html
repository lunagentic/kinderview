<title>KinderFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* KinderFlow — 화면 스타일
   레퍼런스: 짙은 네이비 크롬 + 밝은 회색 바탕 위 흰 카드,
   인디고·오키드·앰버 팔레트, 끝이 완전히 둥근 알약형 바.

   색 규칙
   · 프로젝트  = 정체성 색 (팔레트에서 id 로 고정 배정)
   · 상태      = 의미 색 (대기·진행·검토·완료·지연·이슈)
   · 앰버      = 강조 하나 (활성 메뉴 밑줄, 이슈)
   구조 자체는 여전히 무채색이다. 색이 붙는 곳은 위 세 가지뿐. */

:root{
  /* 바탕과 면 */
  --ground:#F4F5F8;
  --surface:#FFFFFF;
  --surface-2:#EEEFF4;
  --line:#E4E6ED;
  --line-soft:#EDEEF3;
  --ink:#151A2D;
  --ink-2:#3B4256;
  --muted:#727A90;

  /* 크롬 (상단바) */
  --chrome:#1E2440;
  --chrome-2:#2A3157;
  --on-chrome:#EDEFF7;
  --on-chrome-muted:#9AA2C0;

  /* 브랜드 */
  --indigo:#4B3FE4;
  --orchid:#D24FD8;
  --amber:#F5B02E;
  --teal:#14B8A6;
  --purple:#7A4FD4;
  --rose:#E5455F;
  --focus:var(--indigo);

  /* 프로젝트 색 — id 로 고정 배정된다 (ui.js projectTone).
     4칸이다. 6칸일 때는 보라(#7A4FD4)와 파랑(#2E7DF6)이 구분되지 않았다
     (정상 시야 ΔE 13.3, 기준 15). 색은 보조 신호다 — 어디서든 점 옆에
     프로젝트 이름이 함께 나온다. 로즈는 넣지 않는다: 지연(빨강)과 섞여 경고로 읽힌다.
     대비·색각 검증을 통과한 값이다. 바꾸려면 다시 검증할 것. */
  --p0:#3B2FC8; --p1:#CE5EC6; --p2:#0E9384; --p3:#C77B12;

  /* 상태 */
  --s-wait:#858CA6;
  --s-prog:#4B3FE4;
  --s-review:#7A4FD4;
  --s-done:#0E9F8F;
  --s-delay:#DB3A52;
  --s-issue:#C9820A;

  --radius:8px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(21,26,45,.05), 0 10px 28px rgba(21,26,45,.07);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"D2Coding",monospace;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1120; --surface:#171B2E; --surface-2:#1F2438;
    --line:#2B3149; --line-soft:#242940;
    --ink:#E7E9F4; --ink-2:#B7BDD2; --muted:#8990A8;
    --chrome:#12162A; --chrome-2:#1D2340;
    --on-chrome:#E7E9F4; --on-chrome-muted:#8A92B2;
    --indigo:#7C72F5; --orchid:#E27BE8; --amber:#F5BE55;
    --teal:#2DD4BF; --purple:#A188EC; --rose:#F2697F;
    --p0:#6055DE; --p1:#C85FC0; --p2:#17A187; --p3:#C08722;
    --s-wait:#949BB4; --s-prog:#7C72F5; --s-review:#A188EC;
    --s-done:#2DD4BF; --s-delay:#F2697F; --s-issue:#E0A83E;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1120; --surface:#171B2E; --surface-2:#1F2438;
  --line:#2B3149; --line-soft:#242940;
  --ink:#E7E9F4; --ink-2:#B7BDD2; --muted:#8990A8;
  --chrome:#12162A; --chrome-2:#1D2340;
  --on-chrome:#E7E9F4; --on-chrome-muted:#8A92B2;
  --indigo:#7C72F5; --orchid:#E27BE8; --amber:#F5BE55;
  --teal:#2DD4BF; --purple:#A188EC; --rose:#F2697F;
  --p0:#6055DE; --p1:#C85FC0; --p2:#17A187; --p3:#C08722;
  --s-wait:#949BB4; --s-prog:#7C72F5; --s-review:#A188EC;
  --s-done:#2DD4BF; --s-delay:#F2697F; --s-issue:#E0A83E;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
/* hidden 속성은 어떤 display 선언보다 우선한다 —
   .risks-more 처럼 display 를 지정한 요소에서 접기가 무시되는 것을 막는다 */
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.3;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 상단바 ─────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:28px;flex-wrap:wrap;
  padding:12px 24px;background:var(--chrome);color:var(--on-chrome);border-bottom:none;
}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand-mark{font-family:var(--display);font-weight:800;font-size:1.12rem;letter-spacing:-.03em}
.brand-sub{font-size:.68rem;color:var(--on-chrome-muted);letter-spacing:.02em}
.gnb{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.gnb a{
  position:relative;padding:9px 13px 10px;color:var(--on-chrome-muted);
  font-weight:500;font-size:.9rem;border-bottom:2px solid transparent;
}
.gnb a:hover{color:var(--on-chrome)}
.gnb a.active{color:var(--on-chrome);border-bottom-color:var(--amber)}
.topbar-right{display:flex;align-items:center;gap:12px}
.me-picker{display:flex;align-items:center;gap:7px}
.me-label{font-size:.72rem;color:var(--on-chrome-muted);white-space:nowrap}

/* ── 폼 요소 ────────────────────────────── */
.topbar select{background:var(--chrome-2);border-color:var(--chrome-2);color:var(--on-chrome)}
.topbar select:hover{border-color:var(--on-chrome-muted)}
.topbar .btn-primary{background:var(--amber);color:#25200A;border-color:var(--amber)}
.topbar .btn-primary:hover{filter:brightness(1.06);opacity:1}

select,input[type=text],input[type=date],input[type=search],textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:7px 10px;min-width:0;
}
select:hover,input:hover,textarea:hover{border-color:var(--muted)}
textarea{width:100%;resize:vertical;min-height:76px;line-height:1.6}
label.field{display:flex;flex-direction:column;gap:5px;min-width:0}
label.field > span.lab{font-size:.78rem;color:var(--muted);font-weight:500}
label.field > span.lab .req{color:var(--s-delay);margin-left:2px}
.hint{font-size:.76rem;color:var(--muted)}

.btn{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:7px 14px;font-weight:500;font-size:.88rem;cursor:pointer;white-space:nowrap;
}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.btn-primary:hover{opacity:.88}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:5px 8px}
.btn-ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn-danger{color:var(--s-delay);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── 레이아웃 ───────────────────────────── */
.view{max-width:1320px;margin:0 auto;padding:28px 24px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:1.6rem;font-weight:800;letter-spacing:-.03em}
.page-head .sub{font-size:.84rem;color:var(--muted);margin-top:4px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.section{margin-top:34px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:16px}
.section-head h2{font-size:1.06rem;font-weight:800;letter-spacing:-.02em}
.section-head .meta{font-size:.78rem;color:var(--muted)}
.scroller{overflow-x:auto}
.grid-2{display:grid;gap:26px;grid-template-columns:1fr}
@media (min-width:1000px){.grid-2{grid-template-columns:1fr 1fr}}

/* ── 요약 카드 ──────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--surface);padding:16px 17px;border:none;text-align:left;cursor:pointer;display:block;width:100%}
.stat:hover{background:var(--surface-2)}
.stat .k{font-size:.76rem;color:var(--muted);margin-bottom:3px}
.stat .v{font-family:var(--display);font-size:1.85rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em}
.stat.alert .v{color:var(--s-delay)}
.stat.warn .v{color:var(--s-issue)}
.stat.zero .v{color:var(--muted)}

/* ── 진행률 바 ──────────────────────────── */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 46px;gap:14px;align-items:center;
  font-size:.87rem;background:none;border:none;padding:5px 4px;cursor:pointer;text-align:left;width:100%;border-radius:var(--radius)}
.bar:hover{background:var(--surface-2)}
.bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:9px;background:var(--surface-2);border-radius:999px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--pc,var(--indigo));border-radius:999px}
.bar .fill.none{background:var(--line)}
.bar .pct{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2);font-size:.84rem}
.bar .sub{grid-column:1/-1;font-size:.74rem;color:var(--muted);padding-left:2px}

/* ── 담당자 카드 ────────────────────────── */
.owners{display:flex;flex-wrap:wrap;gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden}
.owner{background:var(--surface);padding:14px 16px;border:none;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:9px;flex:1 1 228px;min-width:228px}
.owner:hover{background:var(--surface-2)}
.owner .top{display:flex;align-items:center;gap:8px}
.owner .nm{font-family:var(--display);font-weight:700;font-size:.98rem}
.owner .counts{display:flex;gap:12px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.owner .counts b{color:var(--ink-2);font-family:var(--mono);font-weight:500}
.owner .counts .bad b{color:var(--s-delay)}

.avatar{width:22px;height:22px;border-radius:50%;background:var(--surface-2);
  display:grid;place-items:center;font-size:.68rem;color:var(--muted);flex:none;
  font-family:var(--display);font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:18px;height:18px;font-size:.6rem}
.person{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.person .inactive{font-size:.7rem;color:var(--muted)}

/* ── 칩 ─────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid currentColor;border-radius:999px;
  padding:1px 10px 1px 8px;font-size:.76rem;font-weight:600;line-height:1.65;white-space:nowrap}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.chip.plain::before{display:none}
.chip.wait{color:var(--s-wait)} .chip.prog{color:var(--s-prog)} .chip.review{color:var(--s-review)}
.chip.done{color:var(--s-done)} .chip.delay{color:var(--s-delay)} .chip.issue{color:var(--s-issue)}
.chip.area{color:var(--muted);border-style:dashed}
.pdot{display:inline-block;width:8px;height:8px;border-radius:999px;
  background:var(--pc,var(--muted));flex:none;margin-right:7px;vertical-align:0}
.pname{display:inline-flex;align-items:center;white-space:nowrap}

.flags{display:inline-flex;gap:5px;align-items:center}
.flag{font-size:.78rem;cursor:default}
.flag.delay{color:var(--s-delay)} .flag.issue{color:var(--s-issue)}

/* ── 필터 ───────────────────────────────── */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:5px 13px;font-size:.83rem;cursor:pointer;color:var(--ink-2)}
.quick button:hover{border-color:var(--muted)}
.quick button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter-row select,.filter-row input{font-size:.85rem;padding:6px 9px}

/* ── 테이블 ─────────────────────────────── */
table{border-collapse:collapse;width:100%;font-size:.88rem}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
thead th{position:sticky;top:0;background:var(--surface);z-index:1;
  font-family:var(--mono);font-weight:500;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr.row-click{cursor:pointer}
tbody tr.row-click:hover{background:var(--surface-2)}
td.title-cell{font-weight:500;min-width:190px}
td.nowrap,th.nowrap{white-space:nowrap}
td.due.late{color:var(--s-delay);font-weight:500}
.sev-bar{display:inline-block;width:3px;height:15px;border-radius:2px;vertical-align:-3px;margin-right:8px;background:var(--line)}
.sev-bar.HIGH{background:var(--s-delay)} .sev-bar.NORMAL{background:var(--s-wait)} .sev-bar.LOW{background:var(--line)}

/* ── 빈 상태 ────────────────────────────── */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
  padding:44px 24px;text-align:center;color:var(--muted)}
.empty h3{font-size:1rem;color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}
.loading{padding:44px;text-align:center;color:var(--muted)}
.error-box{background:var(--surface);border:1px solid var(--s-delay);border-left-width:3px;
  border-radius:var(--radius);padding:16px 18px;color:var(--ink-2)}

/* ── 모달 / 드로어 ──────────────────────── */
.backdrop{position:fixed;inset:0;background:rgba(16,23,40,.42);z-index:40;display:flex;
  align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);
  width:min(760px,100%);max-width:100%}
.modal.wide{width:min(940px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:1.05rem;font-weight:700}
.modal-body{padding:20px}
.modal-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 20px;border-top:1px solid var(--line);
  background:var(--surface);flex-wrap:wrap}
.modal-foot .right{display:flex;gap:8px;margin-left:auto}

.form-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:680px){
  .form-grid{grid-template-columns:1fr 1fr}
  .form-grid .span2{grid-column:1/-1}
}
.fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:6px}
.fieldset > legend{font-size:.78rem;color:var(--muted);padding:0 6px;font-weight:500}
details.more{margin-top:6px}
details.more > summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding:6px 0}
details.more[open] > summary{color:var(--ink)}

/* 멤버 선택 */
.member-pick{position:relative}
.member-pick .selected{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.token{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:999px;padding:2px 6px 2px 4px;font-size:.8rem}
.token button{border:none;background:none;cursor:pointer;color:var(--muted);padding:0 2px;line-height:1}
.token button:hover{color:var(--s-delay)}
.pick-list{position:absolute;z-index:5;top:100%;left:0;right:0;margin-top:4px;max-height:220px;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pick-list button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border:none;background:none;padding:8px 11px;cursor:pointer;font-size:.87rem}
.pick-list button:hover{background:var(--surface-2)}
.pick-list .none{padding:10px 12px;color:var(--muted);font-size:.83rem}

/* ── 업무 상세 ──────────────────────────── */
.detail-grid{display:grid;grid-template-columns:1fr;gap:22px}
@media (min-width:800px){.detail-grid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:88px 1fr;gap:8px 14px;font-size:.88rem;align-items:baseline}
.kv dt{color:var(--muted);font-size:.8rem}
.kv dd{margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.panel h3{font-size:.92rem;font-weight:700;margin-bottom:11px}
.timeline{display:flex;flex-direction:column;gap:9px;font-size:.82rem}
.timeline .ev{display:grid;grid-template-columns:96px 1fr;gap:10px;color:var(--ink-2)}
.timeline .ev .t{color:var(--muted);font-family:var(--mono);font-size:.75rem}
.issue-mini{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:.86rem}
.issue-mini:last-child{border-bottom:none}
.status-select{font-weight:500}

/* ── Weekly ─────────────────────────────── */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px}
.report h2{font-size:1.1rem;margin-bottom:2px}
.report .rsec{margin-top:28px}
.report .rsec > h3{font-size:.95rem;font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:12px;
  display:flex;gap:9px;align-items:baseline}
.report .rsec > h3 .n{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.report ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:5px;font-size:.88rem}
.report .delta{font-family:var(--mono);font-size:.78rem}
.delta.up{color:var(--s-done)} .delta.down{color:var(--s-delay)} .delta.flat{color:var(--muted)}
.pill-row{display:flex;flex-wrap:wrap;gap:9px}
.pill{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;min-width:98px;background:var(--surface)}
.pill .k{font-size:.74rem;color:var(--muted)}
.pill .v{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.pill.bad .v{color:var(--s-delay)}
.report .bars .bar{grid-template-columns:minmax(90px,160px) minmax(0,520px) 46px;cursor:default}

/* ── 알림함 ─────────────────────────────── */
.notice{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--s-issue);
  border-radius:var(--radius);padding:14px 17px;margin-bottom:18px;font-size:.87rem;color:var(--ink-2)}
.notice b{color:var(--ink)}
.noti{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:12px 15px;display:grid;gap:5px}
.noti-list{display:flex;flex-direction:column;gap:8px}
.noti .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.noti .ttl{font-weight:500}
.noti .body{white-space:pre-wrap;color:var(--ink-2);font-size:.84rem;
  border-left:2px solid var(--line);padding-left:11px;margin-top:3px}
.noti .when{font-family:var(--mono);font-size:.73rem;color:var(--muted);margin-left:auto}
.tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;color:var(--muted);
  border:1px solid var(--line);border-radius:2px;padding:1px 5px}
.tag.SENT{color:var(--s-done);border-color:currentColor}
.tag.SKIPPED{color:var(--muted)}
.tag.FAILED{color:var(--s-delay);border-color:currentColor}

/* ── 토스트 ─────────────────────────────── */
.toast-root{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:999px;
  font-size:.87rem;box-shadow:var(--shadow)}
.toast.bad{background:var(--s-delay);color:#fff}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ── 모바일 ─────────────────────────────────
   표는 카드로 접고, 상단바는 2줄로 나눈다.
   조회와 상태 변경까지가 모바일의 범위다 (docs/06 §6.8). */
@media (max-width:860px){
  .topbar{
    gap:10px 12px;padding:9px 14px;
    display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand right" "nav nav";
  }
  .brand{grid-area:brand;min-width:0}
  .brand-sub{display:none}
  .topbar-right{grid-area:right;gap:8px}
  .gnb{
    grid-area:nav;flex-wrap:nowrap;overflow-x:auto;gap:2px;
    margin:0 -14px;padding:0 14px 2px;scrollbar-width:none;
  }
  .gnb::-webkit-scrollbar{display:none}
  .gnb a{white-space:nowrap;padding:6px 11px}
  .me-label{display:none}
  #me-select{max-width:104px}

  .view{padding:18px 14px 72px}
  .page-head{gap:12px}
  .page-head h1{font-size:1.3rem}
  .page-actions{width:100%}
  .page-actions .btn,.page-actions select{flex:1 1 auto}

  /* 손가락으로 누를 수 있는 크기 */
  .btn,select,input[type=text],input[type=date],input[type=search]{min-height:40px}
  .quick button{min-height:36px;white-space:nowrap}

  .stats{grid-template-columns:repeat(3,1fr)}
  .stat{padding:12px 13px}
  .stat .v{font-size:1.35rem}

  .filter-row,.quick{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;
    margin:0 -14px;padding:0 14px 2px}
  .filter-row::-webkit-scrollbar,.quick::-webkit-scrollbar{display:none}
  .filter-row > *{flex:0 0 auto}

  .bar{grid-template-columns:minmax(78px,1fr) minmax(0,2fr) 42px}
  .report .bars .bar{grid-template-columns:minmax(78px,1fr) minmax(0,2fr) 42px}

  /* 표 → 카드 */
  .table-wrap{border:none;background:none;overflow:visible}
  .table-wrap table{min-width:0;display:block}
  .table-wrap thead{display:none}
  .table-wrap tbody{display:flex;flex-direction:column;gap:9px}
  .table-wrap tr{
    display:flex;flex-direction:column;gap:7px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;
  }
  .table-wrap tr:hover{background:var(--surface)}
  /* 셀 하나가 카드의 한 줄이 된다. display:contents 를 쓰면
     셀 안의 요소들이 각각 그리드 항목이 되어 라벨-값 짝이 깨진다. */
  /* flex 로 둔다. grid 를 쓰면 셀 안의 텍스트 노드와 span 이
     각각 그리드 항목이 되어 "9/2" 와 "-2일" 이 줄바꿈된다. */
  .table-wrap td{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    border:none;padding:0;font-size:.88rem;
  }
  .table-wrap td[data-label]::before{
    content:attr(data-label);color:var(--muted);font-size:.76rem;white-space:nowrap;
    flex:0 0 58px;
  }
  .table-wrap td > *{flex:0 1 auto}
  .table-wrap td.title-cell{
    display:block;font-weight:600;font-size:.98rem;
    padding-bottom:8px;margin-bottom:3px;border-bottom:1px solid var(--line-soft);
  }
  .table-wrap select{flex:1 1 auto;max-width:170px}
  .risk .head h3{flex:1 1 auto;min-width:0}
  .sev-bar{margin-right:6px}

  /* 모달은 화면을 거의 채운다 */
  .backdrop{padding:0;align-items:stretch}
  .modal,.modal.wide{width:100%;max-width:100%;border-radius:0;border:none;
    display:flex;flex-direction:column;min-height:100dvh}
  .modal-body{flex:1;overflow-y:auto}
  .modal-foot{position:sticky;bottom:0}
  .modal-foot .right{width:100%}
  .modal-foot .right .btn{flex:1}

  .detail-grid{gap:16px}
  .kv{grid-template-columns:74px 1fr}
  .panel{padding:14px 15px}
  .report{padding:18px 16px}
  .pill{min-width:88px;flex:1 1 88px}

  /* 위험 신호 항목은 세로로 쌓는다 */
  .risk li button,.risk li .static{flex-wrap:wrap;gap:3px 9px}
  .risk li .sub{flex-basis:100%;white-space:normal}
  .risk li .note{margin-left:0}
  .risk .head{gap:7px}
  .risk .head h3{font-size:.9rem}

  .lead-row{grid-template-columns:1fr;gap:6px}
  .noti .when{margin-left:0;flex-basis:100%}
  .toast-root{left:14px;right:14px;transform:none;bottom:18px}
  .toast{text-align:center}
}

@media (max-width:420px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .bar{grid-template-columns:minmax(64px,1fr) minmax(0,1.6fr) 38px}
  .brand-mark{font-size:1.02rem}
  .capture .crow{flex-wrap:wrap}
  .capture .crow .btn{width:100%}
}

/* ── AI: 위험 신호 ──────────────────────────── */
.risks{display:flex;flex-direction:column;gap:10px}
.risk{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--s-wait);
  border-radius:var(--radius);padding:14px 16px}
.risk.high{border-left-color:var(--s-delay)}
.risk.medium{border-left-color:var(--s-issue)}
.risk .head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.risk .head h3{font-size:.95rem;font-weight:700}
.risk .sev{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid currentColor;border-radius:2px;padding:0 5px;color:var(--s-wait)}
.risk.high .sev{color:var(--s-delay)} .risk.medium .sev{color:var(--s-issue)}
.risk .cnt{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-left:auto}
.risk .detail{font-size:.84rem;color:var(--ink-2);margin-top:5px}
.risk ul{list-style:none;margin:11px 0 0;padding:0;display:flex;flex-direction:column;gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden}
.risk li{background:var(--surface)}
.risk li button,.risk li .static{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;
  border:none;background:none;padding:8px 12px;font-size:.85rem;cursor:pointer}
.risk li .static{cursor:default}
.risk li button:hover{background:var(--surface-2)}
.risk li .lbl{font-weight:500}
.risk li .sub{color:var(--muted);font-size:.79rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.risk li .note{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.risk.high li .note{color:var(--s-delay)}
.risks-ok{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--s-done);
  border-radius:var(--radius);padding:15px 17px;font-size:.88rem;color:var(--ink-2)}
.risks-ok b{color:var(--s-done)}
.src-tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;color:var(--muted);
  border:1px solid var(--line);border-radius:2px;padding:1px 6px}
.src-tag.llm{color:var(--s-prog);border-color:currentColor}

/* ── AI: 주간 요약문 ────────────────────────── */
.digest{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:17px 19px;margin-bottom:22px}
.digest .dhead{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.digest .dhead h3{font-size:.95rem;font-weight:700}
.digest .dhead .btn{margin-left:auto}
.digest p.sum{font-size:.92rem;line-height:1.75;color:var(--ink)}
.digest .dlist{margin:13px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.digest .dlist li{font-size:.86rem;color:var(--ink-2);padding-left:14px;position:relative}
.digest .dlist li::before{content:"·";position:absolute;left:3px;color:var(--muted)}
.digest .dsub{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;
  font-family:var(--mono);margin-top:14px}

/* ── AI: 빠른 입력 ──────────────────────────── */
.capture{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 15px;margin-bottom:18px}
.capture .crow{display:flex;gap:8px;align-items:center}
.capture input{flex:1;background:var(--surface)}
.capture .chint{font-size:.76rem;color:var(--muted);margin-top:7px}
.capture .cres{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.capture .cres .tok{font-size:.76rem;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:2px 9px;color:var(--ink-2)}
.capture .cres .tok b{color:var(--ink)}
.risks-more{display:flex;flex-direction:column;gap:10px}
.risks-toggle{align-self:flex-start;font-size:.84rem;color:var(--ink-2)}

/* ── 영역 리드 ──────────────────────────────── */
.lead-box{display:flex;align-items:center;gap:7px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;min-height:36px;font-size:.9rem}
.lead-box .lead-none{color:var(--muted);font-size:.82rem}
.lead-table{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden}
.lead-row{background:var(--surface);display:grid;grid-template-columns:1fr 200px;gap:14px;
  align-items:center;padding:9px 14px}
.lead-area{font-weight:500;font-size:.9rem}
.area-lead-tag{color:var(--muted);font-size:.78rem;display:inline-flex;align-items:center;gap:5px}

/* ── 2차 메뉴 (프로젝트 매니징 안) ────────────── */
.subnav{display:flex;gap:2px;flex-wrap:wrap;margin:-6px 0 22px;
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav a{padding:9px 14px 11px;font-size:.9rem;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap}
.subnav a:hover{color:var(--ink)}
.subnav a.on{color:var(--ink);border-bottom-color:var(--indigo)}
.topbar-util{font-size:.83rem;color:var(--on-chrome-muted);padding:6px 4px;white-space:nowrap}
.topbar-util:hover,.topbar-util.active{color:var(--on-chrome)}

/* ── 타임시트 ─────────────────────────────────── */
.sheet{min-width:720px}
.sheet th,.sheet td{padding:9px 10px}
.sheet thead th{text-align:center}
.sheet thead th:first-child{text-align:left}
.sheet .dow{display:block;font-size:.72rem}
.sheet .dnum{display:block;font-size:.66rem;opacity:.75;font-weight:400}
.sheet td.title-cell{min-width:210px}
.sheet .sheet-sub{display:block;font-size:.76rem;color:var(--muted);font-weight:400;margin-top:3px}
.sheet .hcell{
  width:56px;text-align:center;padding:6px 4px;font-family:var(--mono);
  font-variant-numeric:tabular-nums;background:var(--surface);
}
.sheet .hcell:focus{border-color:var(--indigo)}
.sheet td.is-today,.sheet th.is-today{background:color-mix(in srgb,var(--indigo) 6%,transparent)}
.sheet tfoot td{border-top:1px solid var(--line);font-weight:600;
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.sheet tfoot td:first-child{font-family:var(--sans);color:var(--muted);font-weight:500}
.sheet .row-total,.sheet .grand{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.sheet .grand{color:var(--indigo)}
.sheet-add{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:16px}
.sheet-add .field{min-width:280px}
.mini-head{font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:10px}

/* ── 인보이싱 ─────────────────────────────────── */
.amount{width:120px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill.warn{border-color:var(--amber)}
.pill.warn .v{color:var(--s-issue)}
.pill .k + .v + .k{margin-top:2px}

@media (max-width:860px){
  .subnav{margin:-2px -14px 18px;padding:0 14px}
  .sheet-wrap{overflow-x:auto}
  .sheet-wrap table{display:table;min-width:720px}
  .sheet-wrap thead{display:table-header-group}
  .sheet-wrap tbody{display:table-row-group}
  .sheet-wrap tr{display:table-row;background:none;border:none;border-radius:0;padding:0}
  .sheet-wrap td{display:table-cell;padding:9px 10px;border-bottom:1px solid var(--line-soft)}
  .sheet-wrap td[data-label]::before{content:none}
  .sheet-wrap td.title-cell{display:table-cell;border-bottom:1px solid var(--line-soft);
    margin:0;font-size:.88rem}
  .sheet-add .field{min-width:0;width:100%}
}

/* ── 타임라인 (간트) ────────────────────────
   색 규칙은 화면 전체와 같다: 프로젝트 색은 정체성, 채움 길이는 진행률,
   상태색은 마일스톤 상태에만. 막대에는 늘 이름이 붙어 색만으로 구분되는 곳이 없다. */
.tl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:6px 16px 14px;overflow-x:auto;position:relative}
.tl-chart{min-width:660px;position:relative;--tl-label:172px}

.tl-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 2px 10px;font-size:.76rem;color:var(--muted)}
.tl-key{display:inline-flex;align-items:center;gap:7px}
.tl-key i{flex:none}
.tl-key .k-bar{width:26px;height:9px;border-radius:4px;background:var(--surface-2);
  border:1px solid var(--line);position:relative;overflow:hidden}
.tl-key .k-bar::before{content:"";position:absolute;inset:0 auto 0 0;width:55%;background:var(--muted);opacity:.55}
.tl-key .k-ms{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;border:2px solid var(--muted)}
.tl-key .k-ms.plan{border-color:var(--muted);background:var(--surface)}
.tl-key .k-ms.late{border-color:var(--s-delay);background:var(--s-delay)}
.tl-key .k-ms.done{border-color:var(--s-done);background:var(--s-done)}
.tl-key .k-today{width:2px;height:13px;background:var(--ink-2)}

.tl-row{display:grid;grid-template-columns:var(--tl-label) 1fr;align-items:center;gap:12px;min-height:30px}
.tl-label{min-width:0;display:flex;flex-direction:column;gap:1px;padding:3px 0}
.tl-name{background:none;border:none;padding:0;text-align:left;font:inherit;font-weight:500;
  color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-name:hover{color:var(--indigo);text-decoration:underline}
.tl-meta{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:22px}

/* 눈금은 뒤로 물러나 있어야 한다 */
.tl-grid{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--line-soft)}

.tl-axis{min-height:26px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tl-axis .tl-track{height:20px}
.tl-month{position:absolute;top:2px;font-family:var(--mono);font-size:.68rem;color:var(--muted);
  padding-left:5px;border-left:1px solid var(--line);line-height:16px;white-space:nowrap;overflow:hidden}

/* 오늘 — 차트 전체를 관통하는 한 줄 */
.tl-today{position:absolute;top:26px;bottom:6px;width:2px;background:var(--ink-2);opacity:.4;
  pointer-events:none;z-index:2}
.tl-today-cap{position:absolute;top:0;transform:translateX(-50%);font-size:.66rem;font-style:normal;
  color:var(--ink-2);background:var(--surface);padding:0 4px;white-space:nowrap}

.tl-group{padding:10px 0 12px;border-bottom:1px solid var(--line-soft)}
.tl-group:last-of-type{border-bottom:none}
.tl-group-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.tl-group-head h2{font-size:.95rem;font-weight:700;letter-spacing:-.01em}
.tl-group-actions{margin-left:auto;display:flex;gap:6px}
.btn.sm{padding:3px 9px;font-size:.74rem}

/* 페이즈 막대 — 테두리가 전체 기간, 채움이 완료 비율 */
.tl-bar{position:absolute;top:3px;height:16px;border-radius:4px;
  background:color-mix(in oklab, var(--pc) 16%, var(--surface));
  border:1.5px solid var(--pc);cursor:pointer;overflow:hidden;
  display:flex;align-items:center;min-width:6px}
.tl-bar:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tl-bar.is-derived{border-style:dashed}
.tl-fill{position:absolute;inset:0 auto 0 0;background:var(--pc);border-radius:2px 0 0 2px}
/* 페이즈 이름은 왼쪽 축이 이미 달고 있다. 막대 위에 겹쳐 쓰면
   진한 채움 위에서 읽히지 않으므로, 막대 오른쪽에 기간만 덧붙인다. */
.tl-range{position:absolute;top:4px;margin-left:7px;font-size:.7rem;color:var(--muted);
  white-space:nowrap;pointer-events:none;font-family:var(--mono)}
.tl-nodate{position:absolute;left:0;top:3px;font-size:.72rem;color:var(--muted)}

/* 마일스톤 — 마름모. 상태색과 함께 기호를 단다 */
.tl-row-ms .tl-track{height:18px}
.tl-ms{position:absolute;top:0;transform:translateX(-50%);width:22px;height:18px;
  background:none;border:none;padding:0;cursor:pointer;display:grid;place-items:center}
.tl-ms i{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;
  border:2px solid var(--muted);background:var(--surface);
  box-shadow:0 0 0 2px var(--surface)}
.tl-ms.is-plan i{border-color:var(--pc);background:var(--surface)}
.tl-ms.is-late i{border-color:var(--s-delay);background:var(--s-delay)}
.tl-ms.is-done i{border-color:var(--s-done);background:var(--s-done)}
.tl-ms:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:3px}

.chip.ms-done{color:var(--s-done)} .chip.ms-late{color:var(--s-delay)} .chip.ms-plan{color:var(--s-wait)}

.hovertip{position:absolute;z-index:40;pointer-events:none;max-width:260px;
  background:var(--chrome);color:var(--on-chrome);border-radius:var(--radius-sm);
  padding:8px 11px;font-size:.76rem;line-height:1.5;box-shadow:var(--shadow)}
.hovertip b{font-weight:600}
.hovertip .tip-sub{color:var(--on-chrome-muted)}

.tl-table{margin-top:14px}
.tl-table summary{cursor:pointer;font-size:.8rem;color:var(--muted);padding:6px 2px}
.tl-table summary:hover{color:var(--ink)}
.tl-table .table-wrap{margin-top:8px}

@media (max-width:860px){
  .tl-chart{--tl-label:112px;min-width:560px}
  .tl-group-actions{margin-left:0;width:100%}
}

/* ── 경비 ──────────────────────────────────── */
.exp-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.exp-total{font-family:var(--mono);font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.exp-cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.exp-cat{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  border-radius:999px;padding:4px 11px;font-size:.76rem;background:var(--surface)}

/* ── 규칙 엔진 (server/ai/rules.js) ─────────────────── */

// 규칙 엔진 — LLM 없이 동작하는 AI 기능의 본체.
// 순수 함수만 둔다. 서버(server/ai/index.js)와 브라우저 데모(tools/build-demo.mjs)가 함께 쓴다.
//
// 설계: docs/12-ai-spec.md

// ── 공용 ────────────────────────────────────────────────
const dayDiff = (from, to) =>
  Math.round((Date.parse(`${to}T00:00:00Z`) - Date.parse(`${from}T00:00:00Z`)) / 86_400_000);

const daysSince = (isoTimestamp, today) =>
  isoTimestamp ? dayDiff(isoTimestamp.slice(0, 10), today) : null;

const SEVERITY_RANK = { high: 0, medium: 1, low: 2 };

const risk = (code, severity, title, detail, items) => ({
  code, severity, title, detail, items, count: items.length,
});

// ── ① 위험 신호 ────────────────────────────────────────
/**
 * 규칙 기반 위험 감지. 같은 입력이면 같은 결과가 나오고, 모든 항목이 근거를 갖는다.
 * @param {{tasks:Array, issues:Array, events:Array, members:Array, projects:Array, today:string}} ctx
 */
function detectRisks(ctx) {
  const { tasks, issues, events, members, projects, areaLeads = [], today } = ctx;
  const open = tasks.filter((t) => t.status !== 'DONE');
  const out = [];

  const link = (t) => ({ id: t.id, kind: 'task', label: t.title, sub: `${t.project_name} · ${t.owner_name}` });
  const issueLink = (i) => ({ id: i.id, kind: 'issue', label: i.title, sub: `${i.project_name} · ${i.owner_name}` });

  // 마감이 반복해서 밀리는 업무 — 진짜 막힌 곳은 대체로 여기다
  const postponeCount = new Map();
  for (const e of events) {
    if (e.event_type !== 'DUE_CHANGED') continue;
    postponeCount.set(e.task_id, (postponeCount.get(e.task_id) ?? 0) + 1);
  }
  const repeated = open
    .filter((t) => (postponeCount.get(t.id) ?? 0) >= 2)
    .map((t) => ({ ...link(t), note: `마감 ${postponeCount.get(t.id)}회 변경` }));
  if (repeated.length) {
    out.push(risk('REPEATED_POSTPONE', 'high', '마감이 반복해서 밀리고 있습니다',
      '마감일을 두 번 이상 옮긴 업무입니다. 일정 문제가 아니라 범위나 의존성 문제일 수 있습니다.', repeated));
  }

  // 진행중인데 오래 멈춰 있는 업무
  const lastChange = new Map();
  for (const e of events) {
    if (e.event_type !== 'STATUS_CHANGED' && e.event_type !== 'CREATED') continue;
    const prev = lastChange.get(e.task_id);
    if (!prev || e.occurred_at > prev) lastChange.set(e.task_id, e.occurred_at);
  }
  const stalled = open
    .filter((t) => t.stage === 'PROGRESS')
    .map((t) => ({ t, days: daysSince(lastChange.get(t.id) ?? t.updated_at, today) }))
    .filter(({ days }) => days !== null && days >= 7)
    .sort((a, b) => b.days - a.days)
    .map(({ t, days }) => ({ ...link(t), note: `${days}일째 상태 변화 없음` }));
  if (stalled.length) {
    out.push(risk('STALLED', 'medium', '진행중인데 일주일 넘게 움직이지 않습니다',
      '상태가 오래 그대로인 업무입니다. 실제로 멈췄거나, 진행됐는데 기록되지 않은 것입니다.', stalled));
  }

  // 검토·검수 단계에서 막힌 업무 — 병목은 대개 여기 쌓인다
  const bottleneck = open
    .filter((t) => t.stage === 'REVIEW')
    .map((t) => ({ t, days: daysSince(lastChange.get(t.id) ?? t.updated_at, today) }))
    .filter(({ days }) => days !== null && days >= 5)
    .sort((a, b) => b.days - a.days)
    .map(({ t, days }) => ({ ...link(t), note: `검토 ${days}일째` }));
  if (bottleneck.length) {
    out.push(risk('REVIEW_BOTTLENECK', 'medium', '검토 단계에서 대기가 길어집니다',
      '검토·검수로 넘어간 뒤 처리되지 않은 업무입니다. 검토자를 확인해 주세요.', bottleneck));
  }

  // 납품일이 다가오는데 아직 착수 전인 외주
  const atRisk = open
    .filter((t) => t.area === 'OUT' && t.delivery_due_date
      && ['REQUEST_PLANNED', 'REQUESTED'].includes(t.status)
      && dayDiff(today, t.delivery_due_date) <= 3)
    .map((t) => ({
      ...link(t),
      note: `납품 ${dayDiff(today, t.delivery_due_date) < 0 ? `${Math.abs(dayDiff(today, t.delivery_due_date))}일 초과` : `D-${dayDiff(today, t.delivery_due_date)}`} · 아직 ${t.status === 'REQUESTED' ? '요청 완료' : '요청 예정'}`,
    }));
  if (atRisk.length) {
    out.push(risk('DELIVERY_AT_RISK', 'high', '납품일이 코앞인데 작업이 시작되지 않았습니다',
      '외주 상태가 아직 작업중으로 넘어가지 않았습니다. 업체 진행 상황을 확인해 주세요.', atRisk));
  }

  // 반려했는데 수정으로 넘어가지 않은 외주
  const rejected = open
    .filter((t) => t.review_status === 'REJECTED' && t.status !== 'OUT_REVISION')
    .map((t) => ({ ...link(t), note: `검수 반려 · 상태는 ${t.status === 'OUT_REVIEW' ? '검수' : '그대로'}` }));
  if (rejected.length) {
    out.push(risk('REJECTED_IDLE', 'high', '반려한 외주가 수정으로 넘어가지 않았습니다',
      '검수를 반려했지만 업무 상태가 수정으로 바뀌지 않았습니다. 재작업이 요청되지 않았을 수 있습니다.', rejected));
  }

  // 한 사람에게 마감이 몰린 주
  const weekEnd = new Date(Date.parse(`${today}T00:00:00Z`) + 7 * 86_400_000).toISOString().slice(0, 10);
  const loadByOwner = new Map();
  for (const t of open) {
    if (t.due_date < today || t.due_date > weekEnd) continue;
    if (!loadByOwner.has(t.owner_slack_user_id)) loadByOwner.set(t.owner_slack_user_id, []);
    loadByOwner.get(t.owner_slack_user_id).push(t);
  }
  const overload = [...loadByOwner.entries()]
    .filter(([, rows]) => rows.length >= 4)
    .sort((a, b) => b[1].length - a[1].length)
    .map(([owner, rows]) => ({
      id: owner, kind: 'owner', label: rows[0].owner_name,
      sub: rows.map((t) => t.title).slice(0, 3).join(' · ') + (rows.length > 3 ? ` 외 ${rows.length - 3}건` : ''),
      note: `7일 내 마감 ${rows.length}건`,
    }));
  if (overload.length) {
    out.push(risk('OWNER_OVERLOAD', 'medium', '한 리드에게 마감이 몰려 있습니다',
      '일주일 안에 마감이 네 건 이상인 리드입니다. 영역 배분이나 일정 재배치를 검토해 주세요.', overload));
  }

  // 해결 목표일을 넘긴 이슈
  const openIssues = issues.filter((i) => i.status !== 'RESOLVED');
  const overdue = openIssues
    .filter((i) => i.target_resolve_date && i.target_resolve_date < today)
    .map((i) => ({ ...issueLink(i), note: `목표일 ${Math.abs(dayDiff(today, i.target_resolve_date))}일 초과` }));
  if (overdue.length) {
    out.push(risk('ISSUE_OVERDUE', 'high', '해결 목표일이 지난 이슈가 있습니다',
      '목표일을 넘긴 미해결 이슈입니다. 목표일을 다시 잡거나 에스컬레이션이 필요합니다.', overdue));
  }

  // 오래 열려 있는 중요 이슈
  const staleIssues = openIssues
    .filter((i) => i.severity === 'HIGH' && (daysSince(i.created_at, today) ?? 0) >= 7)
    .map((i) => ({ ...issueLink(i), note: `${daysSince(i.created_at, today)}일째 ${i.status === 'OPEN' ? 'Open' : '확인중'}` }));
  if (staleIssues.length) {
    out.push(risk('ISSUE_STALE', 'medium', '중요 이슈가 오래 열려 있습니다',
      '중요도 높음으로 등록된 뒤 일주일 넘게 해결되지 않은 이슈입니다.', staleIssues));
  }

  // 비활성 구성원이 리드로 지정된 영역 — 담당은 영역 리드로 정해지므로 여기가 곧 공백이다
  const inactive = new Set(members.filter((m) => !m.is_active).map((m) => m.slack_user_id));
  const orphanAreas = areaLeads.filter((l) => inactive.has(l.slack_user_id));
  const handover = orphanAreas.map((l) => {
    const rows = open.filter((t) => t.area === l.area);
    return {
      id: l.area, kind: 'area', label: l.display_name ?? l.slack_user_id,
      sub: `${l.area} 영역 리드 · 미완료 ${rows.length}건`,
      note: '리드 비활성',
    };
  });
  // 리드가 아예 없는 영역에 업무가 쌓여 있는 경우도 같은 공백이다
  const ledAreas = new Set(areaLeads.map((l) => l.area));
  for (const t of open) {
    if (ledAreas.has(t.area) || handover.some((h) => h.id === t.area)) continue;
    handover.push({ id: t.area, kind: 'area', label: t.area, sub: '리드 미지정', note: '담당 공백' });
    ledAreas.add(t.area);
  }
  if (handover.length) {
    out.push(risk('HANDOVER', 'high', '리드가 비어 있는 업무 영역이 있습니다',
      '리드가 비활성이거나 지정되지 않은 영역입니다. 그 영역의 업무에 책임자가 없습니다.', handover));
  }

  // 지연 비중이 높은 프로젝트
  const slipping = [];
  for (const p of projects) {
    const rows = open.filter((t) => t.project_id === p.id);
    const late = rows.filter((t) => t.is_delayed);
    if (rows.length >= 2 && late.length >= 2 && late.length / rows.length >= 0.3) {
      slipping.push({
        id: p.id, kind: 'project', label: p.name,
        sub: `미완료 ${rows.length}건 중 지연 ${late.length}건`,
        note: `${Math.round((late.length / rows.length) * 100)}% 지연`,
      });
    }
  }
  if (slipping.length) {
    out.push(risk('PROJECT_SLIPPING', 'medium', '지연 비중이 높은 프로젝트가 있습니다',
      '미완료 업무의 30% 이상이 마감을 넘긴 프로젝트입니다. 일정 전체를 다시 볼 시점입니다.', slipping));
  }

  return out.sort((a, b) => SEVERITY_RANK[a.severity] - SEVERITY_RANK[b.severity] || b.count - a.count);
}

// ── ② 주간 요약문 (규칙 초안) ──────────────────────────
/** LLM 없이 만드는 요약문. 숫자는 LLM 판본과 동일하고 문장만 덜 자연스럽다. */
function draftDigest({ snapshot, risks, periodStart, periodEnd }) {
  const s = snapshot;
  const md = (d) => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}`;

  const moved = s.projects.filter((p) => p.delta !== null && p.delta !== 0)
    .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));

  const summary = [
    `${md(periodStart)}~${md(periodEnd)} 주간 ${s.summary.completed_this_week}건을 완료했고 ${s.summary.in_progress}건이 진행 중입니다.`,
    s.summary.review ? `검토 대기는 ${s.summary.review}건입니다.` : '',
    s.summary.delayed
      ? `마감을 넘긴 업무가 ${s.summary.delayed}건 있습니다.`
      : '마감을 넘긴 업무는 없습니다.',
    moved.length
      ? `진행률 변화가 큰 곳은 ${moved.slice(0, 2).map((p) => `${p.name} ${p.delta > 0 ? '+' : ''}${p.delta}%p`).join(', ')}입니다.`
      : '',
    s.outsourcing.delivery_delayed
      ? `외주 납품 지연이 ${s.outsourcing.delivery_delayed}건입니다.`
      : '',
  ].filter(Boolean).join(' ');

  const highlights = [];
  for (const r of risks.slice(0, 3)) {
    highlights.push(`${r.title} (${r.count}건) — ${r.items.slice(0, 2).map((i) => i.label).join(', ')}`);
  }
  if (!highlights.length && s.completed.rows.length) {
    highlights.push(`이번 주 완료: ${s.completed.rows.slice(0, 3).map((t) => t.title).join(', ')}`);
  }
  if (s.issues.open_count) {
    highlights.push(`미해결 이슈 ${s.issues.open_count}건 (이번 주 신규 ${s.issues.new_this_week}건 · 해결 ${s.issues.resolved_this_week}건)`);
  }

  const focus = [];
  if (s.next_week.due.length) {
    focus.push(`다음 주 마감 ${s.next_week.due.length}건 — ${s.next_week.due.slice(0, 3).map((t) => t.title).join(', ')}`);
  }
  if (s.next_week.delivery.length) {
    focus.push(`외주 납품 예정 ${s.next_week.delivery.length}건`);
  }
  if (s.summary.delayed) {
    focus.push('지연 업무의 마감일 재설정 또는 범위 조정');
  }

  return { summary, highlights: highlights.slice(0, 3), focus: focus.slice(0, 2), source: 'rules' };
}

// ── ③ 빠른 입력 (규칙 파서) ────────────────────────────
const AREA_KEYWORDS = {
  OUT: ['외주', '납품', '업체', '외부 작업자'],
  PLAN: ['기획', '정책', '요구사항', '와이어', '설계', '서비스 기획', '플로우'],
  DESIGN: ['디자인', '시안', '그래픽', '일러스트', '아이콘', '썸네일', '레이아웃', 'ui', 'ux'],
  DEV: ['개발', 'api', '배포', '서버', '버그', 'qa', '인프라', '프론트', '백엔드'],
  CONTENT: ['콘텐츠', '활동지', '교안', '워크북', '영상', '카드뉴스', '스티커', '자료 제작', '번역'],
  MKT: ['마케팅', '홍보', '캠페인', 'sns', '광고', '제안자료', '바이럴', '유입'],
  BIZ: ['사업', '계약', '예산', '보고', '전략', '투자', '의사결정', '파트너'],
  OPS: ['운영', '대응', '모니터링', '문의', '등록', '고객'],
};

const WEEKDAYS = { 월: 1, 화: 2, 수: 3, 목: 4, 금: 5, 토: 6, 일: 7 };

const shift = (base, days) =>
  new Date(Date.parse(`${base}T00:00:00Z`) + days * 86_400_000).toISOString().slice(0, 10);

/** 한국어 한 줄에서 날짜를 뽑는다. 못 찾으면 null — 억지로 추측하지 않는다. */
function parseDate(text, today) {
  const isoWeekday = ((new Date(`${today}T00:00:00Z`).getUTCDay() + 6) % 7) + 1; // 월=1

  let m = text.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;

  m = text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if (m) return `${today.slice(0, 4)}-${String(m[1]).padStart(2, '0')}-${String(m[2]).padStart(2, '0')}`;

  m = text.match(/(?:^|\s)(\d{1,2})[/](\d{1,2})(?=\s|까지|$)/);
  if (m) return `${today.slice(0, 4)}-${String(m[1]).padStart(2, '0')}-${String(m[2]).padStart(2, '0')}`;

  m = text.match(/(다음\s*주|담주|이번\s*주|차주)\s*([월화수목금토일])(?:요일)?/);
  if (m) {
    const target = WEEKDAYS[m[2]];
    const base = /이번/.test(m[1]) ? 0 : 7;
    return shift(today, base + (target - isoWeekday));
  }
  m = text.match(/(\d+)\s*(?:일|영업일)\s*(?:뒤|후|내)/);
  if (m) return shift(today, Number(m[1]));
  if (/모레|내일모레/.test(text)) return shift(today, 2);
  if (/내일/.test(text)) return shift(today, 1);
  if (/오늘|금일/.test(text)) return today;
  if (/이번\s*주\s*(?:말|안|까지)/.test(text)) return shift(today, 5 - isoWeekday);
  if (/다음\s*주|담주|차주/.test(text)) return shift(today, 7 + (5 - isoWeekday));

  m = text.match(/(?:^|\s)([월화수목금])요일/);
  if (m) {
    const target = WEEKDAYS[m[1]];
    return shift(today, target >= isoWeekday ? target - isoWeekday : 7 + target - isoWeekday);
  }
  return null;
}

/**
 * 한 줄 문장 → 업무 필드. 인식하지 못한 필드는 비워 둔다.
 * @param {string} text
 * @param {{members:Array, projects:Array, today:string}} ctx
 */
function parseCapture(text, ctx) {
  const { members, projects, today } = ctx;
  const raw = String(text || '').trim();
  if (!raw) return { source: 'rules', fields: {}, matched: [] };

  const lower = raw.toLowerCase();
  const matched = [];
  const fields = {};
  let rest = raw;
  const strip = (needle) => { rest = rest.replace(needle, ' '); };

  // 담당자 — 이름 또는 Slack 핸들
  for (const m of members) {
    if (!m.is_active) continue;
    const handle = m.email ? m.email.split('@')[0] : null;
    const hit = [m.display_name, m.real_name, handle && `@${handle}`, handle]
      .filter(Boolean).find((token) => raw.includes(token) || (token.length > 2 && lower.includes(token.toLowerCase())));
    if (hit) {
      fields.owner_slack_user_id = m.slack_user_id;
      matched.push({ field: '담당자', value: m.display_name });
      strip(hit);
      break;
    }
  }

  // 프로젝트 — 이름 또는 약칭
  for (const p of projects) {
    if (p.is_archived) continue;
    const hit = [p.name, p.code].filter(Boolean)
      .find((token) => token.length >= 2 && lower.includes(token.toLowerCase()));
    if (hit) {
      fields.project_id = p.id;
      matched.push({ field: '프로젝트', value: p.name });
      strip(new RegExp(hit.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'));
      break;
    }
  }

  // 마감일
  const due = parseDate(raw, today);
  if (due) {
    fields.due_date = due;
    matched.push({ field: '마감일', value: due });
    rest = rest
      .replace(/\d{4}[-./]\d{1,2}[-./]\d{1,2}/, ' ')
      .replace(/\d{1,2}\s*월\s*\d{1,2}\s*일/, ' ')
      .replace(/(?:^|\s)\d{1,2}[/]\d{1,2}/, ' ')
      .replace(/(다음\s*주|담주|이번\s*주|차주)\s*(?:[월화수목금토일](?:요일)?)?/, ' ')
      .replace(/\d+\s*(?:일|영업일)\s*(?:뒤|후|내)/, ' ')
      .replace(/오늘|금일|내일모레|모레|내일/, ' ')
      .replace(/[월화수목금]요일/, ' ')
      .replace(/까지/, ' ');
  }

  // 업무 영역 — '외주'가 명시되면 그것을 따르고, 아니면 키워드 적중 수로 고른다.
  // (외주는 업체·납품일 같은 전용 항목을 여는 영역이라 놓치면 손해가 크다)
  let best = lower.includes('외주') ? { code: 'OUT', score: 99, first: lower.indexOf('외주') } : null;
  for (const [code, words] of Object.entries(AREA_KEYWORDS)) {
    const hits = words.map((w) => lower.indexOf(w)).filter((i) => i >= 0);
    if (!hits.length) continue;
    const candidate = { code, score: hits.length, first: Math.min(...hits) };
    if (!best || candidate.score > best.score
        || (candidate.score === best.score && candidate.first < best.first)) best = candidate;
  }
  if (best) {
    fields.area = best.code;
    matched.push({ field: '업무 영역', value: best.code });
    // 영역 키워드가 문장 끝에 홀로 붙어 있으면 꼬리표로 본다.
    //   "관찰 API 성능 개선 개발" → "관찰 API 성능 개선"
    // 문장 중간의 키워드는 건드리지 않는다. "운영 정책 문서 정리"에서
    // '운영'을 빼면 제목이 더 나빠진다.
    for (const w of AREA_KEYWORDS[best.code]) {
      const tail = new RegExp(`\\s${w}\\s*$`, 'i');
      if (tail.test(rest.trim()) && rest.trim().replace(tail, '').trim().length >= 2) {
        rest = rest.trim().replace(tail, ' ');
        break;
      }
    }
  }

  // 우선순위
  if (/긴급|급함|중요|asap|최우선/i.test(raw)) {
    fields.priority = 'HIGH';
    matched.push({ field: '우선순위', value: '높음' });
    rest = rest.replace(/긴급|급함|중요|asap|최우선/gi, ' ');
  }

  // 남은 문장을 업무명으로
  const title = rest
    .replace(/@\S+/g, ' ')
    .replace(/[,·]/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim()
    .replace(/^(까지|에|의|는|은|를|을)\s*/, '');
  if (title.length >= 2) {
    fields.title = title;
    matched.push({ field: '업무명', value: title });
  }

  return { source: 'rules', fields, matched };
}


/* ── 브라우저 저장소 (demo/store.js) ────────────────── */

// 브라우저 데모용 저장소.
// 서버(server/repo.js · weekly.js · notify.js)와 같은 규칙을 브라우저에서 그대로 재현한다.
// 화면 코드(public/js/**)는 한 줄도 고치지 않고, api 계층만 이 파일로 바꿔 끼운다.
//
// 데이터는 localStorage 에 저장된다. 서버도 DB도 없다.

// 업무 영역 개편(v3)으로 이전 데이터의 area 값이 더는 유효하지 않다 — 키를 올려 새로 만든다
const LS_KEY = 'kf.demo.v6';

// ── 날짜 ────────────────────────────────────────────────
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const addDays = (base, n) => {
  const d = new Date(`${base}T00:00:00`);
  d.setDate(d.getDate() + n);
  return iso(d);
};
const daysBetween = (from, to) =>
  Math.round((new Date(`${to}T00:00:00`) - new Date(`${from}T00:00:00`)) / 86_400_000);
const weekStart = (base = today()) => addDays(base, -((new Date(`${base}T00:00:00`).getDay() + 6) % 7));
const nowISO = () => new Date().toISOString();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : `id-${Math.random().toString(36).slice(2)}`);

// ── 시드 → 실제 데이터 ──────────────────────────────────
// 날짜 오프셋을 오늘 기준으로 펼친다. 언제 열어도 D-day 와 지연이 살아 있다.
function buildSeed() {
  const T = today();
  const d = (n) => addDays(T, n);
  const at = (date, hh = '10') => `${date}T${hh}:00:00.000Z`;

  const members = SEED.MEMBERS.map((m) => ({
    slack_user_id: m.id,
    display_name: m.name,
    real_name: m.name,
    avatar_url: null,
    email: `${m.handle}@example.com`,
    is_active: m.active,
    synced_at: nowISO(),
  }));

  const areaLeadRows = (SEED.AREA_LEADS ?? []).map(([area, slack_user_id]) => ({
    area, slack_user_id, updated_at: nowISO(),
  }));
  const leadOfArea = Object.fromEntries(areaLeadRows.map((l) => [l.area, l.slack_user_id]));

  const projectId = {};
  const projects = SEED.PROJECTS.map((p) => {
    const id = uid();
    projectId[p.key] = id;
    return {
      id, name: p.name, code: p.code, description: null, status: 'ACTIVE',
      start_date: d(-90), end_date: null, lead_slack_user_id: p.lead,
      slack_channel_id: p.channel, sort_order: p.order, is_archived: 0,
      created_at: at(d(-90)), updated_at: at(d(-90)),
    };
  });

  const vendors = [];
  const vendorId = (name) => {
    const found = vendors.find((v) => v.name === name);
    if (found) return found.id;
    const v = { id: uid(), name, contact: null, memo: null, is_active: 1, created_at: nowISO() };
    vendors.push(v);
    return v.id;
  };

  const phaseId = {};
  const phases = (SEED.PHASES ?? []).map(([pk, key, name, start, end, order]) => {
    const id = uid();
    phaseId[key] = id;
    return {
      id, project_id: projectId[pk], name,
      start_date: start == null ? null : d(start),
      end_date: end == null ? null : d(end),
      sort_order: order, created_at: nowISO(), updated_at: nowISO(),
    };
  });

  const tasks = [];
  const collaborators = [];
  const outsourcing = [];
  const events = [];
  const taskIdByTitle = {};

  for (const [pk, title, area, owner, status, dueOffset, priority, collabs, out] of SEED.TASKS) {
    const id = uid();
    taskIdByTitle[title] = id;
    const due = d(dueOffset);
    const created = at(d(Math.max(dueOffset - 14, -60)), '01');
    const taskOwner = leadOfArea[area] ?? owner;   // 담당자 = 영역 리드
    tasks.push({
      id, project_id: projectId[pk], phase_id: phaseId[(SEED.TASK_PHASE ?? {})[title]] ?? null,
      title, area, owner_slack_user_id: taskOwner, status, priority,
      start_date: d(dueOffset - 10), due_date: due, description: null,
      completed_at: status === 'DONE' ? at(due, '08') : null,
      created_by: 'U01KIM', created_at: created, updated_at: created, deleted_at: null,
    });
    for (const c of new Set(collabs.filter((c) => c !== taskOwner))) {
      collaborators.push({ task_id: id, slack_user_id: c, added_at: created });
    }
    if (out) {
      outsourcing.push({
        task_id: id, vendor_id: vendorId(out.vendor), vendor_worker_name: out.worker,
        vendor_worker_contact: null, work_scope: out.scope, requested_at: d(out.requested),
        delivery_due_date: d(out.delivery), delivered_at: null, review_status: out.review,
        amount: out.amount ?? null,
        payment_status: out.review === 'IN_REVIEW' ? 'REQUESTED' : 'PLANNED',
        paid_at: null,
        created_at: created, updated_at: created,
      });
    }
    events.push({ id: uid(), task_id: id, event_type: 'CREATED', from_value: null, to_value: status,
      actor_slack_user_id: 'U01KIM', occurred_at: created });
    const hasExplicitStatusEvent = (SEED.EXTRA_EVENTS ?? [])
      .some(([t, type]) => t === title && type === 'STATUS_CHANGED');
    if (!hasExplicitStatusEvent && status !== 'TODO' && status !== 'REQUEST_PLANNED') {
      events.push({
        id: uid(), task_id: id, event_type: 'STATUS_CHANGED',
        from_value: area === 'OUT' ? 'REQUEST_PLANNED' : 'TODO', to_value: status,
        actor_slack_user_id: taskOwner,
        occurred_at: status === 'DONE' ? at(due, '08') : at(d(Math.min(dueOffset - 3, 0)), '05'),
      });
    }
  }

  for (const [title, type, from, to, daysAgo] of (SEED.EXTRA_EVENTS ?? [])) {
    const taskId = taskIdByTitle[title];
    if (!taskId) continue;
    const val = (v) => (typeof v === 'number' ? d(v) : v);
    events.push({ id: uid(), task_id: taskId, event_type: type, from_value: val(from),
      to_value: val(to), actor_slack_user_id: 'U01KIM', occurred_at: at(d(-daysAgo), '04') });
  }

  const issues = SEED.ISSUES.map(([pk, taskTitle, title, content, owner, severity, status, targetOffset, impact]) => ({
    id: uid(), project_id: projectId[pk], task_id: taskTitle ? taskIdByTitle[taskTitle] : null,
    title, content, owner_slack_user_id: owner, severity, status,
    target_resolve_date: d(targetOffset), impact,
    resolved_at: status === 'RESOLVED' ? at(d(-1), '06') : null,
    created_by: 'U01KIM', created_at: at(d(-4), '03'), updated_at: at(d(-4), '03'), deleted_at: null,
  }));

  const timeRows = (SEED.TIME_ENTRIES ?? []).map(([title, member, dayOffset, hours]) => {
    const taskId = taskIdByTitle[title];
    return taskId ? {
      id: uid(), task_id: taskId, slack_user_id: member, work_date: d(dayOffset),
      hours, note: null, created_at: nowISO(), updated_at: nowISO(),
    } : null;
  }).filter(Boolean);

  const milestones = (SEED.MILESTONES ?? []).map(([pk, phaseKey, name, dueOffset, doneOffset]) => ({
    id: uid(), project_id: projectId[pk], phase_id: phaseKey ? phaseId[phaseKey] ?? null : null,
    name, due_date: d(dueOffset),
    done_at: doneOffset == null ? null : at(d(doneOffset), '07'),
    created_at: nowISO(), updated_at: nowISO(),
  }));

  const expenses = (SEED.EXPENSES ?? []).map(([pk, taskTitle, who, dayOffset, category, amount, memo]) => ({
    id: uid(), project_id: projectId[pk],
    task_id: taskTitle ? taskIdByTitle[taskTitle] ?? null : null,
    slack_user_id: who, spent_on: d(dayOffset), category, amount, memo,
    created_at: nowISO(), updated_at: nowISO(),
  }));

  return {
    anchor: T, members, projects, vendors, tasks, collaborators, outsourcing, issues, events,
    area_leads: areaLeadRows, time_entries: timeRows, notifications: [], weekly_reports: [],
    phases, milestones, expenses,
  };
}

let DB = load();

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // 오래 지난 데모 데이터는 오늘 기준으로 다시 만든다 (전부 지연으로 보이지 않도록)
      if (parsed.anchor && Math.abs(daysBetween(parsed.anchor, today())) <= 14) return parsed;
    }
  } catch { /* 저장된 데이터가 깨졌으면 새로 만든다 */ }
  const fresh = buildSeed();
  save(fresh);
  return fresh;
}

function save(db = DB) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch { /* 용량 초과 시 메모리만 사용 */ }
}

function resetDemo() {
  DB = buildSeed();
  save();
}

// ── 조회 헬퍼 ───────────────────────────────────────────
const member = (id) => DB.members.find((m) => m.slack_user_id === id) || null;
const project = (id) => DB.projects.find((p) => p.id === id) || null;
const vendor = (id) => DB.vendors.find((v) => v.id === id) || null;
const outOf = (taskId) => DB.outsourcing.find((o) => o.task_id === taskId) || null;
const liveIssues = () => DB.issues.filter((i) => !i.deleted_at);
const openIssuesOf = (taskId) => liveIssues().filter((i) => i.task_id === taskId && i.status !== 'RESOLVED');

function hydrate(t, ref = today()) {
  const p = project(t.project_id);
  const m = member(t.owner_slack_user_id);
  const o = outOf(t.id);
  const v = o ? vendor(o.vendor_id) : null;
  const openCount = openIssuesOf(t.id).length;
  return {
    ...t,
    project_name: p?.name ?? '-', project_code: p?.code ?? null,
    project_channel: p?.slack_channel_id ?? null, project_lead: p?.lead_slack_user_id ?? null,
    phase_name: DB.phases?.find((ph) => ph.id === t.phase_id)?.name ?? null,
    owner_name: m?.display_name ?? t.owner_slack_user_id,
    owner_avatar: m?.avatar_url ?? null, owner_active: Boolean(m?.is_active),
    vendor_id: o?.vendor_id ?? null, vendor_name: v?.name ?? null,
    vendor_worker_name: o?.vendor_worker_name ?? null,
    vendor_worker_contact: o?.vendor_worker_contact ?? null,
    work_scope: o?.work_scope ?? null, requested_at: o?.requested_at ?? null,
    delivery_due_date: o?.delivery_due_date ?? null, delivered_at: o?.delivered_at ?? null,
    review_status: o?.review_status ?? null,
    // 지연·이슈는 저장하지 않고 조회 시 계산한다
    is_delayed: t.status !== 'DONE' && t.due_date < ref,
    is_delivery_delayed: Boolean(o) && t.status !== 'DONE' && o.delivery_due_date < ref,
    open_issue_count: openCount,
    has_open_issue: openCount > 0,
    is_outsourcing: t.area === 'OUT',
    stage: STAGE[t.status],
    d_day: daysBetween(ref, t.due_date),
    collaborators: DB.collaborators
      .filter((c) => c.task_id === t.id)
      .map((c) => {
        const cm = member(c.slack_user_id);
        return { slack_user_id: c.slack_user_id, display_name: cm?.display_name ?? c.slack_user_id,
          avatar_url: cm?.avatar_url ?? null, is_active: Boolean(cm?.is_active) };
      })
      .sort((a, b) => a.display_name.localeCompare(b.display_name)),
  };
}

function hydrateIssue(i) {
  const p = project(i.project_id);
  const t = i.task_id ? DB.tasks.find((x) => x.id === i.task_id) : null;
  const o = t ? outOf(t.id) : null;
  const m = member(i.owner_slack_user_id);
  return {
    ...i,
    project_name: p?.name ?? '-', project_channel: p?.slack_channel_id ?? null,
    task_title: t?.title ?? null, task_owner: t?.owner_slack_user_id ?? null,
    vendor_name: o ? vendor(o.vendor_id)?.name ?? null : null,
    vendor_worker_name: o?.vendor_worker_name ?? null,
    owner_name: m?.display_name ?? i.owner_slack_user_id, owner_avatar: m?.avatar_url ?? null,
  };
}

const PRIORITY_RANK = { HIGH: 0, NORMAL: 1, LOW: 2 };

function listTasks(f = {}) {
  const ref = f.today || today();
  let rows = DB.tasks.filter((t) => !t.deleted_at).map((t) => hydrate(t, ref));
  const archived = new Set(DB.projects.filter((p) => p.is_archived).map((p) => p.id));
  rows = rows.filter((t) => !archived.has(t.project_id));

  if (f.project?.length) rows = rows.filter((t) => f.project.includes(t.project_id));
  if (f.area?.length) rows = rows.filter((t) => f.area.includes(t.area));
  if (f.owner?.length) rows = rows.filter((t) => f.owner.includes(t.owner_slack_user_id));
  if (f.status?.length) rows = rows.filter((t) => f.status.includes(t.status));
  if (f.stage === 'WAIT') rows = rows.filter((t) => WAIT_STATUSES.includes(t.status));
  if (f.stage === 'IN_PROGRESS') rows = rows.filter((t) => IN_PROGRESS_STATUSES.includes(t.status));
  if (f.stage === 'REVIEW') rows = rows.filter((t) => REVIEW_STAGE_STATUSES.includes(t.status));
  if (f.stage === 'DONE') rows = rows.filter((t) => t.status === 'DONE');
  if (f.delayed) rows = rows.filter((t) => t.is_delayed);
  if (f.hasIssue) rows = rows.filter((t) => t.has_open_issue);
  if (!f.includeDone && !f.status?.length && f.stage !== 'DONE') rows = rows.filter((t) => t.status !== 'DONE');
  if (f.dueFrom) rows = rows.filter((t) => t.due_date >= f.dueFrom);
  if (f.dueTo) rows = rows.filter((t) => t.due_date <= f.dueTo);
  if (f.q) {
    const q = f.q.toLowerCase();
    rows = rows.filter((t) => `${t.title} ${t.description ?? ''}`.toLowerCase().includes(q));
  }

  return rows.sort((a, b) =>
    (a.status === 'DONE') - (b.status === 'DONE')
    || a.due_date.localeCompare(b.due_date)
    || PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]
    || a.created_at.localeCompare(b.created_at));
}

function listIssues(f = {}) {
  let rows = liveIssues().map(hydrateIssue);
  if (f.project?.length) rows = rows.filter((i) => f.project.includes(i.project_id));
  if (f.owner?.length) rows = rows.filter((i) => f.owner.includes(i.owner_slack_user_id));
  if (f.status?.length) rows = rows.filter((i) => f.status.includes(i.status));
  else if (!f.includeResolved) rows = rows.filter((i) => i.status !== 'RESOLVED');
  if (f.severity?.length) rows = rows.filter((i) => f.severity.includes(i.severity));
  if (f.task_id) rows = rows.filter((i) => i.task_id === f.task_id);
  return rows.sort((a, b) =>
    (a.status === 'RESOLVED') - (b.status === 'RESOLVED')
    || PRIORITY_RANK[a.severity] - PRIORITY_RANK[b.severity]
    || (a.target_resolve_date ?? '9999-12-31').localeCompare(b.target_resolve_date ?? '9999-12-31')
    || a.created_at.localeCompare(b.created_at));
}

const pct = (sum, n) => (n === 0 ? null : Math.round((sum / n) * 100));

function overview(ref = today()) {
  const rows = listTasks({ today: ref, includeDone: true });
  const blank = () => ({ count: 0, weight: 0, done: 0, delayed: 0, issue: 0, in_progress: 0, review: 0 });
  const group = (keyFn) => {
    const map = new Map();
    for (const t of rows) {
      const k = keyFn(t);
      if (!map.has(k)) map.set(k, blank());
      const g = map.get(k);
      g.count += 1;
      g.weight += PROGRESS_WEIGHT[t.status] ?? 0;
      if (t.status === 'DONE') g.done += 1;
      if (t.stage === 'PROGRESS') g.in_progress += 1;
      if (t.stage === 'REVIEW') g.review += 1;
      if (t.is_delayed) g.delayed += 1;
      if (t.has_open_issue) g.issue += 1;
    }
    return map;
  };

  const byProject = group((t) => t.project_id);
  const byArea = group((t) => t.area);
  const byOwner = group((t) => t.owner_slack_user_id);

  const owners = [...byOwner.entries()].map(([id, g]) => {
    const m = member(id);
    return {
      slack_user_id: id, display_name: m?.display_name ?? id, avatar_url: m?.avatar_url ?? null,
      is_active: Boolean(m?.is_active),
      collab_count: DB.collaborators.filter((c) => c.slack_user_id === id
        && DB.tasks.some((t) => t.id === c.task_id && !t.deleted_at)).length,
      ...g, progress: pct(g.weight, g.count),
    };
  }).sort((a, b) => b.count - a.count || a.display_name.localeCompare(b.display_name));

  const out = rows.filter((t) => t.area === 'OUT');

  return {
    today: ref,
    summary: {
      total: rows.length,
      in_progress: rows.filter((t) => t.stage === 'PROGRESS').length,
      review: rows.filter((t) => t.stage === 'REVIEW').length,
      done: rows.filter((t) => t.status === 'DONE').length,
      delayed: rows.filter((t) => t.is_delayed).length,
      issues: listIssues({}).length,
    },
    projects: DB.projects.filter((p) => !p.is_archived)
      .sort((a, b) => a.sort_order - b.sort_order || a.name.localeCompare(b.name))
      .map((p) => {
        const g = byProject.get(p.id) ?? blank();
        return { id: p.id, name: p.name, code: p.code, ...g, progress: pct(g.weight, g.count) };
      }),
    areas: AREAS.map((a) => {
      const g = byArea.get(a.code) ?? blank();
      return { code: a.code, label: a.full, ...g, progress: pct(g.weight, g.count) };
    }),
    owners,
    outsourcing: {
      planned: out.filter((t) => t.status === 'REQUEST_PLANNED').length,
      active: out.filter((t) => ['REQUESTED', 'OUT_IN_PROGRESS'].includes(t.status)).length,
      review: out.filter((t) => t.status === 'OUT_REVIEW').length,
      revision: out.filter((t) => t.status === 'OUT_REVISION').length,
      delivery_delayed: out.filter((t) => t.is_delivery_delayed).length,
      done: out.filter((t) => t.status === 'DONE').length,
      delayed_rows: out.filter((t) => t.is_delivery_delayed).map((t) => ({
        id: t.id, title: t.title, vendor_name: t.vendor_name, owner_name: t.owner_name,
        delivery_due_date: t.delivery_due_date,
        days_late: Math.abs(daysBetween(ref, t.delivery_due_date)),
      })),
    },
    handover: owners.filter((o) => !o.is_active && o.count - o.done > 0)
      .map((o) => ({ display_name: o.display_name, open: o.count - o.done })),
    // 보드 지도 — 업무 하나가 타일 하나다. 프로젝트 순서로 묶고 지연을 앞에 세운다.
    board: (() => {
      const order = new Map(DB.projects
        .slice().sort((a, b) => a.sort_order - b.sort_order)
        .map((p, i) => [p.id, i]));
      return rows.slice()
        .sort((a, b) => (order.get(a.project_id) ?? 99) - (order.get(b.project_id) ?? 99)
          || (b.is_delayed - a.is_delayed)
          || String(a.due_date).localeCompare(String(b.due_date)))
        .slice(0, 400)
        .map((t) => ({
          id: t.id, title: t.title, project_id: t.project_id, project_name: t.project_name,
          stage: t.stage, owner_name: t.owner_name, due_date: t.due_date,
          is_delayed: t.is_delayed, has_open_issue: t.has_open_issue,
        }));
    })(),
    board_truncated: rows.length > 400,
    progress: pct(rows.reduce((s, t) => s + (PROGRESS_WEIGHT[t.status] ?? 0), 0), rows.length),
  };
}

// ── 영역 리드 ───────────────────────────────────────────
const leadRows = () => (DB.area_leads ?? []).map((l) => {
  const m = member(l.slack_user_id);
  return { ...l, display_name: m?.display_name ?? l.slack_user_id,
    avatar_url: m?.avatar_url ?? null, is_active: Boolean(m?.is_active) };
});
const areaLeadOf = (area) => (DB.area_leads ?? []).find((l) => l.area === area)?.slack_user_id ?? null;

function setLead(area, slackUserId, actor) {
  const before = areaLeadOf(area);
  const row = (DB.area_leads ??= []).find((l) => l.area === area);
  if (row) row.slack_user_id = slackUserId;
  else DB.area_leads.push({ area, slack_user_id: slackUserId, updated_at: nowISO() });
  let moved = 0;
  if (before !== slackUserId) {
    for (const t of DB.tasks) {
      if (t.area !== area || t.status === 'DONE' || t.deleted_at) continue;
      t.owner_slack_user_id = slackUserId;
      t.updated_at = nowISO();
      logEvent(t.id, 'OWNER_CHANGED', before, slackUserId, actor);
      moved += 1;
    }
    DB.collaborators = DB.collaborators.filter((c) => {
      const t = DB.tasks.find((x) => x.id === c.task_id);
      return !(t && t.area === area && t.status !== 'DONE' && c.slack_user_id === slackUserId);
    });
  }
  return { area, slack_user_id: slackUserId, moved };
}

// ── 쓰기 ────────────────────────────────────────────────
class DemoError extends Error {}

const logEvent = (taskId, type, from, to, actor) => {
  DB.events.push({ id: uid(), task_id: taskId, event_type: type, from_value: from ?? null,
    to_value: to ?? null, actor_slack_user_id: actor, occurred_at: nowISO() });
};

function setCollaborators(taskId, list, owner) {
  DB.collaborators = DB.collaborators.filter((c) => c.task_id !== taskId);
  for (const u of [...new Set(list)].filter((u) => u && u !== owner)) {
    DB.collaborators.push({ task_id: taskId, slack_user_id: u, added_at: nowISO() });
  }
}

function upsertOutsourcing(taskId, input) {
  const name = (input.vendor_name ?? '').trim();
  if (!name) throw new DemoError('외주 업체를 입력해 주세요.');
  if (!input.delivery_due_date) throw new DemoError('납품 예정일을 입력해 주세요.');
  let v = DB.vendors.find((x) => x.name === name);
  if (!v) {
    v = { id: uid(), name, contact: null, memo: null, is_active: 1, created_at: nowISO() };
    DB.vendors.push(v);
  }
  const row = {
    task_id: taskId, vendor_id: v.id,
    vendor_worker_name: input.vendor_worker_name || null,
    vendor_worker_contact: input.vendor_worker_contact || null,
    work_scope: input.work_scope || null,
    requested_at: input.requested_at || null,
    delivery_due_date: input.delivery_due_date,
    delivered_at: input.delivered_at || null,
    review_status: input.review_status || 'NOT_STARTED',
    created_at: nowISO(), updated_at: nowISO(),
  };
  const idx = DB.outsourcing.findIndex((o) => o.task_id === taskId);
  if (idx >= 0) DB.outsourcing[idx] = { ...DB.outsourcing[idx], ...row };
  else DB.outsourcing.push(row);
}

function createTask(input, actor) {
  if (!input.title?.trim()) throw new DemoError('업무명을 입력해 주세요.');
  if (!input.project_id) throw new DemoError('프로젝트를 선택해 주세요.');
  const area = input.area;
  if (!AREAS.some((a) => a.code === area)) throw new DemoError('업무 영역을 선택해 주세요.');
  const owner = areaLeadOf(area);
  if (!owner) throw new DemoError(`'${AREAS.find((a) => a.code === area)?.full ?? area}' 영역의 리드가 지정되지 않았습니다.`);
  const status = input.status || defaultStatusFor(area);
  if (!domainStatusesFor(area).some((s) => s.code === status)) throw new DemoError('업무 영역에 맞지 않는 상태입니다.');
  const due = input.due_date || (area === 'OUT' ? input.delivery_due_date : null);
  if (!due) throw new DemoError('마감일을 입력해 주세요.');
  if (input.start_date && input.start_date > due) throw new DemoError('시작일은 마감일보다 늦을 수 없습니다.');

  const t = {
    id: uid(), project_id: input.project_id, phase_id: input.phase_id || null,
    title: input.title.trim(), area, owner_slack_user_id: owner, status,
    priority: input.priority || 'NORMAL',
    start_date: input.start_date || null, due_date: due,
    description: input.description || null,
    completed_at: status === 'DONE' ? nowISO() : null,
    created_by: actor, created_at: nowISO(), updated_at: nowISO(), deleted_at: null,
  };
  DB.tasks.push(t);
  setCollaborators(t.id, input.collaborators || [], owner);
  if (area === 'OUT') upsertOutsourcing(t.id, input);
  logEvent(t.id, 'CREATED', null, status, actor);
  const hydrated = hydrate(t);
  notifyTaskCreated(hydrated, actor);
  save();
  return hydrated;
}

function updateTask(id, input, actor) {
  const t = DB.tasks.find((x) => x.id === id && !x.deleted_at);
  if (!t) throw new DemoError('업무를 찾을 수 없습니다.');
  const before = hydrate(t);

  const area = input.area ?? t.area;
  const status = input.status ?? (area === t.area ? t.status : defaultStatusFor(area));
  if (!domainStatusesFor(area).some((s) => s.code === status)) throw new DemoError('업무 영역에 맞지 않는 상태입니다.');
  let owner = t.owner_slack_user_id;
  if (area !== t.area) {
    owner = areaLeadOf(area);
    if (!owner) throw new DemoError(`'${AREAS.find((a) => a.code === area)?.full ?? area}' 영역의 리드가 지정되지 않았습니다.`);
  }
  const due = input.due_date ?? t.due_date;

  Object.assign(t, {
    project_id: input.project_id ?? t.project_id,
    phase_id: input.phase_id === undefined ? t.phase_id : (input.phase_id || null),
    title: (input.title ?? t.title).trim(),
    area, owner_slack_user_id: owner, status,
    priority: input.priority ?? t.priority,
    start_date: input.start_date === undefined ? t.start_date : (input.start_date || null),
    due_date: due,
    description: input.description === undefined ? t.description : (input.description || null),
    completed_at: status === 'DONE' ? (t.completed_at || nowISO()) : null,
    updated_at: nowISO(),
  });

  if (input.collaborators) setCollaborators(t.id, input.collaborators, owner);
  if (area === 'OUT') upsertOutsourcing(t.id, { ...before, ...input });
  else DB.outsourcing = DB.outsourcing.filter((o) => o.task_id !== t.id);

  if (status !== before.status) logEvent(t.id, 'STATUS_CHANGED', before.status, status, actor);
  if (owner !== before.owner_slack_user_id) logEvent(t.id, 'OWNER_CHANGED', before.owner_slack_user_id, owner, actor);
  if (due !== before.due_date) logEvent(t.id, 'DUE_CHANGED', before.due_date, due, actor);
  if (input.review_status && input.review_status !== before.review_status) {
    logEvent(t.id, 'REVIEW_STATUS_CHANGED', before.review_status, input.review_status, actor);
  }

  const after = hydrate(t);
  notifyTaskUpdated(before, after, actor);
  save();
  return after;
}

function createIssue(input, actor) {

  if (!input.project_id) throw new DemoError('관련 프로젝트를 선택해 주세요.');

function updateIssue(id, input) {

// ── 시간 기록 ───────────────────────────────────────────
const timeWeek = (slackUserId, ws) => {
  const end = addDays(ws, 6);
  const rows = (DB.time_entries ?? []).filter((e) =>
    e.slack_user_id === slackUserId && e.work_date >= ws && e.work_date <= end);
  const byTask = new Map();
  for (const e of rows) {
    const t = DB.tasks.find((x) => x.id === e.task_id && !x.deleted_at);
    if (!t) continue;
    if (!byTask.has(t.id)) {
      byTask.set(t.id, {
        task_id: t.id, title: t.title, area: t.area, project_id: t.project_id,
        project_name: project(t.project_id)?.name ?? '-', days: {}, total: 0,
      });
    }
    const row = byTask.get(t.id);
    row.days[e.work_date] = { hours: e.hours, note: e.note };
    row.total += e.hours;
  }
  const list = [...byTask.values()];
  return { period: { start: ws, end }, rows: list, total: list.reduce((n, r) => n + r.total, 0) };
};

function setTime({ task_id, slack_user_id, work_date, hours }) {
  if (!task_id) throw new DemoError('업무를 선택해 주세요.');
  const h = Number(hours);
  if (!Number.isFinite(h)) throw new DemoError('시간을 숫자로 입력해 주세요.');
  if (h > 24) throw new DemoError('하루 24시간을 넘을 수 없습니다.');
  DB.time_entries ??= [];
  const idx = DB.time_entries.findIndex((e) =>
    e.task_id === task_id && e.slack_user_id === slack_user_id && e.work_date === work_date);
  if (h <= 0) {
    if (idx >= 0) DB.time_entries.splice(idx, 1);
    save();
    return { removed: true };
  }
  if (idx >= 0) { DB.time_entries[idx].hours = h; DB.time_entries[idx].updated_at = nowISO(); }
  else {
    DB.time_entries.push({ id: uid(), task_id, slack_user_id, work_date, hours: h,
      note: null, created_at: nowISO(), updated_at: nowISO() });
  }
  save();
  return { hours: h };
}

function timeSummary(from, to) {
  const rows = (DB.time_entries ?? []).filter((e) => e.work_date >= from && e.work_date <= to)
    .map((e) => {
      const t = DB.tasks.find((x) => x.id === e.task_id && !x.deleted_at);
      const p = t ? project(t.project_id) : null;
      return t && p && !p.is_archived
        ? { hours: e.hours, slack_user_id: e.slack_user_id, area: t.area,
            project_id: t.project_id, project_name: p.name,
            display_name: member(e.slack_user_id)?.display_name ?? e.slack_user_id }
        : null;
    }).filter(Boolean);
  const group = (keyFn, labelFn) => {
    const map = new Map();
    for (const r of rows) {
      const k = keyFn(r);
      if (!map.has(k)) map.set(k, { key: k, label: labelFn(r), hours: 0 });
      map.get(k).hours += r.hours;
    }
    return [...map.values()].sort((a, b) => b.hours - a.hours);
  };
  return {
    period: { from, to },
    total: rows.reduce((n, r) => n + r.hours, 0),
    projects: group((r) => r.project_id, (r) => r.project_name),
    areas: group((r) => r.area, (r) => AREA_MAP[r.area]?.full ?? r.area),
    members: group((r) => r.slack_user_id, (r) => r.display_name),
  };
}

const paymentRows = (filter = {}) => DB.tasks
