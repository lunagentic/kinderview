function shiftWeek(iso, days) {
  const d = new Date(`${iso}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function toMarkdown(report) {
  const s = report.snapshot;
  const L = [];
  L.push(`# KinderFlow Weekly Report (${report.period_start} ~ ${report.period_end})`, '');
  L.push('## ① 전체 업무 현황');
  L.push(`- 이번 주 완료 ${s.summary.completed_this_week} · 진행중 ${s.summary.in_progress} · 검토 ${s.summary.review} · 지연 ${s.summary.delayed} · 신규 ${s.summary.created_this_week}`, '');
  L.push('## ② 프로젝트별 진행');
  for (const p of s.projects) {
    const d = p.delta === null ? '-' : `${p.delta > 0 ? '+' : ''}${p.delta}%p`;
    L.push(`- ${p.name}: ${p.progress ?? '-'}% (${d}) · 이번 주 완료 ${p.completed_this_week}건`);
  }
  L.push('', '## ③ 업무 영역별 진행');
  for (const a of s.areas.filter((x) => x.count > 0)) L.push(`- ${a.label}: ${a.progress ?? '-'}% (업무 ${a.count}건)`);
  L.push('', '## ④ 주요 완료 업무');
  for (const t of s.completed.rows) L.push(`- ${t.title} (${t.project_name} · ${t.owner_name})`);
  if (s.completed.more) L.push(`- 외 ${s.completed.more}건`);
  L.push('', '## ⑤ 진행 및 지연 업무');
  for (const t of s.progressing.delayed) L.push(`- [지연 ${t.days_late}일] ${t.title} (${t.project_name} · ${t.owner_name})`);
  L.push('', '## ⑥ 외주 진행 현황');
  L.push(`- 진행 ${s.outsourcing.active}건 · 검수 ${s.outsourcing.review}건 · 수정 ${s.outsourcing.revision}건 · 납품 지연 ${s.outsourcing.delivery_delayed}건`);
  L.push('', '## ⑦ 주요 이슈');
  for (const i of s.issues.rows) L.push(`- [${i.severity}] ${i.title} (${i.project_name} · ${i.owner_name})${i.impact ? ` — ${i.impact}` : ''}`);
  L.push('', '## ⑧ 담당자별 현황');
  for (const o of s.owners) L.push(`- ${o.display_name}: 담당 ${o.count} · 진행 ${o.in_progress} · 이번 주 완료 ${o.completed_this_week} · 지연 ${o.delayed}`);
  L.push('', '## ⑨ 다음 주 주요 업무');
  for (const t of s.next_week.due) L.push(`- ${t.title} (${t.project_name} · ${t.owner_name} · 마감 ${t.due_date})`);
  return L.join('\n');
}

async function renderNotifications(root) {
  root.innerHTML = loading();
  let data;
  try {
    data = await api.get('/api/notifications');
  } catch (err) {
    root.innerHTML = errorBox(err.message);
    return;
  }

  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1>알림함</h1>
        <div class="sub">Slack으로 나가는 알림의 기록입니다. 어떤 알림이 언제 누구에게 가는지 확인할 수 있습니다.</div>
      </div>
      <div class="page-actions">
        <button class="btn" data-run-daily>배치 알림 실행</button>
      </div>
    </div>

    ${data.slack_configured
      ? '<div class="notice" style="border-left-color:var(--s-done)"><b>Slack 연동됨</b> — 아래 알림이 실제로 발송됩니다.</div>'
      : `<div class="notice"><b>Slack 미연동</b> — <code>SLACK_BOT_TOKEN</code> 환경변수가 없어 실제 발송 대신 여기에만 기록됩니다.
         토큰을 넣으면 같은 규칙 그대로 DM·채널로 나갑니다.</div>`}

    ${data.rows.length ? `
      <div class="noti-list">
        ${data.rows.map((n) => `
          <article class="noti">
            <div class="top">
              <span class="tag">${esc(n.channel)}</span>
              <span class="ttl">${esc(KIND_LABEL[n.kind] ?? n.kind)}</span>
              <span style="color:var(--muted);font-size:.82rem">→ ${
                n.channel === 'DM' ? person(n.target) : esc(n.target)}</span>
              <span class="tag ${esc(n.status)}">${esc(n.status)}</span>
              <span class="when">${dateTime(n.created_at)}</span>
            </div>
            <div class="ttl" style="font-size:.9rem">${esc(n.title)}</div>
            <div class="body">${esc(n.body)}</div>
          </article>`).join('')}
      </div>`
      : empty({
        title: '아직 발송된 알림이 없습니다',
        hint: '업무를 등록하거나 배치 알림을 실행하면 여기에 기록됩니다.',
        action: '<button class="btn" data-run-daily>배치 알림 실행</button>',
      })}`;

  root.addEventListener('click', async (e) => {
    if (!e.target.closest('[data-run-daily]')) return;
    try {
      const res = await api.post('/api/jobs/daily');
      const total = res.sent.reduce((a, b) => a + b.count, 0);
      toast(total ? `배치 알림 ${total}건을 처리했습니다.` : '오늘 보낼 배치 알림이 없습니다.');
      window.dispatchEvent(new Event('kf:reload'));
    } catch (err) { toast(err.message, true); }
  });
}












const view = document.getElementById('view');

const parseHash = () => {
  const raw = window.location.hash.replace(/^#/, '') || '/overview';
  const [path, query = ''] = raw.split('?');
  return { segments: path.split('/').filter(Boolean), query };
};

async function render() {
  const { segments, query } = parseHash();
  const [top, id] = segments;

  document.querySelectorAll('#gnb a').forEach((a) => {
    a.classList.toggle('active', a.dataset.nav === (top || 'overview'));
  });

  // 뷰마다 새 노드를 만들어 이전 리스너를 함께 버린다
  const fresh = document.createElement('div');
  view.replaceChildren(fresh);

  try {
    switch (top) {
      case undefined:
      case 'overview': await renderOverview(fresh); break;
      case 'tasks':
        if (id) await renderTaskDetail(fresh, id);
        else await renderTasks(fresh, query);
        break;
      case 'issues':
        if (id) await renderIssueDetail(fresh, id);
        else await renderIssues(fresh, query);
        break;
      case 'weekly': await renderWeekly(fresh, query); break;
      case 'notifications': await renderNotifications(fresh); break;
      default:
        fresh.innerHTML = errorBox('없는 화면입니다.');
    }
  } catch (err) {
    fresh.innerHTML = errorBox(err.message || '화면을 그리지 못했습니다.');
    console.error(err);
  }
}

function renderMePicker() {
  const sel = document.getElementById('me-select');
  sel.innerHTML = state.members
    .filter((m) => m.is_active)
    .map((m) => `<option value="${esc(m.slack_user_id)}"${m.slack_user_id === state.me ? ' selected' : ''}>${esc(m.display_name)}</option>`)
    .join('');
}

async function boot() {
  view.innerHTML = loading();
  try {
    await loadBootstrap();
  } catch (err) {
    view.innerHTML = errorBox(`${err.message} — 서버가 실행 중인지 확인해 주세요.`);
    return;
  }
  renderMePicker();
  await render();
}

document.getElementById('me-select').addEventListener('change', async (e) => {
  setMe(e.target.value);
  await render();
});

// 로그인 대신 현재 사용자를 고르는 구조이므로, 바뀌면 화면을 다시 그린다
document.getElementById('btn-new-task').addEventListener('click', () => {
  taskForm({ onSaved: () => window.dispatchEvent(new Event('kf:reload')) });
});

// 각 뷰의 "+ 업무 등록" 버튼 (위임)
view.addEventListener('click', (e) => {
  if (e.target.closest('[data-new-task]')) {
    taskForm({ onSaved: () => window.dispatchEvent(new Event('kf:reload')) });
  } else if (e.target.closest('[data-new-issue]')) {
    issueForm({ onSaved: () => window.dispatchEvent(new Event('kf:reload')) });
  }
});

window.addEventListener('hashchange', render);
window.addEventListener('kf:reload', async () => {
  await loadBootstrap().catch(() => {});
  renderMePicker();
  render();
});

boot();


document.getElementById('demo-reset')?.addEventListener('click', () => {
  resetDemo();
  window.dispatchEvent(new Event('kf:reload'));
});
