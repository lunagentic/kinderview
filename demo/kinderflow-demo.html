      review_status: o.review_status, amount: o.amount ?? null,
      payment_status: o.payment_status ?? 'PLANNED', paid_at: o.paid_at ?? null,
      owner_name: member(t.owner_slack_user_id)?.display_name ?? t.owner_slack_user_id,
      owner_slack_user_id: t.owner_slack_user_id,
    };
  })
  .filter(Boolean)
  .filter((r) => (!filter.status || r.payment_status === filter.status))
  .sort((a, b) => String(a.delivery_due_date).localeCompare(String(b.delivery_due_date)));

function paymentSummary() {
  const rows = paymentRows();
  const bucket = (s) => {
    const list = rows.filter((r) => r.payment_status === s);
    return { count: list.length, amount: list.reduce((n, r) => n + (r.amount ?? 0), 0) };
  };
  return {
    planned: bucket('PLANNED'), requested: bucket('REQUESTED'), paid: bucket('PAID'),
    total_amount: rows.reduce((n, r) => n + (r.amount ?? 0), 0),
    missing_amount: rows.filter((r) => r.amount === null).length,
    ready: rows.filter((r) => r.review_status === 'APPROVED' && r.payment_status !== 'PAID').length,
  };
}

function updatePayment(taskId, input) {
  const o = outOf(taskId);
  if (!o) throw new DemoError('외주 정보를 찾을 수 없습니다.');
  const status = input.payment_status ?? o.payment_status ?? 'PLANNED';
  if (!['PLANNED', 'REQUESTED', 'PAID'].includes(status)) throw new DemoError('없는 지급 상태입니다.');
  if (status === 'PAID' && o.review_status !== 'APPROVED') {
    throw new DemoError('검수가 승인되지 않았습니다. 검수를 먼저 승인해 주세요.');
  }
  if (input.amount !== undefined) {
    o.amount = input.amount === null || input.amount === '' ? null : Math.round(Number(input.amount));
  }
  o.payment_status = status;
  o.paid_at = status === 'PAID' ? (o.paid_at || today()) : null;
  o.updated_at = nowISO();
  save();
  return paymentRows().find((r) => r.task_id === taskId) ?? null;
}

// ── 알림 ────────────────────────────────────────────────
// 데모에는 Slack 토큰이 없으므로 모두 SKIPPED 로 기록된다.
const UNSET_CHANNEL = '(기본 채널 미설정)';
const fmtDate = (d) => (d ? `${Number(d.slice(5, 7))}월 ${Number(d.slice(8, 10))}일` : '-');
const shortD = (d) => (d ? `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}` : '-');
const sLabel = (code) => ALL_STATUS_MAP[code]?.label ?? code;

function emit({ kind, channel, target, title, body, taskId = null, issueId = null, dedupeKey = null }) {
  if (!target) return null;
  if (dedupeKey && DB.notifications.some((n) => n.dedupe_key === dedupeKey)) return null;
  DB.notifications.unshift({
    id: uid(), kind, channel, target, title, body, task_id: taskId, issue_id: issueId,
    dedupe_key: dedupeKey, status: 'SKIPPED',
    error: 'SLACK_BOT_TOKEN 미설정 — 알림함에만 기록', created_at: nowISO(),
  });
  return 'SKIPPED';
}

function notifyTaskCreated(task, actor) {
  if (task.owner_slack_user_id !== actor) {
    emit({ kind: 'TASK_ASSIGNED', channel: 'DM', target: task.owner_slack_user_id,
      title: '담당 업무가 등록되었습니다.',
      body: `프로젝트  ${task.project_name}\n업무  ${task.title}\n마감  ${fmtDate(task.due_date)}`,
      taskId: task.id });
  }
  for (const c of task.collaborators) {
    if (c.slack_user_id === actor) continue;
    emit({ kind: 'TASK_COLLAB', channel: 'DM', target: c.slack_user_id,
      title: '협업 업무로 등록되었습니다.',
      body: `프로젝트  ${task.project_name}\n업무  ${task.title}\n담당  ${task.owner_name}\n마감  ${fmtDate(task.due_date)}`,
      taskId: task.id });
  }
}

function notifyTaskUpdated(before, after, actor) {
  if (before.owner_slack_user_id !== after.owner_slack_user_id && after.owner_slack_user_id !== actor) {
    emit({ kind: 'TASK_ASSIGNED', channel: 'DM', target: after.owner_slack_user_id,
      title: '담당 업무가 등록되었습니다.',
      body: `프로젝트  ${after.project_name}\n업무  ${after.title}\n마감  ${fmtDate(after.due_date)}`,
      taskId: after.id });
  }
  if (['REVIEW', 'OUT_REVIEW'].includes(after.status) && before.status !== after.status
      && after.project_lead && after.project_lead !== actor) {
    emit({ kind: 'REVIEW_REQUEST', channel: 'DM', target: after.project_lead,
      title: '검토 요청이 있습니다.',
      body: `업무  ${after.title}\n프로젝트  ${after.project_name}\n담당자  ${after.owner_name}`,
      taskId: after.id });
  }
  if (after.review_status === 'REJECTED' && before.review_status !== 'REJECTED') {
    emit({ kind: 'REVIEW_REJECTED', channel: 'DM', target: after.owner_slack_user_id,
      title: '외주 검수가 반려되었습니다.',
      body: `업무  ${after.title}\n외주 업체  ${after.vendor_name ?? '-'}\n업무 상태를 "수정"으로 전환할지 확인해 주세요.`,
      taskId: after.id });
  }
}

function notifyIssueCreated(issue, actor) {
  if (issue.owner_slack_user_id !== actor) {
    emit({ kind: 'ISSUE_CREATED', channel: 'DM', target: issue.owner_slack_user_id,
      title: '이슈 담당으로 등록되었습니다.',
      body: `이슈  ${issue.title}\n프로젝트  ${issue.project_name}\n중요도  ${issue.severity === 'HIGH' ? '높음' : issue.severity === 'LOW' ? '낮음' : '보통'}`,
      issueId: issue.id });
  }
  if (issue.task_owner && issue.task_owner !== issue.owner_slack_user_id && issue.task_owner !== actor) {
    emit({ kind: 'ISSUE_ON_MY_TASK', channel: 'DM', target: issue.task_owner,
      title: '담당 업무에 이슈가 등록되었습니다.',
      body: `업무  ${issue.task_title}\n이슈  ${issue.title}`, issueId: issue.id });
  }
  if (issue.severity === 'HIGH') {
    emit({ kind: 'ISSUE_HIGH', channel: 'CHANNEL', target: issue.project_channel || UNSET_CHANNEL,
      title: '🔥 중요 이슈가 등록되었습니다.',
      body: `이슈  ${issue.title}\n프로젝트  ${issue.project_name}\n관련 업무  ${issue.task_title ?? '-'}\n담당  ${issue.owner_name}\n영향  ${issue.impact ?? '-'}`,
      issueId: issue.id });
  }
}

function runDailyJob(ref = today()) {
  const open = listTasks({ today: ref });
  const activeOwners = new Set(DB.members.filter((m) => m.is_active).map((m) => m.slack_user_id));
  const byOwner = (rows) => {
    const map = new Map();
    for (const r of rows) {
      if (!map.has(r.owner_slack_user_id)) map.set(r.owner_slack_user_id, []);
      map.get(r.owner_slack_user_id).push(r);
    }
    return map;
  };
  const sent = [];
  const count = (kind, n) => sent.push({ kind, count: n });

  let n = 0;
  for (const [owner, rows] of byOwner(open.filter((t) => t.due_date === ref))) {
    if (!activeOwners.has(owner)) continue;
    if (emit({ kind: 'DUE_TODAY', channel: 'DM', target: owner,
      title: `오늘 마감인 담당 업무 ${rows.length}건이 있습니다.`,
      body: rows.map((t) => `· ${t.title}   ${t.project_name}   ${sLabel(t.status)}`).join('\n'),
      dedupeKey: `DUE_TODAY:${owner}:${ref}` })) n += 1;
  }
  count('DUE_TODAY', n);

  n = 0;
  const tomorrow = addDays(ref, 1);
  for (const [owner, rows] of byOwner(open.filter((t) => t.due_date === tomorrow))) {
    if (!activeOwners.has(owner)) continue;
    if (emit({ kind: 'DUE_D1', channel: 'DM', target: owner,
      title: `내일 마감인 담당 업무 ${rows.length}건이 있습니다.`,
      body: rows.map((t) => `· ${t.title}   ${t.project_name}   ${shortD(t.due_date)}`).join('\n'),
      dedupeKey: `DUE_D1:${owner}:${ref}` })) n += 1;
  }
  count('DUE_D1', n);

  const delayed = open.filter((t) => t.is_delayed);
  n = 0;
  for (const [owner, rows] of byOwner(delayed)) {
    if (!activeOwners.has(owner)) continue;
    if (emit({ kind: 'DELAYED', channel: 'DM', target: owner,
      title: `⚠ 마감일이 지난 담당 업무 ${rows.length}건이 있습니다.`,
      body: rows.sort((a, b) => a.d_day - b.d_day)
        .map((t) => `· ${t.title}   ${t.project_name}   ${sLabel(t.status)}   ${Math.abs(t.d_day)}일 지연`).join('\n'),
      dedupeKey: `DELAYED:${owner}:${ref}` })) n += 1;
  }
  count('DELAYED', n);

  const byChannel = new Map();
  for (const t of delayed) {
    const ch = t.project_channel || UNSET_CHANNEL;
    if (!byChannel.has(ch)) byChannel.set(ch, []);
    byChannel.get(ch).push(t);
  }
  for (const [ch, rows] of byChannel) {
    emit({ kind: 'DELAYED_CHANNEL', channel: 'CHANNEL', target: ch,
      title: `⚠ 지연 업무 ${rows.length}건`,
      body: rows.map((t) => `· ${t.title}   ${t.owner_name}   ${Math.abs(t.d_day)}일 지연`).join('\n'),
      dedupeKey: `DELAYED_CHANNEL:${ch}:${ref}` });
  }

  n = 0;
  for (const t of open.filter((t) => t.area === 'OUT'
      && (t.delivery_due_date === ref || t.delivery_due_date === addDays(ref, 2)))) {
    if (emit({ kind: 'DELIVERY_DUE', channel: 'DM', target: t.owner_slack_user_id,
      title: `외주 납품 예정일이 다가옵니다. (${t.delivery_due_date === ref ? 'D-DAY' : 'D-2'})`,
      body: `업무  ${t.title}\n외주 업체  ${t.vendor_name ?? '-'}\n납품 예정  ${fmtDate(t.delivery_due_date)}\n현재 상태  ${sLabel(t.status)}`,
      taskId: t.id, dedupeKey: `DELIVERY_DUE:${t.id}:${ref}` })) n += 1;
  }
  count('DELIVERY_DUE', n);

  n = 0;
  for (const t of open.filter((t) => t.is_delivery_delayed)) {
    if (emit({ kind: 'DELIVERY_DELAYED', channel: 'DM', target: t.owner_slack_user_id,
      title: '⚠ 외주 납품 예정일이 지났습니다.',
      body: `업무  ${t.title}\n외주 업체  ${t.vendor_name ?? '-'}\n납품 예정  ${fmtDate(t.delivery_due_date)}\n현재 상태  ${sLabel(t.status)}`,
      taskId: t.id, dedupeKey: `DELIVERY_DELAYED:${t.id}:${ref}` })) n += 1;
  }
  count('DELIVERY_DELAYED', n);

  n = 0;
  for (const i of listIssues({}).filter((i) => i.target_resolve_date && i.target_resolve_date < ref)) {
    if (emit({ kind: 'ISSUE_OVERDUE', channel: 'DM', target: i.owner_slack_user_id,
      title: '⚠ 이슈 해결 목표일이 지났습니다.',
      body: `이슈  ${i.title}\n프로젝트  ${i.project_name}\n목표일  ${fmtDate(i.target_resolve_date)}`,
      issueId: i.id, dedupeKey: `ISSUE_OVERDUE:${i.id}:${ref}` })) n += 1;
  }
  count('ISSUE_OVERDUE', n);

  save();
  return { date: ref, sent };
}

// ── Weekly Report ───────────────────────────────────────
const inPeriod = (v, a, b) => Boolean(v) && v.slice(0, 10) >= a && v.slice(0, 10) <= b;

function buildSnapshot(periodStart, periodEnd, ref) {
  const ov = overview(ref);
  const rows = listTasks({ today: ref, includeDone: true });
  const completed = rows.filter((t) => inPeriod(t.completed_at, periodStart, periodEnd));
  const created = rows.filter((t) => inPeriod(t.created_at, periodStart, periodEnd));

  const prev = DB.weekly_reports
    .filter((r) => r.period_start < periodStart)
    .sort((a, b) => b.period_start.localeCompare(a.period_start))[0];
  const prevMap = new Map((prev?.snapshot.projects ?? []).map((p) => [p.id, p.progress]));

  const brief = (t) => ({
    id: t.id, title: t.title, project_name: t.project_name, area: t.area,
    area_label: AREA_MAP[t.area]?.label ?? t.area,
    owner_name: t.owner_name, owner_slack_user_id: t.owner_slack_user_id,
    status: t.status, status_label: sLabel(t.status), priority: t.priority,
    due_date: t.due_date, start_date: t.start_date, completed_at: t.completed_at,
    has_open_issue: t.has_open_issue,
  });

  const nextStart = addDays(periodEnd, 1);
  const nextEnd = addDays(periodEnd, 7);
  const allIssues = listIssues({ includeResolved: true });
  const openIssues = listIssues({});

  return {
    summary: {
      total: ov.summary.total,
      completed_this_week: completed.length,
      in_progress: ov.summary.in_progress,
      review: ov.summary.review,
      delayed: ov.summary.delayed,
      created_this_week: created.length,
      progress: ov.progress,
    },
    projects: ov.projects.map((p) => {
      const before = prevMap.get(p.id);
      return {
        ...p,
        completed_this_week: completed.filter((t) => t.project_id === p.id).length,
        delta: before === undefined || before === null || p.progress === null ? null : p.progress - before,
      };
    }),
    areas: ov.areas.map((a) => ({
      ...a, completed_this_week: completed.filter((t) => t.area === a.code).length,
    })),
    completed: {
      rows: [...completed].sort((a, b) => PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]
        || a.project_name.localeCompare(b.project_name)).slice(0, 10).map(brief),
      more: Math.max(0, completed.length - 10),
    },
    progressing: {
      in_progress: rows.filter((t) => t.stage === 'PROGRESS' || t.stage === 'REVIEW')
        .sort((a, b) => a.due_date.localeCompare(b.due_date)).map(brief),
      delayed: rows.filter((t) => t.is_delayed).sort((a, b) => a.d_day - b.d_day)
        .map((t) => ({ ...brief(t), days_late: Math.abs(t.d_day) })),
    },
    outsourcing: ov.outsourcing,
    issues: {
      open_count: openIssues.length,
      new_this_week: allIssues.filter((i) => inPeriod(i.created_at, periodStart, periodEnd)).length,
      resolved_this_week: allIssues.filter((i) => inPeriod(i.resolved_at, periodStart, periodEnd)).length,
      rows: openIssues.slice(0, 10).map((i) => ({
        id: i.id, title: i.title, project_name: i.project_name, task_title: i.task_title,
        owner_name: i.owner_name, severity: i.severity, status: i.status,
        target_resolve_date: i.target_resolve_date, impact: i.impact,
      })),
    },
    owners: ov.owners.filter((o) => o.count > 0).map((o) => ({
      ...o, completed_this_week: completed.filter((t) => t.owner_slack_user_id === o.slack_user_id).length,
    })),
    handover: ov.handover,
    next_week: {
      period: { start: nextStart, end: nextEnd },
      due: rows.filter((t) => t.status !== 'DONE' && t.due_date >= nextStart && t.due_date <= nextEnd)
        .sort((a, b) => a.due_date.localeCompare(b.due_date)).map(brief),
      starting: rows.filter((t) => t.start_date && t.start_date >= nextStart && t.start_date <= nextEnd).map(brief),
      delivery: rows.filter((t) => t.area === 'OUT' && t.status !== 'DONE'
        && t.delivery_due_date >= nextStart && t.delivery_due_date <= nextEnd)
        .map((t) => ({ ...brief(t), vendor_name: t.vendor_name, delivery_due_date: t.delivery_due_date })),
    },
  };
}

function weeklyForWeek(anchor = today()) {
  const periodStart = weekStart(anchor);
  const periodEnd = addDays(periodStart, 6);
  const saved = DB.weekly_reports.filter((r) => r.period_start === periodStart)
    .sort((a, b) => b.generated_at.localeCompare(a.generated_at))[0];
  if (saved) return { ...saved, saved: true };
  return {
    id: null, period_start: periodStart, period_end: periodEnd,
    generated_at: null, shared_at: null, saved: false,
    snapshot: buildSnapshot(periodStart, periodEnd, today()),
  };
}

function weeklyGenerate(anchor, by) {
  const periodStart = weekStart(anchor || today());
  const periodEnd = addDays(periodStart, 6);
  const report = {
    id: uid(), period_start: periodStart, period_end: periodEnd,
    snapshot: buildSnapshot(periodStart, periodEnd, today()),
    generated_at: nowISO(), generated_by: by, shared_at: null,
  };
  DB.weekly_reports.push(report);
  save();
  return report;
}

function weeklyShare(id) {
  const report = DB.weekly_reports.find((r) => r.id === id);
  if (!report) throw new DemoError('리포트를 찾을 수 없습니다.');
  const s = report.snapshot;
  const status = emit({
    kind: 'WEEKLY_REPORT', channel: 'CHANNEL', target: UNSET_CHANNEL,
    title: `📊 KinderFlow Weekly Report  (${shortD(report.period_start)} ~ ${shortD(report.period_end)})`,
    body: [
      `이번 주 완료 ${s.summary.completed_this_week}건 · 진행 ${s.summary.in_progress}건 · 검토 ${s.summary.review}건 · 지연 ${s.summary.delayed}건`,
      '', '프로젝트',
      ...s.projects.map((p) => `· ${p.name}  ${p.progress ?? '-'}%  (${p.delta === null ? '-' : `${p.delta > 0 ? '+' : ''}${p.delta}%p`})`),
      '', `⚠ 지연 ${s.summary.delayed}건 · 🔥 미해결 이슈 ${s.issues.open_count}건 · 외주 납품 지연 ${s.outsourcing.delivery_delayed}건`,
    ].join('\n'),
    dedupeKey: `WEEKLY_REPORT:${report.period_start}`,
  });
  save();
  return { status: status ?? 'ALREADY_SHARED', channel: UNSET_CHANNEL, channel_configured: false, slack_configured: false };
}

// ── api 라우터 (서버 REST 와 같은 모양) ─────────────────
// 현재 사용자는 화면(state.js)이 localStorage 에 넣어 둔 값을 그대로 읽는다.
const currentMe = () => {
  let id = null;
  try { id = localStorage.getItem('kf.me'); } catch { /* 접근 불가 시 기본값 */ }
  if (id && DB.members.some((m) => m.slack_user_id === id && m.is_active)) return id;
  return DB.members.find((m) => m.is_active)?.slack_user_id ?? null;
};

const listParam = (sp, name) => {
  const raw = sp.getAll(name).flatMap((v) => v.split(',')).map((v) => v.trim()).filter(Boolean);
  return raw.length ? raw : undefined;
};

// ── 페이즈 · 마일스톤 · 타임라인 ────────────────────────
// server/repo.js 의 phases · milestones · timeline() 과 같은 규칙이다.

const phasesOf = (projectId) => (DB.phases ?? [])
  .filter((ph) => !projectId || ph.project_id === projectId)
  .map((ph) => {
    const own = DB.tasks.filter((t) => !t.deleted_at && t.phase_id === ph.id);
    return {
      ...ph,
      task_count: own.length,
      done_count: own.filter((t) => t.status === 'DONE').length,
    };
  })
  .sort((a, b) => (a.project_id === b.project_id
    ? a.sort_order - b.sort_order
    : a.project_id.localeCompare(b.project_id)));

const milestonesOf = (projectId) => (DB.milestones ?? [])
  .filter((m) => !projectId || m.project_id === projectId)
  .map((m) => ({
    ...m,
    phase_name: (DB.phases ?? []).find((ph) => ph.id === m.phase_id)?.name ?? null,
    project_name: project(m.project_id)?.name ?? '-',
  }))
  .sort((a, b) => a.due_date.localeCompare(b.due_date));

function createPhase(input) {
  if (!input.project_id) throw new DemoError('프로젝트를 선택해 주세요.');
  if (!input.name?.trim()) throw new DemoError('페이즈 이름을 입력해 주세요.');
  if (input.start_date && input.end_date && input.start_date > input.end_date) {
    throw new DemoError('시작일이 종료일보다 늦습니다.');
  }
  const same = (DB.phases ?? []).filter((ph) => ph.project_id === input.project_id);
  const ph = {
    id: uid(), project_id: input.project_id, name: input.name.trim(),
    start_date: input.start_date || null, end_date: input.end_date || null,
    sort_order: input.sort_order ?? same.reduce((n, x) => Math.max(n, x.sort_order), 0) + 1,
    created_at: nowISO(), updated_at: nowISO(),
  };
  DB.phases.push(ph);
  save();
  return ph;
}

function updatePhase(id, input) {
  const ph = (DB.phases ?? []).find((x) => x.id === id);
  if (!ph) throw new DemoError('페이즈를 찾을 수 없습니다.');
  const start = input.start_date === undefined ? ph.start_date : (input.start_date || null);
  const end = input.end_date === undefined ? ph.end_date : (input.end_date || null);
  if (start && end && start > end) throw new DemoError('시작일이 종료일보다 늦습니다.');
  Object.assign(ph, {
    name: (input.name ?? ph.name).trim(), start_date: start, end_date: end,
    sort_order: input.sort_order ?? ph.sort_order, updated_at: nowISO(),
  });
  save();
  return ph;
}

function removePhase(id) {
  // 업무는 남기고 연결만 끊는다
  for (const t of DB.tasks) if (t.phase_id === id) t.phase_id = null;
  for (const m of (DB.milestones ?? [])) if (m.phase_id === id) m.phase_id = null;
  DB.phases = (DB.phases ?? []).filter((ph) => ph.id !== id);
  save();
  return { ok: true };
}

function createMilestone(input) {
  if (!input.project_id) throw new DemoError('프로젝트를 선택해 주세요.');
  if (!input.name?.trim()) throw new DemoError('마일스톤 이름을 입력해 주세요.');
  if (!input.due_date) throw new DemoError('날짜를 입력해 주세요.');
  const m = {
    id: uid(), project_id: input.project_id, phase_id: input.phase_id || null,
    name: input.name.trim(), due_date: input.due_date, done_at: null,
    created_at: nowISO(), updated_at: nowISO(),
  };
  DB.milestones.push(m);
  save();
  return m;
}

function updateMilestone(id, input) {
  const m = (DB.milestones ?? []).find((x) => x.id === id);
  if (!m) throw new DemoError('마일스톤을 찾을 수 없습니다.');
  Object.assign(m, {
    name: (input.name ?? m.name).trim(),
    due_date: input.due_date ?? m.due_date,
    phase_id: input.phase_id === undefined ? m.phase_id : (input.phase_id || null),
    done_at: input.done === undefined ? m.done_at : (input.done ? (m.done_at || `${today()}T00:00:00.000Z`) : null),
    updated_at: nowISO(),
  });
  save();
  return m;
}

function removeMilestone(id) {
  DB.milestones = (DB.milestones ?? []).filter((m) => m.id !== id);
  save();
  return { ok: true };
}

function timelineRows() {
  const allPhases = phasesOf();
  const allMilestones = milestonesOf();
  return DB.projects
    .filter((p) => !p.is_archived)
    .sort((a, b) => a.sort_order - b.sort_order)
    .map((p) => {
      const ps = allPhases.filter((ph) => ph.project_id === p.id).map((ph) => ({
        ...ph,
        progress: ph.task_count ? Math.round((ph.done_count / ph.task_count) * 100) : null,
      }));
      const rowTasks = DB.tasks.filter((t) => !t.deleted_at && t.project_id === p.id);
      // 기간이 없는 페이즈는 그 페이즈 업무의 일정으로 채운다
      for (const ph of ps) {
        if (ph.start_date && ph.end_date) continue;
        const own = rowTasks.filter((t) => t.phase_id === ph.id);
        if (!own.length) continue;
        const ds = own.flatMap((t) => [t.start_date, t.due_date]).filter(Boolean).sort();
        ph.start_date ??= ds[0] ?? null;
        ph.end_date ??= ds[ds.length - 1] ?? null;
        ph.derived = true;
      }
      const ds = [
        ...ps.flatMap((ph) => [ph.start_date, ph.end_date]),
        ...rowTasks.flatMap((t) => [t.start_date, t.due_date]),
        p.start_date, p.end_date,
      ].filter(Boolean).sort();
      return {
        id: p.id, name: p.name, code: p.code, status: p.status,
        start_date: ds[0] ?? null, end_date: ds[ds.length - 1] ?? null,
        phases: ps,
        milestones: allMilestones.filter((m) => m.project_id === p.id),
        unphased: rowTasks.filter((t) => !t.phase_id).length,
      };
    });
}

const EXPENSE_CATEGORIES = [
  { code: 'TRANSPORT', label: '교통' },
  { code: 'MATERIAL',  label: '자재·인쇄' },
  { code: 'MEAL',      label: '식대' },
  { code: 'SOFTWARE',  label: '소프트웨어' },
  { code: 'ETC',       label: '기타' },
];

function expenseRows({ from, to, project: pid, member: who } = {}) {
  return (DB.expenses ?? [])
    .filter((e) => (!from || e.spent_on >= from) && (!to || e.spent_on <= to)
      && (!pid || e.project_id === pid) && (!who || e.slack_user_id === who))
    .map((e) => ({
      ...e,
      project_name: project(e.project_id)?.name ?? '-',
      task_title: DB.tasks.find((t) => t.id === e.task_id)?.title ?? null,
      display_name: member(e.slack_user_id)?.display_name ?? e.slack_user_id,
    }))
    .sort((a, b) => b.spent_on.localeCompare(a.spent_on));
}

function expenseSummary(range) {
  const rows = expenseRows(range);
  const group = (keyFn, labelFn) => {
    const map = new Map();
    for (const r of rows) {
      const k = keyFn(r);
      if (!map.has(k)) map.set(k, { key: k, label: labelFn(r), amount: 0, count: 0 });
      const g = map.get(k);
      g.amount += r.amount;
      g.count += 1;
    }
    return [...map.values()].sort((a, b) => b.amount - a.amount);
  };
  return {
    total: rows.reduce((n, r) => n + r.amount, 0),
    count: rows.length,
    projects: group((r) => r.project_id, (r) => r.project_name),
    categories: group((r) => r.category,
      (r) => EXPENSE_CATEGORIES.find((c) => c.code === r.category)?.label ?? r.category),
  };
}

function createExpense(input, actor) {
  if (!input.project_id) throw new DemoError('프로젝트를 선택해 주세요.');
  if (!input.spent_on) throw new DemoError('사용일을 입력해 주세요.');
  const amount = Math.round(Number(input.amount));
  if (!Number.isFinite(amount) || amount <= 0) throw new DemoError('금액을 0보다 큰 숫자로 입력해 주세요.');
  const category = input.category || 'ETC';
  if (!EXPENSE_CATEGORIES.some((c) => c.code === category)) throw new DemoError('없는 분류입니다.');
  const e = {
    id: uid(), project_id: input.project_id, task_id: input.task_id || null,
    slack_user_id: input.slack_user_id || actor, spent_on: input.spent_on,
    category, amount, memo: input.memo || null,
    created_at: nowISO(), updated_at: nowISO(),
  };
  DB.expenses.push(e);
  save();
  return expenseRows().find((r) => r.id === e.id) ?? e;
}

function removeExpense(id) {
  DB.expenses = (DB.expenses ?? []).filter((e) => e.id !== id);
  save();
  return { ok: true };
}

function handle(method, path, body) {
  const url = new URL(path, 'http://demo.local');
  const sp = url.searchParams;
  const p = url.pathname;
  const me = currentMe();
  const seg = p.split('/').filter(Boolean); // ['api', ...]

  if (method === 'GET' && p === '/api/bootstrap') {
    return {
      me, today: today(),
      members: DB.members, projects: DB.projects, vendors: DB.vendors,
      area_leads: leadRows(),
      slack_configured: false,
      meta: {
        areas: AREAS, normal_statuses: NORMAL_STATUSES, out_statuses: OUT_STATUSES,
        review_statuses: REVIEW_STATUSES, issue_statuses: ISSUE_STATUSES,
        priorities: PRIORITIES, project_statuses: PROJECT_STATUSES, progress_weight: PROGRESS_WEIGHT,
        expense_categories: EXPENSE_CATEGORIES,
      },
    };
  }
  if (method === 'GET' && p === '/api/overview') return overview();

  if (p === '/api/tasks' && method === 'GET') {
    return listTasks({
      project: listParam(sp, 'project'), area: listParam(sp, 'area'),
      owner: listParam(sp, 'owner')?.map((o) => (o === 'me' ? me : o)),
      status: listParam(sp, 'status'), stage: sp.get('stage') || undefined,
      delayed: sp.get('delayed') === '1', hasIssue: sp.get('issue') === '1',
      includeDone: sp.get('done') === '1',
      dueFrom: sp.get('due_from') || undefined, dueTo: sp.get('due_to') || undefined,
      q: sp.get('q') || undefined,
    });
  }
  if (p === '/api/tasks' && method === 'POST') return createTask(body, me);

  if (seg[1] === 'tasks' && seg[2]) {
    const id = seg[2];
    if (method === 'GET') {
      const t = DB.tasks.find((x) => x.id === id && !x.deleted_at);
      if (!t) throw new DemoError('업무를 찾을 수 없습니다.');
      return {
        ...hydrate(t),
        events: DB.events.filter((e) => e.task_id === id)
          .map((e) => ({ ...e, actor_name: member(e.actor_slack_user_id)?.display_name ?? e.actor_slack_user_id }))
          .sort((a, b) => b.occurred_at.localeCompare(a.occurred_at)),
        issues: listIssues({ task_id: id, includeResolved: true }),
      };
    }
    if (method === 'PATCH') return updateTask(id, body, me);
    if (method === 'DELETE') {
      const t = DB.tasks.find((x) => x.id === id);
      if (t) t.deleted_at = nowISO();
      save();
      return { ok: true };
    }
  }

  if (p === '/api/projects' && method === 'GET') return DB.projects;
  if (p === '/api/projects' && method === 'POST') {
    if (!body.name?.trim()) throw new DemoError('프로젝트명을 입력해 주세요.');
    const pr = {
      id: uid(), name: body.name.trim(), code: body.code || null, description: body.description || null,
      status: body.status || 'ACTIVE', start_date: body.start_date || null, end_date: body.end_date || null,
      lead_slack_user_id: body.lead_slack_user_id || null, slack_channel_id: body.slack_channel_id || null,
      sort_order: DB.projects.length + 1, is_archived: 0, created_at: nowISO(), updated_at: nowISO(),
    };
    DB.projects.push(pr);
    save();
    return pr;
  }
  if (seg[1] === 'projects' && seg[2] && method === 'PATCH') {
    const pr = project(seg[2]);
    if (!pr) throw new DemoError('프로젝트를 찾을 수 없습니다.');
    Object.assign(pr, {
      name: body.name ?? pr.name, code: body.code ?? pr.code, status: body.status ?? pr.status,
      start_date: body.start_date ?? pr.start_date, end_date: body.end_date ?? pr.end_date,
      lead_slack_user_id: body.lead_slack_user_id ?? pr.lead_slack_user_id,
      slack_channel_id: body.slack_channel_id ?? pr.slack_channel_id,
      is_archived: body.is_archived === undefined ? pr.is_archived : (body.is_archived ? 1 : 0),
      updated_at: nowISO(),
    });
    save();
    return pr;
  }

  if (p === '/api/area-leads' && method === 'GET') return leadRows();
  if (p === '/api/area-leads' && method === 'PATCH') {
    if (!Array.isArray(body.leads)) throw new DemoError('리드 목록이 필요합니다.');
    const out = body.leads.map((l) => setLead(l.area, l.slack_user_id, me));
    save();
    return out;
  }

  if (p === '/api/issues' && method === 'GET') {
    return listIssues({
      project: listParam(sp, 'project'),
      owner: listParam(sp, 'owner')?.map((o) => (o === 'me' ? me : o)),
      status: listParam(sp, 'status'), severity: listParam(sp, 'severity'),
      includeResolved: sp.get('resolved') === '1', task_id: sp.get('task_id') || undefined,
    });
  }
  if (p === '/api/issues' && method === 'POST') return createIssue(body, me);
  if (seg[1] === 'issues' && seg[2]) {
    if (method === 'GET') {
      const i = liveIssues().find((x) => x.id === seg[2]);
      if (!i) throw new DemoError('이슈를 찾을 수 없습니다.');
      return hydrateIssue(i);
    }
    if (method === 'PATCH') return updateIssue(seg[2], body);
    if (method === 'DELETE') {
      const i = DB.issues.find((x) => x.id === seg[2]);
      if (i) i.deleted_at = nowISO();
      save();
      return { ok: true };
    }
  }

  if (p === '/api/weekly' && method === 'GET') return weeklyForWeek(sp.get('week') || today());
  if (p === '/api/weekly/list' && method === 'GET') {
    return DB.weekly_reports.map(({ id, period_start, period_end, generated_at, shared_at }) =>
      ({ id, period_start, period_end, generated_at, shared_at }))
      .sort((a, b) => b.period_start.localeCompare(a.period_start));
  }
  if (p === '/api/weekly/generate' && method === 'POST') return weeklyGenerate(body.week, me);
  if (seg[1] === 'weekly' && seg[3] === 'share' && method === 'POST') return weeklyShare(seg[2]);

  // ── AI ── 데모에는 LLM 키가 없으므로 언제나 규칙 결과다 (docs/12-ai-spec.md)
  const aiCtx = () => ({
    tasks: listTasks({ includeDone: true }),
    issues: listIssues({ includeResolved: true }),
    events: DB.events,
    members: DB.members,
    projects: DB.projects.filter((x) => !x.is_archived),
    areaLeads: leadRows(),
    today: today(),
  });
  if (p === '/api/ai/status' && method === 'GET') {
    return { enabled: false, model: 'claude-opus-5', reason: '브라우저 데모에서는 LLM 을 호출하지 않습니다' };
  }
  if (p === '/api/ai/risks' && method === 'GET') {
    return { source: 'rules', rows: detectRisks(aiCtx()) };
  }
  if (p === '/api/ai/digest' && method === 'POST') {
    const report = weeklyForWeek(body.week || today());
    return {
      ...draftDigest({
        snapshot: report.snapshot,
        risks: detectRisks(aiCtx()),
        periodStart: report.period_start,
        periodEnd: report.period_end,
      }),
      period_start: report.period_start,
      period_end: report.period_end,
    };
  }
  if (p === '/api/ai/capture' && method === 'POST') {
    if (!body.text?.trim()) throw new DemoError('문장을 입력해 주세요.');
    const c = aiCtx();
    return parseCapture(body.text, { members: c.members, projects: c.projects, today: c.today });
  }

  if (p === '/api/timeline' && method === 'GET') return timelineRows();

  if (p === '/api/phases' && method === 'GET') return phasesOf(sp.get('project') || undefined);
  if (p === '/api/phases' && method === 'POST') return createPhase(body);
  if (seg[1] === 'phases' && seg[2]) {
    if (method === 'PATCH') return updatePhase(seg[2], body);
    if (method === 'DELETE') return removePhase(seg[2]);
  }

  if (p === '/api/milestones' && method === 'GET') return milestonesOf(sp.get('project') || undefined);
  if (p === '/api/milestones' && method === 'POST') return createMilestone(body);
  if (seg[1] === 'milestones' && seg[2]) {
    if (method === 'PATCH') return updateMilestone(seg[2], body);
    if (method === 'DELETE') return removeMilestone(seg[2]);
  }

  if (p === '/api/expenses' && method === 'GET') {
    const who = sp.get('member');
    const range = {
      from: sp.get('from') || undefined, to: sp.get('to') || undefined,
      project: sp.get('project') || undefined,
      member: who === 'me' ? me : (who || undefined),
    };
    return { rows: expenseRows(range), summary: expenseSummary(range) };
  }
  if (p === '/api/expenses' && method === 'POST') return createExpense(body, me);
  if (seg[1] === 'expenses' && seg[2] && method === 'DELETE') return removeExpense(seg[2]);

  if (p === '/api/time/week' && method === 'GET') {
    const who = sp.get('member');
    return timeWeek(!who || who === 'me' ? me : who, weekStart(sp.get('week') || today()));
  }
  if (p === '/api/time' && method === 'POST') {
    const who = body.slack_user_id && body.slack_user_id !== 'me' ? body.slack_user_id : me;
    return setTime({ ...body, slack_user_id: who });
  }
  if (p === '/api/time/summary' && method === 'GET') {
    const to = sp.get('to') || today();
    return timeSummary(sp.get('from') || addDays(to, -6), to);
  }
  if (p === '/api/payments' && method === 'GET') {
    return { rows: paymentRows({ status: sp.get('status') || undefined }), summary: paymentSummary() };
  }
  if (seg[1] === 'payments' && seg[2] && method === 'PATCH') return updatePayment(seg[2], body);

  if (p === '/api/notifications' && method === 'GET') {
    return { slack_configured: false, rows: DB.notifications.slice(0, 200) };
  }
  if (p === '/api/jobs/daily' && method === 'POST') return runDailyJob();
  if (p === '/api/slack/sync' && method === 'POST') {
    throw new DemoError('데모에서는 Slack 동기화를 실행할 수 없습니다. 시드 구성원을 그대로 사용합니다.');
  }

  throw new DemoError('없는 API 경로입니다.');
}

// 서버판 api.js 와 같은 인터페이스. 화면 코드는 차이를 모른다.
const api = {
  get: (p) => Promise.resolve().then(() => handle('GET', p)),
  post: (p, b) => Promise.resolve().then(() => handle('POST', p, b ?? {})),
  patch: (p, b) => Promise.resolve().then(() => handle('PATCH', p, b ?? {})),
  del: (p) => Promise.resolve().then(() => handle('DELETE', p)),
};

// 브라우저 저장소는 접근 자체가 막히는 환경이 있으므로 항상 감싼다
const readStored = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
const writeStored = (key, value) => { try { localStorage.setItem(key, value); } catch { /* 저장 불가 시 메모리만 */ } };

const state = {
  me: readStored('kf.me') || null,
  members: [],
  projects: [],
  vendors: [],
  areaLeads: [],
  meta: null,
  today: null,
  slackConfigured: false,
};

const esc = (v) =>
  String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ── 날짜 ────────────────────────────────────────────────
const shortDate = (iso) => {
  if (!iso) return '-';
  const [y, m, d] = iso.slice(0, 10).split('-');
  return y === state.today?.slice(0, 4) ? `${Number(m)}/${Number(d)}` : `${y}. ${Number(m)}. ${Number(d)}`;
};
const longDate = (iso) => (iso ? `${Number(iso.slice(5, 7))}월 ${Number(iso.slice(8, 10))}일` : '-');
const dateTime = (iso) => {
  if (!iso) return '-';
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const dDay = (n) => {
  if (n === null || n === undefined) return '';
  if (n === 0) return 'D-DAY';
  return n > 0 ? `D-${n}` : `${n}일`;
};

// ── 프로젝트 색 ─────────────────────────────────────────
// 색은 프로젝트에 고정된다. 필터로 목록이 줄어도 남은 프로젝트의 색은 그대로다.
// 기준은 프로젝트가 이미 가진 정렬 순서(sort_order)다 — 목록 안에서의 등수가 아니라
// 프로젝트 자체의 값이라, 프로젝트를 새로 만들어도 기존 프로젝트 색이 바뀌지 않는다.
// 순서를 모르는 값(합계 행의 임의 키 등)은 id 해시로 떨어뜨린다.
const PROJECT_TONES = 4;
const projectTone = (id) => {
  const order = state.projects.find((p) => p.id === id)?.sort_order;
  if (Number.isInteger(order) && order > 0) return (order - 1) % PROJECT_TONES;
  let h = 0;
  for (const ch of String(id ?? '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return h % PROJECT_TONES;
};
/** 인라인 스타일로 넘길 프로젝트 색 변수 */
const projectStyle = (id) => `--pc:var(--p${projectTone(id)})`;
/** 색 점 + 이름 */
const projectName = (id, name) =>
  `<span class="pname" style="${projectStyle(id)}"><i class="pdot"></i>${esc(name ?? '')}</span>`;

  if (!member) return `<span class="avatar ${cls}">?</span>`;
  const initial = esc(member.display_name?.[0] ?? '?');
  return member.avatar_url
    ? `<span class="avatar ${cls}"><img src="${esc(member.avatar_url)}" alt=""></span>`
    : `<span class="avatar ${cls}">${initial}</span>`;
};

const person = (id, name) => {
  const m = memberOf(id);

// ── 호버 툴팁 ───────────────────────────────────────────
// [data-tip] 을 가진 요소에 붙는다. 마우스와 키보드 포커스를 함께 받는다.
// 차트 계열 화면(타임라인·보드 지도)이 같은 것을 쓴다.
function hoverTip(root) {
  // 툴팁 좌표는 root 기준이다 — root 가 배치 기준이 되어야 어긋나지 않는다
  if (getComputedStyle(root).position === 'static') root.style.position = 'relative';
  const tip = document.createElement('div');
  tip.className = 'hovertip';
  tip.hidden = true;
  root.appendChild(tip);

  const show = (el) => {
    tip.innerHTML = el.dataset.tip;
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const host = root.getBoundingClientRect();
    const w = tip.offsetWidth;
    const left = Math.min(Math.max(r.left - host.left + r.width / 2 - w / 2, 4), host.width - w - 4);
    const above = r.top - host.top - tip.offsetHeight - 8;
    tip.style.left = `${Math.max(left, 4)}px`;
    // 위쪽에 자리가 없으면 아래로 뒤집는다
    tip.style.top = `${above < 0 ? r.bottom - host.top + 8 : above}px`;
  };
  const hide = () => { tip.hidden = true; };

  root.addEventListener('mouseover', (e) => {
    const el = e.target.closest('[data-tip]');
    if (el) show(el); else hide();
  });
  root.addEventListener('mouseleave', hide);
  root.addEventListener('focusin', (e) => {
    const el = e.target.closest('[data-tip]');
    if (el) show(el);
  });
  root.addEventListener('focusout', hide);
  root.addEventListener('scroll', hide, true);
  return tip;
}

// ── 토스트 ──────────────────────────────────────────────
function toast(message, bad = false) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast${bad ? ' bad' : ''}`;
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5200 : 2600);
}

// ── 모달 ────────────────────────────────────────────────
let openModals = 0;

function modal({ title, body, footer, wide = false, onMount }) {
  const root = document.getElementById('modal-root');
  const backdrop = document.createElement('div');
  backdrop.className = 'backdrop';
  backdrop.innerHTML = `
    <div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head">
        <h2>${esc(title)}</h2>
        <button class="btn btn-ghost" data-close aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
    </div>`;
  root.appendChild(backdrop);
  openModals += 1;

  const close = () => {
    backdrop.remove();
    openModals -= 1;
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => { if (e.key === 'Escape' && openModals) close(); };

  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop || e.target.closest('[data-close]')) close();
  });
  document.addEventListener('keydown', onKey);

  const box = backdrop.querySelector('.modal');
  onMount?.({ root: box, close });
  box.querySelector('input,select,textarea,button:not([data-close])')?.focus();
  return { close, root: box };
}

function confirmModal(message, { confirmLabel = '확인', danger = false } = {}) {
  return new Promise((resolve) => {
    const m = modal({
      title: '확인',
      body: `<p>${esc(message)}</p>`,
      footer: `<div class="right">
          <button class="btn" data-close>취소</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(confirmLabel)}</button>
        </div>`,
      onMount({ root, close }) {
        root.querySelector('[data-ok]').addEventListener('click', () => { close(); resolve(true); });
        root.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) resolve(false); });
      },
    });
    void m;
  });
}

// 별도 구성원 DB 없이 Slack 멤버 목록에서 고른다.
function memberPicker(root, { multi = false, value = [], exclude = [], onChange }) {
  const box = root;
  const input = box.querySelector('input[data-search]');
  const listEl = box.querySelector('.pick-list');
  const selectedEl = box.querySelector('.selected');
  let selected = [...value];

  const renderSelected = () => {
    selectedEl.innerHTML = selected.map((id) => {
      const m = memberOf(id);
      return `<span class="token">${avatar(m, 'sm')}<span>${esc(m?.display_name ?? id)}</span>
        <button type="button" data-remove="${esc(id)}" aria-label="제외">✕</button></span>`;
    }).join('');
    onChange?.(multi ? selected : selected[0] ?? null);
  };

  const renderList = (q = '') => {
    const term = q.trim().toLowerCase();
    const rows = activeMembers().filter((m) => {
      if (selected.includes(m.slack_user_id)) return false;
      if (exclude.includes(m.slack_user_id)) return false;
      if (!term) return true;
      return [m.display_name, m.real_name, m.email, m.slack_user_id]
        .filter(Boolean).some((v) => v.toLowerCase().includes(term));
    });
    listEl.innerHTML = rows.length
      ? rows.map((m) => `<button type="button" data-pick="${esc(m.slack_user_id)}">
          ${avatar(m, 'sm')}<span>${esc(m.display_name)}</span>
          <span style="color:var(--muted);font-size:.78rem">@${esc(m.email?.split('@')[0] ?? m.slack_user_id)}</span>
        </button>`).join('')
      : `<div class="none">일치하는 구성원이 없습니다.</div>`;
    listEl.hidden = false;
  };

  input.addEventListener('focus', () => renderList(input.value));
  input.addEventListener('input', () => renderList(input.value));
  input.addEventListener('blur', () => setTimeout(() => { listEl.hidden = true; }, 160));

  listEl.addEventListener('mousedown', (e) => {
    const btn = e.target.closest('[data-pick]');
    if (!btn) return;
    e.preventDefault();
    const id = btn.dataset.pick;
    selected = multi ? [...selected, id] : [id];
    input.value = '';
    listEl.hidden = true;
    renderSelected();
  });

  selectedEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-remove]');
    if (!btn) return;
    selected = selected.filter((id) => id !== btn.dataset.remove);
    renderSelected();
  });

  renderSelected();
  return {
    get value() { return multi ? selected : selected[0] ?? null; },
    setExclude(list) { exclude = list; },
    set(id) { selected = multi ? [...new Set([...selected, id])] : [id]; renderSelected(); },
  };
}

      syncLead();

      // 페이즈는 프로젝트에 딸린 값이라 프로젝트가 바뀔 때마다 다시 불러온다
      const projectSel = form.querySelector('[name=project_id]');
      const phaseSel = form.querySelector('[name=phase_id]');

        const pid = projectSel.value;
        const want = phaseSel.dataset.want ?? task?.phase_id ?? '';

        if (!pid) return;

          const list = await api.get(`/api/phases?project=${encodeURIComponent(pid)}`);

            list.map((ph) => `<option value="${esc(ph.id)}">${esc(ph.name)}</option>`).join(''));
          if (want && list.some((ph) => ph.id === want)) phaseSel.value = want;
        } catch { /* 페이즈를 못 불러와도 업무는 저장할 수 있다 */ }
      };
      projectSel.addEventListener('change', () => { delete phaseSel.dataset.want; syncPhases(); });
      syncPhases();

      // 납품 예정일을 넣으면 마감일 기본값으로 채운다

          const r = await api.post('/api/ai/capture', { text });
          const f = r.fields;
          if (f.title) form.querySelector('[name=title]').value = f.title;
          if (f.project_id) form.querySelector('[name=project_id]').value = f.project_id;
          if (f.area) { areaSel.value = f.area; syncArea(); syncLead(); }
          if (f.due_date) dueInput.value = f.due_date;
          if (f.priority) form.querySelector('[name=priority]').value = f.priority;
          captureRes.hidden = false;
          captureRes.innerHTML = r.matched.length
            ? r.matched.map((m) => `<span class="tok">${esc(m.field)} <b>${esc(String(m.value))}</b></span>`).join('')
              + `<span class="tok">${r.source === 'llm' ? 'AI 해석' : '규칙 해석'}</span>`
            : '<span class="tok">인식된 항목이 없습니다. 아래에서 직접 입력해 주세요.</span>';
        } catch (err) {
          toast(err.message, true);
        }
        captureBtn.disabled = false;
        captureBtn.textContent = '채우기';
      };
      captureBtn?.addEventListener('click', runCapture);
      captureInput?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); runCapture(); }
      });

      root.querySelector('[data-save]').addEventListener('click', async () => {
        const fd = new FormData(form);
        const payload = Object.fromEntries([...fd.entries()].map(([k, v]) => [k, v === '' ? null : v]));
        payload.collaborators = collabPicker.value;

        if (!payload.title?.trim()) return toast('업무명을 입력해 주세요.', true);
        if (!payload.project_id) return toast('프로젝트를 선택해 주세요.', true);
        if (!leadOf(payload.area)) return toast('이 영역의 리드가 지정되지 않았습니다. Overview에서 영역 리드를 먼저 설정해 주세요.', true);
        if (!payload.due_date && !payload.delivery_due_date) return toast('마감일을 입력해 주세요.', true);

        try {
          const saved = editing
            ? await api.patch(`/api/tasks/${task.id}`, payload)
            : await api.post('/api/tasks', payload);
          toast(editing ? '업무를 저장했습니다.' : '업무를 등록했습니다.');
          const keepOpen = root.querySelector('#keep-open')?.checked;
          if (!editing && keepOpen) {
            close();
            taskForm({
              defaults: { project_id: payload.project_id, area: payload.area, owner: payload.owner_slack_user_id },
              onSaved,
            });
          } else {
            close();
          }
          onSaved?.(saved);
        } catch (err) {
          toast(err.message, true);
        }
      });
    },
  });
}

          <select name="status">${opts(state.meta.issue_statuses, issue?.status ?? 'OPEN')}</select>
        </label>
        <label class="field span2">
          <span class="lab">영향</span>
          <input type="text" name="impact" value="${esc(issue?.impact ?? '')}" placeholder="예: 콘텐츠 등록 일정 3일 지연 예상">
        </label>
      </div>
      <p class="hint" style="margin-top:12px">이슈 상태는 업무 상태와 분리해 관리합니다. 이슈를 해결해도 업무가 자동으로 완료되지 않습니다.</p>
    </form>`;

  modal({
    title: editing ? '이슈 수정' : '이슈 등록',
    body,
    footer: `<div class="right"><button class="btn" data-close>취소</button>
             <button class="btn btn-primary" data-save>${editing ? '저장' : '이슈 등록'}</button></div>`,
    wide: true,
    onMount({ root, close }) {
      const form = root.querySelector('#issue-form');
      const projectSel = form.querySelector('[name=project_id]');
      const taskSel = form.querySelector('[name=task_id]');

      const ownerPicker = memberPicker(form.querySelector('[data-owner-slot] .member-pick'), {
        multi: false,
        value: issue?.owner_slack_user_id ? [issue.owner_slack_user_id] : [state.me],
      });

      const loadTasks = async () => {
        const pid = projectSel.value;
        taskSel.innerHTML = '<option value="">연결 안 함</option>';
        if (!pid) return;
        const rows = await api.get(`/api/tasks?project=${encodeURIComponent(pid)}&done=1`);
        taskSel.innerHTML += rows.map((t) =>
          `<option value="${esc(t.id)}"${t.id === (issue?.task_id ?? defaults.task_id) ? ' selected' : ''}>${esc(t.title)}</option>`).join('');
      };
      projectSel.addEventListener('change', loadTasks);
      loadTasks();

      root.querySelector('[data-save]').addEventListener('click', async () => {
        const fd = new FormData(form);
        const payload = Object.fromEntries([...fd.entries()].map(([k, v]) => [k, v === '' ? null : v]));
        payload.owner_slack_user_id = ownerPicker.value;
        if (!payload.title?.trim()) return toast('이슈명을 입력해 주세요.', true);
        if (!payload.project_id) return toast('관련 프로젝트를 선택해 주세요.', true);
        if (!payload.content?.trim()) return toast('이슈 내용을 입력해 주세요.', true);
        if (!payload.owner_slack_user_id) return toast('이슈 담당자를 지정해 주세요.', true);
        try {
          const saved = editing
            ? await api.patch(`/api/issues/${issue.id}`, payload)
            : await api.post('/api/issues', payload);
          toast(editing ? '이슈를 저장했습니다.' : '이슈를 등록했습니다.');
          close();
          onSaved?.(saved);
        } catch (err) {
          toast(err.message, true);
        }
      });
    },
  });
}

// 업무마다 사람을 고르는 대신 여기서 영역별 책임자를 정한다.
function areaLeadsForm({ onSaved }) {

  const people = activeMembers();

  const body = `
    <p class="hint" style="margin-bottom:14px">
      업무를 등록할 때 담당자를 따로 고르지 않습니다. 선택한 <b>업무 영역의 리드</b>가 담당이 됩니다.
      리드를 바꾸면 그 영역의 <b>미완료 업무</b> 담당도 함께 옮겨지고, 완료된 업무는 기록으로 남습니다.
    </p>
    <div class="lead-table">
      ${state.meta.areas.map((a) => `
        <div class="lead-row">
          <span class="lead-area">${esc(a.full)}</span>
          <select data-area="${esc(a.code)}">
            <option value="">지정 안 함</option>
            ${people.map((m) => `<option value="${esc(m.slack_user_id)}"${
              current[a.code] === m.slack_user_id ? ' selected' : ''}>${esc(m.display_name)}</option>`).join('')}
          </select>
        </div>`).join('')}
    </div>`;

  modal({
    title: '영역 리드',
    body,
    footer: `<div class="right"><button class="btn" data-close>취소</button>
             <button class="btn btn-primary" data-save>저장</button></div>`,
    onMount({ root, close }) {
      root.querySelector('[data-save]').addEventListener('click', async () => {
        const leads = [...root.querySelectorAll('[data-area]')]
          .filter((sel) => sel.value)
          .map((sel) => ({ area: sel.dataset.area, slack_user_id: sel.value }));

          const result = await api.patch('/api/area-leads', { leads });
          const moved = result.reduce((n, r) => n + (r.moved ?? 0), 0);
          toast(moved ? `영역 리드를 저장했습니다. 업무 ${moved}건의 담당이 함께 바뀌었습니다.` : '영역 리드를 저장했습니다.');
          close();
          onSaved?.();
        } catch (err) {
          toast(err.message, true);
        }
      });
    },
  });
}

  const body = `

      <div class="form-grid">
        <label class="field">
          <span class="lab">프로젝트<span class="req">*</span></span>

          <input type="text" name="amount" inputmode="numeric" required placeholder="예: 18400">
        </label>
        <label class="field span2">

          <select name="task_id"><option value="">지정 안 함</option></select>
          <span class="hint">프로젝트를 고르면 내 업무 목록이 채워집니다.</span>
        </label>
        <label class="field span2">
          <span class="lab">메모</span>
          <input type="text" name="memo" maxlength="120" placeholder="예: 파일럿 어린이집 방문 인터뷰">
        </label>
      </div>
    </form>`;

  modal({
    title: '경비 등록',
    body,
    footer: `<div class="right">
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" data-save>등록</button></div>`,
    onMount({ root, close }) {
      const form = root.querySelector('#expense-form');
      const taskSel = form.querySelector('[name=task_id]');

      const loadTasks = async () => {
        const pid = form.querySelector('[name=project_id]').value;
        taskSel.innerHTML = '<option value="">지정 안 함</option>';
        if (!pid) return;
        try {
          const rows = await api.get(`/api/tasks?project=${encodeURIComponent(pid)}&done=1`);
          taskSel.insertAdjacentHTML('beforeend',
            rows.map((t) => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join(''));
          if (defaults.task_id) taskSel.value = defaults.task_id;
        } catch { /* 업무를 못 불러와도 경비는 등록할 수 있다 */ }
      };
      form.querySelector('[name=project_id]').addEventListener('change', loadTasks);
      loadTasks();

      root.querySelector('[data-save]').addEventListener('click', async () => {
        const fd = new FormData(form);
        const amount = Number(String(fd.get('amount')).replace(/[,\s원]/g, ''));
        if (!fd.get('project_id')) return toast('프로젝트를 선택해 주세요.', true);
        if (!fd.get('spent_on')) return toast('사용일을 입력해 주세요.', true);
        if (!Number.isFinite(amount) || amount <= 0) return toast('금액을 0보다 큰 숫자로 입력해 주세요.', true);
        try {
          await api.post('/api/expenses', {
            project_id: fd.get('project_id'),
            task_id: fd.get('task_id') || null,
            spent_on: fd.get('spent_on'),
            category: fd.get('category'),
            amount,
            memo: fd.get('memo') || null,
          });
          toast('경비를 등록했습니다.');
          close();
          onSaved?.();
        } catch (err) { toast(err.message, true); }
      });
    },
  });
}




const SEV_LABEL = { high: '높음', medium: '보통', low: '낮음' };

// 한눈에 볼 수 있는 만큼만 펼쳐 둔다. 나머지는 접어 두되 몇 건인지는 알려준다.
const VISIBLE = 3;

/** 위험 신호 섹션 마크업. 근거가 되는 업무·이슈로 바로 이동할 수 있어야 한다. */
function riskSection(rows, { source = 'rules' } = {}) {
  const head = `
    <div class="section-head">
      <h2>위험 신호</h2>
      <span class="meta">
        <span class="src-tag ${source === 'llm' ? 'llm' : ''}">${source === 'llm' ? 'AI' : '규칙'}</span>
        데이터에서 자동으로 찾아냅니다
      </span>
    </div>`;

  if (!rows.length) {
    return `<section class="section">${head}
      <div class="risks-ok"><b>지금 눈에 띄는 위험 신호가 없습니다.</b>
        마감이 반복해서 밀리거나, 진행이 멈추거나, 납품이 임박한 업무가 생기면 여기에 표시됩니다.</div>
    </section>`;
  }

  const card = (r) => `
        <article class="risk ${esc(r.severity)}">
          <div class="head">
            <span class="sev">${esc(SEV_LABEL[r.severity] ?? r.severity)}</span>
            <h3>${esc(r.title)}</h3>
            <span class="cnt">${r.count}건</span>
          </div>
          <p class="detail">${esc(r.detail)}</p>
          <ul>
            ${r.items.slice(0, 5).map((i) => {
              const inner = `
                <span class="lbl">${esc(i.label)}</span>
                <span class="sub">${esc(i.sub ?? '')}</span>
                <span class="note">${esc(i.note ?? '')}</span>`;
              const target = i.kind === 'task' ? `#/project/tasks/${i.id}`
                : i.kind === 'issue' ? `#/project/issues/${i.id}`
                : i.kind === 'owner' ? `#/project/tasks?owner=${encodeURIComponent(i.id)}&done=1`
                : i.kind === 'project' ? `#/project/tasks?project=${encodeURIComponent(i.id)}&done=1`
                : i.kind === 'area' ? `#/project/tasks?area=${encodeURIComponent(i.id)}&done=1`
                : null;
              return `<li>${target
                ? `<button type="button" data-jump="${esc(target)}">${inner}</button>`
                : `<span class="static">${inner}</span>`}</li>`;
            }).join('')}
            ${r.items.length > 5
              ? `<li><span class="static"><span class="sub">외 ${r.items.length - 5}건</span></span></li>` : ''}
          </ul>
        </article>`;

  const shown = rows.slice(0, VISIBLE);
  const hidden = rows.slice(VISIBLE);

  return `<section class="section">${head}
    <div class="risks">
      ${shown.map(card).join('')}
      ${hidden.length ? `
        <div class="risks-more" hidden>${hidden.map(card).join('')}</div>
        <button class="btn risks-toggle" data-more aria-expanded="false">
          위험 신호 ${hidden.length}건 더 보기
        </button>` : ''}
    </div>
  </section>`;
}








// ── 보드 지도 ───────────────────────────────────────────
// 업무 하나가 타일 하나다. 이 화면에서 유일한 그래프이고, 보드 자체를 그린 것이다.
//
// 무엇을 무엇으로 나타내는가 — 채널을 하나씩만 쓴다.
//   가로 위치(열) = 진행 단계   대기 → 진행중 → 검토 → 완료
//   타일 색       = 프로젝트    (4칸 팔레트, 대비·색각 검증을 통과한 값)
//   테두리 빨강   = 지연        상태색은 지연에만 쓴다. 범례와 툴팁이 말로도 알려 준다
//   타일 개수     = 업무 수     넓이가 아니라 개수다. 하나가 하나다
//
// 색만으로 구분하게 두지 않는다: 열 머리에 개수가 적혀 있고, 같은 프로젝트끼리
// 붙여 두며, 아래 범례와 타일 툴팁이 이름을 말한다.

const BOARD_STAGES = [
  { key: 'WAIT',     label: '대기',   jump: '#/project/tasks?stage=WAIT' },
  { key: 'PROGRESS', label: '진행중', jump: '#/project/tasks?stage=IN_PROGRESS' },
  { key: 'REVIEW',   label: '검토',   jump: '#/project/tasks?stage=REVIEW' },
  { key: 'DONE',     label: '완료',   jump: '#/project/tasks?stage=DONE&done=1' },
];
const BOARD_COLUMN_CAP = 72;   // 한 열에 이보다 많으면 접고 개수만 알린다

function boardMap(ov) {
  const used = ov.projects.filter((p) => p.count > 0);
  let i = 0;   // 등장 순서 — 타일이 차례로 나타나는 효과에만 쓴다

  const column = (st) => {
    const rows = ov.board.filter((t) => t.stage === st.key);
    const total = ov.summary.total
      ? { WAIT: ov.summary.total - ov.summary.in_progress - ov.summary.review - ov.summary.done,
          PROGRESS: ov.summary.in_progress, REVIEW: ov.summary.review, DONE: ov.summary.done }[st.key]
      : 0;
    const shown = rows.slice(0, BOARD_COLUMN_CAP);
    const hidden = Math.max(total - shown.length, 0);

    return `
      <div class="bm-col">
        <button class="bm-head" data-jump="${esc(st.jump)}">
          <span class="bm-stage">${esc(st.label)}</span>
          <span class="bm-count">${total}</span>
        </button>
        <div class="bm-tiles">
          ${shown.map((t) => {
            i += 1;
            const tip = `<b>${esc(t.title)}</b><br><span class="tip-sub">${esc(t.project_name)} · ${esc(t.owner_name)}`
              + `${t.due_date ? ` · ${esc(shortDate(t.due_date))}` : ''}</span>`
              + `${t.is_delayed ? '<br>⚠ 지연' : ''}${t.has_open_issue ? '<br>🔥 이슈' : ''}`;
            return `<button class="bm-tile${t.is_delayed ? ' late' : ''}"
                      style="${projectStyle(t.project_id)};--i:${i}"
                      data-jump="#/project/tasks/${esc(t.id)}" data-tip="${esc(tip)}"
                      aria-label="${esc(`${t.title} — ${t.project_name}${t.is_delayed ? ' 지연' : ''}`)}"></button>`;
          }).join('')}
          ${hidden ? `<span class="bm-rest">+${hidden}</span>` : ''}
        </div>
      </div>`;
  };

  return `
    <section class="boardmap">
      <div class="bm-top">
        <div class="bm-figure">
          <div class="bm-num">${pctText(ov.progress)}</div>
          <div class="bm-cap">전체 진행률 · 업무 ${ov.summary.total}건</div>
        </div>
        <div class="bm-alerts">
          <button class="bm-alert ${ov.summary.delayed ? 'on' : ''}" data-jump="delayed">
            <span class="k">지연</span><span class="v">${ov.summary.delayed}</span>
          </button>
          <button class="bm-alert warn ${ov.summary.issues ? 'on' : ''}" data-jump="issues">
            <span class="k">이슈</span><span class="v">${ov.summary.issues}</span>
          </button>
        </div>
      </div>

      <div class="bm-grid">${BOARD_STAGES.map(column).join('')}</div>

      <div class="bm-legend">
        ${used.map((p) => `<span class="bm-key" style="${projectStyle(p.id)}"><i class="sw"></i>${esc(p.name)}</span>`).join('')}
        <span class="bm-key late"><i class="sw"></i>지연</span>
        <span class="bm-note">타일 하나 = 업무 하나 · 누르면 그 업무로</span>
      </div>
    </section>`;
}

const QUICK = [
  { key: 'mine',    label: '내 영역 업무', params: { owner: 'me' } },
  { key: 'all',     label: '전체',         params: { done: '1' } },
  { key: 'progress',label: '진행중',       params: { stage: 'IN_PROGRESS' } },
  { key: 'review',  label: '검토',         params: { stage: 'REVIEW' } },
  { key: 'delayed', label: '지연',         params: { delayed: '1' } },
  { key: 'issue',   label: '이슈 있음',    params: { issue: '1' } },
  { key: 'out',     label: '외주 작업',    params: { area: 'OUT' } },
];

const paramsOf = (query) => {
  const p = new URLSearchParams(query);
  return p;
};

const matchesQuick = (p, quick) => {
  const entries = Object.entries(quick.params);
  return entries.every(([k, v]) => p.get(k) === v)
    && [...p.keys()].filter((k) => k !== 'done').length === entries.filter(([k]) => k !== 'done').length;
};

async function renderTasks(root, query) {
  const p = paramsOf(query);
  root.innerHTML = loading();

  let rows;
  try {
    rows = await api.get(`/api/tasks?${p.toString()}`);
  } catch (err) {
    root.innerHTML = errorBox(err.message);
    return;
  }

  const setParam = (patch) => {
    const next = new URLSearchParams(p);
    for (const [k, v] of Object.entries(patch)) {
      if (v === null || v === undefined || v === '') next.delete(k);
      else next.set(k, v);
    }
    go(`#/project/tasks?${next.toString()}`);
  };

  const projectOptions = activeProjects()
    .map((pr) => `<option value="${esc(pr.id)}"${p.get('project') === pr.id ? ' selected' : ''}>${esc(pr.name)}</option>`).join('');

    .map((a) => `<option value="${esc(a.code)}"${p.get('area') === a.code ? ' selected' : ''}>${esc(a.full)}</option>`).join('');
  const ownerOptions = state.members
    .map((m) => `<option value="${esc(m.slack_user_id)}"${p.get('owner') === m.slack_user_id ? ' selected' : ''}>${esc(m.display_name)}${m.is_active ? '' : ' (비활성)'}</option>`).join('');

        <h1>Tasks</h1>

        <button class="btn btn-primary" data-new-task>+ 업무 등록</button>
      </div>
    </div>

    <div class="filters">
      <div class="quick">
        ${QUICK.map((q) => `<button data-quick="${q.key}" class="${matchesQuick(p, q) ? 'on' : ''}">${esc(q.label)}</button>`).join('')}
      </div>
    </div>

    <div class="filter-row" style="margin-bottom:16px">
      <select data-f="project"><option value="">프로젝트 전체</option>${projectOptions}</select>
      <select data-f="area"><option value="">영역 전체</option>${areaOptions}</select>
      <select data-f="owner"><option value="">리드 전체</option><option value="me"${p.get('owner') === 'me' ? ' selected' : ''}>나</option>${ownerOptions}</select>
      <input type="search" data-f="q" value="${esc(p.get('q') ?? '')}" placeholder="업무명 검색">
      <label style="display:flex;align-items:center;gap:6px;font-size:.83rem;color:var(--muted)">
        <input type="checkbox" data-f="done" ${p.get('done') === '1' ? 'checked' : ''}> 완료 포함
      </label>
      <button class="btn btn-ghost" data-reset>필터 초기화</button>
    </div>

    ${rows.length ? `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>업무</th>
              <th>프로젝트</th>
              <th>영역</th>
              <th>담당</th>
              <th class="nowrap">마감</th>
              <th class="nowrap">상태</th>
              <th class="nowrap">이슈</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((t) => `
              <tr class="row-click" data-open="${esc(t.id)}">
                <td class="title-cell">${esc(t.title)} ${flags(t)}</td>
                <td data-label="프로젝트">${projectName(t.project_id, t.project_name)}</td>
                <td data-label="영역">${areaChip(t.area)}</td>
                <td data-label="담당">${person(t.owner_slack_user_id, t.owner_name)}</td>
                <td data-label="마감" class="nowrap num due ${t.is_delayed ? 'late' : ''}">
                  ${shortDate(t.due_date)}
                  <span style="color:var(--muted);font-size:.76rem">${t.status === 'DONE' ? '' : dDay(t.d_day)}</span>
                </td>
                <td data-label="상태" class="nowrap">
                  <select class="status-select" data-status="${esc(t.id)}" data-area="${esc(t.area)}" aria-label="상태 변경">
                    ${(t.area === 'OUT' ? state.meta.out_statuses : state.meta.normal_statuses)
                      .map((s) => `<option value="${esc(s.code)}"${s.code === t.status ? ' selected' : ''}>${esc(s.label)}</option>`).join('')}
                  </select>
                </td>
                <td data-label="이슈" class="nowrap issue-cell">${t.has_open_issue ? `<span class="flag issue">🔥 ${t.open_issue_count}</span>` : '<span style="color:var(--muted)">-</span>'}</td>
              </tr>`).join('')}

        action: [...p.keys()].length
          ? '<button class="btn" data-reset>필터 초기화</button>'
          : '<button class="btn btn-primary" data-new-task>+ 업무 등록</button>',
      })}`;

  root.addEventListener('change', async (e) => {

        toast('상태를 변경했습니다.');
        window.dispatchEvent(new Event('kf:reload'));
      } catch (err) {
        toast(err.message, true);
        window.dispatchEvent(new Event('kf:reload'));
      }
      return;
    }
    const f = e.target.closest('[data-f]');
    if (f) {
      const key = f.dataset.f;
      setParam({ [key]: f.type === 'checkbox' ? (f.checked ? '1' : null) : f.value });
    }
  });

  root.addEventListener('keydown', (e) => {
    const f = e.target.closest('[data-f=q]');
    if (f && e.key === 'Enter') setParam({ q: f.value });
  });

  root.addEventListener('click', (e) => {
    if (e.target.closest('.status-select')) return;
    const quick = e.target.closest('[data-quick]');
    if (quick) {
      const q = QUICK.find((x) => x.key === quick.dataset.quick);
      go(`#/project/tasks?${new URLSearchParams(q.params).toString()}`);
      return;
    }
    if (e.target.closest('[data-reset]')) { go('#/project/tasks'); return; }
    const row = e.target.closest('[data-open]');
    if (row) go(`#/project/tasks/${row.dataset.open}`);
  });
}

            </div>`).join('')
            : '<p style="color:var(--muted);font-size:.86rem">등록된 이슈가 없습니다. 진행을 막는 문제가 있으면 이슈로 남겨 주세요.</p>'}
        </div>

        <div class="panel">
          <h3>변경 이력</h3>
          <div class="timeline">
            ${t.events.map((e) => `
              <div class="ev">
                <span class="t">${dateTime(e.occurred_at)}</span>
                <span>${esc(e.actor_name)} · ${esc(EVENT_LABEL[e.event_type] ?? e.event_type)}
                  ${e.event_type === 'STATUS_CHANGED' ? `<b>${esc(statusLabel(e.from_value))} → ${esc(statusLabel(e.to_value))}</b>` : ''}
                  ${e.event_type === 'DUE_CHANGED' ? `<b>${shortDate(e.from_value)} → ${shortDate(e.to_value)}</b>` : ''}
                  ${e.event_type === 'REVIEW_STATUS_CHANGED' ? `<b>${esc(reviewLabel(e.from_value))} → ${esc(reviewLabel(e.to_value))}</b>` : ''}
                </span>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>`;

  root.addEventListener('change', async (e) => {
    if (e.target.closest('[data-status]')) {
      const next = e.target.value;
      if (t.status === 'DONE' && next !== 'DONE') {
        const ok = await confirmModal('완료된 업무입니다. 상태를 되돌리면 완료 시각이 지워집니다. 계속할까요?');
        if (!ok) return reload();
      }
      if (t.area === 'OUT' && next === 'DONE' && t.review_status !== 'APPROVED') {
        const ok = await confirmModal('검수 상태가 승인이 아닙니다. 그래도 완료 처리할까요?');
        if (!ok) return reload();
      }
      try {
        await api.patch(`/api/tasks/${t.id}`, { status: next });
        toast('상태를 변경했습니다.');
      } catch (err) { toast(err.message, true); }
      reload();
      return;
    }
    if (e.target.closest('[data-review]')) {
      const next = e.target.value;
      try {
        await api.patch(`/api/tasks/${t.id}`, { review_status: next });
        toast('검수 상태를 변경했습니다.');
        if (next === 'REJECTED' && t.status !== 'OUT_REVISION') {
          const ok = await confirmModal('반려 처리했습니다. 업무 상태를 "수정"으로 전환할까요?');
          if (ok) await api.patch(`/api/tasks/${t.id}`, { status: 'OUT_REVISION' });
        }
      } catch (err) { toast(err.message, true); }
      reload();
    }
  });

  root.addEventListener('click', async (e) => {
    if (e.target.closest('[data-edit]')) {
      taskForm({ task: t, onSaved: reload });
    } else if (e.target.closest('[data-new-issue]')) {
      issueForm({ defaults: { project_id: t.project_id, task_id: t.id }, onSaved: reload });
    } else if (e.target.closest('[data-delete]')) {
      const ok = await confirmModal('이 업무를 삭제할까요? 연결된 이슈는 남습니다.', { confirmLabel: '삭제', danger: true });
      if (!ok) return;
      await api.del(`/api/tasks/${t.id}`);
      toast('업무를 삭제했습니다.');
      go('#/project/tasks');
    }
  });
}







const severityLabel = (code) => state.meta.priorities.find((p) => p.code === code)?.label ?? code;

async function renderIssues(root, query) {
  const p = new URLSearchParams(query);
  root.innerHTML = loading();
  let rows;
  try {
    rows = await api.get(`/api/issues?${p.toString()}`);
  } catch (err) {
    root.innerHTML = errorBox(err.message);
    return;
  }

  const set = (patch) => {
    const next = new URLSearchParams(p);
    for (const [k, v] of Object.entries(patch)) {
      if (!v) next.delete(k); else next.set(k, v);
    }
    go(`#/project/issues?${next.toString()}`);
  };
  const on = (k, v) => (p.get(k) === v ? 'on' : '');

  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Issues</h1>
        <div class="sub">${rows.length}건 · 업무 상태와 이슈 상태는 분리해서 관리합니다</div>
      </div>
      <div class="page-actions"><button class="btn btn-primary" data-new-issue>+ 이슈 등록</button></div>
    </div>

    <div class="filters">
      <div class="quick">
        <button data-q="clear" class="${[...p.keys()].length === 0 ? 'on' : ''}">미해결</button>
        <button data-q="mine" class="${on('owner', 'me')}">내 담당 이슈</button>
        <button data-q="open" class="${on('status', 'OPEN')}">Open</button>
        <button data-q="checking" class="${on('status', 'CHECKING')}">확인중</button>
        <button data-q="high" class="${on('severity', 'HIGH')}">중요도 높음</button>
        <button data-q="resolved" class="${on('resolved', '1')}">해결 포함</button>
      </div>
    </div>

    ${rows.length ? `
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>이슈</th><th>프로젝트</th><th>관련 업무</th>
                <th>담당</th><th class="nowrap">중요도</th><th class="nowrap">목표일</th><th class="nowrap">상태</th></tr>
          </thead>
          <tbody>
            ${rows.map((i) => `
              <tr class="row-click" data-open="${esc(i.id)}">
                <td class="title-cell"><span class="sev-bar ${esc(i.severity)}"></span>${esc(i.title)}</td>
                <td data-label="프로젝트">${esc(i.project_name)}</td>
                <td data-label="관련 업무">${i.task_title ? esc(i.task_title) : '<span style="color:var(--muted)">-</span>'}</td>
                <td data-label="담당">${person(i.owner_slack_user_id, i.owner_name)}</td>
                <td data-label="중요도" class="nowrap">${esc(severityLabel(i.severity))}</td>
                <td data-label="목표일" class="nowrap num" style="${i.target_resolve_date && i.target_resolve_date < state.today && i.status !== 'RESOLVED' ? 'color:var(--s-delay)' : ''}">
                  ${shortDate(i.target_resolve_date)}</td>
                <td data-label="상태" class="nowrap">
                  <select data-status="${esc(i.id)}" class="status-select" aria-label="이슈 상태">
                    ${state.meta.issue_statuses.map((s) =>
                      `<option value="${esc(s.code)}"${s.code === i.status ? ' selected' : ''}>${esc(s.label)}</option>`).join('')}
                  </select>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>` : empty({
        title: [...p.keys()].length ? '조건에 맞는 이슈가 없습니다' : '등록된 이슈가 없습니다',
        hint: '업무 진행을 막는 문제와 블로커를 이슈로 남겨 주세요.',
        action: '<button class="btn btn-primary" data-new-issue>+ 이슈 등록</button>',
      })}`;

  root.addEventListener('change', async (e) => {
    const sel = e.target.closest('[data-status]');
    if (!sel) return;
    try {
      await api.patch(`/api/issues/${sel.dataset.status}`, { status: sel.value });
      toast('이슈 상태를 변경했습니다.');
    } catch (err) { toast(err.message, true); }
    window.dispatchEvent(new Event('kf:reload'));
  });

  root.addEventListener('click', (e) => {
    if (e.target.closest('.status-select')) return;
    const q = e.target.closest('[data-q]')?.dataset.q;
    if (q) {
      const map = {
        clear: '#/project/issues',
        mine: '#/project/issues?owner=me',
        open: '#/project/issues?status=OPEN',
        checking: '#/project/issues?status=CHECKING',
        high: '#/project/issues?severity=HIGH',
        resolved: '#/project/issues?resolved=1',
      };
      go(map[q]);
      return;
    }
    const row = e.target.closest('[data-open]');
    if (row) go(`#/project/issues/${row.dataset.open}`);
  });
}

const sec = (n, title, inner) => `
  <section class="rsec"><h3><span class="n">${n}</span>${esc(title)}</h3>${inner}</section>`;

const deltaTag = (d) => {
  if (d === null || d === undefined) return '<span class="delta flat">-</span>';
  if (d === 0) return '<span class="delta flat">±0%p</span>';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}%p</span>`;
};

const taskLine = (t, extra = '') => `
  <li><a href="#/project/tasks/${esc(t.id)}" style="text-decoration:underline">${esc(t.title)}</a>
    <span style="color:var(--muted)">· ${esc(t.project_name)} · ${esc(t.owner_name)} · ${esc(t.status_label)}${extra}</span></li>`;

function shiftWeek(iso, days) {
  const d = new Date(`${iso}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function toMarkdown(report) {
  const s = report.snapshot;
  const L = [];
  L.push(`# KinderFlow Weekly Report (${report.period_start} ~ ${report.period_end})`, '');
  L.push('## ① 전체 업무 현황');
  L.push(`- 이번 주 완료 ${s.summary.completed_this_week} · 진행중 ${s.summary.in_progress} · 검토 ${s.summary.review} · 지연 ${s.summary.delayed} · 신규 ${s.summary.created_this_week}`, '');
  L.push('## ② 프로젝트별 진행');
  for (const p of s.projects) {
    const d = p.delta === null ? '-' : `${p.delta > 0 ? '+' : ''}${p.delta}%p`;
    L.push(`- ${p.name}: ${p.progress ?? '-'}% (${d}) · 이번 주 완료 ${p.completed_this_week}건`);
  }
  L.push('', '## ③ 업무 영역별 진행');
  for (const a of s.areas.filter((x) => x.count > 0)) L.push(`- ${a.label}: ${a.progress ?? '-'}% (업무 ${a.count}건)`);
  L.push('', '## ④ 주요 완료 업무');
  for (const t of s.completed.rows) L.push(`- ${t.title} (${t.project_name} · ${t.owner_name})`);
  if (s.completed.more) L.push(`- 외 ${s.completed.more}건`);
  L.push('', '## ⑤ 진행 및 지연 업무');
  for (const t of s.progressing.delayed) L.push(`- [지연 ${t.days_late}일] ${t.title} (${t.project_name} · ${t.owner_name})`);
  L.push('', '## ⑥ 외주 진행 현황');
  L.push(`- 진행 ${s.outsourcing.active}건 · 검수 ${s.outsourcing.review}건 · 수정 ${s.outsourcing.revision}건 · 납품 지연 ${s.outsourcing.delivery_delayed}건`);
  L.push('', '## ⑦ 주요 이슈');
  for (const i of s.issues.rows) L.push(`- [${i.severity}] ${i.title} (${i.project_name} · ${i.owner_name})${i.impact ? ` — ${i.impact}` : ''}`);
  L.push('', '## ⑧ 리드별 현황');
  for (const o of s.owners) L.push(`- ${o.display_name}: 담당 ${o.count} · 진행 ${o.in_progress} · 이번 주 완료 ${o.completed_this_week} · 지연 ${o.delayed}`);
  L.push('', '## ⑨ 다음 주 주요 업무');
  for (const t of s.next_week.due) L.push(`- ${t.title} (${t.project_name} · ${t.owner_name} · 마감 ${t.due_date})`);
  return L.join('\n');
}
