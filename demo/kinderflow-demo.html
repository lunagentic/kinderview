  const known = new Set((db.tasks ?? []).map((t) => t.title));
  const phaseByKey = {};
  for (const ph of db.phases ?? []) phaseByKey[`${ph.project_id}/${ph.name}`] = ph.id;
  const projectByName = {};
  for (const pr of db.projects ?? []) projectByName[pr.name] = pr.id;
  const seedProjectName = Object.fromEntries((SEED.PROJECTS ?? []).map((pr) => [pr.key, pr.name]));
  const seedPhaseName = Object.fromEntries((SEED.PHASES ?? []).map(([, key, name]) => [key, name]));
  const leadNow = (area) => (db.area_leads ?? [])
    .find((l) => l.area === area && (l.role ?? 'LEAD') === 'LEAD')?.slack_user_id;

  for (const [pk, phaseKey, group, detail, area, due, priority, note, who] of SEED.TASKS ?? []) {
    const title = taskTitle(group, detail);
    if (known.has(title)) continue;
    // 프로젝트 이름이 바뀌었을 수 있으니 바뀐 이름으로도 찾아본다
    const wanted = seedProjectName[pk];
    const projectId = projectByName[RENAMED_PROJECTS[wanted] ?? wanted] ?? projectByName[wanted];
    const owner = who || leadNow(area);
    if (!projectId || !owner) continue;
    const created = `${addDays(due, -21)}T01:00:00.000Z`;
    const id = uid();
    db.tasks.push({
      id, project_id: projectId, phase_id: phaseByKey[`${projectId}/${seedPhaseName[phaseKey]}`] ?? null,
      title, area, owner_slack_user_id: owner, status: 'TODO', priority,
      start_date: null, due_date: due, description: note || null,
      completed_at: null, created_by: owner,
      created_at: created, updated_at: created, deleted_at: null,
    });
    (db.events ??= []).push({ id: uid(), task_id: id, event_type: 'CREATED',
      from_value: null, to_value: 'TODO', actor_slack_user_id: owner, occurred_at: created });
    known.add(title);
    changed = true;
  }

  return changed;
}

// ── 공유 저장소 (Supabase) ──────────────────────────────
// 표 하나(kf_rows)에 개체마다 한 줄이 들어간다. 규칙과 계산은 그대로 브라우저가 하고,
// 여기는 "팀이 같은 것을 본다"만 맡는다. 그래서 라이브러리 없이 REST 로 붙인다.
//
// 키는 공개용(publishable)이다. 브라우저에 내려가는 값이라 감출 수 없고, 감출 이유도 없다 —
// 접근 범위는 Supabase 쪽 정책이 정한다. 지금은 "주소를 아는 사람은 보고 고치기"다.
const SB_URL = 'https://tlthpmwgchvzhewlmyss.supabase.co';
const SB_KEY = 'sb_publishable_h4epUC2bxGZSWdD1vXAsrQ_8rQ9K9qF';
const SB_TABLE = 'kf_rows';

// 묶음마다 줄을 가리키는 이름이 다르다. 없는 것은 합쳐서 만든다.
const ROW_KEY = {
  members: (r) => r.slack_user_id,
  projects: (r) => r.id,
  vendors: (r) => r.id,
  phases: (r) => r.id,
  milestones: (r) => r.id,
  tasks: (r) => r.id,
  subtasks: (r) => r.id,
  issues: (r) => r.id,
  events: (r) => r.id,
  expenses: (r) => r.id,
  time_entries: (r) => r.id,
  notifications: (r) => r.id,
  weekly_reports: (r) => r.id,
  collaborators: (r) => `${r.task_id}/${r.slack_user_id}`,
  outsourcing: (r) => r.task_id,
  area_leads: (r) => `${r.area}/${r.slack_user_id}`,
};
const COLLECTIONS = Object.keys(ROW_KEY);

// 경비는 관리자에게만 내려온다(저장소 정책). 그래서 올릴 때도 관리자일 때만 실어야 한다 —
// 한쪽만 걸러 두면 "내려오지 않은 줄"을 "지워진 줄"로 착각해 공유본에서 지워 버린다.
const ADMIN_ONLY_COLLECTIONS = ['expenses'];
const visibleCollections = () =>
  (canAdmin() ? COLLECTIONS : COLLECTIONS.filter((c) => !ADMIN_ONLY_COLLECTIONS.includes(c)));

let remoteOk = false;      // 한 번이라도 닿았는가
let remoteWarned = false;
let lastSeen = null;       // 남이 고친 것을 알아채는 기준 시각

const sbFetch = (path, init = {}) => {
  // 들고 있는 코드를 그대로 실어 보낸다. 맞는지 판단하는 곳은 저장소다.
  const code = currentCode();
  return fetch(`${SB_URL}/rest/v1/${path}`, {
    ...init,
    headers: {
      apikey: SB_KEY,
      Authorization: `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      ...(code ? { 'x-kf-code': code } : {}),
      ...(init.headers ?? {}),
    },
  });
};

/**
 * 저장소에 코드를 물어본다. 해시는 내려오지 않는다 — 등급만 온다.
 * 직접 넣어 들어올 때(claim)는 누가 그 코드를 쓰는지도 함께 남긴다.
 * 창을 다시 열며 조용히 확인할 때(kf_role)는 남기지 않는다 — 새로고침마다 쌓일 이유가 없다.
 */
async function sbVerify(code, { claim = false } = {}) {
  const fn = claim ? 'kf_gate_claim' : 'kf_role';
  const args = claim ? { code, who: member(currentMe())?.display_name ?? currentMe() } : { code };
  const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!res.ok) throw new Error('코드를 확인하지 못했습니다. 잠시 뒤 다시 시도해 주세요.');
  return (await res.json()) ?? null;
}
install({ verify: sbVerify });

/** 저장점 함수를 부른다 */
async function sbRpc(fn, args = {}) {
  const res = await sbFetch(`rpc/${fn}`, { method: 'POST', body: JSON.stringify(args) });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    let msg = '';
    try { msg = JSON.parse(text).message ?? ''; } catch { msg = ''; }
    throw new DemoError(msg || `저장점 작업에 실패했습니다. (${res.status})`);
  }
  return res.json().catch(() => null);
}

/** 지금 공유되고 있는지 화면에 알린다 — 모르고 쓰면 "공유된 줄 알았는데"가 생긴다 */
const tellSync = (ok) => {
  try { window.dispatchEvent(new CustomEvent('kf:sync', { detail: { ok } })); } catch { /* 창이 없으면 넘어간다 */ }
};

/**
 * 저장소가 쓰기를 거절했다 — 코드가 바뀌었거나 등급이 모자란다.
 * 이 브라우저에만 남은 변경은 버리고 공유본을 다시 읽는다.
 * 여기서 그냥 두면 "내 화면에만 있는 사실"이 생긴다. 그게 제일 나쁘다.
 */
function writeDenied() {
  lock();
  try {
    window.dispatchEvent(new CustomEvent('kf:denied', {
      detail: { message: '편집 권한이 확인되지 않아 되돌렸습니다. 코드를 다시 넣어 주세요.' },
    }));
  } catch { /* 창이 없으면 넘어간다 */ }
  return refreshFromRemote();
}

/** 공유본을 다시 읽어 화면을 새로 그린다 */
async function refreshFromRemote() {
  // 올리려고 대기 중이던 것은 버린다 — 지금 읽어 올 것이 정답이다
  clearTimeout(flushTimer);
  flushAgain = false;
  try {
    const rows = await remoteReadAll();
    // 아무것도 안 내려왔다면 그것은 "다 지워졌다"는 뜻이 아니라 아직 아무도 안 올렸다는 뜻이다.
    // 여기서 통째로 갈아 끼우면 이 브라우저에 있던 것까지 날아간다.
    if (!rows.length) { window.dispatchEvent(new Event('kf:reload')); return; }
    DB = unflatten(rows);
    save(DB, { push: false });
    shadow = snapshot(flatten(DB));
    lastSeen = rows[rows.length - 1]?.updated_at ?? lastSeen;
    window.dispatchEvent(new Event('kf:reload'));
  } catch { /* 못 닿으면 다음 순번에 다시 맞춘다 */ }
}

function remoteDown(err) {
  const was = remoteOk;
  remoteOk = false;
  if (was || !remoteWarned) tellSync(false);
  if (!remoteWarned) {
    remoteWarned = true;
    // 못 닿아도 앱은 그대로 돈다 — 이 브라우저에만 쌓일 뿐이다
    console.warn('[kf] 공유 저장소에 닿지 못했습니다. 이 브라우저에만 저장됩니다.', err);
  }
}

/** 줄 전체를 읽어 온다. PostgREST 는 한 번에 1000줄까지 준다. */
async function remoteReadAll() {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const res = await sbFetch(`${SB_TABLE}?select=collection,id,data,updated_at&order=updated_at.asc`, {
      headers: { Range: `${from}-${from + 999}` },
    });
    if (!res.ok) throw new Error(`읽기 실패 ${res.status}`);
    const part = await res.json();
    rows.push(...part);
    if (part.length < 1000) break;
  }
  return rows;
}

/** 저장된 판을 kf_rows 줄 목록으로 편다 */
function flatten(db) {
  const out = [];
  for (const c of visibleCollections()) {
    for (const r of db[c] ?? []) out.push({ collection: c, id: String(ROW_KEY[c](r)), data: r });
  }
  out.push({ collection: 'meta', id: 'anchor', data: { value: db.anchor } });
  // 한 번만 해야 하는 정리는 여기에 표시를 남긴다. 날짜로 판단하면 날이 바뀔 때마다
  // 진짜 이력까지 지워 버린다.
  out.push({ collection: 'meta', id: 'flags', data: { history_trimmed: Boolean(db.history_trimmed) } });
  return out;
}

/** 줄 목록을 판으로 되돌린다 */
function unflatten(rows) {
  const db = { anchor: today() };
  for (const c of COLLECTIONS) db[c] = [];
  // 관리자가 아니면 경비는 아예 안 내려온다. 빈 채로 두면 된다 —
  // 그 화면은 어차피 잠겨 있고, 올릴 때도 같이 빠지므로 공유본은 다치지 않는다.
  for (const r of rows) {
    if (r.collection === 'meta') {
      if (r.id === 'anchor' && r.data?.value) db.anchor = r.data.value;
      if (r.id === 'flags') db.history_trimmed = Boolean(r.data?.history_trimmed);
      continue;
    }
    (db[r.collection] ??= []).push(r.data);
  }
  return db;
}

let shadow = new Map();    // 마지막으로 올린 모습 — 바뀐 줄만 골라내는 기준
const snapshot = (rows) => new Map(rows.map((r) => [`${r.collection}/${r.id}`, JSON.stringify(r.data)]));

let flushTimer = null;
let flushing = false;
let flushAgain = false;

/** 바뀐 줄만 올린다. 여러 번 불려도 한 번으로 모은다. */
// 하루에 한 번이면 충분하다 — 창을 열어 둔 채로 계속 부르지 않게 한 번만 시도한다
let autoSnapTried = false;
async function autoSnapshot() {
  if (autoSnapTried) return;
  autoSnapTried = true;
  try {
    await sbRpc('kf_snapshot_take', { p_kind: 'AUTO', p_label: '자동 저장', p_by: null });
  } catch { /* 저장점을 못 남겨도 저장 자체는 막지 않는다 */ }
}

function scheduleFlush() {
  if (!remoteOk) return;
  if (!canEdit()) return;   // 보기 전용 — 올릴 것이 없다
  clearTimeout(flushTimer);
  flushTimer = setTimeout(() => { flush(); }, 350);
}

async function flush() {
  if (!remoteOk) return;
  if (!canEdit()) return;
  if (flushing) { flushAgain = true; return; }
  flushing = true;
  try {
    const rows = flatten(DB);
    const now = snapshot(rows);
    const upserts = rows.filter((r) => now.get(`${r.collection}/${r.id}`) !== shadow.get(`${r.collection}/${r.id}`));
    const gone = [...shadow.keys()].filter((k) => !now.has(k));

    // 오늘 처음 손대는 것이면 손대기 전 상태를 저장점으로 남긴다.
    // 저장소가 6시간 안에 저장점이 있으면 알아서 건너뛴다.
    if (upserts.length || gone.length) await autoSnapshot();

    if (upserts.length) {
      // 저장된 시각을 되돌려 받는다. 브라우저 시계로 기준을 잡으면 시계가 어긋난 만큼
      // 남이 고친 것을 영영 못 본다 — 기준은 항상 저장소가 찍은 시각이어야 한다.
      const res = await sbFetch(`${SB_TABLE}?select=updated_at`, {
        method: 'POST',
        headers: { Prefer: 'resolution=merge-duplicates,return=representation' },
        body: JSON.stringify(upserts),
      });
      if (res.status === 401 || res.status === 403) return writeDenied();
      if (!res.ok) throw new Error(`쓰기 실패 ${res.status} ${await res.text()}`);
      const saved = await res.json().catch(() => []);
      for (const r of saved) if (!lastSeen || r.updated_at > lastSeen) lastSeen = r.updated_at;
    }
    for (const key of gone) {
      const cut = key.indexOf('/');
      const collection = key.slice(0, cut);
      const id = key.slice(cut + 1);
      const res = await sbFetch(
        `${SB_TABLE}?collection=eq.${encodeURIComponent(collection)}&id=eq.${encodeURIComponent(id)}`,
        { method: 'DELETE', headers: { Prefer: 'return=minimal' } },
      );
      if (res.status === 401 || res.status === 403) return writeDenied();
      if (!res.ok) throw new Error(`삭제 실패 ${res.status}`);
    }
    shadow = now;
  } catch (err) {
    remoteDown(err);
  } finally {
    flushing = false;
    if (flushAgain) { flushAgain = false; scheduleFlush(); }
  }
}

/**
 * 처음 열 때 공유 저장소와 맞춘다.
 * - 저장소가 비어 있으면 이 브라우저에 있던 것을 그대로 올린다 (처음 여는 사람이 기준이 된다)
 * - 들어 있으면 그것을 쓴다. 이 브라우저에만 있던 것은 덮인다.
 */
async function syncFromRemote() {
  try {
    const rows = await remoteReadAll();
    remoteOk = true;
    tellSync(true);
    if (!rows.length) {
      // 비어 있으면 이 브라우저에 있던 것이 공유본이 된다
      shadow = new Map();
      lastSeen = null;
      await flush();
      return;
    }
    const remote = unflatten(rows);
    lastSeen = rows[rows.length - 1]?.updated_at ?? null;
    // 시드가 늘었으면 여기서도 채운다 (구성원·영역 리드·새 업무)
    try { reconcile(remote); } catch (err) { console.warn('[kf] 시드 맞추기 실패', err); }
    DB = remote;
    save();
    shadow = snapshot(flatten(DB));
    await flush();   // reconcile 로 는 것이 있으면 올린다
  } catch (err) {
    remoteDown(err);
  }
}

/** 남이 고친 것이 있으면 다시 읽어 화면을 새로 그린다 */
async function pollRemote() {
  if (!remoteOk || flushing || document.hidden) return;
  try {
    const res = await sbFetch(`${SB_TABLE}?select=updated_at&order=updated_at.desc&limit=1`);
    if (!res.ok) return;
    const [top] = await res.json();
    if (!top || !lastSeen || top.updated_at <= lastSeen) return;
    const rows = await remoteReadAll();
    if (!rows.length) return;   // 빈 응답을 '전부 지워졌다'로 읽지 않는다
    DB = unflatten(rows);
    save(DB, { push: false });
    shadow = snapshot(flatten(DB));
    lastSeen = top.updated_at;
    window.dispatchEvent(new Event('kf:reload'));
  } catch { /* 잠깐 못 닿는 것은 넘어간다 */ }
}

// 등급이 바뀌면 받을 수 있는 줄이 달라진다 — 관리자가 되거나 그만둘 때만 다시 읽는다.
// 편집↔보기 전환에서는 읽어 올 것이 같으므로 건드리지 않는다(올리려던 것을 버리게 된다).
let wasAdmin = canAdmin();
try {
  window.addEventListener('kf:gate', () => {
    const now = canAdmin();
    if (now === wasAdmin) return;
    wasAdmin = now;
    if (remoteOk) refreshFromRemote();
  });
} catch { /* 창이 없으면 넘어간다 */ }

let readyPromise = null;
const ensureReady = () => (readyPromise ??= resume().then(syncFromRemote).then(() => {
  setInterval(pollRemote, 15_000);
}));

function load() {
  let parsed = null;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) parsed = JSON.parse(raw);
  } catch { /* 저장된 데이터가 깨졌으면 아래에서 새로 만든다 */ }

  // 실제 일정이라 날짜가 따라 움직이면 안 된다 — 저장된 것을 그대로 쓴다
  if (parsed?.anchor) {
    // 맞춰 주다 실패해도 저장된 데이터는 그대로 쓴다.
    // 여기서 시드를 새로 만들면 그동안 등록한 업무가 통째로 날아간다.
    try {
      if (reconcile(parsed)) save(parsed);
    } catch (err) {
      console.warn('[kf] 저장된 데이터를 최신 시드에 맞추지 못했습니다', err);
    }
    return parsed;
  }

  const fresh = buildSeed();
  save(fresh);
  return fresh;
}

function save(db = DB, { push = true } = {}) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch { /* 용량 초과 시 메모리만 사용 */ }
  // 공유 저장소에는 바뀐 줄만, 잠깐 모았다가 한 번에 올린다.
  // 공유본을 방금 읽어 온 참이면 되돌려 보낼 것이 없다(push:false).
  if (push) scheduleFlush();
}

// DB 는 위의 선언들이 모두 준비된 뒤에 읽는다 —
// 먼저 읽으면 reconcile 이 아직 만들어지지 않은 값을 건드린다.
let DB = load();

function resetDemo() {
  DB = buildSeed();
  save();
}

// ── 조회 헬퍼 ───────────────────────────────────────────
const member = (id) => DB.members.find((m) => m.slack_user_id === id) || null;
const project = (id) => DB.projects.find((p) => p.id === id) || null;
const vendor = (id) => DB.vendors.find((v) => v.id === id) || null;
const outOf = (taskId) => DB.outsourcing.find((o) => o.task_id === taskId) || null;
const liveIssues = () => DB.issues.filter((i) => !i.deleted_at);
const openIssuesOf = (taskId) => liveIssues().filter((i) => i.task_id === taskId && i.status !== 'RESOLVED');

// ── 하위 업무 ───────────────────────────────────────────
// 서버(server/repo.js 의 subtasks)와 같은 규칙이다.
const subtasksOf = (taskId) => (DB.subtasks ?? [])
  .filter((s) => s.task_id === taskId)
  .sort((a, b) => (a.sort_order - b.sort_order) || a.created_at.localeCompare(b.created_at));

function createSubtask(taskId, body) {
  const title = String(body.title ?? '').trim();
  if (!title) throw new DemoError('하위 업무명을 입력해 주세요.');
  const t = DB.tasks.find((x) => x.id === taskId && !x.deleted_at);
  if (!t) throw new DemoError('업무를 찾을 수 없습니다.');
  const next = subtasksOf(taskId).reduce((n, s) => Math.max(n, s.sort_order), 0) + 1;
  const row = { id: uid(), task_id: taskId, title, is_done: false, sort_order: next,
    created_at: nowISO(), done_at: null };
  (DB.subtasks ??= []).push(row);
  save();
  return row;
}

function updateSubtask(id, body) {
  const row = (DB.subtasks ?? []).find((s) => s.id === id);
  if (!row) throw new DemoError('하위 업무를 찾을 수 없습니다.');
  if (body.title !== undefined) {
    const title = String(body.title).trim();
    if (!title) throw new DemoError('하위 업무명을 입력해 주세요.');
    row.title = title;
  }
  if (body.is_done !== undefined) {
    row.is_done = Boolean(body.is_done);
    row.done_at = row.is_done ? nowISO() : null;
  }
  save();
  return row;
}

function removeSubtask(id) {
  DB.subtasks = (DB.subtasks ?? []).filter((s) => s.id !== id);
  save();
  return { ok: true };
}

function hydrate(t, ref = today()) {
  const p = project(t.project_id);
  const m = member(t.owner_slack_user_id);
  const o = outOf(t.id);
  const v = o ? vendor(o.vendor_id) : null;
  const openCount = openIssuesOf(t.id).length;
  return {
    ...t,
    project_name: p?.name ?? null, project_code: p?.code ?? null,
    project_channel: p?.slack_channel_id ?? null, project_lead: p?.lead_slack_user_id ?? null,
    phase_name: DB.phases?.find((ph) => ph.id === t.phase_id)?.name ?? null,
    owner_name: m?.display_name ?? t.owner_slack_user_id,
    owner_avatar: m?.avatar_url ?? null, owner_active: Boolean(m?.is_active),
    vendor_id: o?.vendor_id ?? null, vendor_name: v?.name ?? null,
    vendor_worker_name: o?.vendor_worker_name ?? null,
    vendor_worker_contact: o?.vendor_worker_contact ?? null,
    work_scope: o?.work_scope ?? null, requested_at: o?.requested_at ?? null,
    delivery_due_date: o?.delivery_due_date ?? null, delivered_at: o?.delivered_at ?? null,
    review_status: o?.review_status ?? null,
    // 지연·이슈는 저장하지 않고 조회 시 계산한다
    is_delayed: Boolean(t.due_date) && t.status !== 'DONE' && t.due_date < ref,
    is_delivery_delayed: Boolean(o) && t.status !== 'DONE' && o.delivery_due_date < ref,
    open_issue_count: openCount,
    has_open_issue: openCount > 0,
    subtask_total: subtasksOf(t.id).length,
    subtask_done: subtasksOf(t.id).filter((s) => s.is_done).length,
    is_outsourcing: t.area === 'OUT',
    stage: STAGE[t.status],
    d_day: t.due_date ? daysBetween(ref, t.due_date) : null,
    collaborators: DB.collaborators
      .filter((c) => c.task_id === t.id)
      .map((c) => {
        const cm = member(c.slack_user_id);
        return { slack_user_id: c.slack_user_id, display_name: cm?.display_name ?? c.slack_user_id,
          avatar_url: cm?.avatar_url ?? null, is_active: Boolean(cm?.is_active) };
      })
      .sort((a, b) => a.display_name.localeCompare(b.display_name)),
  };
}

function hydrateIssue(i) {
  const p = project(i.project_id);
  const t = i.task_id ? DB.tasks.find((x) => x.id === i.task_id) : null;
  const o = t ? outOf(t.id) : null;
  const m = member(i.owner_slack_user_id);
  return {
    ...i,
    project_name: p?.name ?? '-', project_channel: p?.slack_channel_id ?? null,
    task_title: t?.title ?? null, task_owner: t?.owner_slack_user_id ?? null,
    vendor_name: o ? vendor(o.vendor_id)?.name ?? null : null,
    vendor_worker_name: o?.vendor_worker_name ?? null,
    owner_name: m?.display_name ?? i.owner_slack_user_id, owner_avatar: m?.avatar_url ?? null,
  };
}

const PRIORITY_RANK = { HIGH: 0, NORMAL: 1, LOW: 2 };

function listTasks(f = {}) {
  const ref = f.today || today();
  let rows = DB.tasks.filter((t) => !t.deleted_at).map((t) => hydrate(t, ref));
  const archived = new Set(DB.projects.filter((p) => p.is_archived).map((p) => p.id));
  rows = rows.filter((t) => !t.project_id || !archived.has(t.project_id));

  if (f.project?.length) rows = rows.filter((t) => f.project.includes(t.project_id));
  if (f.phase?.length) rows = rows.filter((t) => f.phase.includes(t.phase_id));
  if (f.month) {
    // 'YYYY-MM' 한 달 — 마감일 기준
    rows = rows.filter((t) => (t.due_date ?? '').slice(0, 7) === f.month);
  }
  if (f.area?.length) rows = rows.filter((t) => f.area.includes(t.area));
  if (f.owner?.length) rows = rows.filter((t) => f.owner.includes(t.owner_slack_user_id));
  if (f.status?.length) rows = rows.filter((t) => f.status.includes(t.status));
  if (f.stage === 'WAIT') rows = rows.filter((t) => WAIT_STATUSES.includes(t.status));
  if (f.stage === 'IN_PROGRESS') rows = rows.filter((t) => IN_PROGRESS_STATUSES.includes(t.status));
  if (f.stage === 'REVIEW') rows = rows.filter((t) => REVIEW_STAGE_STATUSES.includes(t.status));
  if (f.stage === 'DONE') rows = rows.filter((t) => t.status === 'DONE');
  if (f.delayed) rows = rows.filter((t) => t.is_delayed);
  if (f.hasIssue) rows = rows.filter((t) => t.has_open_issue);
  if (!f.includeDone && !f.status?.length && f.stage !== 'DONE') rows = rows.filter((t) => t.status !== 'DONE');
  // 백로그(마감일 미정)는 달력 위의 일이 아니다. 따로 달라고 해야 나온다.
  if (f.backlog) rows = rows.filter((t) => !t.due_date);
  else if (!f.includeBacklog) rows = rows.filter((t) => Boolean(t.due_date));
  if (f.dueFrom) rows = rows.filter((t) => (t.due_date ?? '') >= f.dueFrom);
  if (f.dueTo) rows = rows.filter((t) => (t.due_date ?? '') <= f.dueTo);
  if (f.q) {
    const q = f.q.toLowerCase();
    rows = rows.filter((t) => `${t.title} ${t.description ?? ''}`.toLowerCase().includes(q));
  }

  return rows.sort((a, b) =>
    (a.status === 'DONE') - (b.status === 'DONE')
    || (!a.due_date) - (!b.due_date)          // 마감일 없는 것은 뒤로
    || (a.due_date ?? '').localeCompare(b.due_date ?? '')
    || PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]
    || a.created_at.localeCompare(b.created_at));
}

function listIssues(f = {}) {
  let rows = liveIssues().map(hydrateIssue);
  if (f.project?.length) rows = rows.filter((i) => f.project.includes(i.project_id));
  if (f.owner?.length) rows = rows.filter((i) => f.owner.includes(i.owner_slack_user_id));
  if (f.status?.length) rows = rows.filter((i) => f.status.includes(i.status));
  else if (!f.includeResolved) rows = rows.filter((i) => i.status !== 'RESOLVED');
  if (f.severity?.length) rows = rows.filter((i) => f.severity.includes(i.severity));
  if (f.task_id) rows = rows.filter((i) => i.task_id === f.task_id);
  return rows.sort((a, b) =>
    (a.status === 'RESOLVED') - (b.status === 'RESOLVED')
    || PRIORITY_RANK[a.severity] - PRIORITY_RANK[b.severity]
    || (a.target_resolve_date ?? '9999-12-31').localeCompare(b.target_resolve_date ?? '9999-12-31')
    || a.created_at.localeCompare(b.created_at));
}

const pct = (sum, n) => (n === 0 ? null : Math.round((sum / n) * 100));

function overview(ref = today()) {
  const rows = listTasks({ today: ref, includeDone: true });
  const blank = () => ({ count: 0, weight: 0, done: 0, delayed: 0, issue: 0, in_progress: 0, review: 0 });
  const group = (keyFn) => {
    const map = new Map();
    for (const t of rows) {
      const k = keyFn(t);
      if (!map.has(k)) map.set(k, blank());
      const g = map.get(k);
      g.count += 1;
      g.weight += PROGRESS_WEIGHT[t.status] ?? 0;
      if (t.status === 'DONE') g.done += 1;
      if (t.stage === 'PROGRESS') g.in_progress += 1;
      if (t.stage === 'REVIEW') g.review += 1;
      if (t.is_delayed) g.delayed += 1;
      if (t.has_open_issue) g.issue += 1;
    }
    return map;
  };

  const byProject = group((t) => t.project_id);
  const byArea = group((t) => t.area);
  const byOwner = group((t) => t.owner_slack_user_id);

  const owners = [...byOwner.entries()].map(([id, g]) => {
    const m = member(id);
    return {
      slack_user_id: id, display_name: m?.display_name ?? id, avatar_url: m?.avatar_url ?? null,
      is_active: Boolean(m?.is_active),
      collab_count: DB.collaborators.filter((c) => c.slack_user_id === id
        && DB.tasks.some((t) => t.id === c.task_id && !t.deleted_at)).length,
      ...g, progress: pct(g.weight, g.count),
    };
  }).sort((a, b) => b.count - a.count || a.display_name.localeCompare(b.display_name));

  const out = rows.filter((t) => t.area === 'OUT');

  return {
    today: ref,
    summary: {
      total: rows.length,
      in_progress: rows.filter((t) => t.stage === 'PROGRESS').length,
      review: rows.filter((t) => t.stage === 'REVIEW').length,
      done: rows.filter((t) => t.status === 'DONE').length,
      delayed: rows.filter((t) => t.is_delayed).length,
      issues: listIssues({}).length,
    },
    projects: DB.projects.filter((p) => !p.is_archived)
      .sort((a, b) => a.sort_order - b.sort_order || a.name.localeCompare(b.name))
      .map((p) => {
        const g = byProject.get(p.id) ?? blank();
        return { id: p.id, name: p.name, code: p.code, ...g, progress: pct(g.weight, g.count) };
      }),
    areas: AREAS.map((a) => {
      const g = byArea.get(a.code) ?? blank();
      return { code: a.code, label: a.full, ...g, progress: pct(g.weight, g.count) };
    }),
    owners,
    outsourcing: {
      planned: out.filter((t) => t.status === 'REQUEST_PLANNED').length,
      active: out.filter((t) => ['REQUESTED', 'OUT_IN_PROGRESS'].includes(t.status)).length,
      review: out.filter((t) => t.status === 'OUT_REVIEW').length,
      revision: out.filter((t) => t.status === 'OUT_REVISION').length,
      delivery_delayed: out.filter((t) => t.is_delivery_delayed).length,
      done: out.filter((t) => t.status === 'DONE').length,
      delayed_rows: out.filter((t) => t.is_delivery_delayed).map((t) => ({
        id: t.id, title: t.title, vendor_name: t.vendor_name, owner_name: t.owner_name,
        delivery_due_date: t.delivery_due_date,
        days_late: Math.abs(daysBetween(ref, t.delivery_due_date)),
      })),
    },
    handover: owners.filter((o) => !o.is_active && o.count - o.done > 0)
      .map((o) => ({ display_name: o.display_name, open: o.count - o.done })),
    // 보드 지도 — 업무 하나가 타일 하나다. 프로젝트 순서로 묶고 지연을 앞에 세운다.
    board: (() => {
      const order = new Map(DB.projects
        .slice().sort((a, b) => a.sort_order - b.sort_order)
        .map((p, i) => [p.id, i]));
      return rows.slice()
        .sort((a, b) => (order.get(a.project_id) ?? 99) - (order.get(b.project_id) ?? 99)
          || (b.is_delayed - a.is_delayed)
          || String(a.due_date).localeCompare(String(b.due_date)))
        .slice(0, 400)
        .map((t) => ({
          id: t.id, title: t.title, project_id: t.project_id, project_name: t.project_name,
          stage: t.stage, owner_name: t.owner_name, due_date: t.due_date,
          is_delayed: t.is_delayed, has_open_issue: t.has_open_issue,
        }));
    })(),
    board_truncated: rows.length > 400,
    progress: pct(rows.reduce((s, t) => s + (PROGRESS_WEIGHT[t.status] ?? 0), 0), rows.length),
  };
}

/** 담당으로 세울 수 있는 사람인지 본다 — 담당 없는 업무는 만들 수 없다(원칙 1) */
function ensureMember(slackUserId) {
  const m = member(slackUserId);
  if (!m || !m.is_active) throw new DemoError('없는 구성원입니다.');
  return m.slack_user_id;
}

/** 프로젝트마다 업무 수를 얹는다 — 업무가 하나도 없는 프로젝트를 화면에서 알아보려면 필요하다 */
const projectRows = () => (DB.projects ?? []).map((p) => ({
  ...p,
  lead_name: member(p.lead_slack_user_id)?.display_name ?? null,
  task_count: (DB.tasks ?? []).filter((t) => t.project_id === p.id && !t.deleted_at).length,
}));

// ── 영역 리드 ───────────────────────────────────────────
const leadRows = () => (DB.area_leads ?? []).map((l) => {
  const m = member(l.slack_user_id);
  return { ...l, display_name: m?.display_name ?? l.slack_user_id,
    avatar_url: m?.avatar_url ?? null, is_active: Boolean(m?.is_active) };
});
// 담당이 되는 사람은 대표 리드다
const areaLeadOf = (area) => (DB.area_leads ?? [])
  .find((l) => l.area === area && (l.role ?? 'LEAD') === 'LEAD')?.slack_user_id ?? null;

/** 공동 리드 줄을 통째로 다시 쓴다 — [{area, slack_user_id}] */
function setCoLeads(rows = []) {
  DB.area_leads = (DB.area_leads ?? []).filter((l) => (l.role ?? 'LEAD') === 'LEAD');
  const seen = new Set();
  for (const r of rows) {
    const { area, slack_user_id: uid } = r ?? {};
    if (!area || !uid) continue;
    if (!AREAS.some((a) => a.code === area)) throw new DemoError('없는 업무 영역입니다.');
    const key = `${area}/${uid}`;
    if (seen.has(key) || uid === areaLeadOf(area)) continue;
    seen.add(key);
    DB.area_leads.push({ area, slack_user_id: uid, role: 'CO', updated_at: nowISO() });
  }
  save();
  return leadRows();
}

function setLead(area, slackUserId, actor) {
  const before = areaLeadOf(area);
  // 대표는 영역마다 한 명. 공동으로 서 있던 사람이 대표가 되면 그 줄도 지운다.
  DB.area_leads = (DB.area_leads ??= []).filter(
    (l) => !(l.area === area && ((l.role ?? 'LEAD') === 'LEAD' || l.slack_user_id === slackUserId)));
  DB.area_leads.push({ area, slack_user_id: slackUserId, role: 'LEAD', updated_at: nowISO() });
  let moved = 0;
  if (before !== slackUserId) {
    for (const t of DB.tasks) {
      if (t.area !== area || t.status === 'DONE' || t.deleted_at) continue;
      // 담당을 따로 정해 둔 업무는 그대로 둔다 — 리드를 바꿀 때마다 지워지면 안 된다
      if (t.owner_slack_user_id !== before) continue;
      t.owner_slack_user_id = slackUserId;
      t.updated_at = nowISO();
      logEvent(t.id, 'OWNER_CHANGED', before, slackUserId, actor);
      moved += 1;
    }
    DB.collaborators = DB.collaborators.filter((c) => {
      const t = DB.tasks.find((x) => x.id === c.task_id);
      return !(t && t.area === area && t.status !== 'DONE' && c.slack_user_id === slackUserId);
    });
  }
  return { area, slack_user_id: slackUserId, moved };
}

// ── 쓰기 ────────────────────────────────────────────────
class DemoError extends Error {}

const logEvent = (taskId, type, from, to, actor) => {
  DB.events.push({ id: uid(), task_id: taskId, event_type: type, from_value: from ?? null,
    to_value: to ?? null, actor_slack_user_id: actor, occurred_at: nowISO() });
};

function setCollaborators(taskId, list, owner) {
  DB.collaborators = DB.collaborators.filter((c) => c.task_id !== taskId);
  for (const u of [...new Set(list)].filter((u) => u && u !== owner)) {
    DB.collaborators.push({ task_id: taskId, slack_user_id: u, added_at: nowISO() });
  }
}

function upsertOutsourcing(taskId, input) {
  const name = (input.vendor_name ?? '').trim();
  if (!name) throw new DemoError('외주 업체를 입력해 주세요.');
  if (!input.delivery_due_date) throw new DemoError('납품 예정일을 입력해 주세요.');
  let v = DB.vendors.find((x) => x.name === name);
  if (!v) {
    v = { id: uid(), name, contact: null, memo: null, is_active: 1, created_at: nowISO() };
    DB.vendors.push(v);
  }
  const row = {
    task_id: taskId, vendor_id: v.id,
    vendor_worker_name: input.vendor_worker_name || null,
    vendor_worker_contact: input.vendor_worker_contact || null,
    work_scope: input.work_scope || null,
    requested_at: input.requested_at || null,
    delivery_due_date: input.delivery_due_date,
    delivered_at: input.delivered_at || null,
    review_status: input.review_status || 'NOT_STARTED',
    created_at: nowISO(), updated_at: nowISO(),
  };
  const idx = DB.outsourcing.findIndex((o) => o.task_id === taskId);
  if (idx >= 0) DB.outsourcing[idx] = { ...DB.outsourcing[idx], ...row };
  else DB.outsourcing.push(row);
}

function createTask(input, actor) {
  if (!input.title?.trim()) throw new DemoError('업무명을 입력해 주세요.');
  // 프로젝트는 비워 둘 수 있다 — 어디에 붙일지 나중에 정하는 일도 일단 받아 적는다.
  const area = input.area;
  if (!AREAS.some((a) => a.code === area)) throw new DemoError('업무 영역을 선택해 주세요.');
  // 담당은 기본이 그 영역의 리드다. 다른 사람을 고르면 그 사람이 맡는다.
  const owner = input.owner_slack_user_id ? ensureMember(input.owner_slack_user_id) : areaLeadOf(area);
  if (!owner) throw new DemoError(`'${AREAS.find((a) => a.code === area)?.full ?? area}' 영역의 리드가 지정되지 않았습니다. 영역 리드를 먼저 설정하거나 담당을 직접 골라 주세요.`);
  const status = input.status || defaultStatusFor(area);
  if (!domainStatusesFor(area).some((s) => s.code === status)) throw new DemoError('업무 영역에 맞지 않는 상태입니다.');
  const due = input.due_date || (area === 'OUT' ? input.delivery_due_date : null) || null;
  // 마감일을 비우면 백로그다 — 아직 언제 할지 안 정한 일.
  if (input.start_date && input.start_date > due) throw new DemoError('시작일은 마감일보다 늦을 수 없습니다.');

  const t = {
    id: uid(), project_id: input.project_id || null,
    // 페이즈는 프로젝트 안에 있다. 프로젝트가 없으면 페이즈도 못 고른다.
    phase_id: (input.project_id && input.phase_id) || null,
    title: input.title.trim(), area, owner_slack_user_id: owner, status,
    priority: input.priority || 'NORMAL',
    start_date: input.start_date || null, due_date: due,
    description: input.description || null,
    completed_at: status === 'DONE' ? nowISO() : null,
    created_by: actor, created_at: nowISO(), updated_at: nowISO(), deleted_at: null,
  };
  DB.tasks.push(t);
  setCollaborators(t.id, input.collaborators || [], owner);
  if (area === 'OUT') upsertOutsourcing(t.id, input);
  logEvent(t.id, 'CREATED', null, status, actor);
  const hydrated = hydrate(t);
  notifyTaskCreated(hydrated, actor);
  save();
  return hydrated;
}

function updateTask(id, input, actor) {
  const t = DB.tasks.find((x) => x.id === id && !x.deleted_at);
  if (!t) throw new DemoError('업무를 찾을 수 없습니다.');
  const before = hydrate(t);

  const area = input.area ?? t.area;
  // 영역이 바뀌어도 그 상태를 쓸 수 있으면 그대로 둔다 (외주 ↔ 일반일 때만 처음으로)
  const status = input.status ?? (
    area === t.area || domainStatusesFor(area).some((x) => x.code === t.status)
      ? t.status
      : defaultStatusFor(area));
  if (!domainStatusesFor(area).some((s) => s.code === status)) throw new DemoError('업무 영역에 맞지 않는 상태입니다.');
  let owner = t.owner_slack_user_id;
  if (input.owner_slack_user_id) {
    // 직접 고른 담당이 가장 세다
    owner = ensureMember(input.owner_slack_user_id);
  } else if (area !== t.area && t.owner_slack_user_id === areaLeadOf(t.area)) {
    // 리드를 따르고 있던 업무만 새 영역의 리드로 따라간다
    owner = areaLeadOf(area);
    if (!owner) throw new DemoError(`'${AREAS.find((a) => a.code === area)?.full ?? area}' 영역의 리드가 지정되지 않았습니다.`);
  }
  // 빈 문자열로 오면 '비운다'는 뜻이다 (백로그로 내린다)
  const due = input.due_date === undefined ? t.due_date : (input.due_date || null);
  // 프로젝트도 마찬가지 — 빈 값이 오면 프로젝트 미정으로 내린다
  const pid = input.project_id === undefined ? t.project_id : (input.project_id || null);

  Object.assign(t, {
    project_id: pid,
    // 프로젝트를 떼면 그 안에 있던 페이즈도 같이 뗀다
    phase_id: !pid ? null : (input.phase_id === undefined ? t.phase_id : (input.phase_id || null)),
    title: (input.title ?? t.title).trim(),
    area, owner_slack_user_id: owner, status,
    priority: input.priority ?? t.priority,
    start_date: input.start_date === undefined ? t.start_date : (input.start_date || null),
    due_date: due,
    description: input.description === undefined ? t.description : (input.description || null),
    completed_at: status === 'DONE' ? (t.completed_at || nowISO()) : null,
    updated_at: nowISO(),
  });

  if (input.collaborators) setCollaborators(t.id, input.collaborators, owner);
  if (area === 'OUT') upsertOutsourcing(t.id, { ...before, ...input });
  else DB.outsourcing = DB.outsourcing.filter((o) => o.task_id !== t.id);

  if (status !== before.status) logEvent(t.id, 'STATUS_CHANGED', before.status, status, actor);
  if (owner !== before.owner_slack_user_id) logEvent(t.id, 'OWNER_CHANGED', before.owner_slack_user_id, owner, actor);
  if (due !== before.due_date) logEvent(t.id, 'DUE_CHANGED', before.due_date, due, actor);
  if (input.review_status && input.review_status !== before.review_status) {
    logEvent(t.id, 'REVIEW_STATUS_CHANGED', before.review_status, input.review_status, actor);
  }

  const after = hydrate(t);
  notifyTaskUpdated(before, after, actor);
  save();
  return after;
}

function createIssue(input, actor) {
  if (!input.title?.trim()) throw new DemoError('이슈명을 입력해 주세요.');
  if (!input.project_id) throw new DemoError('관련 프로젝트를 선택해 주세요.');
  if (!input.content?.trim()) throw new DemoError('이슈 내용을 입력해 주세요.');
  if (!input.owner_slack_user_id) throw new DemoError('이슈 담당자를 지정해 주세요.');
  const status = input.status || 'OPEN';
  const i = {
    id: uid(), project_id: input.project_id, task_id: input.task_id || null,
    title: input.title.trim(), content: input.content.trim(),
    owner_slack_user_id: input.owner_slack_user_id,
    severity: input.severity || 'NORMAL', status,
    target_resolve_date: input.target_resolve_date || null,
    impact: input.impact || null,
    resolved_at: status === 'RESOLVED' ? nowISO() : null,
    created_by: actor, created_at: nowISO(), updated_at: nowISO(), deleted_at: null,
  };
  DB.issues.push(i);
  const hydrated = hydrateIssue(i);
  notifyIssueCreated(hydrated, actor);
  save();
  return hydrated;
}

function updateIssue(id, input) {
  const i = DB.issues.find((x) => x.id === id && !x.deleted_at);
  if (!i) throw new DemoError('이슈를 찾을 수 없습니다.');
  const status = input.status ?? i.status;
  Object.assign(i, {
    project_id: input.project_id ?? i.project_id,
    task_id: input.task_id === undefined ? i.task_id : (input.task_id || null),
    title: (input.title ?? i.title).trim(),
    content: (input.content ?? i.content).trim(),
    owner_slack_user_id: input.owner_slack_user_id ?? i.owner_slack_user_id,
    severity: input.severity ?? i.severity,
    status,
    target_resolve_date: input.target_resolve_date === undefined ? i.target_resolve_date : (input.target_resolve_date || null),
    impact: input.impact === undefined ? i.impact : (input.impact || null),
    resolved_at: status === 'RESOLVED' ? (i.resolved_at || nowISO()) : null,
    updated_at: nowISO(),
  });
  save();
  return hydrateIssue(i);
}

// ── 시간 기록 ───────────────────────────────────────────
const timeWeek = (slackUserId, ws) => {
  const end = addDays(ws, 6);
  const rows = (DB.time_entries ?? []).filter((e) =>
    e.slack_user_id === slackUserId && e.work_date >= ws && e.work_date <= end);
  const byTask = new Map();
  for (const e of rows) {
    const t = DB.tasks.find((x) => x.id === e.task_id && !x.deleted_at);
    if (!t) continue;
    if (!byTask.has(t.id)) {
      byTask.set(t.id, {
        task_id: t.id, title: t.title, area: t.area, project_id: t.project_id,
        project_name: project(t.project_id)?.name ?? '-', days: {}, total: 0,
      });
    }
    const row = byTask.get(t.id);
    row.days[e.work_date] = { hours: e.hours, note: e.note };
    row.total += e.hours;
  }
  const list = [...byTask.values()];
  return { period: { start: ws, end }, rows: list, total: list.reduce((n, r) => n + r.total, 0) };
};

function setTime({ task_id, slack_user_id, work_date, hours }) {
  if (!task_id) throw new DemoError('업무를 선택해 주세요.');
  const h = Number(hours);
  if (!Number.isFinite(h)) throw new DemoError('시간을 숫자로 입력해 주세요.');
  if (h > 24) throw new DemoError('하루 24시간을 넘을 수 없습니다.');
  DB.time_entries ??= [];
  const idx = DB.time_entries.findIndex((e) =>
    e.task_id === task_id && e.slack_user_id === slack_user_id && e.work_date === work_date);
  if (h <= 0) {
    if (idx >= 0) DB.time_entries.splice(idx, 1);
    save();
    return { removed: true };
  }
  if (idx >= 0) { DB.time_entries[idx].hours = h; DB.time_entries[idx].updated_at = nowISO(); }
  else {
    DB.time_entries.push({ id: uid(), task_id, slack_user_id, work_date, hours: h,
      note: null, created_at: nowISO(), updated_at: nowISO() });
  }
  save();
  return { hours: h };
}

function timeSummary(from, to) {
  const rows = (DB.time_entries ?? []).filter((e) => e.work_date >= from && e.work_date <= to)
    .map((e) => {
      const t = DB.tasks.find((x) => x.id === e.task_id && !x.deleted_at);
      const p = t?.project_id ? project(t.project_id) : null;
      return t && (!t.project_id ? true : (p && !p.is_archived))
        ? { hours: e.hours, slack_user_id: e.slack_user_id, area: t.area,
            project_id: t.project_id, project_name: p?.name ?? null,
            display_name: member(e.slack_user_id)?.display_name ?? e.slack_user_id }
        : null;
    }).filter(Boolean);
  const group = (keyFn, labelFn) => {
    const map = new Map();
    for (const r of rows) {
      const k = keyFn(r);
      if (!map.has(k)) map.set(k, { key: k, label: labelFn(r), hours: 0 });
      map.get(k).hours += r.hours;
    }
    return [...map.values()].sort((a, b) => b.hours - a.hours);
  };
  return {
    period: { from, to },
    total: rows.reduce((n, r) => n + r.hours, 0),
    projects: group((r) => r.project_id, (r) => r.project_name),
    areas: group((r) => r.area, (r) => AREA_MAP[r.area]?.full ?? r.area),
    members: group((r) => r.slack_user_id, (r) => r.display_name),
  };
}

// ── 외주 지급 ───────────────────────────────────────────
const paymentRows = (filter = {}) => DB.tasks
  .filter((t) => t.area === 'OUT' && !t.deleted_at)
  .map((t) => {
    const o = outOf(t.id);
    if (!o) return null;
    const p = project(t.project_id);
    const v = vendor(o.vendor_id);
    return {
      task_id: t.id, title: t.title, status: t.status, project_id: t.project_id,
      project_name: p?.name ?? '-', vendor_name: v?.name ?? '-',
      vendor_worker_name: o.vendor_worker_name,
      delivery_due_date: o.delivery_due_date, delivered_at: o.delivered_at,
      review_status: o.review_status, amount: o.amount ?? null,
      payment_status: o.payment_status ?? 'PLANNED', paid_at: o.paid_at ?? null,
      owner_name: member(t.owner_slack_user_id)?.display_name ?? t.owner_slack_user_id,
      owner_slack_user_id: t.owner_slack_user_id,
    };
  })
  .filter(Boolean)
  .filter((r) => (!filter.status || r.payment_status === filter.status))
  .sort((a, b) => String(a.delivery_due_date).localeCompare(String(b.delivery_due_date)));

function paymentSummary() {
  const rows = paymentRows();
  const bucket = (s) => {
    const list = rows.filter((r) => r.payment_status === s);
    return { count: list.length, amount: list.reduce((n, r) => n + (r.amount ?? 0), 0) };
  };
  return {
    planned: bucket('PLANNED'), requested: bucket('REQUESTED'), paid: bucket('PAID'),
    total_amount: rows.reduce((n, r) => n + (r.amount ?? 0), 0),
    missing_amount: rows.filter((r) => r.amount === null).length,
    ready: rows.filter((r) => r.review_status === 'APPROVED' && r.payment_status !== 'PAID').length,
  };
}

function updatePayment(taskId, input) {
  const o = outOf(taskId);
  if (!o) throw new DemoError('외주 정보를 찾을 수 없습니다.');
  const status = input.payment_status ?? o.payment_status ?? 'PLANNED';
  if (!['PLANNED', 'REQUESTED', 'PAID'].includes(status)) throw new DemoError('없는 지급 상태입니다.');
  if (status === 'PAID' && o.review_status !== 'APPROVED') {
    throw new DemoError('검수가 승인되지 않았습니다. 검수를 먼저 승인해 주세요.');
  }
  if (input.amount !== undefined) {
    o.amount = input.amount === null || input.amount === '' ? null : Math.round(Number(input.amount));
  }
  o.payment_status = status;
  o.paid_at = status === 'PAID' ? (o.paid_at || today()) : null;
  o.updated_at = nowISO();
  save();
  return paymentRows().find((r) => r.task_id === taskId) ?? null;
}

// ── 알림 ────────────────────────────────────────────────
// 데모에는 Slack 토큰이 없으므로 모두 SKIPPED 로 기록된다.
const UNSET_CHANNEL = '(기본 채널 미설정)';
const fmtDate = (d) => (d ? `${Number(d.slice(5, 7))}월 ${Number(d.slice(8, 10))}일` : '-');
const shortD = (d) => (d ? `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}` : '-');
const sLabel = (code) => ALL_STATUS_MAP[code]?.label ?? code;

function emit({ kind, channel, target, title, body, taskId = null, issueId = null, dedupeKey = null }) {
  if (!target) return null;
  if (dedupeKey && DB.notifications.some((n) => n.dedupe_key === dedupeKey)) return null;
  DB.notifications.unshift({
    id: uid(), kind, channel, target, title, body, task_id: taskId, issue_id: issueId,
    dedupe_key: dedupeKey, status: 'SKIPPED',
    error: 'SLACK_BOT_TOKEN 미설정 — 알림함에만 기록', created_at: nowISO(),
  });
  return 'SKIPPED';
}

function notifyTaskCreated(task, actor) {
  if (task.owner_slack_user_id !== actor) {
    emit({ kind: 'TASK_ASSIGNED', channel: 'DM', target: task.owner_slack_user_id,
      title: '담당 업무가 등록되었습니다.',
      body: `프로젝트  ${task.project_name}\n업무  ${task.title}\n마감  ${fmtDate(task.due_date)}`,
      taskId: task.id });
  }
  for (const c of task.collaborators) {
    if (c.slack_user_id === actor) continue;
    emit({ kind: 'TASK_COLLAB', channel: 'DM', target: c.slack_user_id,
      title: '협업 업무로 등록되었습니다.',
      body: `프로젝트  ${task.project_name}\n업무  ${task.title}\n담당  ${task.owner_name}\n마감  ${fmtDate(task.due_date)}`,
      taskId: task.id });
  }
}

function notifyTaskUpdated(before, after, actor) {
  if (before.owner_slack_user_id !== after.owner_slack_user_id && after.owner_slack_user_id !== actor) {
    emit({ kind: 'TASK_ASSIGNED', channel: 'DM', target: after.owner_slack_user_id,
      title: '담당 업무가 등록되었습니다.',
      body: `프로젝트  ${after.project_name}\n업무  ${after.title}\n마감  ${fmtDate(after.due_date)}`,
      taskId: after.id });
  }
  if (['REVIEW', 'OUT_REVIEW'].includes(after.status) && before.status !== after.status
      && after.project_lead && after.project_lead !== actor) {
    emit({ kind: 'REVIEW_REQUEST', channel: 'DM', target: after.project_lead,
      title: '검토 요청이 있습니다.',
      body: `업무  ${after.title}\n프로젝트  ${after.project_name}\n담당자  ${after.owner_name}`,
      taskId: after.id });
  }
  if (after.review_status === 'REJECTED' && before.review_status !== 'REJECTED') {
    emit({ kind: 'REVIEW_REJECTED', channel: 'DM', target: after.owner_slack_user_id,
      title: '외주 검수가 반려되었습니다.',
      body: `업무  ${after.title}\n외주 업체  ${after.vendor_name ?? '-'}\n업무 상태를 "수정"으로 전환할지 확인해 주세요.`,
      taskId: after.id });
  }
}

function notifyIssueCreated(issue, actor) {
  if (issue.owner_slack_user_id !== actor) {
    emit({ kind: 'ISSUE_CREATED', channel: 'DM', target: issue.owner_slack_user_id,
      title: '이슈 담당으로 등록되었습니다.',
      body: `이슈  ${issue.title}\n프로젝트  ${issue.project_name}\n중요도  ${issue.severity === 'HIGH' ? '높음' : issue.severity === 'LOW' ? '낮음' : '보통'}`,
      issueId: issue.id });
  }
  if (issue.task_owner && issue.task_owner !== issue.owner_slack_user_id && issue.task_owner !== actor) {
    emit({ kind: 'ISSUE_ON_MY_TASK', channel: 'DM', target: issue.task_owner,
      title: '담당 업무에 이슈가 등록되었습니다.',
      body: `업무  ${issue.task_title}\n이슈  ${issue.title}`, issueId: issue.id });
  }
  if (issue.severity === 'HIGH') {
    emit({ kind: 'ISSUE_HIGH', channel: 'CHANNEL', target: issue.project_channel || UNSET_CHANNEL,
      title: '🔥 중요 이슈가 등록되었습니다.',
      body: `이슈  ${issue.title}\n프로젝트  ${issue.project_name}\n관련 업무  ${issue.task_title ?? '-'}\n담당  ${issue.owner_name}\n영향  ${issue.impact ?? '-'}`,
      issueId: issue.id });
  }
}

function runDailyJob(ref = today()) {
  const open = listTasks({ today: ref });
  const activeOwners = new Set(DB.members.filter((m) => m.is_active).map((m) => m.slack_user_id));
  const byOwner = (rows) => {
    const map = new Map();
    for (const r of rows) {
      if (!map.has(r.owner_slack_user_id)) map.set(r.owner_slack_user_id, []);
      map.get(r.owner_slack_user_id).push(r);
    }
    return map;
  };
  const sent = [];
  const count = (kind, n) => sent.push({ kind, count: n });

  let n = 0;
  for (const [owner, rows] of byOwner(open.filter((t) => t.due_date === ref))) {
    if (!activeOwners.has(owner)) continue;
    if (emit({ kind: 'DUE_TODAY', channel: 'DM', target: owner,
      title: `오늘 마감인 담당 업무 ${rows.length}건이 있습니다.`,
      body: rows.map((t) => `· ${t.title}   ${t.project_name}   ${sLabel(t.status)}`).join('\n'),
      dedupeKey: `DUE_TODAY:${owner}:${ref}` })) n += 1;
  }
  count('DUE_TODAY', n);

  n = 0;
  const tomorrow = addDays(ref, 1);
  for (const [owner, rows] of byOwner(open.filter((t) => t.due_date === tomorrow))) {
    if (!activeOwners.has(owner)) continue;
    if (emit({ kind: 'DUE_D1', channel: 'DM', target: owner,
      title: `내일 마감인 담당 업무 ${rows.length}건이 있습니다.`,
      body: rows.map((t) => `· ${t.title}   ${t.project_name}   ${shortD(t.due_date)}`).join('\n'),
      dedupeKey: `DUE_D1:${owner}:${ref}` })) n += 1;
  }
  count('DUE_D1', n);

  const delayed = open.filter((t) => t.is_delayed);
  n = 0;
  for (const [owner, rows] of byOwner(delayed)) {
    if (!activeOwners.has(owner)) continue;
    if (emit({ kind: 'DELAYED', channel: 'DM', target: owner,
      title: `⚠ 마감일이 지난 담당 업무 ${rows.length}건이 있습니다.`,
      body: rows.sort((a, b) => a.d_day - b.d_day)
        .map((t) => `· ${t.title}   ${t.project_name}   ${sLabel(t.status)}   ${Math.abs(t.d_day)}일 지연`).join('\n'),
      dedupeKey: `DELAYED:${owner}:${ref}` })) n += 1;
  }
  count('DELAYED', n);

  const byChannel = new Map();
  for (const t of delayed) {
    const ch = t.project_channel || UNSET_CHANNEL;
    if (!byChannel.has(ch)) byChannel.set(ch, []);
    byChannel.get(ch).push(t);
  }
  for (const [ch, rows] of byChannel) {
    emit({ kind: 'DELAYED_CHANNEL', channel: 'CHANNEL', target: ch,
      title: `⚠ 지연 업무 ${rows.length}건`,
      body: rows.map((t) => `· ${t.title}   ${t.owner_name}   ${Math.abs(t.d_day)}일 지연`).join('\n'),
      dedupeKey: `DELAYED_CHANNEL:${ch}:${ref}` });
  }

  n = 0;
  for (const t of open.filter((t) => t.area === 'OUT'
      && (t.delivery_due_date === ref || t.delivery_due_date === addDays(ref, 2)))) {
    if (emit({ kind: 'DELIVERY_DUE', channel: 'DM', target: t.owner_slack_user_id,
      title: `외주 납품 예정일이 다가옵니다. (${t.delivery_due_date === ref ? 'D-DAY' : 'D-2'})`,
      body: `업무  ${t.title}\n외주 업체  ${t.vendor_name ?? '-'}\n납품 예정  ${fmtDate(t.delivery_due_date)}\n현재 상태  ${sLabel(t.status)}`,
      taskId: t.id, dedupeKey: `DELIVERY_DUE:${t.id}:${ref}` })) n += 1;
  }
  count('DELIVERY_DUE', n);

  n = 0;
  for (const t of open.filter((t) => t.is_delivery_delayed)) {
    if (emit({ kind: 'DELIVERY_DELAYED', channel: 'DM', target: t.owner_slack_user_id,
      title: '⚠ 외주 납품 예정일이 지났습니다.',
      body: `업무  ${t.title}\n외주 업체  ${t.vendor_name ?? '-'}\n납품 예정  ${fmtDate(t.delivery_due_date)}\n현재 상태  ${sLabel(t.status)}`,
      taskId: t.id, dedupeKey: `DELIVERY_DELAYED:${t.id}:${ref}` })) n += 1;
  }
  count('DELIVERY_DELAYED', n);

  n = 0;
  for (const i of listIssues({}).filter((i) => i.target_resolve_date && i.target_resolve_date < ref)) {
    if (emit({ kind: 'ISSUE_OVERDUE', channel: 'DM', target: i.owner_slack_user_id,
      title: '⚠ 이슈 해결 목표일이 지났습니다.',
      body: `이슈  ${i.title}\n프로젝트  ${i.project_name}\n목표일  ${fmtDate(i.target_resolve_date)}`,
      issueId: i.id, dedupeKey: `ISSUE_OVERDUE:${i.id}:${ref}` })) n += 1;
  }
  count('ISSUE_OVERDUE', n);

  save();
  return { date: ref, sent };
}

// ── Weekly Report ───────────────────────────────────────
const inPeriod = (v, a, b) => Boolean(v) && v.slice(0, 10) >= a && v.slice(0, 10) <= b;

function buildSnapshot(periodStart, periodEnd, ref) {
  const ov = overview(ref);
  const rows = listTasks({ today: ref, includeDone: true });
  const completed = rows.filter((t) => inPeriod(t.completed_at, periodStart, periodEnd));
  const created = rows.filter((t) => inPeriod(t.created_at, periodStart, periodEnd));

  const prev = DB.weekly_reports
    .filter((r) => r.period_start < periodStart)
    .sort((a, b) => b.period_start.localeCompare(a.period_start))[0];
  const prevMap = new Map((prev?.snapshot.projects ?? []).map((p) => [p.id, p.progress]));

  const brief = (t) => ({
    id: t.id, title: t.title, project_name: t.project_name, area: t.area,
    area_label: AREA_MAP[t.area]?.label ?? t.area,
    owner_name: t.owner_name, owner_slack_user_id: t.owner_slack_user_id,
    status: t.status, status_label: sLabel(t.status), priority: t.priority,
    due_date: t.due_date, start_date: t.start_date, completed_at: t.completed_at,
    has_open_issue: t.has_open_issue,
  });

  const nextStart = addDays(periodEnd, 1);
  const nextEnd = addDays(periodEnd, 7);
  const allIssues = listIssues({ includeResolved: true });
  const openIssues = listIssues({});

  return {
    summary: {
      total: ov.summary.total,
      completed_this_week: completed.length,
      in_progress: ov.summary.in_progress,
      review: ov.summary.review,
      delayed: ov.summary.delayed,
      created_this_week: created.length,
      progress: ov.progress,
    },
    projects: ov.projects.map((p) => {
      const before = prevMap.get(p.id);
      return {
        ...p,
        completed_this_week: completed.filter((t) => t.project_id === p.id).length,
        delta: before === undefined || before === null || p.progress === null ? null : p.progress - before,
      };
    }),
    areas: ov.areas.map((a) => ({
      ...a, completed_this_week: completed.filter((t) => t.area === a.code).length,
    })),
    completed: {
      rows: [...completed].sort((a, b) => PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]
        || a.project_name.localeCompare(b.project_name)).slice(0, 10).map(brief),
      more: Math.max(0, completed.length - 10),
    },
    progressing: {
      in_progress: rows.filter((t) => t.stage === 'PROGRESS' || t.stage === 'REVIEW')
        .sort((a, b) => a.due_date.localeCompare(b.due_date)).map(brief),
      delayed: rows.filter((t) => t.is_delayed).sort((a, b) => a.d_day - b.d_day)
        .map((t) => ({ ...brief(t), days_late: Math.abs(t.d_day) })),
    },
    outsourcing: ov.outsourcing,
    issues: {
      open_count: openIssues.length,
      new_this_week: allIssues.filter((i) => inPeriod(i.created_at, periodStart, periodEnd)).length,
      resolved_this_week: allIssues.filter((i) => inPeriod(i.resolved_at, periodStart, periodEnd)).length,
      rows: openIssues.slice(0, 10).map((i) => ({
        id: i.id, title: i.title, project_name: i.project_name, task_title: i.task_title,
        owner_name: i.owner_name, severity: i.severity, status: i.status,
        target_resolve_date: i.target_resolve_date, impact: i.impact,
      })),
    },
    owners: ov.owners.filter((o) => o.count > 0).map((o) => ({
      ...o, completed_this_week: completed.filter((t) => t.owner_slack_user_id === o.slack_user_id).length,
    })),
    handover: ov.handover,
    next_week: {
      period: { start: nextStart, end: nextEnd },
      due: rows.filter((t) => t.status !== 'DONE' && t.due_date >= nextStart && t.due_date <= nextEnd)
        .sort((a, b) => a.due_date.localeCompare(b.due_date)).map(brief),
      starting: rows.filter((t) => t.start_date && t.start_date >= nextStart && t.start_date <= nextEnd).map(brief),
      delivery: rows.filter((t) => t.area === 'OUT' && t.status !== 'DONE'
        && t.delivery_due_date >= nextStart && t.delivery_due_date <= nextEnd)
        .map((t) => ({ ...brief(t), vendor_name: t.vendor_name, delivery_due_date: t.delivery_due_date })),
    },
  };
}

function weeklyForWeek(anchor = today()) {
  const periodStart = weekStart(anchor);
  const periodEnd = addDays(periodStart, 6);
  const saved = DB.weekly_reports.filter((r) => r.period_start === periodStart)
    .sort((a, b) => b.generated_at.localeCompare(a.generated_at))[0];
  if (saved) return { ...saved, saved: true };
  return {
    id: null, period_start: periodStart, period_end: periodEnd,
    generated_at: null, shared_at: null, saved: false,
    snapshot: buildSnapshot(periodStart, periodEnd, today()),
  };
}

function weeklyGenerate(anchor, by) {
  const periodStart = weekStart(anchor || today());
  const periodEnd = addDays(periodStart, 6);
  const report = {
    id: uid(), period_start: periodStart, period_end: periodEnd,
    snapshot: buildSnapshot(periodStart, periodEnd, today()),
    generated_at: nowISO(), generated_by: by, shared_at: null,
  };
  DB.weekly_reports.push(report);
  save();
  return report;
}

function weeklyShare(id) {
  const report = DB.weekly_reports.find((r) => r.id === id);
  if (!report) throw new DemoError('리포트를 찾을 수 없습니다.');
  const s = report.snapshot;
  const status = emit({
    kind: 'WEEKLY_REPORT', channel: 'CHANNEL', target: UNSET_CHANNEL,
    title: `📊 KinderFlow Weekly Report  (${shortD(report.period_start)} ~ ${shortD(report.period_end)})`,
    body: [
      `이번 주 완료 ${s.summary.completed_this_week}건 · 진행 ${s.summary.in_progress}건 · 검토 ${s.summary.review}건 · 지연 ${s.summary.delayed}건`,
      '', '프로젝트',
      ...s.projects.map((p) => `· ${p.name}  ${p.progress ?? '-'}%  (${p.delta === null ? '-' : `${p.delta > 0 ? '+' : ''}${p.delta}%p`})`),
      '', `⚠ 지연 ${s.summary.delayed}건 · 🔥 미해결 이슈 ${s.issues.open_count}건 · 외주 납품 지연 ${s.outsourcing.delivery_delayed}건`,
    ].join('\n'),
    dedupeKey: `WEEKLY_REPORT:${report.period_start}`,
  });
  save();
  return { status: status ?? 'ALREADY_SHARED', channel: UNSET_CHANNEL, channel_configured: false, slack_configured: false };
}

// ── api 라우터 (서버 REST 와 같은 모양) ─────────────────
// 현재 사용자는 화면(state.js)이 localStorage 에 넣어 둔 값을 그대로 읽는다.
const currentMe = () => {
  let id = null;
  try { id = localStorage.getItem('kf.me'); } catch { /* 접근 불가 시 기본값 */ }
  if (id && DB.members.some((m) => m.slack_user_id === id && m.is_active)) return id;
  return DB.members.find((m) => m.is_active)?.slack_user_id ?? null;
};

const listParam = (sp, name) => {
  const raw = sp.getAll(name).flatMap((v) => v.split(',')).map((v) => v.trim()).filter(Boolean);
  return raw.length ? raw : undefined;
};

// ── 페이즈 · 마일스톤 · 타임라인 ────────────────────────
// server/repo.js 의 phases · milestones · timeline() 과 같은 규칙이다.

const phasesOf = (projectId) => (DB.phases ?? [])
  .filter((ph) => !projectId || ph.project_id === projectId)
  .map((ph) => {
    const own = DB.tasks.filter((t) => !t.deleted_at && t.phase_id === ph.id);
    return {
      ...ph,
      task_count: own.length,
      done_count: own.filter((t) => t.status === 'DONE').length,
    };
  })
  .sort((a, b) => (a.project_id === b.project_id
    ? a.sort_order - b.sort_order
    : a.project_id.localeCompare(b.project_id)));

const milestonesOf = (projectId) => (DB.milestones ?? [])
  .filter((m) => !projectId || m.project_id === projectId)
  .map((m) => ({
    ...m,
    phase_name: (DB.phases ?? []).find((ph) => ph.id === m.phase_id)?.name ?? null,
    project_name: project(m.project_id)?.name ?? '-',
  }))
  .sort((a, b) => a.due_date.localeCompare(b.due_date));

function createPhase(input) {
  if (!input.project_id) throw new DemoError('프로젝트를 선택해 주세요.');
  if (!input.name?.trim()) throw new DemoError('페이즈 이름을 입력해 주세요.');
  if (input.start_date && input.end_date && input.start_date > input.end_date) {
    throw new DemoError('시작일이 종료일보다 늦습니다.');
  }
  const same = (DB.phases ?? []).filter((ph) => ph.project_id === input.project_id);
  const ph = {
    id: uid(), project_id: input.project_id, name: input.name.trim(),
    start_date: input.start_date || null, end_date: input.end_date || null,
    sort_order: input.sort_order ?? same.reduce((n, x) => Math.max(n, x.sort_order), 0) + 1,
    created_at: nowISO(), updated_at: nowISO(),
  };
  DB.phases.push(ph);
  save();
  return ph;
}

function updatePhase(id, input) {
  const ph = (DB.phases ?? []).find((x) => x.id === id);
  if (!ph) throw new DemoError('페이즈를 찾을 수 없습니다.');
  const start = input.start_date === undefined ? ph.start_date : (input.start_date || null);
  const end = input.end_date === undefined ? ph.end_date : (input.end_date || null);
  if (start && end && start > end) throw new DemoError('시작일이 종료일보다 늦습니다.');
  Object.assign(ph, {
    name: (input.name ?? ph.name).trim(), start_date: start, end_date: end,
    sort_order: input.sort_order ?? ph.sort_order, updated_at: nowISO(),
  });
  save();
  return ph;
}

function removePhase(id) {
  // 업무는 남기고 연결만 끊는다
  for (const t of DB.tasks) if (t.phase_id === id) t.phase_id = null;
  for (const m of (DB.milestones ?? [])) if (m.phase_id === id) m.phase_id = null;
  DB.phases = (DB.phases ?? []).filter((ph) => ph.id !== id);
  save();
  return { ok: true };
}

function createMilestone(input) {
  if (!input.project_id) throw new DemoError('프로젝트를 선택해 주세요.');
  if (!input.name?.trim()) throw new DemoError('마일스톤 이름을 입력해 주세요.');
  if (!input.due_date) throw new DemoError('날짜를 입력해 주세요.');
  const m = {
    id: uid(), project_id: input.project_id, phase_id: input.phase_id || null,
    name: input.name.trim(), due_date: input.due_date, done_at: null,
    created_at: nowISO(), updated_at: nowISO(),
  };
  DB.milestones.push(m);
  save();
  return m;
}

function updateMilestone(id, input) {
  const m = (DB.milestones ?? []).find((x) => x.id === id);
  if (!m) throw new DemoError('마일스톤을 찾을 수 없습니다.');
  Object.assign(m, {
    name: (input.name ?? m.name).trim(),
    due_date: input.due_date ?? m.due_date,
    phase_id: input.phase_id === undefined ? m.phase_id : (input.phase_id || null),
    done_at: input.done === undefined ? m.done_at : (input.done ? (m.done_at || `${today()}T00:00:00.000Z`) : null),
    updated_at: nowISO(),
  });
  save();
  return m;
}

function removeMilestone(id) {
  DB.milestones = (DB.milestones ?? []).filter((m) => m.id !== id);
  save();
  return { ok: true };
}

function timelineRows() {
  const allPhases = phasesOf();
  const allMilestones = milestonesOf();
  return DB.projects
    .filter((p) => !p.is_archived)
    .sort((a, b) => a.sort_order - b.sort_order)
    .map((p) => {
      const ps = allPhases.filter((ph) => ph.project_id === p.id).map((ph) => ({
        ...ph,
        progress: ph.task_count ? Math.round((ph.done_count / ph.task_count) * 100) : null,
      }));
      const rowTasks = DB.tasks.filter((t) => !t.deleted_at && t.project_id === p.id);
      // 기간이 없는 페이즈는 그 페이즈 업무의 일정으로 채운다
      for (const ph of ps) {
        if (ph.start_date && ph.end_date) continue;
        const own = rowTasks.filter((t) => t.phase_id === ph.id);
        if (!own.length) continue;
        const ds = own.flatMap((t) => [t.start_date, t.due_date]).filter(Boolean).sort();
        ph.start_date ??= ds[0] ?? null;
        ph.end_date ??= ds[ds.length - 1] ?? null;
        ph.derived = true;
      }
      const ds = [
        ...ps.flatMap((ph) => [ph.start_date, ph.end_date]),
        ...rowTasks.flatMap((t) => [t.start_date, t.due_date]),
        p.start_date, p.end_date,
      ].filter(Boolean).sort();
      return {
        id: p.id, name: p.name, code: p.code, status: p.status,
        start_date: ds[0] ?? null, end_date: ds[ds.length - 1] ?? null,
        phases: ps,
        milestones: allMilestones.filter((m) => m.project_id === p.id),
        unphased: rowTasks.filter((t) => !t.phase_id).length,
      };
    });
}

// ── 경비 ────────────────────────────────────────────────
const EXPENSE_CATEGORIES = [
  { code: 'TRANSPORT', label: '교통' },
  { code: 'MATERIAL',  label: '자재·인쇄' },
  { code: 'MEAL',      label: '식대' },
  { code: 'SOFTWARE',  label: '소프트웨어' },
  { code: 'ETC',       label: '기타' },
];

function expenseRows({ from, to, project: pid, member: who } = {}) {
  return (DB.expenses ?? [])
    .filter((e) => (!from || e.spent_on >= from) && (!to || e.spent_on <= to)
      && (!pid || e.project_id === pid) && (!who || e.slack_user_id === who))
    .map((e) => ({
      ...e,
      project_name: project(e.project_id)?.name ?? '-',
      task_title: DB.tasks.find((t) => t.id === e.task_id)?.title ?? null,
      display_name: member(e.slack_user_id)?.display_name ?? e.slack_user_id,
    }))
    .sort((a, b) => b.spent_on.localeCompare(a.spent_on));
}

function expenseSummary(range) {
  const rows = expenseRows(range);
  const group = (keyFn, labelFn) => {
    const map = new Map();
    for (const r of rows) {
      const k = keyFn(r);
      if (!map.has(k)) map.set(k, { key: k, label: labelFn(r), amount: 0, count: 0 });
      const g = map.get(k);
      g.amount += r.amount;
      g.count += 1;
    }
    return [...map.values()].sort((a, b) => b.amount - a.amount);
  };
  return {
    total: rows.reduce((n, r) => n + r.amount, 0),
    count: rows.length,
    projects: group((r) => r.project_id, (r) => r.project_name),
    categories: group((r) => r.category,
      (r) => EXPENSE_CATEGORIES.find((c) => c.code === r.category)?.label ?? r.category),
  };
}

function createExpense(input, actor) {
  if (!input.project_id) throw new DemoError('프로젝트를 선택해 주세요.');
  if (!input.spent_on) throw new DemoError('사용일을 입력해 주세요.');
  const amount = Math.round(Number(input.amount));
  if (!Number.isFinite(amount) || amount <= 0) throw new DemoError('금액을 0보다 큰 숫자로 입력해 주세요.');
  const category = input.category || 'ETC';
  if (!EXPENSE_CATEGORIES.some((c) => c.code === category)) throw new DemoError('없는 분류입니다.');
  const e = {
    id: uid(), project_id: input.project_id, task_id: input.task_id || null,
    slack_user_id: input.slack_user_id || actor, spent_on: input.spent_on,
    category, amount, memo: input.memo || null,
    created_at: nowISO(), updated_at: nowISO(),
  };
  DB.expenses.push(e);
  save();
  return expenseRows().find((r) => r.id === e.id) ?? e;
}

function removeExpense(id) {
  DB.expenses = (DB.expenses ?? []).filter((e) => e.id !== id);
  save();
  return { ok: true };
}

function handle(method, path, body) {
  const url = new URL(path, 'http://demo.local');
  const sp = url.searchParams;
  const p = url.pathname;
  const me = currentMe();
  const seg = p.split('/').filter(Boolean); // ['api', ...]

  // ── 나눠 준 코드 ─────────────────────────────────────
  // 코드 자체는 해시로만 있어 되돌릴 수 없다. 여기서 보이는 것은 누가 쓰는지와 상태뿐이다.
  if (p === '/api/gate-codes' && method === 'GET') {
    return sbRpc('kf_gate_list').then((rows) => rows ?? []);
  }
  if (method === 'PATCH' && seg[1] === 'gate-codes' && seg[2]) {
    return sbRpc('kf_gate_set_active', { p_id: Number(seg[2]), p_active: Boolean(body?.active) })
      .then((active) => ({ active }));
  }

  // ── 저장점 ───────────────────────────────────────────
  // 언제 무엇이 저장됐는지 보고, 그 시점으로 통째로 되돌린다.
  if (p === '/api/restore-points') {
    if (method === 'GET') {
      return sbRpc('kf_snapshot_list', { limit_n: 60 }).then((rows) => (rows ?? []).map((r) => ({
        id: r.id, taken_at: r.taken_at, kind: r.kind,
        label: r.label ?? (r.kind === 'AUTO' ? '자동 저장' : r.kind === 'PRE_RESTORE' ? '되돌리기 직전' : '저장점'),
        taken_by: r.taken_by, row_count: r.row_count,
      })));
    }
    if (method === 'POST') {
      // 아직 안 올린 변경이 있으면 먼저 올린다. 저장점은 "지금 화면"이어야 한다.
      return flush().then(() => sbRpc('kf_snapshot_take', {
        p_kind: 'MANUAL',
        p_label: body?.label ?? null,
        p_by: (member(currentMe())?.display_name ?? currentMe()),
      })).then((id) => ({ id }));
    }
  }
  if (method === 'POST' && seg[1] === 'restore-points' && seg[3] === 'restore') {
    return sbRpc('kf_snapshot_restore', { p_id: Number(seg[2]), p_by: (member(currentMe())?.display_name ?? currentMe()) })
      .then(async (rows) => {
        const r = Array.isArray(rows) ? rows[0] : rows;
        await refreshFromRemote();
        return { restored: r?.restored ?? 0, backup_id: r?.backup_id ?? null };
      });
  }

  if (method === 'GET' && p === '/api/bootstrap') {
    return {
      me, today: today(),
      members: DB.members, projects: projectRows(), vendors: DB.vendors,
      area_leads: leadRows(),
      slack_configured: false,
      meta: {
        areas: AREAS, normal_statuses: NORMAL_STATUSES, out_statuses: OUT_STATUSES,
        review_statuses: REVIEW_STATUSES, issue_statuses: ISSUE_STATUSES,
        priorities: PRIORITIES, project_statuses: PROJECT_STATUSES, progress_weight: PROGRESS_WEIGHT,
        expense_categories: EXPENSE_CATEGORIES,
      },
    };
  }
  if (method === 'GET' && p === '/api/overview') return overview();

  if (p === '/api/tasks' && method === 'GET') {
    return listTasks({
      project: listParam(sp, 'project'), area: listParam(sp, 'area'),
      phase: listParam(sp, 'phase'), month: sp.get('month') || undefined,
      owner: listParam(sp, 'owner')?.map((o) => (o === 'me' ? me : o)),
      status: listParam(sp, 'status'), stage: sp.get('stage') || undefined,
      delayed: sp.get('delayed') === '1', hasIssue: sp.get('issue') === '1',
      includeDone: sp.get('done') === '1',
      backlog: sp.get('backlog') === '1',
      includeBacklog: sp.get('all_backlog') === '1',
      dueFrom: sp.get('due_from') || undefined, dueTo: sp.get('due_to') || undefined,
      q: sp.get('q') || undefined,
    });
  }
  if (p === '/api/tasks' && method === 'POST') return createTask(body, me);

  if (seg[1] === 'tasks' && seg[2] && seg[3] === 'subtasks') {
    if (method === 'GET') return subtasksOf(seg[2]);
    if (method === 'POST') return createSubtask(seg[2], body);
  }
  if (seg[1] === 'subtasks' && seg[2]) {
    if (method === 'PATCH') return updateSubtask(seg[2], body);
    if (method === 'DELETE') return removeSubtask(seg[2]);
  }

  if (seg[1] === 'tasks' && seg[2]) {
    const id = seg[2];
    if (method === 'GET') {
      const t = DB.tasks.find((x) => x.id === id && !x.deleted_at);
      if (!t) throw new DemoError('업무를 찾을 수 없습니다.');
      return {
        ...hydrate(t),
        events: DB.events.filter((e) => e.task_id === id)
          .map((e) => ({ ...e, actor_name: member(e.actor_slack_user_id)?.display_name ?? e.actor_slack_user_id }))
          .sort((a, b) => b.occurred_at.localeCompare(a.occurred_at)),
        issues: listIssues({ task_id: id, includeResolved: true }),
        subtasks: subtasksOf(id),
      };
    }
    if (method === 'PATCH') return updateTask(id, body, me);
    if (method === 'DELETE') {
      const t = DB.tasks.find((x) => x.id === id);
      if (t) t.deleted_at = nowISO();
      save();
      return { ok: true };
    }
  }

  if (seg[1] === 'projects' && seg[2] && method === 'DELETE') {
    const id = seg[2];
    const pr = project(id);
    if (!pr) throw new DemoError('프로젝트를 찾을 수 없습니다.');
    // 빈 프로젝트만 지운다. 붙은 기록이 있으면 아카이브해야 한다.
    const held = [
      ['업무', (DB.tasks ?? []).filter((t) => t.project_id === id && !t.deleted_at).length],
      ['페이즈', (DB.phases ?? []).filter((x) => x.project_id === id).length],
      ['마일스톤', (DB.milestones ?? []).filter((x) => x.project_id === id).length],
      ['경비', (DB.expenses ?? []).filter((x) => x.project_id === id).length],
    ].filter(([, n]) => n > 0);
    if (held.length) {
      throw new DemoError(`${held.map(([k, n]) => `${k} ${n}건`).join(' · ')}이 남아 있어 지울 수 없습니다. 아카이브를 쓰세요.`);
    }
    DB.projects = DB.projects.filter((x) => x.id !== id);
    save();
    return { ok: true };
  }

  if (p === '/api/projects' && method === 'GET') return projectRows();
  if (p === '/api/projects' && method === 'POST') {
    if (!body.name?.trim()) throw new DemoError('프로젝트명을 입력해 주세요.');
    const pr = {
      id: uid(), name: body.name.trim(), code: body.code || null, description: body.description || null,
      status: body.status || 'ACTIVE', start_date: body.start_date || null, end_date: body.end_date || null,
      lead_slack_user_id: body.lead_slack_user_id || null, slack_channel_id: body.slack_channel_id || null,
      sort_order: DB.projects.length + 1, is_archived: 0, created_at: nowISO(), updated_at: nowISO(),
    };
    DB.projects.push(pr);
    save();
    return pr;
  }
  if (seg[1] === 'projects' && seg[2] && method === 'PATCH') {
    const pr = project(seg[2]);
    if (!pr) throw new DemoError('프로젝트를 찾을 수 없습니다.');
    Object.assign(pr, {
      name: body.name ?? pr.name, code: body.code ?? pr.code, status: body.status ?? pr.status,
      start_date: body.start_date ?? pr.start_date, end_date: body.end_date ?? pr.end_date,
      lead_slack_user_id: body.lead_slack_user_id ?? pr.lead_slack_user_id,
      slack_channel_id: body.slack_channel_id ?? pr.slack_channel_id,
      is_archived: body.is_archived === undefined ? pr.is_archived : (body.is_archived ? 1 : 0),
      updated_at: nowISO(),
    });
    save();
    return pr;
  }

  if (p === '/api/area-leads' && method === 'GET') return leadRows();
  if (p === '/api/area-leads/co' && method === 'PATCH') return setCoLeads(body.rows ?? []);
  if (p === '/api/area-leads' && method === 'PATCH') {
    if (!Array.isArray(body.leads)) throw new DemoError('리드 목록이 필요합니다.');
    const out = body.leads.map((l) => setLead(l.area, l.slack_user_id, me));
    save();
    return out;
  }

  if (p === '/api/issues' && method === 'GET') {
    return listIssues({
      project: listParam(sp, 'project'),
      owner: listParam(sp, 'owner')?.map((o) => (o === 'me' ? me : o)),
      status: listParam(sp, 'status'), severity: listParam(sp, 'severity'),
      includeResolved: sp.get('resolved') === '1', task_id: sp.get('task_id') || undefined,
    });
  }
  if (p === '/api/issues' && method === 'POST') return createIssue(body, me);
  if (seg[1] === 'issues' && seg[2]) {
    if (method === 'GET') {
      const i = liveIssues().find((x) => x.id === seg[2]);
      if (!i) throw new DemoError('이슈를 찾을 수 없습니다.');
      return hydrateIssue(i);
    }
    if (method === 'PATCH') return updateIssue(seg[2], body);
    if (method === 'DELETE') {
      const i = DB.issues.find((x) => x.id === seg[2]);
      if (i) i.deleted_at = nowISO();
      save();
      return { ok: true };
    }
  }

  if (p === '/api/weekly' && method === 'GET') return weeklyForWeek(sp.get('week') || today());
  if (p === '/api/weekly/list' && method === 'GET') {
    return DB.weekly_reports.map(({ id, period_start, period_end, generated_at, shared_at }) =>
      ({ id, period_start, period_end, generated_at, shared_at }))
      .sort((a, b) => b.period_start.localeCompare(a.period_start));
  }
  if (p === '/api/weekly/generate' && method === 'POST') return weeklyGenerate(body.week, me);
  if (seg[1] === 'weekly' && seg[3] === 'share' && method === 'POST') return weeklyShare(seg[2]);

  // ── AI ── 데모에는 LLM 키가 없으므로 언제나 규칙 결과다 (docs/12-ai-spec.md)
  const aiCtx = () => ({
    tasks: listTasks({ includeDone: true }),
    issues: listIssues({ includeResolved: true }),
    events: DB.events,
    members: DB.members,
    projects: DB.projects.filter((x) => !x.is_archived),
    areaLeads: leadRows(),
    today: today(),
  });
  if (p === '/api/ai/status' && method === 'GET') {
    return { enabled: false, model: 'claude-opus-5', reason: '브라우저 데모에서는 LLM 을 호출하지 않습니다' };
  }
  if (p === '/api/ai/risks' && method === 'GET') {
    return { source: 'rules', rows: detectRisks(aiCtx()) };
  }
  if (p === '/api/ai/digest' && method === 'POST') {
    const report = weeklyForWeek(body.week || today());
    return {
      ...draftDigest({
        snapshot: report.snapshot,
        risks: detectRisks(aiCtx()),
        periodStart: report.period_start,
        periodEnd: report.period_end,
      }),
      period_start: report.period_start,
      period_end: report.period_end,
    };
  }
  if (p === '/api/ai/capture' && method === 'POST') {
    if (!body.text?.trim()) throw new DemoError('문장을 입력해 주세요.');
    const c = aiCtx();
    return parseCapture(body.text, { members: c.members, projects: c.projects, today: c.today });
  }

  if (p === '/api/task-months' && method === 'GET') {
    const ref = today();
    const map = new Map();
    for (const t of DB.tasks) {
      if (t.deleted_at || !t.due_date) continue;
      const pr = project(t.project_id);
      if (!pr || pr.is_archived) continue;
      const key = t.due_date.slice(0, 7);
      if (!map.has(key)) map.set(key, { month: key, count: 0, delayed: 0, done: 0 });
      const g = map.get(key);
      g.count += 1;
      if (t.status === 'DONE') g.done += 1;
      else if (t.due_date < ref) g.delayed += 1;
    }
    return [...map.values()].sort((a, b) => a.month.localeCompare(b.month));
  }

  if (p === '/api/timeline' && method === 'GET') return timelineRows();

  if (p === '/api/phases' && method === 'GET') return phasesOf(sp.get('project') || undefined);
  if (p === '/api/phases' && method === 'POST') return createPhase(body);
  if (seg[1] === 'phases' && seg[2]) {
    if (method === 'PATCH') return updatePhase(seg[2], body);
    if (method === 'DELETE') return removePhase(seg[2]);
  }

  if (p === '/api/milestones' && method === 'GET') return milestonesOf(sp.get('project') || undefined);
  if (p === '/api/milestones' && method === 'POST') return createMilestone(body);
  if (seg[1] === 'milestones' && seg[2]) {
    if (method === 'PATCH') return updateMilestone(seg[2], body);
    if (method === 'DELETE') return removeMilestone(seg[2]);
  }

  if (p === '/api/expenses' && method === 'GET') {
    const who = sp.get('member');
    const range = {
      from: sp.get('from') || undefined, to: sp.get('to') || undefined,
      project: sp.get('project') || undefined,
      member: who === 'me' ? me : (who || undefined),
    };
    return { rows: expenseRows(range), summary: expenseSummary(range) };
  }
  if (p === '/api/expenses' && method === 'POST') return createExpense(body, me);
  if (seg[1] === 'expenses' && seg[2] && method === 'DELETE') return removeExpense(seg[2]);

  if (p === '/api/time/week' && method === 'GET') {
    const who = sp.get('member');
    return timeWeek(!who || who === 'me' ? me : who, weekStart(sp.get('week') || today()));
  }
  if (p === '/api/time' && method === 'POST') {
    const who = body.slack_user_id && body.slack_user_id !== 'me' ? body.slack_user_id : me;
    return setTime({ ...body, slack_user_id: who });
  }
  if (p === '/api/time/summary' && method === 'GET') {
    const to = sp.get('to') || today();
    return timeSummary(sp.get('from') || addDays(to, -6), to);
  }
  if (p === '/api/payments' && method === 'GET') {
    return { rows: paymentRows({ status: sp.get('status') || undefined }), summary: paymentSummary() };
  }
  if (seg[1] === 'payments' && seg[2] && method === 'PATCH') return updatePayment(seg[2], body);

  if (p === '/api/notifications' && method === 'GET') {
    return { slack_configured: false, rows: DB.notifications.slice(0, 200) };
  }
  if (p === '/api/jobs/daily' && method === 'POST') return runDailyJob();
  if (p === '/api/slack/sync' && method === 'POST') {
    throw new DemoError('데모에서는 Slack 동기화를 실행할 수 없습니다. 시드 구성원을 그대로 사용합니다.');
  }

  throw new DemoError('없는 API 경로입니다.');
}

// 서버판 api.js 와 같은 인터페이스. 화면 코드는 차이를 모른다.
// 첫 요청 때 공유 저장소를 먼저 맞춘다. 화면은 원래도 기다리게 되어 있어 손댈 것이 없다.
const call = async (method, p, b) => {
  await ensureReady();
  // 화면이 실수로 편집칸을 열어 두었더라도 여기서 걸린다.
  // 진짜로 막는 곳은 저장소지만, 여기서 걸러야 "고쳐진 것처럼 보였다가 사라지는" 일이 없다.
  assertCan(method, p);
  return handle(method, p, b);   // 저장점 호출처럼 기다려야 하는 것은 Promise 로 돌아온다
};

const api = {
  get: (p) => call('GET', p),
  post: (p, b) => call('POST', p, b ?? {}),
  patch: (p, b) => call('PATCH', p, b ?? {}),
  del: (p) => call('DELETE', p),
};


/* ── 화면 (public/js/**) ────────────────────────────── */



// 브라우저 저장소는 접근 자체가 막히는 환경이 있으므로 항상 감싼다
const readStored = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
const writeStored = (key, value) => { try { localStorage.setItem(key, value); } catch { /* 저장 불가 시 메모리만 */ } };

const state = {
  me: readStored('kf.me') || null,
  members: [],
  projects: [],
  vendors: [],
  areaLeads: [],
  meta: null,
  today: null,
  slackConfigured: false,
};

async function loadBootstrap() {
  const data = await api.get('/api/bootstrap');
  state.members = data.members;
  state.projects = data.projects;
  state.vendors = data.vendors;
  state.areaLeads = data.area_leads ?? [];
  state.meta = data.meta;
  state.today = data.today;
  state.slackConfigured = data.slack_configured;
  const valid = data.members.some((m) => m.slack_user_id === state.me && m.is_active);
  if (!valid) setMe(data.me);
  return data;
}

function setMe(id) {
  state.me = id;
  writeStored('kf.me', id);
}

const memberOf = (id) => state.members.find((m) => m.slack_user_id === id) || null;
const projectOf = (id) => state.projects.find((p) => p.id === id) || null;
const activeMembers = () => state.members.filter((m) => m.is_active);
const activeProjects = () =>
  state.projects.filter((p) => !p.is_archived && ['ACTIVE', 'PLANNED'].includes(p.status));

// 프로젝트 선택의 기본값 — 차례가 가장 앞선 진행 프로젝트(지금은 킨더버스).
// 이름으로 박지 않는다. 차례는 프로젝트 관리에서 바꾸면 기본값도 따라 바뀐다.
const defaultProjectId = () => activeProjects()[0]?.id ?? '';

const statusMeta = (code) => {
  const all = [...(state.meta?.normal_statuses || []), ...(state.meta?.out_statuses || [])];
  return all.find((s) => s.code === code) || { code, label: code, tone: 'wait' };
};
const statusesFor = (area) =>
  area === 'OUT' ? state.meta.out_statuses : state.meta.normal_statuses;
// 담당이 되는 사람은 대표 리드다. role 이 없던 시절 데이터도 대표로 본다.
const leadOf = (area) =>
  state.areaLeads.find((l) => l.area === area && (l.role ?? 'LEAD') === 'LEAD') ?? null;
// 함께 서는 사람들 — 담당은 지지 않는다
const coLeadsOf = (area) => state.areaLeads.filter((l) => l.area === area && l.role === 'CO');
/** 화면에 쓰는 이름 한 줄: "혁 · 손" */
const leadNames = (area) => {
  const names = [leadOf(area), ...coLeadsOf(area)].filter(Boolean).map((l) => l.display_name);
  return names.length ? names.join(' · ') : '리드 미지정';
};
const leadAreas = (slackUserId) =>
  state.areaLeads.filter((l) => l.slack_user_id === slackUserId).map((l) => l.area);

const areaMeta = (code) => (state.meta?.areas || []).find((a) => a.code === code) || { code, label: code };
const issueStatusMeta = (code) =>
  (state.meta?.issue_statuses || []).find((s) => s.code === code) || { code, label: code, tone: 'wait' };




const esc = (v) =>
  String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ── 날짜 ────────────────────────────────────────────────
const shortDate = (iso) => {
  if (!iso) return '-';
  const [y, m, d] = iso.slice(0, 10).split('-');
  return y === state.today?.slice(0, 4) ? `${Number(m)}/${Number(d)}` : `${y}. ${Number(m)}. ${Number(d)}`;
};
const longDate = (iso) => (iso ? `${Number(iso.slice(5, 7))}월 ${Number(iso.slice(8, 10))}일` : '-');
const dateTime = (iso) => {
  if (!iso) return '-';
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const dDay = (n) => {
  if (n === null || n === undefined) return '';
  if (n === 0) return 'D-DAY';
  return n > 0 ? `D-${n}` : `${n}일`;
};

// ── 화면 취향값 ─────────────────────────────────────────
