// 탭 순서·프로젝트 순서처럼 "보는 사람" 것인 값. 이 브라우저에만 남는다.
// 저장이 막힌 환경(사생활 보호 창 등)에서도 화면은 기본값으로 그대로 돈다.
const readPref = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const writePref = (k, v) => { try { localStorage.setItem(k, v); } catch { /* 이번 세션만 유지 */ } };

// ── 프로젝트 색 ─────────────────────────────────────────
// 색은 프로젝트에 고정된다. 필터로 목록이 줄어도 남은 프로젝트의 색은 그대로다.
// 기준은 프로젝트가 이미 가진 정렬 순서(sort_order)다 — 목록 안에서의 등수가 아니라
// 프로젝트 자체의 값이라, 프로젝트를 새로 만들어도 기존 프로젝트 색이 바뀌지 않는다.
// 순서를 모르는 값(합계 행의 임의 키 등)은 id 해시로 떨어뜨린다.
const PROJECT_TONES = 4;
const projectTone = (id) => {
  const order = state.projects.find((p) => p.id === id)?.sort_order;
  if (Number.isInteger(order) && order > 0) return (order - 1) % PROJECT_TONES;
  let h = 0;
  for (const ch of String(id ?? '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return h % PROJECT_TONES;
};
/** 인라인 스타일로 넘길 프로젝트 색 변수 */
const projectStyle = (id) => `--pc:var(--p${projectTone(id)})`;
/** 색 점 + 이름 */
const projectName = (id, name) =>
  `<span class="pname" style="${projectStyle(id)}"><i class="pdot"></i>${esc(name ?? '')}</span>`;
/** 프로젝트를 아직 안 정한 업무도 있다 — 빈 칸 대신 그렇게 적는다 */
const projectLabel = (name) => (name ? String(name) : '프로젝트 미정');

// ── 조각 ────────────────────────────────────────────────
const avatar = (member, cls = '') => {
  if (!member) return `<span class="avatar ${cls}">?</span>`;
  const initial = esc(member.display_name?.[0] ?? '?');
  return member.avatar_url
    ? `<span class="avatar ${cls}"><img src="${esc(member.avatar_url)}" alt=""></span>`
    : `<span class="avatar ${cls}">${initial}</span>`;
};

const person = (id, name) => {
  const m = memberOf(id);
  const label = name || m?.display_name || id || '-';
  return `<span class="person">${avatar(m, 'sm')}<span>${esc(label)}</span>${
    m && !m.is_active ? '<span class="inactive">(비활성)</span>' : ''
  }</span>`;
};

const statusChip = (code) => {

};

/**
 * 상태 칩을 눌러 그 자리에서 바꾼다. 보이는 모양은 칩 그대로다.
 * 고를 수 있는 값은 영역을 따른다 — 외주는 6단계, 나머지는 4단계.

const statusPick = (t) => {

const issueChip = (code) => {
  const s = issueStatusMeta(code);
  return `<span class="chip ${s.tone}">${esc(s.label)}</span>`;

const areaChip = (code) => `<span class="chip area plain">${esc(areaMeta(code).label)}</span>`;

const flags = (task) => {
  const out = [];
  if (task.is_delayed) out.push(`<span class="flag delay" title="지연">⚠</span>`);
  if (task.has_open_issue) out.push(`<span class="flag issue" title="이슈 있음">🔥</span>`);

const progressBar = (pct, extraClass = '') =>
  `<span class="track"><span class="fill ${pct === null ? 'none' : ''} ${extraClass}" style="width:${pct ?? 0}%"></span></span>`;

const pctText = (v) => (v === null || v === undefined ? '-' : `${v}%`);

// ── 호버 툴팁 ───────────────────────────────────────────
// [data-tip] 을 가진 요소에 붙는다. 마우스와 키보드 포커스를 함께 받는다.
// 차트 계열 화면(타임라인·보드 지도)이 같은 것을 쓴다.
/**
 * 마감일 칸 — 평소에는 글자, 누르면 그때 날짜 입력칸이 된다.
 * 날짜 입력칸은 폭이 150px 가까이 필요해서, 늘 띄워 두면 좁은 칸에서 잘린다.
 */
const dueCell = (t) => `
  <button type="button" class="due-view" data-due="${esc(t.id)}" data-date="${esc(t.due_date ?? '')}"
          title="눌러서 마감일 바꾸기">${shortDate(t.due_date)}<i class="dday">${
    t.status === 'DONE' ? '' : esc(dDay(t.d_day))}</i></button>`;

/** dueCell 을 실제로 고칠 수 있게 한다. save(id, 'YYYY-MM-DD') 를 부른다. */
function bindDueEdit(root, save) {
  root.addEventListener('click', (e) => {
    const btn = e.target.closest('.due-view');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();

    const input = document.createElement('input');
    input.type = 'date';
    input.className = 'due-edit';
    input.value = btn.dataset.date ?? '';
    input.setAttribute('aria-label', '마감일 변경');
    btn.replaceWith(input);
    input.focus();
    try { input.showPicker?.(); } catch { /* 손짓 없이 부르면 막히는 브라우저가 있다 */ }

    let saved = false;
    input.addEventListener('change', () => {
      saved = true;
      save(btn.dataset.due, input.value);
    });
    // 고치지 않고 나가면 원래 글자로 되돌린다 (고쳤으면 화면을 다시 그린다)
    input.addEventListener('blur', () => {
      if (!saved && input.isConnected) input.replaceWith(btn);
    });
  });
}

/**
 * 업무명 칸 — 길면 줄바꿈해서 다 보인다.
 * input 은 한 줄뿐이라 긴 제목이 잘렸다. textarea 로 두고 내용만큼 키운다.
 */
const titleCell = (t, extra = '') => `
  <span class="ttl-wrap${extra ? ` ${extra}` : ''}" data-val="${esc(t.title)}">
    <textarea class="ttl-edit" rows="1" maxlength="120"
              data-title="${esc(t.id ?? '')}" aria-label="업무명 수정"
              title="눌러서 업무명 고치기">${esc(t.title)}</textarea>
  </span>`;

/** 제목칸의 높이는 같은 자리에 겹쳐 둔 글자(::after)가 정한다.
 *  재지 않고 그리므로 언제 그리든 줄 수가 맞는다 — 바뀐 글자만 여기서 옮겨 준다. */
const syncTitleCell = (el) => { if (el?.parentElement) el.parentElement.dataset.val = el.value; };

function autoGrow(root) {
  root.addEventListener('input', (e) => syncTitleCell(e.target.closest('textarea.ttl-edit')));
}

function hoverTip(root) {
  // 툴팁 좌표는 root 기준이다 — root 가 배치 기준이 되어야 어긋나지 않는다
  if (getComputedStyle(root).position === 'static') root.style.position = 'relative';
  const tip = document.createElement('div');
  tip.className = 'hovertip';
  tip.hidden = true;
  root.appendChild(tip);

  const show = (el) => {
    tip.innerHTML = el.dataset.tip;
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const host = root.getBoundingClientRect();
    const w = tip.offsetWidth;
    const left = Math.min(Math.max(r.left - host.left + r.width / 2 - w / 2, 4), host.width - w - 4);
    const above = r.top - host.top - tip.offsetHeight - 8;
    tip.style.left = `${Math.max(left, 4)}px`;
    // 위쪽에 자리가 없으면 아래로 뒤집는다
    tip.style.top = `${above < 0 ? r.bottom - host.top + 8 : above}px`;
  };
  const hide = () => { tip.hidden = true; };

  root.addEventListener('mouseover', (e) => {
    const el = e.target.closest('[data-tip]');
    if (el) show(el); else hide();
  });
  root.addEventListener('mouseleave', hide);
  root.addEventListener('focusin', (e) => {
    const el = e.target.closest('[data-tip]');
    if (el) show(el);
  });
  root.addEventListener('focusout', hide);
  root.addEventListener('scroll', hide, true);
  return tip;
}

function toast(message, bad = false) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast${bad ? ' bad' : ''}`;
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5200 : 2600);
}

// ── 모달 ────────────────────────────────────────────────
let openModals = 0;

function modal({ title, body, footer, wide = false, onMount }) {
  const root = document.getElementById('modal-root');
  const backdrop = document.createElement('div');
  backdrop.className = 'backdrop';
  backdrop.innerHTML = `
    <div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head">
        <h2>${esc(title)}</h2>
        <button class="btn btn-ghost" data-close aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
    </div>`;
  root.appendChild(backdrop);
  openModals += 1;

  const close = () => {
    backdrop.remove();
    openModals -= 1;
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => { if (e.key === 'Escape' && openModals) close(); };

  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop || e.target.closest('[data-close]')) close();
  });
  document.addEventListener('keydown', onKey);

  const box = backdrop.querySelector('.modal');
  onMount?.({ root: box, close });
  box.querySelector('input,select,textarea,button:not([data-close])')?.focus();
  return { close, root: box };
}

function confirmModal(message, { confirmLabel = '확인', danger = false } = {}) {
  return new Promise((resolve) => {
    const m = modal({
      title: '확인',
      body: `<p>${esc(message)}</p>`,
      footer: `<div class="right">
          <button class="btn" data-close>취소</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(confirmLabel)}</button>
        </div>`,
      onMount({ root, close }) {
        root.querySelector('[data-ok]').addEventListener('click', () => { close(); resolve(true); });
        root.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) resolve(false); });
      },
    });
    void m;
  });
}

// ── Slack 멤버 검색 선택기 ──────────────────────────────
// 별도 구성원 DB 없이 Slack 멤버 목록에서 고른다.
function memberPicker(root, { multi = false, value = [], exclude = [], onChange }) {
  const box = root;
  const input = box.querySelector('input[data-search]');
  const listEl = box.querySelector('.pick-list');
  const selectedEl = box.querySelector('.selected');
  let selected = [...value];

  const renderSelected = () => {
    selectedEl.innerHTML = selected.map((id) => {
      const m = memberOf(id);
      return `<span class="token">${avatar(m, 'sm')}<span>${esc(m?.display_name ?? id)}</span>
        <button type="button" data-remove="${esc(id)}" aria-label="제외">✕</button></span>`;
    }).join('');
    onChange?.(multi ? selected : selected[0] ?? null);
  };

  const renderList = (q = '') => {
    const term = q.trim().toLowerCase();
    const rows = activeMembers().filter((m) => {
      if (selected.includes(m.slack_user_id)) return false;
      if (exclude.includes(m.slack_user_id)) return false;
      if (!term) return true;
      return [m.display_name, m.real_name, m.email, m.slack_user_id]
        .filter(Boolean).some((v) => v.toLowerCase().includes(term));
    });
    listEl.innerHTML = rows.length
      ? rows.map((m) => `<button type="button" data-pick="${esc(m.slack_user_id)}">
          ${avatar(m, 'sm')}<span>${esc(m.display_name)}</span>
          <span style="color:var(--muted);font-size:.78rem">@${esc(m.email?.split('@')[0] ?? m.slack_user_id)}</span>
        </button>`).join('')
      : `<div class="none">일치하는 구성원이 없습니다.</div>`;
    listEl.hidden = false;
  };

  input.addEventListener('focus', () => renderList(input.value));
  input.addEventListener('input', () => renderList(input.value));
  input.addEventListener('blur', () => setTimeout(() => { listEl.hidden = true; }, 160));

  listEl.addEventListener('mousedown', (e) => {
    const btn = e.target.closest('[data-pick]');
    if (!btn) return;
    e.preventDefault();
    const id = btn.dataset.pick;
    selected = multi ? [...selected, id] : [id];
    input.value = '';
    listEl.hidden = true;
    renderSelected();
  });

  selectedEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-remove]');
    if (!btn) return;
    selected = selected.filter((id) => id !== btn.dataset.remove);
    renderSelected();
  });

  renderSelected();
  return {
    get value() { return multi ? selected : selected[0] ?? null; },
    setExclude(list) { exclude = list; },
    set(id) { selected = multi ? [...new Set([...selected, id])] : [id]; renderSelected(); },
  };
}

        multi: true,
        value: (task?.collaborators ?? []).map((c) => c.slack_user_id),

      // 담당을 직접 골랐는지 기억한다. 손대지 않았으면 영역을 바꿀 때 리드를 따라간다.
      const ownerSel = form.querySelector('[data-owner]');
      let ownerPicked = Boolean(task?.owner_slack_user_id
        && task.owner_slack_user_id !== leadOf(task.area)?.slack_user_id);
      ownerSel.addEventListener('change', () => { ownerPicked = true; syncLead(); });

      const syncLead = () => {
        const lead = leadOf(areaSel.value);
        const co = coLeadsOf(areaSel.value);
        if (!ownerPicked && lead) ownerSel.value = lead.slack_user_id;
        const owner = memberOf(ownerSel.value);
        const isLead = owner && owner.slack_user_id === lead?.slack_user_id;

          ? (isLead ? `<span class="lead-co">${esc(areaMeta(areaSel.value).full)} 리드</span>` : '')

        collabPicker.setExclude([ownerSel.value, ...co.map((l) => l.slack_user_id)].filter(Boolean));
      };

      const syncArea = () => {
        const area = areaSel.value;

      };
      areaSel.addEventListener('change', () => { syncArea(); syncLead(); });
      syncArea();
      syncLead();

      // 페이즈는 프로젝트에 딸린 값이라 프로젝트가 바뀔 때마다 다시 불러온다

          const list = await api.get(`/api/phases?project=${encodeURIComponent(pid)}`);

            list.map((ph) => `<option value="${esc(ph.id)}">${esc(ph.name)}</option>`).join(''));
          if (want && list.some((ph) => ph.id === want)) phaseSel.value = want;
        } catch { /* 페이즈를 못 불러와도 업무는 저장할 수 있다 */ }
      };
      projectSel.addEventListener('change', () => { delete phaseSel.dataset.want; syncPhases(); });

      // 납품 예정일을 넣으면 마감일 기본값으로 채운다

      const captureInput = root.querySelector('#capture-input');

      const runCapture = async () => {
        const text = captureInput.value.trim();
        if (!text) return;
        captureBtn.disabled = true;
        captureBtn.textContent = '읽는 중…';
        try {
          const r = await api.post('/api/ai/capture', { text });
          const f = r.fields;
          if (f.title) form.querySelector('[name=title]').value = f.title;
          if (f.project_id) form.querySelector('[name=project_id]').value = f.project_id;
          if (f.area) { areaSel.value = f.area; syncArea(); syncLead(); }
          if (f.due_date) dueInput.value = f.due_date;
          if (f.priority) form.querySelector('[name=priority]').value = f.priority;
          captureRes.hidden = false;
          captureRes.innerHTML = r.matched.length
            ? r.matched.map((m) => `<span class="tok">${esc(m.field)} <b>${esc(String(m.value))}</b></span>`).join('')
              + `<span class="tok">${r.source === 'llm' ? 'AI 해석' : '규칙 해석'}</span>`
            : '<span class="tok">인식된 항목이 없습니다. 아래에서 직접 입력해 주세요.</span>';
        } catch (err) {
          toast(err.message, true);
        }
        captureBtn.disabled = false;
        captureBtn.textContent = '채우기';
      };
      captureBtn?.addEventListener('click', runCapture);
      captureInput?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); runCapture(); }
      });

      root.querySelector('[data-save]').addEventListener('click', async () => {
        const fd = new FormData(form);
        const payload = Object.fromEntries([...fd.entries()].map(([k, v]) => [k, v === '' ? null : v]));
        payload.collaborators = collabPicker.value;

        if (!payload.title?.trim()) return toast('업무명을 입력해 주세요.', true);
        // 프로젝트는 비워 둬도 된다 — '프로젝트 미정'으로 들어간다
        if (!payload.owner_slack_user_id) return toast('담당을 골라 주세요.', true);
        // 마감일을 비우면 백로그로 들어간다 — 막지 않는다.
        // 외주만은 납품 예정일이 곧 마감이라 하나는 있어야 한다.
        if (payload.area === 'OUT' && !payload.due_date && !payload.delivery_due_date) {
          return toast('납품 예정일이나 마감일 중 하나는 입력해 주세요.', true);
        }

        try {
          const saved = editing
            ? await api.patch(`/api/tasks/${task.id}`, payload)
            : await api.post('/api/tasks', payload);
          // 등록한 업무가 지금 보고 있는 목록에 안 잡히면 그대로 사라진 것처럼 보인다.
          // 어디로 갔는지 말해 준다 — 목록을 마음대로 옮기는 것보다 이쪽이 덜 놀랍다.
          const landed = !saved.due_date ? '백로그'
            : saved.due_date.slice(0, 7) !== (state.today ?? '').slice(0, 7)
              ? `${Number(saved.due_date.slice(5, 7))}월` : null;
          toast(editing ? '업무를 저장했습니다.'
            : landed ? `업무를 등록했습니다 — ${landed}에 들어갔습니다.`
            : '업무를 등록했습니다.');
          const keepOpen = root.querySelector('#keep-open')?.checked;
          if (!editing && keepOpen) {
            close();
            taskForm({
              defaults: { project_id: payload.project_id, area: payload.area, owner: payload.owner_slack_user_id },
              onSaved,
            });
          } else {
            close();
          }
          onSaved?.(saved);
        } catch (err) {
          toast(err.message, true);
        }
      });
    },
  });
}

          <span class="lab">해결 목표일</span>

        <label class="field">
          <span class="lab">상태</span>
          <select name="status">${opts(state.meta.issue_statuses, issue?.status ?? 'OPEN')}</select>
        </label>
        <label class="field span2">
          <span class="lab">영향</span>
          <input type="text" name="impact" value="${esc(issue?.impact ?? '')}" placeholder="예: 콘텐츠 등록 일정 3일 지연 예상">
        </label>
      </div>
      <p class="hint" style="margin-top:12px">이슈 상태는 업무 상태와 분리해 관리합니다. 이슈를 해결해도 업무가 자동으로 완료되지 않습니다.</p>
    </form>`;

  modal({
    title: editing ? '이슈 수정' : '이슈 등록',
    body,
    footer: `<div class="right"><button class="btn" data-close>취소</button>
             <button class="btn btn-primary" data-save>${editing ? '저장' : '이슈 등록'}</button></div>`,
    wide: true,
    onMount({ root, close }) {
      const form = root.querySelector('#issue-form');
      const projectSel = form.querySelector('[name=project_id]');
      const taskSel = form.querySelector('[name=task_id]');

      const ownerPicker = memberPicker(form.querySelector('[data-owner-slot] .member-pick'), {
        multi: false,
        value: issue?.owner_slack_user_id ? [issue.owner_slack_user_id] : [state.me],
      });

      const loadTasks = async () => {
        const pid = projectSel.value;
        taskSel.innerHTML = '<option value="">연결 안 함</option>';
        if (!pid) return;
        const rows = await api.get(`/api/tasks?project=${encodeURIComponent(pid)}&done=1`);
        taskSel.innerHTML += rows.map((t) =>
          `<option value="${esc(t.id)}"${t.id === (issue?.task_id ?? defaults.task_id) ? ' selected' : ''}>${esc(t.title)}</option>`).join('');

        const fd = new FormData(form);
        const payload = Object.fromEntries([...fd.entries()].map(([k, v]) => [k, v === '' ? null : v]));

        if (!payload.project_id) return toast('관련 프로젝트를 선택해 주세요.', true);
        if (!payload.content?.trim()) return toast('이슈 내용을 입력해 주세요.', true);
        if (!payload.owner_slack_user_id) return toast('이슈 담당자를 지정해 주세요.', true);
        try {
          const saved = editing
            ? await api.patch(`/api/issues/${issue.id}`, payload)
            : await api.post('/api/issues', payload);
          toast(editing ? '이슈를 저장했습니다.' : '이슈를 등록했습니다.');
          close();
          onSaved?.(saved);
        } catch (err) {
          toast(err.message, true);
        }
      });
    },
  });
}

// ── 영역 리드 관리 ──────────────────────────────────────
// 공동 리드 한 줄: 사람 이름 + 그 사람이 함께 서는 영역 칩.
// 칩을 눌러 켜고 끈다. 아무 칩도 안 켜면 그 사람은 공동 리드가 아니다.
const coPersonRow = (m, areas = new Set()) => `
  <div class="co-person" data-co-person="${esc(m.slack_user_id)}">
    <div class="co-who">
      <span class="nm">${esc(m.display_name)}</span>
      <button type="button" class="lnk" data-co-all>전체</button>
      <button type="button" class="lnk" data-co-none>해제</button>
    </div>
    <div class="co-areas">
      ${state.meta.areas.map((a) => `
        <button type="button" class="co-chip${areas.has(a.code) ? ' on' : ''}"
                data-co-area="${esc(a.code)}" aria-pressed="${areas.has(a.code) ? 'true' : 'false'}">
          ${esc(a.label)}
        </button>`).join('')}
    </div>
  </div>`;

// 업무마다 사람을 고르는 대신 여기서 영역별 책임자를 정한다.
function areaLeadsForm({ onSaved }) {
  if (!openable(true)) return;
  const current = Object.fromEntries(
    state.areaLeads.filter((l) => (l.role ?? 'LEAD') === 'LEAD').map((l) => [l.area, l.slack_user_id]));
  // 공동 리드는 사람마다 서는 영역이 다르다 — 사람 → 영역 집합으로 들고 있는다
  const co = new Map();
  for (const l of state.areaLeads.filter((x) => x.role === 'CO')) {
    if (!co.has(l.slack_user_id)) co.set(l.slack_user_id, new Set());
    co.get(l.slack_user_id).add(l.area);
  }
  const people = activeMembers();

  const body = `
    <p class="hint" style="margin-bottom:14px">
      업무를 등록할 때 담당자를 따로 고르지 않습니다. 선택한 <b>업무 영역의 리드</b>가 담당이 됩니다.
      리드를 바꾸면 그 영역의 <b>미완료 업무</b> 담당도 함께 옮겨지고, 완료된 업무는 기록으로 남습니다.
    </p>
    <div class="lead-table">
      ${state.meta.areas.map((a) => `
        <div class="lead-row">
          <span class="lead-area">${esc(a.full)}</span>
          <select data-area="${esc(a.code)}">
            <option value="">지정 안 함</option>
            ${people.map((m) => `<option value="${esc(m.slack_user_id)}"${
              current[a.code] === m.slack_user_id ? ' selected' : ''}>${esc(m.display_name)}</option>`).join('')}
          </select>
        </div>`).join('')}
    </div>

    <h4 class="lead-h4">공동 리드</h4>
    <p class="hint" style="margin-bottom:10px">
      고른 영역의 리드 옆에 함께 섭니다. 담당은 지지 않습니다 —
      업무 담당은 위의 대표 리드 그대로입니다.
    </p>
    <div class="co-people">${people.map((m) => coPersonRow(m, co.get(m.slack_user_id))).join('')}</div>`;

  modal({
    title: '영역 리드',
    body,
    footer: `<div class="right"><button class="btn" data-close>취소</button>
             <button class="btn btn-primary" data-save>저장</button></div>`,
    onMount({ root, close }) {
      // 칩 켜고 끄기 — 대표로 세운 영역은 공동으로 또 설 수 없으니 눌러도 꺼 둔다
      root.addEventListener('click', (e) => {
        const chip = e.target.closest('.co-chip');
        if (chip) {
          const on = chip.classList.toggle('on');
          chip.setAttribute('aria-pressed', on ? 'true' : 'false');
          return;
        }
        const all = e.target.closest('[data-co-all]');
        const none = e.target.closest('[data-co-none]');
        if (!all && !none) return;
        const row = (all ?? none).closest('[data-co-person]');
        for (const c of row.querySelectorAll('.co-chip')) {
          c.classList.toggle('on', Boolean(all));
          c.setAttribute('aria-pressed', all ? 'true' : 'false');
        }
      });

      root.querySelector('[data-save]').addEventListener('click', async () => {
        const leads = [...root.querySelectorAll('[data-area]')]
          .filter((sel) => sel.value)
          .map((sel) => ({ area: sel.dataset.area, slack_user_id: sel.value }));
        if (!leads.length) return toast('리드를 한 명 이상 지정해 주세요.', true);
        const coRows = [...root.querySelectorAll('[data-co-person]')].flatMap((row) =>
          [...row.querySelectorAll('.co-chip.on')].map((c) => ({
            area: c.dataset.coArea, slack_user_id: row.dataset.coPerson,
          })));
        try {
          const result = await api.patch('/api/area-leads', { leads });
          // 대표를 먼저 세우고 공동을 쓴다 — 대표와 겹치는 사람은 서버가 걸러 낸다
          await api.patch('/api/area-leads/co', { rows: coRows });
          const moved = result.reduce((n, r) => n + (r.moved ?? 0), 0);
          toast(moved ? `영역 리드를 저장했습니다. 업무 ${moved}건의 담당이 함께 바뀌었습니다.` : '영역 리드를 저장했습니다.');
          close();
          onSaved?.();
        } catch (err) {
          toast(err.message, true);
        }
      });
    },
  });
}

// ── 페이즈 ──────────────────────────────────────────────
// 기간을 비워 두면 그 페이즈에 속한 업무 일정에서 자동으로 유도된다.

      <div class="form-grid">
        <label class="field span2">
          <span class="lab">페이즈 이름<span class="req">*</span></span>

          <span class="lab">시작일</span>
          <input type="date" name="start_date" value="${esc(phase?.start_date ?? '')}">
        </label>
        <label class="field">
          <span class="lab">종료일</span>
          <input type="date" name="end_date" value="${esc(phase?.end_date ?? '')}">

        <p class="hint span2">기간을 비워 두면 이 페이즈에 속한 업무의 시작·마감으로 자동 계산합니다.</p>

      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" data-save>${editing ? '저장' : '추가'}</button></div>`,
    onMount({ root, close }) {
      const form = root.querySelector('#phase-form');
      root.querySelector('[data-remove]')?.addEventListener('click', async () => {

          toast('페이즈를 삭제했습니다.');
          close();
          onSaved?.();
        } catch (err) { toast(err.message, true); }
      });
      root.querySelector('[data-save]').addEventListener('click', async () => {
        const fd = new FormData(form);
        const payload = Object.fromEntries([...fd.entries()].map(([k, v]) => [k, v === '' ? null : v]));

          close();
          onSaved?.();
        } catch (err) { toast(err.message, true); }
      });
    },
  });
}

      ${editing ? '<button class="btn btn-danger" data-remove>삭제</button>' : ''}
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" data-save>${editing ? '저장' : '추가'}</button></div>`,
    onMount({ root, close }) {
      const form = root.querySelector('#milestone-form');
      root.querySelector('[data-remove]')?.addEventListener('click', async () => {
        const ok = await confirmModal('마일스톤을 삭제할까요?', { danger: true });
        if (!ok) return;
        try {
          await api.del(`/api/milestones/${milestone.id}`);
          toast('마일스톤을 삭제했습니다.');
          close();
          onSaved?.();
        } catch (err) { toast(err.message, true); }
      });
      root.querySelector('[data-save]').addEventListener('click', async () => {
        const fd = new FormData(form);
        const payload = {
          name: fd.get('name'),
          due_date: fd.get('due_date') || null,
          phase_id: fd.get('phase_id') || null,
          project_id: pid,
        };
        if (editing) payload.done = form.querySelector('[name=done]').checked;
        if (!payload.name?.trim()) return toast('마일스톤 이름을 입력해 주세요.', true);
        if (!payload.due_date) return toast('날짜를 입력해 주세요.', true);
        try {
          await (editing ? api.patch(`/api/milestones/${milestone.id}`, payload) : api.post('/api/milestones', payload));
          toast(editing ? '마일스톤을 저장했습니다.' : '마일스톤을 추가했습니다.');
          close();
          onSaved?.();
        } catch (err) { toast(err.message, true); }
      });
    },
  });
}

// ── 경비 ────────────────────────────────────────────────
// 실비만 다룬다. 요율·인건비는 넣지 않는다 (docs/13-time-invoice-spec.md).
function expenseForm({ defaults = {}, onSaved }) {
  if (!openable(true)) return;
  const cats = state.meta?.expense_categories ?? [];
  const body = `
    <form id="expense-form">
      <div class="form-grid">
        <label class="field">
          <span class="lab">프로젝트<span class="req">*</span></span>
          <select name="project_id" required>
            <option value="">선택</option>
            ${opts(activeProjects(), defaults.project_id ?? defaultProjectId(), { value: 'id', label: 'name' })}
          </select>
        </label>
        <label class="field">
          <span class="lab">사용일<span class="req">*</span></span>
          <input type="date" name="spent_on" required value="${esc(defaults.spent_on ?? state.today ?? '')}">
        </label>
        <label class="field">
          <span class="lab">분류<span class="req">*</span></span>
          <select name="category" required>${opts(cats, defaults.category ?? 'TRANSPORT')}</select>
        </label>
        <label class="field">
          <span class="lab">금액(원)<span class="req">*</span></span>
          <input type="text" name="amount" inputmode="numeric" required placeholder="예: 18400">
        </label>
        <label class="field span2">
          <span class="lab">연결 업무</span>
          <select name="task_id"><option value="">지정 안 함</option></select>
          <span class="hint">프로젝트를 고르면 내 업무 목록이 채워집니다.</span>
        </label>
        <label class="field span2">
          <span class="lab">메모</span>
          <input type="text" name="memo" maxlength="120" placeholder="예: 파일럿 어린이집 방문 인터뷰">
        </label>
      </div>
    </form>`;

  modal({
    title: '경비 등록',
    body,
    footer: `<div class="right">
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" data-save>등록</button></div>`,
    onMount({ root, close }) {
      const form = root.querySelector('#expense-form');
      const taskSel = form.querySelector('[name=task_id]');

      const loadTasks = async () => {
        const pid = form.querySelector('[name=project_id]').value;
        taskSel.innerHTML = '<option value="">지정 안 함</option>';
        if (!pid) return;
        try {
          const rows = await api.get(`/api/tasks?project=${encodeURIComponent(pid)}&done=1`);
          taskSel.insertAdjacentHTML('beforeend',
            rows.map((t) => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join(''));
          if (defaults.task_id) taskSel.value = defaults.task_id;
        } catch { /* 업무를 못 불러와도 경비는 등록할 수 있다 */ }
      };
      form.querySelector('[name=project_id]').addEventListener('change', loadTasks);
      loadTasks();

      root.querySelector('[data-save]').addEventListener('click', async () => {
        const fd = new FormData(form);
        const amount = Number(String(fd.get('amount')).replace(/[,\s원]/g, ''));
        if (!fd.get('project_id')) return toast('프로젝트를 선택해 주세요.', true);
        if (!fd.get('spent_on')) return toast('사용일을 입력해 주세요.', true);
        if (!Number.isFinite(amount) || amount <= 0) return toast('금액을 0보다 큰 숫자로 입력해 주세요.', true);
        try {
          await api.post('/api/expenses', {
            project_id: fd.get('project_id'),
            task_id: fd.get('task_id') || null,
            spent_on: fd.get('spent_on'),
            category: fd.get('category'),
            amount,
            memo: fd.get('memo') || null,
          });
          toast('경비를 등록했습니다.');
          close();
          onSaved?.();
        } catch (err) { toast(err.message, true); }
      });
    },
  });
}




const SEV_LABEL = { high: '높음', medium: '보통', low: '낮음' };

// 한눈에 볼 수 있는 만큼만 펼쳐 둔다. 나머지는 접어 두되 몇 건인지는 알려준다.
const VISIBLE = 3;

/** 위험 신호 섹션 마크업. 근거가 되는 업무·이슈로 바로 이동할 수 있어야 한다. */
function riskSection(rows, { source = 'rules' } = {}) {
  const head = `
    <div class="section-head">
      <h2>위험 신호</h2>
      <span class="meta">
        <span class="src-tag ${source === 'llm' ? 'llm' : ''}">${source === 'llm' ? 'AI' : '규칙'}</span>
        데이터에서 자동으로 찾아냅니다
      </span>
    </div>`;

  if (!rows.length) {
    return `<section class="section">${head}
      <div class="risks-ok"><b>지금 눈에 띄는 위험 신호가 없습니다.</b>
        마감이 반복해서 밀리거나, 진행이 멈추거나, 납품이 임박한 업무가 생기면 여기에 표시됩니다.</div>
    </section>`;
  }

  const card = (r) => `
        <article class="risk ${esc(r.severity)}">
          <div class="head">
            <span class="sev">${esc(SEV_LABEL[r.severity] ?? r.severity)}</span>
            <h3>${esc(r.title)}</h3>
            <span class="cnt">${r.count}건</span>
          </div>
          <p class="detail">${esc(r.detail)}</p>
          <ul>
            ${r.items.slice(0, 5).map((i) => {
              const inner = `
                <span class="lbl">${esc(i.label)}</span>
                <span class="sub">${esc(i.sub ?? '')}</span>
                <span class="note">${esc(i.note ?? '')}</span>`;
              const target = i.kind === 'task' ? `#/project/tasks/${i.id}`
                : i.kind === 'issue' ? `#/project/issues/${i.id}`
                : i.kind === 'owner' ? `#/project/tasks?owner=${encodeURIComponent(i.id)}&done=1`
                : i.kind === 'project' ? `#/project/tasks?project=${encodeURIComponent(i.id)}&done=1`
                : i.kind === 'area' ? `#/project/tasks?area=${encodeURIComponent(i.id)}&done=1`
                : null;
              return `<li>${target
                ? `<button type="button" data-jump="${esc(target)}">${inner}</button>`
                : `<span class="static">${inner}</span>`}</li>`;
            }).join('')}
            ${r.items.length > 5
              ? `<li><span class="static"><span class="sub">외 ${r.items.length - 5}건</span></span></li>` : ''}
          </ul>
        </article>`;

  const shown = rows.slice(0, VISIBLE);
  const hidden = rows.slice(VISIBLE);

  return `<section class="section">${head}
    <div class="risks">
      ${shown.map(card).join('')}
      ${hidden.length ? `
        <div class="risks-more" hidden>${hidden.map(card).join('')}</div>
        <button class="btn risks-toggle" data-more aria-expanded="false">
          위험 신호 ${hidden.length}건 더 보기
        </button>` : ''}
    </div>
  </section>`;
}








// ── 보드 지도 ───────────────────────────────────────────
// 업무 하나가 타일 하나다. 이 화면에서 유일한 그래프이고, 보드 자체를 그린 것이다.
//
// 무엇을 무엇으로 나타내는가 — 채널을 하나씩만 쓴다.
//   가로 위치(열) = 진행 단계   대기 → 진행중 → 검토 → 완료
//   타일 색       = 프로젝트    (4칸 팔레트, 대비·색각 검증을 통과한 값)
//   테두리 빨강   = 지연        상태색은 지연에만 쓴다. 범례와 툴팁이 말로도 알려 준다
//   타일 개수     = 업무 수     넓이가 아니라 개수다. 하나가 하나다
//
// 색만으로 구분하게 두지 않는다: 열 머리에 개수가 적혀 있고, 같은 프로젝트끼리
// 붙여 두며, 아래 범례와 타일 툴팁이 이름을 말한다.

const BOARD_STAGES = [
  { key: 'WAIT',     label: '대기',   jump: '#/project/tasks?stage=WAIT' },
  { key: 'PROGRESS', label: '진행중', jump: '#/project/tasks?stage=IN_PROGRESS' },
  { key: 'REVIEW',   label: '검토',   jump: '#/project/tasks?stage=REVIEW' },
  { key: 'DONE',     label: '완료',   jump: '#/project/tasks?stage=DONE&done=1' },
];
const BOARD_COLUMN_CAP = 72;   // 한 열에 이보다 많으면 접고 개수만 알린다

function boardMap(ov) {
  const used = ov.projects.filter((p) => p.count > 0);
  let i = 0;   // 등장 순서 — 타일이 차례로 나타나는 효과에만 쓴다

  const column = (st) => {
    const rows = ov.board.filter((t) => t.stage === st.key);
    const total = ov.summary.total
      ? { WAIT: ov.summary.total - ov.summary.in_progress - ov.summary.review - ov.summary.done,
          PROGRESS: ov.summary.in_progress, REVIEW: ov.summary.review, DONE: ov.summary.done }[st.key]
      : 0;
    const shown = rows.slice(0, BOARD_COLUMN_CAP);
    const hidden = Math.max(total - shown.length, 0);

    return `
      <div class="bm-col">
        <button class="bm-head" data-jump="${esc(st.jump)}">
          <span class="bm-stage">${esc(st.label)}</span>
          <span class="bm-count">${total}</span>
        </button>
        <div class="bm-tiles">
          ${shown.map((t) => {
            i += 1;
            const tip = `<b>${esc(t.title)}</b><br><span class="tip-sub">${esc(projectLabel(t.project_name))} · ${esc(t.owner_name)}`
              + `${t.due_date ? ` · ${esc(shortDate(t.due_date))}` : ''}</span>`
              + `${t.is_delayed ? '<br>⚠ 지연' : ''}${t.has_open_issue ? '<br>🔥 이슈' : ''}`;
            return `<button class="bm-tile${t.is_delayed ? ' late' : ''}"
                      style="${projectStyle(t.project_id)};--i:${i}"
                      data-jump="#/project/tasks/${esc(t.id)}" data-tip="${esc(tip)}"
                      aria-label="${esc(`${t.title} — ${t.project_name}${t.is_delayed ? ' 지연' : ''}`)}"></button>`;
          }).join('')}
          ${hidden ? `<span class="bm-rest">+${hidden}</span>` : ''}
        </div>
      </div>`;
  };

  return `
    <section class="boardmap">
      <div class="bm-top">
        <div class="bm-figure">
          <div class="bm-num">${pctText(ov.progress)}</div>
          <div class="bm-cap">전체 진행률 · 업무 ${ov.summary.total}건</div>
        </div>
        <div class="bm-alerts">
          <button class="bm-alert ${ov.summary.delayed ? 'on' : ''}" data-jump="delayed">
            <span class="k">지연</span><span class="v">${ov.summary.delayed}</span>
          </button>
          <button class="bm-alert warn ${ov.summary.issues ? 'on' : ''}" data-jump="issues">
            <span class="k">이슈</span><span class="v">${ov.summary.issues}</span>
          </button>
        </div>
      </div>

      <div class="bm-grid">${BOARD_STAGES.map(column).join('')}</div>

      <div class="bm-legend">
        ${used.map((p) => `<span class="bm-key" style="${projectStyle(p.id)}"><i class="sw"></i>${esc(p.name)}</span>`).join('')}
        <span class="bm-key late"><i class="sw"></i>지연</span>
        <span class="bm-note">타일 하나 = 업무 하나 · 누르면 그 업무로</span>
      </div>
    </section>`;
}

              ${ov.outsourcing.delayed_rows.map((r) => `
                <tr class="row-click" data-jump="#/project/tasks/${esc(r.id)}">

                  <td>${esc(r.vendor_name ?? '-')}</td>
                  <td>${esc(r.owner_name)}</td>
                  <td class="nowrap num">${shortDate(r.delivery_due_date)}</td>
                  <td class="nowrap num" style="color:var(--s-delay)">${r.days_late}일</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>` : ''}
    </section>`;

  hoverTip(root);

  const jumps = {
    all: '#/project/tasks?done=1',
    progress: '#/project/tasks?stage=IN_PROGRESS',
    review: '#/project/tasks?stage=REVIEW',
    done: '#/project/tasks?stage=DONE&done=1',
    delayed: '#/project/tasks?delayed=1',
    issues: '#/project/issues',
  };

  root.addEventListener('click', (e) => {
    const more = e.target.closest('[data-more]');
    if (more) {
      const box = root.querySelector('.risks-more');
      const open = box.hidden;
      box.hidden = !open;
      more.setAttribute('aria-expanded', String(open));
      more.textContent = open ? '접기' : `위험 신호 ${box.children.length}건 더 보기`;
      return;
    }
    const el = e.target.closest('[data-jump]');
    if (el) {
      const key = el.dataset.jump;
      go(jumps[key] ?? key);
      return;
    }
    if (e.target.closest('[data-new-project]')) projectForm({ onSaved: () => window.dispatchEvent(new Event('kf:reload')) });
    else if (e.target.closest('[data-area-leads]')) areaLeadsForm({ onSaved: () => window.dispatchEvent(new Event('kf:reload')) });
  });
}







// 업무 화면은 "언제까지 무엇을" 보는 곳이다.
// 그래서 마감이 맨 앞이고, 기본 정렬도 마감일 순이다.
// 묶음은 프로젝트 › 영역 › 업무 — 영역이 곧 담당이라 이 층이 책임 단위가 된다.

const QUICK = [
  { key: 'mine',    label: '내 영역 업무', params: { owner: 'me' } },
  { key: 'progress',label: '진행중',       params: { stage: 'IN_PROGRESS' } },
  { key: 'review',  label: '검토',         params: { stage: 'REVIEW' } },
  { key: 'delayed', label: '지연',         params: { delayed: '1' } },
  { key: 'issue',   label: '이슈 있음',    params: { issue: '1' } },
  { key: 'out',     label: '외주 작업',    params: { area: 'OUT' } },
];

const PR_TONE = { HIGH: 'pr-high', NORMAL: 'pr-normal', LOW: 'pr-low' };

// 프로젝트를 보여 주는 순서. 이 브라우저에만 남는다 —
// 서버의 sort_order 는 건드리지 않는다. 그 값이 프로젝트 색을 정하기 때문에,
// 여기서 순서를 바꿔도 색은 그대로다 (색은 프로젝트를 따라가지 등수를 따라가지 않는다).
const PROJ_KEY = 'kf.projOrder';
const readProjOrder = () => (readPref(PROJ_KEY) || '').split(',').filter(Boolean);

// 업무 차례도 같은 규칙이다. 기본은 마감일 순이고, 끌어서 바꾼 것만 기억한다.
// 한 번도 안 끈 업무는 마감일 순 그대로 뒤에 붙는다 — 새 업무가 끼어들어도 제자리를 찾는다.
const TASK_KEY = 'kf.taskOrder';
const readTaskOrder = () => (readPref(TASK_KEY) || '').split(',').filter(Boolean);
const monthLabel = (m) => `${Number(m.slice(5, 7))}월`;
const monthEndDay = (m) => {
  const [y, mm] = m.split('-').map(Number);
  return new Date(Date.UTC(y, mm, 0)).toISOString().slice(0, 10);
};

const matchesQuick = (p, quick) =>
  Object.entries(quick.params).every(([k, v]) => p.get(k) === v);

async function renderTasks(root, query) {
  const p = new URLSearchParams(query);
  root.innerHTML = loading();

  // month=all 은 "달을 안 고름"이라는 뜻이다. 파라미터가 아예 없는 것과 구별해야
  // 전체를 눌렀을 때 이번 달로 다시 튕기지 않는다.
  const rawMonth = p.get('month');
  const backlog = rawMonth === 'backlog';
  const month = rawMonth && rawMonth !== 'all' && !backlog ? rawMonth : null;
  // 방금 등록한 업무를 짚어 주기 위한 표시. 조건이 아니므로 여기서 떼어 낸다 —
  // 그래야 서버에도 안 가고, 달을 다시 고를 때 따라붙지도 않는다.
  const justMade = p.get('new');
  p.delete('new');
  const ask = new URLSearchParams(p);
  if (ask.get('month') === 'all') ask.delete('month');
  // 백로그는 달이 아니다 — 달 자리에 얹어 두고 서버에는 따로 알린다
  if (backlog) { ask.delete('month'); ask.set('backlog', '1'); }

  let rows;
  let months;
  let backlogCount = 0;
  try {
    let backlogRows;
    [months, rows, backlogRows] = await Promise.all([
      api.get('/api/task-months'),
      api.get(`/api/tasks?${ask.toString()}`),
      api.get('/api/tasks?backlog=1&done=1'),
    ]);
    backlogCount = backlogRows.length;
  } catch (err) {
    root.innerHTML = errorBox(err.message);
    return;
  }

  // 아무 조건 없이 들어오면 이번 달부터 보여 준다 — 대개 그걸 보러 온다
  if (![...p.keys()].length && months.length && !backlog) {
    const now = (state.today ?? '').slice(0, 7);
    const pick = months.find((m) => m.month === now) ?? months[0];
    go(`#/project/tasks?month=${pick.month}`);
    return;
  }

  const setParam = (patch) => {
    const next = new URLSearchParams(p);
    for (const [k, v] of Object.entries(patch)) {
      if (v === null || v === undefined || v === '') next.delete(k);
      else next.set(k, v);
    }
    go(`#/project/tasks${next.toString() ? `?${next.toString()}` : ''}`);
  };

  // 프로젝트 › 영역 순으로 묶는다. 각 묶음 안은 서버가 준 마감일 순 그대로.
  // 프로젝트 차례는 저장해 둔 순서를 먼저 따르고, 모르는 것은 서버 순서로 뒤에 붙인다.
  const saved = readProjOrder();
  const ordered = [
    ...saved.map((id) => state.projects.find((pr) => pr.id === id)).filter(Boolean),
    ...state.projects.filter((pr) => !saved.includes(pr.id)),
  ];

  const savedTasks = readTaskOrder();
  const rank = new Map(savedTasks.map((id, i) => [id, i]));
  // 정한 차례가 먼저, 나머지는 받은 순서(마감일 순) 그대로. sort 가 안정적이라 뒤쪽은 안 흔들린다.
  const byRank = (a, b) => {
    const ra = rank.has(a.id) ? rank.get(a.id) : Infinity;
    const rb = rank.has(b.id) ? rank.get(b.id) : Infinity;
    return ra === rb ? 0 : ra - rb;
  };

  const NO_PROJECT = { id: '', name: '프로젝트 미정', task_count: 0 };
  const groups = [];
  // 프로젝트를 아직 안 정한 업무 — 맨 앞에 둔다. 자리를 못 잡은 일이라 먼저 보여야 한다.
  const loose = rows.filter((t) => !t.project_id);
  if (loose.length) {
    const areas = [];
    for (const a of state.meta.areas) {
      const inArea = loose.filter((t) => t.area === a.code);
      if (inArea.length) areas.push({ area: a, rows: rank.size ? inArea.sort(byRank) : inArea });
    }
    groups.push({ project: NO_PROJECT, count: loose.length, areas, loose: true });
  }
  for (const pr of ordered) {
    const mine = rows.filter((t) => t.project_id === pr.id);
    // 업무가 아직 하나도 없는 프로젝트도 보여 준다. 안 보이면 방금 만든 프로젝트가
    // 사라진 것처럼 보인다. 조건에 안 걸린 것뿐인 프로젝트는 접어 둔다.
    if (!mine.length && pr.task_count) continue;
    const areas = [];
    for (const a of state.meta.areas) {
      const inArea = mine.filter((t) => t.area === a.code);
      if (inArea.length) areas.push({ area: a, rows: rank.size ? inArea.sort(byRank) : inArea });
    }
    groups.push({ project: pr, count: mine.length, areas });
  }
  const manual = rows.some((t) => rank.has(t.id));

  const projectOptions = activeProjects()
    .map((pr) => `<option value="${esc(pr.id)}"${p.get('project') === pr.id ? ' selected' : ''}>${esc(pr.name)}</option>`).join('');
  const areaOptions = state.meta.areas
    .map((a) => `<option value="${esc(a.code)}"${p.get('area') === a.code ? ' selected' : ''}>${esc(a.full)}</option>`).join('');
  const ownerOptions = state.members
    .map((m) => `<option value="${esc(m.slack_user_id)}"${p.get('owner') === m.slack_user_id ? ' selected' : ''}>${esc(m.display_name)}${m.is_active ? '' : ' (비활성)'}</option>`).join('');

  const taskRow = (t) => `
    <div class="tk-row" data-open="${esc(t.id)}" tabindex="0" role="button">
      <span class="tk-grip" aria-hidden="true" title="끌어서 차례를 바꿉니다">⠿</span>
      <span class="tk-due num ${t.is_delayed ? 'late' : ''}">${dueCell(t)}</span>
      <span class="tk-title">
        ${titleCell(t)}
        ${flags(t)}${t.subtask_total
          ? `<i class="tk-sub${t.subtask_done === t.subtask_total ? ' all' : ''}">${t.subtask_done}/${t.subtask_total}</i>` : ''}</span>
      <span class="tk-pr ${PR_TONE[t.priority] ?? ''}">${esc(
        (state.meta.priorities.find((x) => x.code === t.priority) ?? {}).label ?? t.priority)}</span>
      <span class="tk-owner">${person(t.owner_slack_user_id, t.owner_name)}</span>
      <span class="tk-status">
        <select class="status-select" data-status="${esc(t.id)}" data-area="${esc(t.area)}" aria-label="상태 변경">
          ${(t.area === 'OUT' ? state.meta.out_statuses : state.meta.normal_statuses)
            .map((s) => `<option value="${esc(s.code)}"${s.code === t.status ? ' selected' : ''}>${esc(s.label)}</option>`).join('')}
        </select>
      </span>
      <span class="tk-issue">${t.has_open_issue
        ? `<span class="flag issue" title="이슈 ${t.open_issue_count}건">🔥 ${t.open_issue_count}</span>` : ''}</span>
      <button class="tk-del" data-del="${esc(t.id)}" aria-label="업무 삭제" title="삭제">×</button>
    </div>`;

  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1>업무</h1>
        <div class="sub">${backlog ? '백로그 ' : month ? `${monthLabel(month)} ` : ''}${rows.length}건 · ${
          backlog ? '마감일을 아직 안 정한 업무' : manual ? '직접 정한 차례' : '마감일 순'
        } · 담당은 업무 영역의 리드가 맡습니다</div>
      </div>
      <div class="page-actions">
        <button class="btn" data-new-project>+ 프로젝트</button>
        <button class="btn btn-primary" data-new-task>+ 업무 등록</button>
      </div>
    </div>

    <div class="months" role="group" aria-label="월 선택">
      <button data-month="all" class="${month || backlog ? '' : 'on'}">전체 <b>${months.reduce((n, m) => n + m.count, 0)}</b></button>
      ${months.map((m) => `
        <button data-month="${esc(m.month)}" class="${m.month === month ? 'on' : ''}">
          ${monthLabel(m.month)} <b>${m.count}</b>${m.delayed ? `<i class="late">지연 ${m.delayed}</i>` : ''}
        </button>`).join('')}
      <button data-month="backlog" class="bl ${backlog ? 'on' : ''}" title="마감일을 아직 안 정한 업무">
        백로그${backlogCount ? ` <b>${backlogCount}</b>` : ''}
      </button>
    </div>

    <div class="filters">
      <div class="quick">
        ${QUICK.map((q) => `<button data-quick="${q.key}" class="${matchesQuick(p, q) ? 'on' : ''}">${esc(q.label)}</button>`).join('')}
      </div>
    </div>

    <div class="filter-row" style="margin-bottom:18px">
      <select data-f="project"><option value="">프로젝트 전체</option>${projectOptions}</select>
      <select data-f="area"><option value="">영역 전체</option>${areaOptions}</select>
      <select data-f="owner"><option value="">리드 전체</option><option value="me"${p.get('owner') === 'me' ? ' selected' : ''}>나</option>${ownerOptions}</select>
      <input type="search" data-f="q" value="${esc(p.get('q') ?? '')}" placeholder="업무명 검색">
      <label class="chk"><input type="checkbox" data-f="done" ${p.get('done') === '1' ? 'checked' : ''}> 완료 포함</label>
      <button class="btn btn-ghost" data-reset>필터 초기화</button>
      ${manual ? '<button class="btn btn-ghost" data-order-reset>마감일 순으로</button>' : ''}
    </div>

    ${groups.length ? groups.map((g) => `
      <section class="tk-project${g.loose ? ' loose' : ''}" data-project="${esc(g.project.id)}"
               style="${projectStyle(g.project.id)}">
        <div class="tk-project-head"${g.loose ? '' : ' title="끌어서 프로젝트 차례를 바꿉니다"'}>
          ${g.loose ? '' : '<span class="grip" aria-hidden="true">⠿</span>'}
          <h2>${g.loose ? esc(g.project.name) : projectName(g.project.id, g.project.name)}</h2>
          ${g.loose ? '<span class="hint">업무를 열어 프로젝트를 정해 주세요</span>'
            : `<button class="pr-edit" data-edit-project="${esc(g.project.id)}"
                  aria-label="프로젝트 수정" title="프로젝트 수정">✎</button>`}
          <span class="n">${g.count}건</span>
        </div>
        ${g.areas.length ? '' : `
          <div class="tk-empty-project">
            아직 업무가 없습니다.
            <button class="btn btn-ghost" data-new-task data-project="${esc(g.project.id)}">+ 업무 등록</button>
          </div>`}
        ${g.areas.map((a) => `
          <div class="tk-area">
            <div class="tk-area-head">
              <a class="lab" href="#/project/tasks?area=${encodeURIComponent(a.area.code)}&month=all&done=1"
                 title="${esc(a.area.full)} 업무 전체 보기">${esc(a.area.full)}</a>
              <span class="n">${a.rows.length}건</span>
              <span class="lead">${esc(leadNames(a.area.code))}</span>
            </div>
            <div class="tk-rows">${a.rows.map(taskRow).join('')}</div>
          </div>`).join('')}
      </section>`).join('') : empty({
        title: backlog ? '백로그가 비어 있습니다'
          : month ? `${monthLabel(month)}에 마감인 업무가 없습니다` : '조건에 맞는 업무가 없습니다',
        hint: backlog ? '업무를 등록할 때 마감일을 비우면 여기로 들어옵니다.' : '월을 바꾸거나 필터를 초기화해 보세요.',
        action: '<button class="btn btn-primary" data-new-task>+ 업무 등록</button>',
      })}`;

  const reload = () => window.dispatchEvent(new Event('kf:reload'));

  // ── 프로젝트 차례 바꾸기 ──────────────────────────────
  // 머리를 잡고 위아래로 끈다. 마우스·터치 같은 코드로 받는다.
  (function enableProjectDrag() {
    let key = null;
    let moved = false;
    let startY = 0;
    // 프로젝트 미정 묶음은 차례가 없다 — 끌기에서 뺀다
    const sections = () => [...root.querySelectorAll('.tk-project:not(.loose)')];
    const order = () => sections().map((el) => el.dataset.project);

    root.addEventListener('pointerdown', (e) => {
      const head = e.target.closest('.tk-project-head');
      if (!head || head.closest('.tk-project.loose')) return;
      if (e.target.closest('button')) return;   // 단추는 눌리는 것이지 끌리는 것이 아니다
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      key = head.closest('.tk-project').dataset.project;
      moved = false;
      startY = e.clientY;
      head.setPointerCapture?.(e.pointerId);
    });

    root.addEventListener('pointermove', (e) => {
      if (!key) return;
      if (!moved && Math.abs(e.clientY - startY) < 8) return;
      moved = true;
      const el = root.querySelector(`.tk-project[data-project="${key}"]`);
      if (!el) return;
      el.classList.add('dragging');
      // 커서가 올라간 다른 프로젝트와 자리를 맞바꾼다. 다시 그리면 끌기가 끊기므로 DOM 만 옮긴다.
      const over = sections().find((n) => {
        if (n === el) return false;
        const r = n.getBoundingClientRect();
        return e.clientY >= r.top && e.clientY <= r.bottom;
      });
      if (!over) return;
      const mid = over.getBoundingClientRect().top + over.getBoundingClientRect().height / 2;
      if (e.clientY < mid) over.before(el); else over.after(el);
    });

    const end = () => {
      if (!key) return;
      root.querySelector(`.tk-project[data-project="${key}"]`)?.classList.remove('dragging');
      if (moved) {
        writePref(PROJ_KEY, order().join(','));
        toast('프로젝트 차례를 저장했습니다.');
      }
      key = null;
    };
    root.addEventListener('pointerup', end);
    root.addEventListener('pointercancel', end);
    // 끌어서 놓은 것이면 눌린 것으로 치지 않는다
    root.addEventListener('click', (e) => {
      if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
    }, true);
  }());

  // ── 업무 차례 바꾸기 ──────────────────────────────────
  // 손잡이를 잡고 위아래로 끈다. 같은 영역 안에서만 움직인다 —
  // 영역을 넘기면 담당이 바뀌는 것이라, 그건 끌기가 아니라 수정으로 해야 한다.
  (function enableTaskDrag() {
    let id = null;
    let box = null;
    let moved = false;
    let startY = 0;
    const rowsOf = () => [...box.querySelectorAll(':scope > .tk-row')];

    root.addEventListener('pointerdown', (e) => {
      const grip = e.target.closest('.tk-grip');
      if (!grip || (e.pointerType === 'mouse' && e.button !== 0)) return;
      const row = grip.closest('.tk-row');
      id = row.dataset.open;
      box = row.parentElement;
      moved = false;
      startY = e.clientY;
      grip.setPointerCapture?.(e.pointerId);
    });

    // 자리를 바꾼 줄들이 미끄러져 움직이게 한다.
    // 옮기기 전 위치를 재 두고, 옮긴 뒤 그만큼 되돌려 놓았다가 원래 자리로 보낸다.
    const slide = (move) => {
      const rows = rowsOf();
      const before = new Map(rows.map((n) => [n, n.getBoundingClientRect().top]));
      move();
      for (const n of rows) {
        if (n.classList.contains('dragging')) continue;   // 잡고 있는 줄은 손가락을 따라간다
        const delta = before.get(n) - n.getBoundingClientRect().top;
        if (!delta) continue;
        n.style.transition = 'none';
        n.style.transform = `translateY(${delta}px)`;
        void n.offsetHeight;   // 여기서 시작 위치를 확정한다. 다음 프레임을 기다리면
                               // 화면이 멈춘 탭에서는 줄이 어긋난 채로 남는다.
        n.style.transition = 'transform .16s ease';
        n.style.transform = '';
      }
    };

    root.addEventListener('pointermove', (e) => {
      if (!id) return;
      if (!moved && Math.abs(e.clientY - startY) < 8) return;
      if (!moved) {
        moved = true;
        box.classList.add('dragging-box');   // 끄는 동안 글자가 선택되지 않게
      }
      const el = box.querySelector(`.tk-row[data-open="${id}"]`);
      if (!el) return;
      el.classList.add('dragging');
      // 다시 그리면 끌기가 끊긴다 — DOM 만 옮기고 저장은 놓을 때 한 번 한다
      const over = rowsOf().find((n) => {
        if (n === el) return false;
        const r = n.getBoundingClientRect();
        return e.clientY >= r.top && e.clientY <= r.bottom;
      });
      if (!over) return;
      const r = over.getBoundingClientRect();
      const after = e.clientY >= r.top + r.height / 2;
      // 이미 그 자리면 건드리지 않는다 (놔둬야 떨림이 없다)
      if ((after ? over.nextElementSibling : over.previousElementSibling) === el) return;
      slide(() => { if (after) over.after(el); else over.before(el); });
    });

    const end = () => {
      if (!id) return;
      const el = box.querySelector(`.tk-row[data-open="${id}"]`);
      el?.classList.remove('dragging');
      box.classList.remove('dragging-box');
      if (moved && el) {
        // 어디에 놓였는지 한 번 짚어 준다
        el.classList.add('landed');
        setTimeout(() => el.classList.remove('landed'), 700);
      }
      if (moved) {
        // 이 영역의 차례만 새로 쓴다. 다른 영역에서 정해 둔 차례는 그대로 둔다.
        const here = rowsOf().map((n) => n.dataset.open);
        const rest = readTaskOrder().filter((x) => !here.includes(x));
        writePref(TASK_KEY, [...rest, ...here].join(','));
        toast('업무 차례를 저장했습니다.');
      }
      id = null;
      box = null;
    };
    root.addEventListener('pointerup', end);
    root.addEventListener('pointercancel', end);
    root.addEventListener('click', (e) => {
      if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
    }, true);
  }());

  root.addEventListener('click', async (e) => {
    const m = e.target.closest('[data-month]');
    if (m) return setParam({ month: m.dataset.month });

    const q = e.target.closest('[data-quick]');
    if (q) {
      const quick = QUICK.find((x) => x.key === q.dataset.quick);
      const next = new URLSearchParams();
      if (rawMonth) next.set('month', rawMonth);     // 고른 달은 유지한다
      if (!matchesQuick(p, quick)) for (const [k, v] of Object.entries(quick.params)) next.set(k, v);
      return go(`#/project/tasks${next.toString() ? `?${next.toString()}` : ''}`);
    }

    if (e.target.closest('[data-reset]')) return setParam({
      owner: '', stage: '', delayed: '', issue: '', area: '', project: '', q: '', done: '',
      month: rawMonth || 'all',   // 달은 그대로 두되 빈 주소로는 만들지 않는다
    });

    if (e.target.closest('[data-new-project]')) {
      return projectForm({ onSaved: reload });
    }

    const edit = e.target.closest('[data-edit-project]');
    if (edit) {
      const pr = state.projects.find((x) => x.id === edit.dataset.editProject);
      if (pr) return projectForm({ project: pr, onSaved: reload });
    }

    const newTask = e.target.closest('[data-new-task]');
    if (newTask) {
      return taskForm({
        defaults: {
          project_id: newTask.dataset.project || p.get('project') || undefined,
          area: p.get('area') || undefined,
          due_date: month ? monthEndDay(month) : undefined,
        },
        onSaved: reload,
      });
    }

    const del = e.target.closest('[data-del]');
    if (del) {
      const title = del.closest('.tk-row')?.querySelector('.ttl-edit')?.value ?? '이 업무';
      const ok = await confirmModal(`「${title}」을(를) 삭제할까요? 연결된 이슈는 남습니다.`,
        { confirmLabel: '삭제', danger: true });
      if (!ok) return undefined;
      try {
        await api.del(`/api/tasks/${del.dataset.del}`);
        toast('업무를 삭제했습니다.');
      } catch (err) { toast(err.message, true); }
      return reload();
    }

    if (e.target.closest('[data-order-reset]')) {
      writePref(TASK_KEY, '');
      toast('마감일 순으로 되돌렸습니다.');
      return reload();
    }

    const row = e.target.closest('[data-open]');
    if (row && !e.target.closest('select') && !e.target.closest('.tk-grip')
        && !e.target.closest('.due-edit') && !e.target.closest('.due-view')
        && !e.target.closest('.ttl-edit') && !e.target.closest('.tk-del')) {
      go(`#/project/tasks/${row.dataset.open}`);
    }
    return undefined;
  });

  root.addEventListener('keydown', (e) => {
    const ttl = e.target.closest('[data-title]');
    if (ttl) {
      // 엔터는 확정, Esc 는 되돌리기. 줄 전체의 엔터(상세로 가기)와 겹치지 않게 여기서 끊는다.
      if (e.key === 'Enter') { e.preventDefault(); ttl.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); ttl.value = ttl.defaultValue; syncTitleCell(ttl); ttl.blur(); }
      return;
    }
    const row = e.target.closest('[data-open]');
    if (row && (e.key === 'Enter' || e.key === ' ') && !e.target.closest('input, select')) {
      e.preventDefault();
      go(`#/project/tasks/${row.dataset.open}`);
    }
  });

  // ── 방금 등록한 업무 짚어 주기 ──────────────────────
  // 주소에서 표시는 지운다. 새로고침할 때마다 다시 반짝이면 성가시다.
  if (justMade) {
    // 주소에서 표시를 지운다. 새로고침할 때마다 다시 반짝이면 성가시다.
    const hash = `#/project/tasks${p.toString() ? `?${p.toString()}` : ''}`;
    try { window.history.replaceState(null, '', hash); } catch { /* 주소를 못 고쳐도 화면은 그대로다 */ }

    const row = root.querySelector(`.tk-row[data-open="${CSS.escape(justMade)}"]`);
    if (row) {
      row.classList.add('landed');
      row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    } else if (!rows.some((t) => t.id === justMade)) {
      // 달은 맞춰 왔는데도 안 보인다 = 다른 필터가 가리고 있다
      toast('등록한 업무가 지금 필터에 가려 있습니다. 「필터 초기화」를 눌러 보세요.');
    }
  }

  autoGrow(root);

  // 마감일은 누를 때 입력칸이 된다
  bindDueEdit(root, async (id, value) => {
    if (!value) { toast('마감일을 비울 수는 없습니다.', true); return reload(); }
    try {
      await api.patch(`/api/tasks/${id}`, { due_date: value });
      toast('마감일을 바꿨습니다.');
    } catch (err) { toast(err.message, true); }
    // 마감일이 바뀌면 달·정렬·지연이 다 달라진다 — 다시 불러오는 게 맞다
    return reload();
  });

  root.addEventListener('change', async (e) => {
    const ttl = e.target.closest('[data-title]');
    if (ttl) {
      const next = ttl.value.replace(/\s+/g, ' ').trim();   // 줄바꿈은 제목에 남기지 않는다
      if (!next) { toast('업무명을 비울 수는 없습니다.', true); return reload(); }
      if (next === ttl.defaultValue) return undefined;   // 손대기만 하고 그대로 둔 것
      try {
        await api.patch(`/api/tasks/${ttl.dataset.title}`, { title: next });
        ttl.defaultValue = next;
        toast('업무명을 바꿨습니다.');
      } catch (err) { toast(err.message, true); reload(); }
      return undefined;
    }
    const sel = e.target.closest('[data-status]');
    if (sel) {
      try {
        await api.patch(`/api/tasks/${sel.dataset.status}`, { status: sel.value });
        toast('상태를 바꿨습니다.');
        reload();
      } catch (err) { toast(err.message, true); reload(); }
      return;
    }
    const f = e.target.closest('[data-f]');
    if (!f) return;
    const key = f.dataset.f;
    setParam({ [key]: f.type === 'checkbox' ? (f.checked ? '1' : '') : f.value });
  });

  root.addEventListener('keydown', (e) => {
    const f = e.target.closest('[data-f="q"]');
    if (f && e.key === 'Enter') setParam({ q: f.value });
  });

  void statusChip;
}







const EVENT_LABEL = {
  CREATED: '업무 등록',
  STATUS_CHANGED: '상태 변경',
  OWNER_CHANGED: '담당자 변경',
  DUE_CHANGED: '마감일 변경',
  REVIEW_STATUS_CHANGED: '검수 상태 변경',
};

const statusLabel = (code) => {
  const all = [...state.meta.normal_statuses, ...state.meta.out_statuses];
  return all.find((s) => s.code === code)?.label ?? code ?? '-';
};
const reviewLabel = (code) => state.meta.review_statuses.find((s) => s.code === code)?.label ?? '-';
const priorityLabel = (code) => state.meta.priorities.find((s) => s.code === code)?.label ?? '-';

const subCount = (rows = []) => {
  if (!rows.length) return '';
  const done = rows.filter((r) => r.is_done).length;
  return `<span class="sub-n${done === rows.length ? ' all' : ''}">${done}/${rows.length}</span>`;
};

const subList = (rows = []) => (rows.length
  ? `<ul class="subs">${rows.map((r) => `
      <li class="${r.is_done ? 'done' : ''}">
        <label>
          <input type="checkbox" data-sub="${esc(r.id)}"${r.is_done ? ' checked' : ''}>
          <span>${esc(r.title)}</span>
        </label>
        <button class="x" data-sub-del="${esc(r.id)}" aria-label="삭제" title="삭제">×</button>

  const repaintSubs = (rows) => {
    const panel = root.querySelector('[data-subs-panel]');
    if (!panel) return;
    t.subtasks = rows;
    panel.querySelector('h3').innerHTML = `하위 업무 ${subCount(rows)}`;
    panel.querySelector('.subs, .empty-line')?.replaceWith(
      new DOMParser().parseFromString(subList(rows), 'text/html').body.firstElementChild);
  };
  const reloadSubs = async () => {
    try { repaintSubs(await api.get(`/api/tasks/${t.id}/subtasks`)); }
    catch (err) { toast(err.message, true); }
  };

  root.addEventListener('change', async (e) => {

    if (own) {
      if (own.value === t.owner_slack_user_id) return undefined;

        await api.patch(`/api/tasks/${t.id}`, { owner_slack_user_id: own.value });

      } catch (err) { toast(err.message, true); }

    const areaSel = e.target.closest('[data-area]');

      const next = areaSel.value;
      if (next === t.area) return undefined;
      // 영역이 곧 담당이다 — 바뀌면 그 영역의 리드가 맡는다

        await api.patch(`/api/tasks/${t.id}`, { area: next });

      if (!next) { toast('업무명을 비울 수는 없습니다.', true); return reload(); }
      if (next === ttl.defaultValue) return undefined;
      try {
        await api.patch(`/api/tasks/${t.id}`, { title: next });
        ttl.defaultValue = next;
        toast('업무명을 바꿨습니다.');

      return undefined;

    const due = e.target.closest('[data-due]');
    if (due) {

        await api.patch(`/api/tasks/${t.id}`, { due_date: due.value });

      return reload();

      try {
        await api.patch(`/api/subtasks/${sub.dataset.sub}`, { is_done: sub.checked });

      } catch (err) { toast(err.message, true); await reloadSubs(); }
      return;
    }
    if (e.target.closest('[data-status]')) {
      const next = e.target.value;
      if (t.status === 'DONE' && next !== 'DONE') {
        const ok = await confirmModal('완료된 업무입니다. 상태를 되돌리면 완료 시각이 지워집니다. 계속할까요?');
        if (!ok) return reload();
      }
      if (t.area === 'OUT' && next === 'DONE' && t.review_status !== 'APPROVED') {

        if (!ok) return reload();
      }
      try {
        await api.patch(`/api/tasks/${t.id}`, { status: next });
        toast('상태를 변경했습니다.');
      } catch (err) { toast(err.message, true); }
      reload();
      return;
    }
    if (e.target.closest('[data-review]')) {
      const next = e.target.value;
      try {
        await api.patch(`/api/tasks/${t.id}`, { review_status: next });
        toast('검수 상태를 변경했습니다.');
        if (next === 'REJECTED' && t.status !== 'OUT_REVISION') {
          const ok = await confirmModal('반려 처리했습니다. 업무 상태를 "수정"으로 전환할까요?');
          if (ok) await api.patch(`/api/tasks/${t.id}`, { status: 'OUT_REVISION' });
        }
      } catch (err) { toast(err.message, true); }
      reload();
    }
  });

  root.addEventListener('submit', async (e) => {
    const form = e.target.closest('[data-sub-add]');
    if (!form) return;
    e.preventDefault();
    const input = form.querySelector('[name=title]');
    const title = input.value.trim();
    if (!title) return;
    try {
      await api.post(`/api/tasks/${t.id}/subtasks`, { title });
      input.value = '';
      await reloadSubs();
      input.focus();   // 여러 개를 잇달아 넣는 일이 많다
    } catch (err) { toast(err.message, true); }
  });

  autoGrow(root);

  root.addEventListener('keydown', (e) => {
    const ttl = e.target.closest('[data-title]');
    if (!ttl) return;
    if (e.key === 'Enter') { e.preventDefault(); ttl.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); ttl.value = ttl.defaultValue; syncTitleCell(ttl); ttl.blur(); }
  });

  root.addEventListener('click', async (e) => {
    const del = e.target.closest('[data-sub-del]');
    if (del) {
      try {
        await api.del(`/api/subtasks/${del.dataset.subDel}`);
        await reloadSubs();
      } catch (err) { toast(err.message, true); }
      return;
    }
    if (e.target.closest('[data-edit]')) {
      taskForm({ task: t, onSaved: reload });
    } else if (e.target.closest('[data-new-issue]')) {
      issueForm({ defaults: { project_id: t.project_id, task_id: t.id }, onSaved: reload });
    } else if (e.target.closest('[data-delete]')) {
      const ok = await confirmModal('이 업무를 삭제할까요? 연결된 이슈는 남습니다.', { confirmLabel: '삭제', danger: true });
      if (!ok) return;
      await api.del(`/api/tasks/${t.id}`);
      toast('업무를 삭제했습니다.');
      go('#/project/tasks');
    }
  });
}







const severityLabel = (code) => state.meta.priorities.find((p) => p.code === code)?.label ?? code;

async function renderIssues(root, query) {
  const p = new URLSearchParams(query);
  root.innerHTML = loading();
  let rows;
  try {
    rows = await api.get(`/api/issues?${p.toString()}`);
  } catch (err) {
    root.innerHTML = errorBox(err.message);
    return;
  }

  const set = (patch) => {
    const next = new URLSearchParams(p);
    for (const [k, v] of Object.entries(patch)) {
      if (!v) next.delete(k); else next.set(k, v);
    }
    go(`#/project/issues?${next.toString()}`);
  };
  const on = (k, v) => (p.get(k) === v ? 'on' : '');

  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Issues</h1>
        <div class="sub">${rows.length}건 · 업무 상태와 이슈 상태는 분리해서 관리합니다</div>
      </div>
      <div class="page-actions"><button class="btn btn-primary" data-new-issue>+ 이슈 등록</button></div>
    </div>

    <div class="filters">
      <div class="quick">
        <button data-q="clear" class="${[...p.keys()].length === 0 ? 'on' : ''}">미해결</button>
        <button data-q="mine" class="${on('owner', 'me')}">내 담당 이슈</button>
        <button data-q="open" class="${on('status', 'OPEN')}">Open</button>
        <button data-q="checking" class="${on('status', 'CHECKING')}">확인중</button>
        <button data-q="high" class="${on('severity', 'HIGH')}">중요도 높음</button>
        <button data-q="resolved" class="${on('resolved', '1')}">해결 포함</button>
      </div>
    </div>

    ${rows.length ? `
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>이슈</th><th>프로젝트</th><th>관련 업무</th>
                <th>담당</th><th class="nowrap">중요도</th><th class="nowrap">목표일</th><th class="nowrap">상태</th></tr>
          </thead>
          <tbody>
            ${rows.map((i) => `
              <tr class="row-click" data-open="${esc(i.id)}">
                <td class="title-cell"><span class="sev-bar ${esc(i.severity)}"></span>${esc(i.title)}</td>
                <td data-label="프로젝트">${esc(i.project_name)}</td>
                <td data-label="관련 업무">${i.task_title ? esc(i.task_title) : '<span style="color:var(--muted)">-</span>'}</td>
                <td data-label="담당">${person(i.owner_slack_user_id, i.owner_name)}</td>
                <td data-label="중요도" class="nowrap">${esc(severityLabel(i.severity))}</td>
                <td data-label="목표일" class="nowrap num" style="${i.target_resolve_date && i.target_resolve_date < state.today && i.status !== 'RESOLVED' ? 'color:var(--s-delay)' : ''}">
                  ${shortDate(i.target_resolve_date)}</td>
                <td data-label="상태" class="nowrap">
                  <select data-status="${esc(i.id)}" class="status-select" aria-label="이슈 상태">
                    ${state.meta.issue_statuses.map((s) =>
                      `<option value="${esc(s.code)}"${s.code === i.status ? ' selected' : ''}>${esc(s.label)}</option>`).join('')}
                  </select>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>` : empty({
        title: [...p.keys()].length ? '조건에 맞는 이슈가 없습니다' : '등록된 이슈가 없습니다',
        hint: '업무 진행을 막는 문제와 블로커를 이슈로 남겨 주세요.',
        action: '<button class="btn btn-primary" data-new-issue>+ 이슈 등록</button>',
      })}`;

  root.addEventListener('change', async (e) => {
    const sel = e.target.closest('[data-status]');
    if (!sel) return;
    try {
      await api.patch(`/api/issues/${sel.dataset.status}`, { status: sel.value });
      toast('이슈 상태를 변경했습니다.');
    } catch (err) { toast(err.message, true); }
    window.dispatchEvent(new Event('kf:reload'));
  });

  root.addEventListener('click', (e) => {
    if (e.target.closest('.status-select')) return;
    const q = e.target.closest('[data-q]')?.dataset.q;
    if (q) {
      const map = {
        clear: '#/project/issues',
        mine: '#/project/issues?owner=me',
        open: '#/project/issues?status=OPEN',
        checking: '#/project/issues?status=CHECKING',
        high: '#/project/issues?severity=HIGH',
        resolved: '#/project/issues?resolved=1',
      };
      go(map[q]);
      return;
    }
    const row = e.target.closest('[data-open]');
    if (row) go(`#/project/issues/${row.dataset.open}`);
  });
}

          ${i.vendor_name ? `<dt>외주 업체</dt><dd>${esc(i.vendor_name)}${i.vendor_worker_name ? ` · ${esc(i.vendor_worker_name)}` : ''}</dd>` : ''}
          <dt>목표일</dt><dd class="num">${shortDate(i.target_resolve_date)}</dd>
