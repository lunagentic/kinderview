// 주간보고에 옮겨 적는 건 "진행 사항"이다 — 이번 주 완료 / 진행·지연 / 다음 주.
// 나머지 섹션(프로젝트별·영역별·외주·이슈·리드별)은 배경 자료라 접어 둔다.
// 복사도 이 설정을 따라간다. 붙여넣을 때 안 쓸 것까지 따라오면 다시 지워야 한다.
const BRIEF_KEY = 'kf.weeklyBrief';
const BRIEF_SECTIONS = ['summary', 'completed', 'progressing', 'next'];

const sec = (n, title, inner, key) => `
  <section class="rsec${BRIEF_SECTIONS.includes(key) ? ' core' : ' extra'}">
    <h3><span class="n">${n}</span>${esc(title)}</h3>${inner}</section>`;

const deltaTag = (d) => {
  if (d === null || d === undefined) return '<span class="delta flat">-</span>';
  if (d === 0) return '<span class="delta flat">±0%p</span>';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}%p</span>`;
};

const taskLine = (t, extra = '') => `
  <li><a href="#/project/tasks/${esc(t.id)}" style="text-decoration:underline">${esc(t.title)}</a>
    <span style="color:var(--muted)">· ${esc(projectLabel(t.project_name))} · ${esc(t.owner_name)} · ${esc(t.status_label)}${extra}</span></li>`;

async function renderWeekly(root, query) {
  let brief = readPref(BRIEF_KEY) !== 'off';   // 기본은 진행 사항만
  const p = new URLSearchParams(query);
  const week = p.get('week') || '';
  root.innerHTML = loading();

  let report;
  try {
    report = await api.get(`/api/weekly${week ? `?week=${encodeURIComponent(week)}` : ''}`);
  } catch (err) {
    root.innerHTML = errorBox(err.message);
    return;
  }
  const s = report.snapshot;

  const prevWeek = shiftWeek(report.period_start, -7);
  const nextWeek = shiftWeek(report.period_start, +7);

  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Weekly Report</h1>
        <div class="sub">
          ${shortDate(report.period_start)} ~ ${shortDate(report.period_end)} ·
          ${report.saved
            ? `저장된 리포트 (생성 ${dateTime(report.generated_at)}${report.shared_at ? ` · Slack 공유 ${dateTime(report.shared_at)}` : ''})`
            : '미리보기 — 아직 저장되지 않았습니다'}
        </div>
      </div>
      <div class="page-actions">
        <button class="btn" data-week="${esc(prevWeek)}">◀ 이전 주</button>
        <button class="btn" data-week="${esc(nextWeek)}">다음 주 ▶</button>
        <button class="btn" data-generate>${report.saved ? '다시 생성' : '리포트 생성'}</button>
        ${report.saved ? '<button class="btn" data-share>Slack 공유</button>' : ''}
        <button class="btn ${brief ? 'on' : ''}" data-brief aria-pressed="${brief}">진행 사항만</button>
        <button class="btn" data-copy>텍스트 복사</button>
      </div>
    </div>

    <div class="digest" id="digest">
      <div class="dhead">
        <h3>요약문</h3>
        <span class="hint">숫자를 팀에 공유할 문장으로 만듭니다</span>
        <button class="btn" data-digest>요약문 생성</button>
      </div>
      <p class="sum" style="color:var(--muted)">아직 생성하지 않았습니다.</p>
    </div>

    <div class="report${brief ? ' brief' : ''}">
      <h2>KinderFlow Weekly Report</h2>
      <div class="sub" style="color:var(--muted);font-size:.84rem">
        업무·이슈 데이터에서 자동 생성됩니다. 리포트를 위해 따로 입력하는 항목은 없습니다.</div>

      ${sec('①', '전체 업무 현황', `
        <div class="pill-row">
          <div class="pill"><div class="k">이번 주 완료</div><div class="v">${s.summary.completed_this_week}</div></div>
          <div class="pill"><div class="k">진행중</div><div class="v">${s.summary.in_progress}</div></div>
          <div class="pill"><div class="k">검토</div><div class="v">${s.summary.review}</div></div>
          <div class="pill ${s.summary.delayed ? 'bad' : ''}"><div class="k">지연</div><div class="v">${s.summary.delayed}</div></div>
          <div class="pill"><div class="k">신규 등록</div><div class="v">${s.summary.created_this_week}</div></div>
          <div class="pill"><div class="k">전체 진행률</div><div class="v">${pctText(s.summary.progress)}</div></div>
        </div>`, 'summary')}

      ${sec('②', '프로젝트별 진행', `
        <div class="bars">
          ${s.projects.map((pr) => `
            <div class="bar" style="cursor:default;${projectStyle(pr.id)}">
              <span class="name">${esc(pr.name)}</span>
              ${progressBar(pr.progress)}
              <span class="pct">${pctText(pr.progress)}</span>
              <span class="sub">${deltaTag(pr.delta)} · 이번 주 완료 ${pr.completed_this_week}건${pr.delayed ? ` · 지연 ${pr.delayed}건` : ''}</span>
            </div>`).join('')}
        </div>`, 'projects')}

      ${sec('③', '업무 영역별 진행', `
        <div class="bars">
          ${s.areas.filter((a) => a.count > 0).map((a) => `
            <div class="bar" style="cursor:default">
              <span class="name">${esc(a.label)}</span>
              ${progressBar(a.progress)}
              <span class="pct">${pctText(a.progress)}</span>
              <span class="sub">업무 ${a.count}건 · 이번 주 완료 ${a.completed_this_week}건</span>
            </div>`).join('')}
        </div>`, 'areas')}

      ${sec('④', '주요 완료 업무', s.completed.rows.length
        ? `<ul>${s.completed.rows.map((t) => taskLine(t)).join('')}</ul>
           ${s.completed.more ? `<p class="hint" style="margin-top:8px">외 ${s.completed.more}건</p>` : ''}`
        : '<p class="hint">이번 주 완료된 업무가 없습니다.</p>', 'completed')}

      ${sec('⑤', '진행 및 지연 업무', `
        <h4 style="font-size:.85rem;color:var(--muted);margin-bottom:7px">진행중 · 검토 ${s.progressing.in_progress.length}건</h4>
        ${s.progressing.in_progress.length
          ? `<ul>${s.progressing.in_progress.slice(0, 15).map((t) => taskLine(t, ` · 마감 ${shortDate(t.due_date)}`)).join('')}</ul>`
          : '<p class="hint">없습니다.</p>'}
        <h4 style="font-size:.85rem;color:var(--s-delay);margin:16px 0 7px">지연 ${s.progressing.delayed.length}건</h4>
        ${s.progressing.delayed.length
          ? `<ul>${s.progressing.delayed.map((t) => taskLine(t, ` · <b style="color:var(--s-delay)">${t.days_late}일 지연</b>`)).join('')}</ul>`
          : '<p class="hint">지연된 업무가 없습니다.</p>'}`, 'progressing')}

      ${sec('⑥', '외주 진행 현황', `
        <div class="pill-row">
          <div class="pill"><div class="k">진행 외주</div><div class="v">${s.outsourcing.active}</div></div>
          <div class="pill"><div class="k">검수</div><div class="v">${s.outsourcing.review}</div></div>
          <div class="pill"><div class="k">수정</div><div class="v">${s.outsourcing.revision}</div></div>
          <div class="pill ${s.outsourcing.delivery_delayed ? 'bad' : ''}"><div class="k">납품 지연</div><div class="v">${s.outsourcing.delivery_delayed}</div></div>
        </div>
        ${s.outsourcing.delayed_rows.length ? `<ul style="margin-top:12px">
          ${s.outsourcing.delayed_rows.map((r) => `<li><a href="#/project/tasks/${esc(r.id)}" style="text-decoration:underline">${esc(r.title)}</a>
            <span style="color:var(--muted)">· ${esc(r.vendor_name ?? '-')} · ${esc(r.owner_name)} ·
            <b style="color:var(--s-delay)">${r.days_late}일 지연</b></span></li>`).join('')}
        </ul>` : ''}`, 'outsourcing')}

      ${sec('⑦', '주요 이슈', `
        <p class="hint" style="margin-bottom:10px">미해결 ${s.issues.open_count}건 · 이번 주 신규 ${s.issues.new_this_week}건 · 해결 ${s.issues.resolved_this_week}건</p>
        ${s.issues.rows.length ? `<ul>${s.issues.rows.map((i) => `
          <li><a href="#/project/issues/${esc(i.id)}" style="text-decoration:underline">${esc(i.title)}</a>
            <span style="color:var(--muted)">· ${esc(i.project_name)} · ${esc(i.owner_name)} ·
            ${i.severity === 'HIGH' ? '<b style="color:var(--s-delay)">높음</b>' : i.severity === 'LOW' ? '낮음' : '보통'}
            ${i.impact ? ` · ${esc(i.impact)}` : ''}</span></li>`).join('')}</ul>`
          : '<p class="hint">미해결 이슈가 없습니다.</p>'}`, 'issues')}

      ${sec('⑧', '리드별 현황', `
        <div class="table-wrap">
          <table>
            <thead><tr><th>리드</th><th class="nowrap">담당 업무</th><th class="nowrap">진행</th>
              <th class="nowrap">이번 주 완료</th><th class="nowrap">지연</th><th class="nowrap">진행률</th></tr></thead>
            <tbody>
              ${s.owners.map((o) => `
                <tr><td>${person(o.slack_user_id, o.display_name)}</td>
                  <td class="num">${o.count}</td><td class="num">${o.in_progress}</td>
                  <td class="num">${o.completed_this_week}</td>
                  <td class="num" style="${o.delayed ? 'color:var(--s-delay)' : ''}">${o.delayed}</td>
                  <td class="num">${pctText(o.progress)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
        ${s.handover.length ? `<p class="hint" style="margin-top:10px">인수인계 필요 — ${esc(s.handover.map((h) => `${h.display_name} ${h.open}건`).join(' · '))}</p>` : ''}`, 'owners')}

      ${sec('⑨', '다음 주 주요 업무', `
        <h4 style="font-size:.85rem;color:var(--muted);margin-bottom:7px">마감 예정 ${s.next_week.due.length}건 (${shortDate(s.next_week.period.start)} ~ ${shortDate(s.next_week.period.end)})</h4>
        ${s.next_week.due.length ? `<ul>${s.next_week.due.map((t) => taskLine(t, ` · 마감 ${shortDate(t.due_date)}`)).join('')}</ul>` : '<p class="hint">없습니다.</p>'}
        ${s.next_week.delivery.length ? `
          <h4 style="font-size:.85rem;color:var(--muted);margin:16px 0 7px">외주 납품 예정 ${s.next_week.delivery.length}건</h4>
          <ul>${s.next_week.delivery.map((t) => `<li>${esc(t.title)}
            <span style="color:var(--muted)">· ${esc(t.vendor_name ?? '-')} · ${shortDate(t.delivery_due_date)}</span></li>`).join('')}</ul>` : ''}`, 'next')}
    </div>`;

  root.addEventListener('click', async (e) => {
    const wk = e.target.closest('[data-week]');
    if (wk) return go(`#/project/weekly?week=${wk.dataset.week}`);

    if (e.target.closest('[data-generate]')) {
      try {
        await api.post('/api/weekly/generate', { week: report.period_start });
        toast('리포트를 생성했습니다.');
        window.dispatchEvent(new Event('kf:reload'));
      } catch (err) { toast(err.message, true); }
      return;
    }
    if (e.target.closest('[data-share]')) {
      try {
        const res = await api.post(`/api/weekly/${report.id}/share`);
        if (res.status === 'ALREADY_SHARED') toast('이미 공유한 리포트입니다.');
        else if (res.status === 'SENT') toast(`Slack ${res.channel} 채널에 공유했습니다.`);
        else if (!res.channel_configured) toast('SLACK_DEFAULT_CHANNEL 미설정 — 알림함에 기록했습니다.');
        else toast('Slack 미연동 — 알림함에 기록했습니다.');
        window.dispatchEvent(new Event('kf:reload'));
      } catch (err) { toast(err.message, true); }
      return;
    }
    if (e.target.closest('[data-digest]')) {
      const box = root.querySelector('#digest');
      const btn = box.querySelector('[data-digest]');
      btn.disabled = true;
      btn.textContent = '생성 중…';
      try {
        const d = await api.post('/api/ai/digest', { week: report.period_start });
        box.innerHTML = renderDigest(d);
      } catch (err) {
        toast(err.message, true);
        btn.disabled = false;
        btn.textContent = '요약문 생성';
      }
      return;
    }
    const briefBtn = e.target.closest('[data-brief]');
    if (briefBtn) {
      brief = !brief;
      writePref(BRIEF_KEY, brief ? 'on' : 'off');
      root.querySelector('.report').classList.toggle('brief', brief);
      briefBtn.classList.toggle('on', brief);
      briefBtn.setAttribute('aria-pressed', String(brief));
      briefBtn.textContent = brief ? '진행 사항만' : '전체 보기';
      return;
    }

    if (e.target.closest('[data-copy]')) {
      const text = toMarkdown(report, brief);
      try {
        await navigator.clipboard.writeText(text);
        toast(brief ? '진행 사항만 복사했습니다.' : '전체를 마크다운으로 복사했습니다.');
      } catch {
        toast('복사에 실패했습니다. 브라우저 권한을 확인해 주세요.', true);
      }
    }
  });
}

function renderDigest(d) {
  return `
    <div class="dhead">
      <h3>요약문</h3>

function shiftWeek(iso, days) {
  const d = new Date(`${iso}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function toMarkdown(report, brief = false) {
  const s = report.snapshot;
  const L = [];
  L.push(`# KinderFlow Weekly Report (${report.period_start} ~ ${report.period_end})`, '');
  L.push(brief ? '## 전체 현황' : '## ① 전체 업무 현황');
  L.push(`- 이번 주 완료 ${s.summary.completed_this_week} · 진행중 ${s.summary.in_progress} · 검토 ${s.summary.review} · 지연 ${s.summary.delayed} · 신규 ${s.summary.created_this_week}`, '');

  if (brief) {
    L.push('## 이번 주 완료');
    if (s.completed.rows.length) {
      for (const t of s.completed.rows) L.push(`- ${t.title} (${t.project_name} · ${t.owner_name})`);
      if (s.completed.more) L.push(`- 외 ${s.completed.more}건`);
    } else L.push('- 없음');
    L.push('', '## 진행중 · 검토');
    if (s.progressing.in_progress.length) {
      for (const t of s.progressing.in_progress) {
        L.push(`- ${t.title} (${t.project_name} · ${t.owner_name} · ${t.status_label} · 마감 ${t.due_date})`);
      }
    } else L.push('- 없음');
    L.push('', '## 지연');
    if (s.progressing.delayed.length) {
      for (const t of s.progressing.delayed) {
        L.push(`- [${t.days_late}일 지연] ${t.title} (${t.project_name} · ${t.owner_name})`);
      }
    } else L.push('- 없음');
    L.push('', `## 다음 주 (${s.next_week.period.start} ~ ${s.next_week.period.end})`);
    if (s.next_week.due.length) {
      for (const t of s.next_week.due) L.push(`- ${t.title} (${t.project_name} · ${t.owner_name} · 마감 ${t.due_date})`);
    } else L.push('- 없음');
    return L.join('\n');
  }

  L.push('## ② 프로젝트별 진행');
  for (const p of s.projects) {
    const d = p.delta === null ? '-' : `${p.delta > 0 ? '+' : ''}${p.delta}%p`;
    L.push(`- ${p.name}: ${p.progress ?? '-'}% (${d}) · 이번 주 완료 ${p.completed_this_week}건`);
  }
  L.push('', '## ③ 업무 영역별 진행');
  for (const a of s.areas.filter((x) => x.count > 0)) L.push(`- ${a.label}: ${a.progress ?? '-'}% (업무 ${a.count}건)`);
  L.push('', '## ④ 주요 완료 업무');
  for (const t of s.completed.rows) L.push(`- ${t.title} (${t.project_name} · ${t.owner_name})`);
  if (s.completed.more) L.push(`- 외 ${s.completed.more}건`);
  L.push('', '## ⑤ 진행 및 지연 업무');
  for (const t of s.progressing.delayed) L.push(`- [지연 ${t.days_late}일] ${t.title} (${t.project_name} · ${t.owner_name})`);
  L.push('', '## ⑥ 외주 진행 현황');
  L.push(`- 진행 ${s.outsourcing.active}건 · 검수 ${s.outsourcing.review}건 · 수정 ${s.outsourcing.revision}건 · 납품 지연 ${s.outsourcing.delivery_delayed}건`);
  L.push('', '## ⑦ 주요 이슈');
  for (const i of s.issues.rows) L.push(`- [${i.severity}] ${i.title} (${i.project_name} · ${i.owner_name})${i.impact ? ` — ${i.impact}` : ''}`);
  L.push('', '## ⑧ 리드별 현황');
  for (const o of s.owners) L.push(`- ${o.display_name}: 담당 ${o.count} · 진행 ${o.in_progress} · 이번 주 완료 ${o.completed_this_week} · 지연 ${o.delayed}`);
  L.push('', '## ⑨ 다음 주 주요 업무');
  for (const t of s.next_week.due) L.push(`- ${t.title} (${t.project_name} · ${t.owner_name} · 마감 ${t.due_date})`);
  return L.join('\n');
}

// 간트는 "언제 무엇이 겹치는가"를 읽는 화면이다.
// 색은 프로젝트 정체성만 나타내고, 진행률은 같은 색의 채움 길이로, 상태는 상태색으로 나눈다.
// 막대에는 늘 이름이 붙는다 — 색만으로 구분되는 곳은 없다.

const TL_DAY = 86_400_000;
const tlParse = (iso) => Date.parse(`${String(iso).slice(0, 10)}T00:00:00Z`);
const tlAdd = (iso, n) => new Date(tlParse(iso) + n * TL_DAY).toISOString().slice(0, 10);
const tlDiff = (a, b) => Math.round((tlParse(b) - tlParse(a)) / TL_DAY);
const tlMonthStart = (iso) => `${iso.slice(0, 7)}-01`;
const tlMonthNext = (iso) => {
  const y = Number(iso.slice(0, 4));
  const m = Number(iso.slice(5, 7));
  return m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, '0')}-01`;
};

/** 창(window) 안에서의 위치를 % 로. 밖으로 나가면 잘라 낸다. */
const tlSpan = (win, start, end) => {
  const total = tlDiff(win.start, win.end) || 1;
  const s = Math.max(0, tlDiff(win.start, start));
  const e = Math.min(total, tlDiff(win.start, end) + 1);
  if (e <= s) return null;
  return { left: (s / total) * 100, width: ((e - s) / total) * 100 };
};
const tlPoint = (win, date) => {
  const total = tlDiff(win.start, win.end) || 1;
  const d = tlDiff(win.start, date);
  if (d < 0 || d > total) return null;
  return ((d + 0.5) / total) * 100;
};

const tlMilestoneState = (m) => {
  if (m.done_at) return { key: 'done', label: '달성', mark: '✓' };
  if (m.due_date < state.today) return { key: 'late', label: '지연', mark: '!' };
  return { key: 'plan', label: '예정', mark: '' };
};

// 열어 둔 페이즈를 기억한다. 화면을 다시 그릴 때마다 패널이 닫히면
// 페이즈를 고치거나 업무 하나를 손볼 때마다 아래 표가 사라진다.
let lastOpenPhase = null;

async function renderTimeline(root) {
  root.innerHTML = loading();

  let rows;
  try {
    rows = await api.get('/api/timeline');
  } catch (err) {
    root.innerHTML = errorBox(err.message);
    return;
  }

  // 기간이 아직 없는 프로젝트도 자리를 지킨다. 방금 만든 프로젝트가 여기서도
  // 안 보이면 등록이 안 된 것처럼 보인다 — 페이즈를 더하라고 그 자리에서 권한다.
  const live = rows;
  if (!live.length) {
    root.innerHTML = `${tlHead()}${empty({
      title: '일정이 없습니다',
      hint: '프로젝트에 페이즈를 추가하면 여기에 기간이 그려집니다.',
    })}`;
    return;
  }

  // 창 = 모든 날짜를 감싸는 달 경계. 최소 3개월은 확보한다.
  const all = live.flatMap((r) => [
    r.start_date, r.end_date,
    ...r.phases.flatMap((p) => [p.start_date, p.end_date]),
    ...r.milestones.map((m) => m.due_date),
    state.today,
  ]).filter(Boolean).sort();
  let winStart = tlMonthStart(all[0]);
  let winEnd = tlAdd(tlMonthNext(all[all.length - 1]), -1);
  while (tlDiff(winStart, winEnd) < 89) winEnd = tlAdd(tlMonthNext(winEnd), -1);
  const win = { start: winStart, end: winEnd };

  const months = [];
  for (let m = winStart; tlParse(m) <= tlParse(winEnd); m = tlMonthNext(m)) {
    const next = tlMonthNext(m);
    const end = tlAdd(next, -1);
    months.push({ start: m, ...tlSpan(win, m, end > winEnd ? winEnd : end) });
  }
  const todayAt = tlPoint(win, state.today);

  const phaseRow = (r, ph) => {
    const box = ph.start_date && ph.end_date ? tlSpan(win, ph.start_date, ph.end_date) : null;
    const pct = ph.progress;
    const range = ph.start_date ? `${shortDate(ph.start_date)} ~ ${shortDate(ph.end_date)}` : '기간 미정';
    const tip = [
      `<b>${esc(ph.name)}</b>`,
      `${esc(r.name)} · ${esc(range)}${ph.derived ? ' (업무에서 계산)' : ''}`,
      `업무 ${ph.task_count}건 · 완료 ${ph.done_count}건${pct === null ? '' : ` · ${pct}%`}`,
    ].join('<br>');
    return `
      <div class="tl-row">
        <div class="tl-label">
          <button class="tl-name" data-phase="${esc(ph.id)}" title="페이즈 이름·기간 수정">${esc(ph.name)}</button>
          <span class="tl-meta">${ph.task_count ? `업무 ${ph.task_count}` : '업무 없음'}${
            pct === null ? '' : ` · ${pct}%`}</span>
        </div>
        <div class="tl-track">
          ${months.map((m) => `<i class="tl-grid" style="left:${m.left}%"></i>`).join('')}
          ${box ? `
            <div class="tl-bar${ph.derived ? ' is-derived' : ''}" style="left:${box.left}%;width:${box.width}%"
                 data-open-phase="${esc(ph.id)}" data-tip="${esc(tip)}" tabindex="0"
                 role="button" aria-expanded="false"
                 aria-label="${esc(`${ph.name} ${range} — 업무 보기`)}">
              <span class="tl-fill" style="width:${pct ?? 0}%"></span>
            </div>
            ${box.left + box.width < 84 ? `
              <span class="tl-range" style="left:${box.left + box.width}%">${esc(range)}</span>` : ''}
          ` : `<span class="tl-nodate">기간 미정</span>`}
        </div>
      </div>`;
  };

  const milestoneLane = (r) => {
    if (!r.milestones.length) return '';
    return `
      <div class="tl-row tl-row-ms">
        <div class="tl-label"><span class="tl-meta">마일스톤 ${r.milestones.length}</span></div>
        <div class="tl-track">
          ${months.map((m) => `<i class="tl-grid" style="left:${m.left}%"></i>`).join('')}
          ${r.milestones.map((m) => {
            const at = tlPoint(win, m.due_date);
            if (at === null) return '';
            const st = tlMilestoneState(m);
            const tip = `<b>${esc(m.name)}</b><br>${esc(shortDate(m.due_date))} · ${esc(st.label)}${
              m.phase_name ? `<br>페이즈 ${esc(m.phase_name)}` : ''}`;
            return `<button class="tl-ms is-${st.key}" style="left:${at}%"
                      data-milestone="${esc(m.id)}" data-tip="${esc(tip)}"
                      aria-label="${esc(`${m.name} ${m.due_date} ${st.label}`)}"><i></i></button>`;
          }).join('')}
        </div>
      </div>`;
  };

  root.innerHTML = `
    ${tlHead()}

    <div class="tl-legend">
      <span class="tl-key"><i class="k-bar"></i>페이즈 기간 — 진한 부분이 완료 비율</span>
      <span class="tl-key"><i class="k-ms plan"></i>마일스톤 예정</span>
      <span class="tl-key"><i class="k-ms late"></i>지연</span>
      <span class="tl-key"><i class="k-ms done"></i>달성</span>
      <span class="tl-key"><i class="k-today"></i>오늘</span>
      <span class="tl-hint">막대를 누르면 그 페이즈 업무가 아래에 영역별로 열립니다</span>
    </div>

    <div class="tl-wrap">
      <div class="tl-chart">
        <div class="tl-row tl-axis">
          <div class="tl-label"></div>
          <div class="tl-track">
            ${months.map((m) => `
              <span class="tl-month" style="left:${m.left}%;width:${m.width}%">
                ${Number(m.start.slice(5, 7))}월${m.start.slice(5, 7) === '01' ? ` ’${m.start.slice(2, 4)}` : ''}
              </span>`).join('')}
            ${todayAt === null ? '' : `<i class="tl-today-cap" style="left:${todayAt}%">오늘</i>`}
          </div>
        </div>

        ${live.map((r) => `
          <section class="tl-group" style="${projectStyle(r.id)}">
            <div class="tl-group-head">
              <h2>${projectName(r.id, r.name)}</h2>
              <button class="pr-edit" data-edit-project="${esc(r.id)}"
                      aria-label="프로젝트 수정" title="프로젝트 수정">✎</button>
              <span class="tl-meta">${r.start_date ? `${shortDate(r.start_date)} ~ ${shortDate(r.end_date)}` : '일정 없음'}${
                r.unphased ? ` · 페이즈 미지정 업무 ${r.unphased}` : ''}</span>
              <span class="tl-group-actions">
                <button class="btn btn-ghost sm" data-add-phase="${esc(r.id)}">+ 페이즈</button>
                <button class="btn btn-ghost sm" data-add-milestone="${esc(r.id)}">+ 마일스톤</button>
              </span>
            </div>
            ${r.phases.length
              ? r.phases.map((ph) => phaseRow(r, ph)).join('')
              : `<div class="tl-row"><div class="tl-label"><span class="tl-meta">페이즈 없음</span></div>
                 <div class="tl-track">${months.map((m) => `<i class="tl-grid" style="left:${m.left}%"></i>`).join('')}
                 <span class="tl-nodate">페이즈를 추가하면 기간이 그려집니다</span></div></div>`}
            ${milestoneLane(r)}

      </div>
    </div>

    <div class="tl-detail" id="tl-detail" hidden></div>

    <details class="tl-table">
      <summary>표로 보기</summary>
      <div class="table-wrap">

          <thead><tr><th>프로젝트</th><th>페이즈</th><th>시작</th><th>종료</th><th class="num">업무</th><th class="num">진행</th></tr></thead>
          <tbody>
            ${live.flatMap((r) => r.phases.map((ph) => `
              <tr>
                <td data-label="프로젝트">${projectName(r.id, r.name)}</td>
                <td data-label="페이즈">${esc(ph.name)}${ph.derived ? ' <span class="hint">(계산)</span>' : ''}</td>
                <td data-label="시작">${shortDate(ph.start_date)}</td>

                <td data-label="업무" class="num">${ph.task_count}</td>
                <td data-label="진행" class="num">${ph.progress === null ? '-' : `${ph.progress}%`}</td>
              </tr>`)).join('') || '<tr><td colspan="6">페이즈가 없습니다.</td></tr>'}
          </tbody>

    <section class="section">

            <tbody>

                .sort((a, b) => a.m.due_date.localeCompare(b.m.due_date))
                .map(({ m, r }) => {
                  const st = tlMilestoneState(m);
                  return `
                    <tr class="row-click" data-milestone-row="${esc(m.id)}">

                      <td data-label="프로젝트">${projectName(r.id, r.name)}</td>
                      <td data-label="페이즈">${m.phase_name ? esc(m.phase_name) : '-'}</td>
                      <td data-label="날짜">${shortDate(m.due_date)}
                        <span class="dday">${m.done_at ? '' : esc(dDay(tlDiff(state.today, m.due_date)))}</span></td>
                      <td data-label="상태"><span class="chip ms-${st.key}">${st.mark ? `${st.mark} ` : ''}${st.label}</span></td>
                    </tr>`;
                }).join('')}
            </tbody>
          </table>
        </div>` : '<p class="hint">등록된 마일스톤이 없습니다.</p>'}
    </section>
`;

  hoverTip(root);

  // ── 편집 ──────────────────────────────────────────────
  const reload = () => window.dispatchEvent(new Event('kf:reload'));
  const allPhases = live.flatMap((r) => r.phases);

  // ── 페이즈 업무 패널 ──────────────────────────────────
  // 막대를 누르면 그 페이즈의 업무를 영역별로 묶어 아래에 편다.
  // 영역이 곧 담당이라, 이 묶음이 "누가 무엇을 언제까지"가 된다.
  const detail = root.querySelector('#tl-detail');
  let openId = null;

  const closeDetail = () => {
    openId = null;
    lastOpenPhase = null;
    detail.hidden = true;
    detail.innerHTML = '';
    root.querySelectorAll('.tl-bar.on').forEach((b) => {
      b.classList.remove('on');
      b.setAttribute('aria-expanded', 'false');
    });
  };

  async function togglePhase(phaseId) {
    if (openId === phaseId) return closeDetail();
    closeDetail();
    openId = phaseId;
    lastOpenPhase = phaseId;

    const row = live.find((r) => r.phases.some((p) => p.id === phaseId));
    const ph = row?.phases.find((p) => p.id === phaseId);
    if (!ph) return undefined;

    const bar = root.querySelector(`.tl-bar[data-open-phase="${phaseId}"]`);
    bar?.classList.add('on');
    bar?.setAttribute('aria-expanded', 'true');

    detail.hidden = false;
    detail.innerHTML = `<div class="loading">불러오는 중…</div>`;

    let rows;
    try {
      rows = await api.get(`/api/tasks?phase=${encodeURIComponent(phaseId)}&done=1`);
    } catch (err) {
      detail.innerHTML = errorBox(err.message);
      return undefined;
    }
    if (openId !== phaseId) return undefined;   // 그새 다른 걸 눌렀으면 버린다

    const areas = (state.meta?.areas ?? [])
      .map((a) => ({ area: a, rows: rows.filter((t) => t.area === a.code) }))
      .filter((g) => g.rows.length);

    const range = ph.start_date ? `${shortDate(ph.start_date)} ~ ${shortDate(ph.end_date)}` : '기간 미정';

    detail.innerHTML = `
      <div class="tld-head" style="${projectStyle(row.id)}">
        <h3>${projectName(row.id, row.name)}<span class="sep">·</span>${esc(ph.name)}</h3>
        <span class="meta">${esc(range)}${ph.derived ? ' (업무에서 계산)' : ''} · 업무 ${rows.length}건${
          ph.progress === null ? '' : ` · 진행 ${ph.progress}%`}</span>
        <span class="acts">
          <button class="btn btn-ghost sm" data-phase="${esc(ph.id)}">페이즈 수정</button>
          <button class="btn btn-ghost sm" data-close-detail aria-label="닫기">닫기 ✕</button>
        </span>
      </div>
      ${areas.length ? `<div class="tld-areas">${areas.map((g) => `
        <section class="tld-area">
          <div class="tld-area-head">
            <a class="lab" href="#/project/tasks?area=${encodeURIComponent(g.area.code)}&month=all&done=1"
               title="${esc(g.area.full)} 업무 전체 보기">${esc(g.area.full)}</a>
            <span class="n">${g.rows.length}건</span>
            <span class="lead">${esc(leadNames(g.area.code))}</span>
          </div>
          ${g.rows.map((t) => `
            <div class="tld-task">
              <span class="due num ${t.is_delayed ? 'late' : ''}">${dueCell(t)}</span>
              <span class="ttl">${titleCell(t)}</span>
              <span class="st">${statusPick(t)}</span>
              <button class="tld-edit" data-task="${esc(t.id)}" aria-label="상세 편집으로 이동"
                      title="상세 편집">✎</button>
              <button class="tld-del" data-del-task="${esc(t.id)}" aria-label="업무 삭제" title="삭제">×</button>
            </div>`).join('')}
        </section>`).join('')}</div>`
        : '<p class="hint" style="padding:14px 2px">이 페이즈에 배정된 업무가 없습니다.</p>'}`;
    return undefined;
  }

  root.addEventListener('change', async (e) => {
    const st = e.target.closest('[data-status]');
    if (st) {
      try {
        await api.patch(`/api/tasks/${st.dataset.status}`, { status: st.value });
        toast('상태를 바꿨습니다.');
      } catch (err) { toast(err.message, true); }
      // 페이즈 진행률이 함께 달라진다
      return reload();
    }
    const ttl = e.target.closest('[data-title]');
    if (ttl) {
      const next = ttl.value.replace(/\s+/g, ' ').trim();   // 줄바꿈은 제목에 남기지 않는다
      if (!next) { toast('업무명을 비울 수는 없습니다.', true); return reload(); }
      if (next === ttl.defaultValue) return undefined;
      try {
        await api.patch(`/api/tasks/${ttl.dataset.title}`, { title: next });
        ttl.defaultValue = next;
        toast('업무명을 바꿨습니다.');
      } catch (err) { toast(err.message, true); reload(); }
      return undefined;
    }
    return undefined;
  });

  autoGrow(root);

  // 마감일은 누를 때 입력칸이 된다. 바뀌면 페이즈 기간·진행도 달라지므로 다시 불러온다.
  bindDueEdit(root, async (id, value) => {
    if (!value) { toast('마감일을 비울 수는 없습니다.', true); return reload(); }
    try {
      await api.patch(`/api/tasks/${id}`, { due_date: value });
      toast('마감일을 바꿨습니다.');
    } catch (err) { toast(err.message, true); }
    return reload();
  });

  root.addEventListener('keydown', (e) => {
    const ttl = e.target.closest('[data-title]');
    if (!ttl) return;
    if (e.key === 'Enter') { e.preventDefault(); ttl.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); ttl.value = ttl.defaultValue; syncTitleCell(ttl); ttl.blur(); }
  });

  root.addEventListener('click', (e) => {
    const addP = e.target.closest('[data-add-phase]');
    if (addP) return phaseForm({ projectId: addP.dataset.addPhase, onSaved: reload });

    const addM = e.target.closest('[data-add-milestone]');
    if (addM) return milestoneForm({ projectId: addM.dataset.addMilestone, phases: allPhases, onSaved: reload });

    const ph = e.target.closest('[data-phase]');
    if (ph) {
      const found = allPhases.find((p) => p.id === ph.dataset.phase);
      if (found) return phaseForm({ phase: found, projectId: found.project_id, onSaved: reload });
    }

    const openPh = e.target.closest('[data-open-phase]');
    if (openPh) return togglePhase(openPh.dataset.openPhase);

    if (e.target.closest('[data-close-detail]')) return closeDetail();

    const delTask = e.target.closest('[data-del-task]');
    if (delTask) {
      const title = delTask.closest('.tld-task')?.querySelector('.ttl-edit')?.value ?? '이 업무';
      return confirmModal(`「${title}」을(를) 삭제할까요? 연결된 이슈는 남습니다.`,
        { confirmLabel: '삭제', danger: true }).then(async (ok) => {
        if (!ok) return;
        try {
          await api.del(`/api/tasks/${delTask.dataset.delTask}`);
          toast('업무를 삭제했습니다.');
        } catch (err) { toast(err.message, true); }
        reload();
      });
    }

    const editPr = e.target.closest('[data-edit-project]');
    if (editPr) {
      const pr = state.projects.find((x) => x.id === editPr.dataset.editProject);
      if (pr) return projectForm({ project: pr, onSaved: reload });
    }

    const task = e.target.closest('[data-task]');
    if (task) return go(`#/project/tasks/${task.dataset.task}`);

    const ms = e.target.closest('[data-milestone], [data-milestone-row]');
    if (ms) {
      const id = ms.dataset.milestone || ms.dataset.milestoneRow;
      const found = live.flatMap((r) => r.milestones).find((m) => m.id === id);
      if (found) return milestoneForm({ milestone: found, projectId: found.project_id, phases: allPhases, onSaved: reload });
    }
    return undefined;
  });

  // 백로그는 펼칠 때 한 번만 불러온다 — 타임라인을 여는 값이 아니라 곁들이는 값이다
  (function enableBacklog() {
    const box = root.querySelector('.tl-backlog');
    const body = root.querySelector('#tl-backlog-body');
    const nBox = root.querySelector('#tl-backlog-n');
    let loaded = false;

    const paint = (list) => {
      nBox.textContent = `${list.length}건`;
      body.innerHTML = list.length
        ? `<div class="tk-rows">${list.map((t) => `
            <div class="tld-task">
              <span class="due num"><span class="due-view" data-due="${esc(t.id)}"
                    data-date="" title="눌러서 마감일 정하기">미정</span></span>
              <span class="ttl">${titleCell(t)}</span>
              <span class="st">${statusPick(t)}</span>
              <button class="tld-edit" data-task="${esc(t.id)}" aria-label="상세 편집으로 이동"
                      title="상세 편집">✎</button>
              <button class="tld-del" data-del-task="${esc(t.id)}" aria-label="업무 삭제" title="삭제">×</button>
            </div>`).join('')}</div>`
        : '<p class="hint" style="padding:12px 2px">백로그가 비어 있습니다. 업무를 등록할 때 마감일을 비우면 여기로 들어옵니다.</p>';
    };

    const load = async () => {
      try {
        paint(await api.get('/api/tasks?backlog=1'));
        loaded = true;
      } catch (err) {
        body.innerHTML = errorBox(err.message);
      }
    };

    box.addEventListener('toggle', () => { if (box.open && !loaded) load(); });
    // 몇 건인지는 접혀 있어도 보여 준다
    api.get('/api/tasks?backlog=1').then((list) => {
      nBox.textContent = `${list.length}건`;
      if (box.open) { paint(list); loaded = true; }
    }).catch(() => { nBox.textContent = ''; });
  }());

  // 아까 열어 둔 페이즈가 아직 있으면 도로 펴 준다.
  // 저장하고 나면 화면을 다시 그리는데, 그때마다 표가 사라지면 고칠 수가 없다.
  if (lastOpenPhase && allPhases.some((p) => p.id === lastOpenPhase)) {
    const want = lastOpenPhase;
    lastOpenPhase = null;    // togglePhase 가 '같은 것을 또 눌렀다'로 보지 않게 한다
    togglePhase(want);
  } else {
    lastOpenPhase = null;
  }
}

function tlHead() {
  return `
    <div class="page-head">
      <div>
        <h1>타임라인</h1>
        <div class="sub">프로젝트 · 페이즈 기간과 마일스톤을 한 화면에서 봅니다.</div>
      </div>
    </div>`;
}







const won = (n) => `${Number(n || 0).toLocaleString('ko-KR')}원`;

const WEEK_LABELS = ['월', '화', '수', '목', '금', '토', '일'];
const dayShift = (iso, n) =>
  new Date(Date.parse(`${iso}T00:00:00Z`) + n * 86_400_000).toISOString().slice(0, 10);
const mmdd = (iso) => `${Number(iso.slice(5, 7))}/${Number(iso.slice(8, 10))}`;
const fmtHours = (n) => (n ? String(Math.round(n * 10) / 10) : '');

async function renderTime(root, query) {
  const p = new URLSearchParams(query);
  const week = p.get('week') || '';
  root.innerHTML = loading();

  let sheet;
  let summary;
  let myTasks;
  let spend;
  try {
    [sheet, myTasks] = await Promise.all([
      api.get(`/api/time/week${week ? `?week=${encodeURIComponent(week)}` : ''}`),
      api.get('/api/tasks?owner=me&done=1'),
    ]);
    [summary, spend] = await Promise.all([
      api.get(`/api/time/summary?from=${sheet.period.start}&to=${sheet.period.end}`),
      api.get(`/api/expenses?from=${sheet.period.start}&to=${sheet.period.end}`),
    ]);
  } catch (err) {
    root.innerHTML = errorBox(err.message);
    return;
  }

  const dates = WEEK_LABELS.map((_, i) => dayShift(sheet.period.start, i));
  const dayTotal = (d) => sheet.rows.reduce((n, r) => n + (r.days[d]?.hours ?? 0), 0);
  const inSheet = new Set(sheet.rows.map((r) => r.task_id));
  const addable = myTasks.filter((t) => !inSheet.has(t.id));

  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1>타임트래킹</h1>
        <div class="sub">${mmdd(sheet.period.start)} ~ ${mmdd(sheet.period.end)} · 이번 주 <b>${fmtHours(sheet.total) || 0}시간</b></div>
      </div>
      <div class="page-actions">
        <button class="btn" data-new-expense>+ 경비</button>
        <button class="btn" data-week="${esc(dayShift(sheet.period.start, -7))}">◀ 지난주</button>
        <button class="btn" data-week="${esc(dayShift(sheet.period.start, 7))}">다음주 ▶</button>
      </div>
    </div>

    <section>
      <div class="section-head">
        <h2>내 타임시트</h2>
        <span class="meta">숫자를 입력하면 바로 저장됩니다 · 비우면 삭제</span>
      </div>

      ${sheet.rows.length || addable.length ? `
        <div class="table-wrap sheet-wrap">
          <table class="sheet">
            <thead>
              <tr>
                <th>업무</th>
                ${dates.map((d, i) => `<th class="num ${d === state.today ? 'is-today' : ''}">
                  <span class="dow">${WEEK_LABELS[i]}</span><span class="dnum">${mmdd(d)}</span></th>`).join('')}
                <th class="num">합계</th>
              </tr>
            </thead>
            <tbody>
              ${sheet.rows.map((r) => `
                <tr>
                  <td class="title-cell">
                    <a href="#/project/tasks/${esc(r.task_id)}">${esc(r.title)}</a>
                    <span class="sheet-sub">${projectName(r.project_id, projectLabel(r.project_name))} · ${esc(areaMeta(r.area).label)}</span>
                  </td>
                  ${dates.map((d) => `<td class="num ${d === state.today ? 'is-today' : ''}">
                    <input type="text" inputmode="decimal" class="hcell"
                           data-task="${esc(r.task_id)}" data-date="${d}"
                           value="${fmtHours(r.days[d]?.hours)}" aria-label="${esc(r.title)} ${mmdd(d)} 시간">
                  </td>`).join('')}
                  <td class="num row-total">${fmtHours(r.total)}</td>
                </tr>`).join('')}
            </tbody>
            <tfoot>
              <tr>
                <td>일별 합계</td>
                ${dates.map((d) => `<td class="num ${d === state.today ? 'is-today' : ''}" data-daytotal="${d}">${fmtHours(dayTotal(d))}</td>`).join('')}
                <td class="num grand">${fmtHours(sheet.total)}</td>
              </tr>
            </tfoot>
          </table>
        </div>

        ${addable.length ? `
          <div class="sheet-add">
            <label class="field">
              <span class="lab">업무 추가</span>
              <select data-add-task>
                <option value="">내 영역 업무 선택</option>
                ${addable.map((t) => `<option value="${esc(t.id)}">${esc(t.title)} — ${esc(t.project_name)}</option>`).join('')}
              </select>
            </label>
            <span class="hint">추가한 업무에 시간을 입력하면 목록에 남습니다.</span>
          </div>` : ''}
      ` : empty({
        title: '기록할 업무가 없습니다',
        hint: '내가 리드인 영역의 업무가 있어야 시간을 기록할 수 있습니다.',
        action: '<button class="btn btn-primary" data-new-task>+ 업무 등록</button>',
      })}
    </section>

    <section class="section">
      <div class="section-head">
        <h2>이번 주 투입</h2>
        <span class="meta">팀 전체 ${fmtHours(summary.total) || 0}시간</span>
      </div>
      <div class="grid-2">
        <div>
          <h3 class="mini-head">프로젝트별</h3>
          <div class="bars">
            ${summary.projects.length ? summary.projects.map((r) => `
              <div class="bar" style="cursor:default;--pc:var(--p${projectTone(r.key)})">
                <span class="name">${esc(r.label)}</span>
                ${progressBar(summary.total ? Math.round((r.hours / summary.total) * 100) : 0)}
                <span class="pct">${fmtHours(r.hours)}h</span>
              </div>`).join('') : '<p class="hint">기록된 시간이 없습니다.</p>'}
          </div>
        </div>
        <div>
          <h3 class="mini-head">구성원별</h3>
          <div class="bars">
            ${summary.members.length ? summary.members.map((r) => `
              <div class="bar" style="cursor:default">
                <span class="name">${esc(r.label)}</span>
                ${progressBar(summary.total ? Math.round((r.hours / summary.total) * 100) : 0)}
                <span class="pct">${fmtHours(r.hours)}h</span>
              </div>`).join('') : '<p class="hint">기록된 시간이 없습니다.</p>'}
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>이번 주 경비</h2>
        <span class="meta">실비만 기록합니다 · 요율·인건비는 다루지 않습니다</span>
      </div>
      <div class="exp-head">
        <span class="exp-total">${won(spend.summary.total)}</span>
        <span class="hint">${spend.summary.count}건</span>
      </div>
      ${spend.summary.categories.length ? `
        <div class="exp-cats">
          ${spend.summary.categories.map((c) => `
            <span class="exp-cat">${esc(c.label)} <b>${won(c.amount)}</b></span>`).join('')}
        </div>` : ''}
      ${spend.rows.length ? `
        <div class="table-wrap">
          <table class="list">
            <thead><tr><th>사용일</th><th>프로젝트</th><th>분류</th><th>내용</th><th>지출자</th><th class="num">금액</th><th></th></tr></thead>
            <tbody>
              ${spend.rows.map((r) => `
                <tr>
                  <td data-label="사용일" class="nowrap">${shortDate(r.spent_on)}</td>
                  <td data-label="프로젝트">${projectName(r.project_id, projectLabel(r.project_name))}</td>
                  <td data-label="분류">${esc(catLabel(r.category))}</td>
                  <td data-label="내용">${esc(r.memo || '-')}${
                    r.task_title ? `<span class="hint"> · ${esc(r.task_title)}</span>` : ''}</td>
                  <td data-label="지출자">${esc(r.display_name)}</td>
                  <td data-label="금액" class="num nowrap">${won(r.amount)}</td>
                  <td class="num"><button class="btn btn-ghost sm" data-del-expense="${esc(r.id)}">삭제</button></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>` : '<p class="hint">이번 주에 등록된 경비가 없습니다.</p>'}
    </section>`;

  function catLabel(code) {
    return (state.meta?.expense_categories ?? []).find((c) => c.code === code)?.label ?? code;
  }

  const reload = () => window.dispatchEvent(new Event('kf:reload'));

  const save = async (input) => {
    const raw = input.value.trim();
    const hours = raw === '' ? 0 : Number(raw);
    if (raw !== '' && (!Number.isFinite(hours) || hours < 0)) {
      toast('시간을 숫자로 입력해 주세요.', true);
      input.value = input.dataset.prev ?? '';
      return;
    }
    try {
      await api.post('/api/time', {
        task_id: input.dataset.task,
        work_date: input.dataset.date,
        hours,
      });
      reload();
    } catch (err) {
      toast(err.message, true);
      input.value = input.dataset.prev ?? '';
    }
  };

  root.addEventListener('focusin', (e) => {
    const i = e.target.closest('.hcell');
    if (i) i.dataset.prev = i.value;
  });
  root.addEventListener('change', async (e) => {
    const cell = e.target.closest('.hcell');
    if (cell) return save(cell);
    const add = e.target.closest('[data-add-task]');
    if (add?.value) {
      // 값이 0 인 기록은 저장되지 않으므로, 오늘 자리에 0.5 를 넣어 행을 만든다
      try {
        await api.post('/api/time', { task_id: add.value, work_date: state.today, hours: 0.5 });
        toast('업무를 타임시트에 추가했습니다.');
        reload();
      } catch (err) { toast(err.message, true); }
    }
  });
  root.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.closest('.hcell')) { e.preventDefault(); e.target.blur(); }
  });
  root.addEventListener('click', async (e) => {
    const w = e.target.closest('[data-week]');
    if (w) return go(`#/time?week=${w.dataset.week}`);

    if (e.target.closest('[data-new-expense]')) {
      return expenseForm({ defaults: { spent_on: state.today }, onSaved: reload });
    }

    const del = e.target.closest('[data-del-expense]');
    if (del) {
      const ok = await confirmModal('이 경비 기록을 삭제할까요?', { danger: true });
      if (!ok) return undefined;
      try {
        await api.del(`/api/expenses/${del.dataset.delExpense}`);
        toast('경비를 삭제했습니다.');
        reload();
      } catch (err) { toast(err.message, true); }
    }
    return undefined;
  });
  void pctText;
}

          <tbody>

                <td class="title-cell"><a href="#/project/tasks/${esc(r.task_id)}">${esc(r.title)}</a></td>
                <td data-label="업체">${esc(r.vendor_name)}${r.vendor_worker_name ? `<span class="hint"> · ${esc(r.vendor_worker_name)}</span>` : ''}</td>

                <td data-label="납품 예정" class="nowrap num ${r.delivery_due_date < state.today && r.payment_status !== 'PAID' ? 'late' : ''}">

                <td data-label="금액" class="nowrap">

          ${spend.summary.projects.map((r) => `
            <div class="bar" style="cursor:default">

  const reload = () => window.dispatchEvent(new Event('kf:reload'));

      toast(err.message, true);
      reload();

  root.addEventListener('change', (e) => {
    const amount = e.target.closest('[data-amount]');
    if (amount) {
      const raw = amount.value.replace(/[^\d]/g, '');
      return patch(amount.dataset.amount, { amount: raw === '' ? null : Number(raw) }, amount);
    }
    const pay = e.target.closest('[data-pay]');
    if (pay) return patch(pay.dataset.pay, { payment_status: pay.value }, pay);

  void payLabel;
}


// 편집 코드와 저장점을 한 자리에서 다룬다.
// 오른쪽 위 등급 표시를 누르면 열린다.





const SNAP_KIND = { AUTO: '자동', MANUAL: '직접 저장', PRE_RESTORE: '되돌리기 직전' };

// 나눠 준 코드 한 줄. 코드 자체는 해시로만 있어 여기에도 나오지 않는다 —
// 누구에게 준 것인지(label)와 실제로 누가 쓰고 있는지만 보인다.
const codeRow = (c) => `
  <li class="gc-row${c.active ? '' : ' off'}">
    <span class="gc-name">
      <b>${esc(c.label ?? '이름 없음')}</b>
      <span class="rp-meta">${c.role === 'ADMIN' ? '관리자' : '편집'}${
        c.claimed_by ? ` · ${esc(c.claimed_by)}` : ' · 아직 안 씀'}${
        c.use_count ? ` · ${esc(c.use_count)}회` : ''}</span>
    </span>
    <span class="rp-meta gc-when">${c.last_used_at ? esc(dateTime(c.last_used_at)) : '-'}</span>
    <button class="btn btn-ghost gc-go" data-code="${esc(c.id)}" data-next="${c.active ? '0' : '1'}">${
      c.active ? '정지' : '다시 쓰기'}</button>
  </li>`;

const pointRow = (r) => `
  <li class="rp-row" data-point="${esc(r.id)}">
    <span class="rp-when">${esc(dateTime(r.taken_at))}</span>
    <span class="rp-what">
      <b>${esc(r.label ?? '저장점')}</b>
      <span class="rp-meta">${esc(SNAP_KIND[r.kind] ?? r.kind)} · ${esc(r.row_count)}건${
        r.taken_by ? ` · ${esc(r.taken_by)}` : ''}</span>
    </span>
    ${canAdmin()
      ? `<button class="btn btn-ghost rp-go" data-restore="${esc(r.id)}">되돌리기</button>`
      : '<span class="rp-meta">관리자만</span>'}
  </li>`;

function gatePanel() {
  const body = () => {
    const role = currentRole();
    return `
      <div class="gate-now ${role ? 'on' : ''}">
        <b>${esc(roleLabel())}</b>
        <span class="hint">${role
          ? '이 브라우저에 기억됩니다. 공용 컴퓨터라면 쓰고 나서 나가 주세요.'
          : '보기는 누구나 됩니다. 고치려면 코드가 필요합니다.'}</span>
      </div>

      ${role ? `
        <div class="gate-acts">
          <button class="btn btn-ghost" data-lock>보기 전용으로 나가기</button>
        </div>
      ` : `
        <form class="gate-form" data-unlock>
          <label class="field">
            <span class="lab">편집 코드</span>
            <input type="password" name="code" autocomplete="one-time-code"
                   placeholder="예: kv-••••-••••" autocapitalize="off" spellcheck="false">
          </label>
          <button class="btn btn-primary" type="submit">들어가기</button>
        </form>
      `}

      ${canAdmin() ? `
      <section class="gate-codes">
        <h3>나눠 준 코드</h3>
        <p class="hint">코드는 해시로만 저장돼 다시 보여 줄 수 없습니다. 잃어버리면 정지시키고 새로 만들어 주세요.</p>
        <ul class="rp-list gc-list" data-codes><li class="hint">불러오는 중…</li></ul>
      </section>` : ''}

      <section class="gate-points">
        <div class="gate-points-head">
          <h3>저장점</h3>
          ${canEdit() ? '<button class="btn btn-ghost" data-take>지금 상태 저장</button>' : ''}
        </div>
        <p class="hint">여기 있는 시점으로 전체를 되돌릴 수 있습니다. 되돌리기 직전 상태도 저장점으로 남습니다.</p>
        <ul class="rp-list" data-points><li class="hint">불러오는 중…</li></ul>
      </section>`;
  };

  const m = modal({
    title: '편집 권한 · 저장점',
    body: body(),
    onMount: ({ root, close }) => {
      const paint = () => {
        root.querySelector('.modal-body').innerHTML = body();
        loadPoints();
        loadCodes();
      };

      const loadCodes = async () => {
        const box = root.querySelector('[data-codes]');
        if (!box) return;
        try {
          const rows = await api.get('/api/gate-codes');
          box.innerHTML = rows.length ? rows.map(codeRow).join('') : '<li class="hint">코드가 없습니다.</li>';
        } catch (err) {
          box.innerHTML = `<li class="hint">${esc(err.message)}</li>`;
        }
      };

      const loadPoints = async () => {
        const box = root.querySelector('[data-points]');
        if (!box) return;
        try {
          const rows = await api.get('/api/restore-points');
          box.innerHTML = rows.length
            ? rows.map(pointRow).join('')
            : '<li class="hint">아직 저장점이 없습니다.</li>';
        } catch (err) {
          box.innerHTML = `<li class="hint">${esc(err.message)}</li>`;
        }
      };
      loadPoints();
      loadCodes();

      root.addEventListener('submit', async (e) => {
        const form = e.target.closest('[data-unlock]');
        if (!form) return;
        e.preventDefault();
        const btn = form.querySelector('button[type=submit]');
        btn.disabled = true;
        btn.textContent = '확인 중…';
        try {
          const got = await unlock(form.querySelector('[name=code]').value);
          if (!got) {
            toast('코드가 맞지 않습니다.', true);
            btn.disabled = false;
            btn.textContent = '들어가기';
            return;
          }
          toast(got === 'ADMIN' ? '관리자로 들어왔습니다.' : '편집 모드로 들어왔습니다.');
          paint();
          window.dispatchEvent(new Event('kf:reload'));
        } catch (err) {
          toast(err.message, true);
          btn.disabled = false;
          btn.textContent = '들어가기';
        }
      });

      root.addEventListener('click', async (e) => {
        if (e.target.closest('[data-lock]')) {
          lock();
          toast('보기 전용으로 바꿨습니다.');
          paint();
          window.dispatchEvent(new Event('kf:reload'));
          return;
        }

        const take = e.target.closest('[data-take]');
        if (take) {
          take.disabled = true;
          try {
            await api.post('/api/restore-points', { label: `${new Date().getMonth() + 1}월 ${new Date().getDate()}일 저장` });
            toast('지금 상태를 저장점으로 남겼습니다.');
            loadPoints();
          } catch (err) { toast(err.message, true); }
          take.disabled = false;
          return;
        }

        const code = e.target.closest('[data-code]');
        if (code) {
          const on = code.dataset.next === '1';
          if (!on && !await confirmModal(
            '이 코드를 정지합니다. 그 코드를 들고 있는 사람은 다음부터 보기 전용이 됩니다.',
            { confirmLabel: '정지', danger: true })) return;
          code.disabled = true;
          try {
            await api.patch(`/api/gate-codes/${code.dataset.code}`, { active: on });
            toast(on ? '다시 쓸 수 있게 했습니다.' : '코드를 정지했습니다.');
          } catch (err) { toast(err.message, true); }
          code.disabled = false;
          loadCodes();
          return;
        }

        const go = e.target.closest('[data-restore]');
        if (go) {
          const row = go.closest('.rp-row');
          const when = row.querySelector('.rp-when').textContent;
          const ok = await confirmModal(
            `${when} 시점으로 전체를 되돌립니다. 그 뒤에 바꾼 내용은 모두 사라집니다. 되돌리기 직전 상태는 저장점으로 남습니다.`,
            { confirmLabel: '되돌리기', danger: true },
          );
          if (!ok) return;
          go.disabled = true;
          go.textContent = '되돌리는 중…';
          try {
            const r = await api.post(`/api/restore-points/${go.dataset.restore}/restore`);
            toast(`${r.restored}건을 되돌렸습니다.`);
            close();
            window.dispatchEvent(new Event('kf:reload'));
          } catch (err) {
            toast(err.message, true);
            go.disabled = false;
            go.textContent = '되돌리기';
          }
        }
      });
    },
  });
  return m;
}

















const view = document.getElementById('view');

// 프로젝트 매니징 아래의 화면들.
// 첫 칸이 곧 들어왔을 때 보이는 화면이다 — 순서를 바꾸면 진입 화면도 함께 바뀐다.
// 공유 저장소에 닿아 있는지 알려 준다. 서버 모드에서는 이 알림이 오지 않아 그대로 숨어 있다.
window.addEventListener('kf:sync', (e) => {
  const badge = document.getElementById('sync-badge');

  const ok = Boolean(e.detail?.ok);

});

// 지금 무엇을 할 수 있는지 한 곳에 적어 둔다. CSS 가 이것을 보고 편집칸을 열고 닫는다.
function paintGate() {
  const role = currentRole();
  document.body.dataset.gate = role ? role.toLowerCase() : 'view';
  const badge = document.getElementById('gate-badge');
  if (!badge) return;
  badge.textContent = roleLabel();
  badge.classList.toggle('on', Boolean(role));
  badge.title = canEdit()
    ? '편집할 수 있습니다. 눌러서 저장점을 보거나 보기 전용으로 나갑니다.'
    : '보기 전용입니다. 눌러서 편집 코드를 넣습니다.';
}
window.addEventListener('kf:gate', paintGate);
document.getElementById('gate-badge')?.addEventListener('click', () => gatePanel());

// 보기 전용일 때 편집칸에 손이 가면, 아무 일도 안 일어나는 대신 문을 연다.
// CSS 로도 잠그지만 그것만으로는 키보드가 남는다 — 여기서 확실히 끊는다.
const EDIT_TARGETS = [
  '[data-new-task]', '[data-new-issue]', '[data-new-project]', '[data-edit-project]',
  '[data-add-phase]', '[data-add-milestone]', '[data-area-leads]',
  '[data-del]', '[data-del-task]', '[data-del-project]', '[data-sub-del]', '[data-sub-add]',
  '.due-view', '.chip-select', '.status-select', '.ttl-edit', '.tk-del', '.tld-del', '.pr-edit',
  '[data-title]', '[data-due]', '[data-status]', '[data-owner]', '[data-area]',
].join(',');

const blockWhenLocked = (e) => {
  if (canEdit()) return;
  if (e.target.closest('#modal-root')) return;   // 문 자체는 열려 있어야 한다
  if (!e.target.closest(EDIT_TARGETS)) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.type === 'click') gatePanel();
};
for (const type of ['click', 'change', 'keydown', 'pointerdown']) {
  document.addEventListener(type, blockWhenLocked, true);
}

// 저장소가 쓰기를 거절하면 바로 알린다 — 조용히 사라지는 것이 제일 나쁘다
window.addEventListener('kf:denied', (e) => {
  toast(e.detail?.message ?? '편집 권한이 확인되지 않았습니다.', true);

});

];
// 탭 순서는 사람마다 다르다 — 끌어서 바꾸고 이 브라우저에 저장한다.
// 저장이 막힌 환경에서도 기본 순서로 그대로 동작해야 한다.
const TAB_KEY = 'kf.tabs';
const DEFAULT_ORDER = PROJECT_TABS.map((t) => t.key);
let tabOrder = (() => {
  const saved = (readPref(TAB_KEY) || '').split(',').filter((k) => DEFAULT_ORDER.includes(k));
  // 저장된 뒤에 탭이 늘어도 빠지지 않도록 남은 것을 뒤에 붙인다
  return [...saved, ...DEFAULT_ORDER.filter((k) => !saved.includes(k))];
})();
const orderedTabs = () => tabOrder.map((k) => PROJECT_TABS.find((t) => t.key === k));
const homeTab = () => tabOrder[0];

// 예전 주소를 새 구조로 옮긴다 (#/tasks → #/project/tasks)
const LEGACY = { overview: 'overview', tasks: 'tasks', issues: 'issues', weekly: 'weekly' };

const subNav = (active) => `
  <nav class="subnav" aria-label="프로젝트 매니징 화면">
    ${orderedTabs().map((t) => `<a href="#/project/${t.key}" data-tab="${t.key}" draggable="false"
        class="${t.key === active ? 'on' : ''}"
        title="끌어서 순서를 바꿀 수 있습니다 (키보드: Alt + ← →)">${t.label}</a>`).join('')}
  </nav>`;

/** 탭을 끌어서 자리를 바꾼다. 마우스·터치 모두 같은 코드로 받는다. */
function enableTabDrag(nav) {
  let key = null;
  let moved = false;
  let startX = 0;

  const tabs = () => [...nav.querySelectorAll('a[data-tab]')];

  const move = (from, to) => {
    if (from === to || from < 0 || to < 0) return false;
    tabOrder.splice(to, 0, tabOrder.splice(from, 1)[0]);
    return true;
  };

  const commit = (focusKey) => {
    writePref(TAB_KEY, tabOrder.join(','));
    toast(`탭 순서를 저장했습니다 · 첫 화면은 ${orderedTabs()[0].label}`);
    if (focusKey) {
      render().then(() => nav.ownerDocument.querySelector(`.subnav a[data-tab="${focusKey}"]`)?.focus());
    }
  };

  nav.addEventListener('pointerdown', (e) => {
    const a = e.target.closest('a[data-tab]');
    if (!a || (e.pointerType === 'mouse' && e.button !== 0)) return;
    key = a.dataset.tab;
    moved = false;
    startX = e.clientX;
    a.setPointerCapture?.(e.pointerId);
  });

  nav.addEventListener('pointermove', (e) => {
    if (!key) return;
    if (!moved && Math.abs(e.clientX - startX) < 6) return;
    moved = true;
    nav.classList.add('reordering');
    const el = nav.querySelector(`a[data-tab="${key}"]`);
    if (!el) return;
    el.classList.add('dragging');
    // 커서가 올라간 탭과 자리를 맞바꾼다. 다시 그리면 드래그가 끊기므로 DOM 만 옮긴다.
    const over = tabs().find((n) => {
      if (n === el) return false;
      const r = n.getBoundingClientRect();
      return e.clientX >= r.left && e.clientX <= r.right;
    });
    if (!over) return;
    const from = tabOrder.indexOf(key);
    const to = tabOrder.indexOf(over.dataset.tab);
    if (!move(from, to)) return;
    if (to > from) over.after(el); else over.before(el);
  });

  const end = () => {
    if (!key) return;
    nav.querySelector(`a[data-tab="${key}"]`)?.classList.remove('dragging');
    nav.classList.remove('reordering');
    if (moved) commit(null);
    key = null;
  };
  nav.addEventListener('pointerup', end);
  nav.addEventListener('pointercancel', end);

  // 끌어서 놓은 것이면 화면을 옮기지 않는다
  nav.addEventListener('click', (e) => {
    if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
  }, true);

  // 키보드로도 옮길 수 있어야 한다
  nav.addEventListener('keydown', (e) => {
    const a = e.target.closest('a[data-tab]');
    if (!a || !e.altKey) return;
    const dir = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
    if (!dir) return;
    e.preventDefault();
    const from = tabOrder.indexOf(a.dataset.tab);
    if (move(from, Math.min(Math.max(from + dir, 0), tabOrder.length - 1))) commit(a.dataset.tab);
  });
}

const parseHash = () => {
  const raw = window.location.hash.replace(/^#/, '') || '/project';
  const [path, query = ''] = raw.split('?');
  return { segments: path.split('/').filter(Boolean), query };
};

async function render() {
  const { segments, query } = parseHash();
  let [top, ...rest] = segments;

  // 예전 주소는 새 구조로 돌린다
  if (LEGACY[top]) {
    window.location.replace(`#/project/${LEGACY[top]}${rest.length ? `/${rest.join('/')}` : ''}${query ? `?${query}` : ''}`);
    return;
  }
  if (!top) top = 'project';

  document.querySelectorAll('#gnb a, .topbar-util').forEach((a) => {
    a.classList.toggle('active', a.dataset.nav === top);
  });

  // 뷰마다 새 노드를 만들어 이전 리스너를 함께 버린다
  const fresh = document.createElement('div');
  view.replaceChildren(fresh);

  try {
    if (top === 'project') {
      const sub = PROJECT_TABS.some((t) => t.key === rest[0]) ? rest[0] : homeTab();
      const id = rest[1];
      fresh.innerHTML = subNav(sub);
      enableTabDrag(fresh.querySelector('.subnav'));
      const host = document.createElement('div');
      fresh.appendChild(host);
      if (sub === 'overview') await renderOverview(host);
      else if (sub === 'tasks') { if (id) await renderTaskDetail(host, id); else await renderTasks(host, query); }
      else if (sub === 'timeline') await renderTimeline(host);
      else if (sub === 'issues') { if (id) await renderIssueDetail(host, id); else await renderIssues(host, query); }
      else await renderWeekly(host, query);
      return;
    }
    switch (top) {
      // 돈 이야기는 관리자만 연다. 탭은 그대로 둔다 —
      // 없는 것처럼 감추면 "인보이싱이 어디 갔냐"는 질문만 늘어난다.
      case 'time':
        if (!canSeeMoney()) { fresh.innerHTML = moneyLocked('타임트래킹'); break; }
        await renderTime(fresh, query);
        break;
      case 'invoice':
        if (!canSeeMoney()) { fresh.innerHTML = moneyLocked('인보이싱'); break; }
        await renderInvoice(fresh, query);
        break;
      case 'notifications': await renderNotifications(fresh); break;
      default:
        fresh.innerHTML = errorBox('없는 화면입니다.');
    }
  } catch (err) {
    fresh.innerHTML = errorBox(err.message || '화면을 그리지 못했습니다.');
    console.error(err);
  }
}

/**
 * 등록한 업무가 있는 곳으로 목록을 옮긴다.
 * 만들어 놓고 못 찾으면 만든 보람이 없다 — 마감일이 없으면 백로그로,
 * 다른 달이면 그 달로 옮기고 방금 만든 줄을 짚어 준다.
 *
 * 목록을 보고 있지 않을 때는 끌고 가지 않는다. 타임라인에서 등록했는데
 * 갑자기 업무 목록으로 튀면 하던 일을 잃는다 — 그때는 토스트가 어디로
 * 갔는지 말해 준다.
 */
function revealTask(saved) {
  const onList = /^#\/project\/tasks(\?|$)/.test(window.location.hash);
  if (!saved?.id || !onList) {
    window.dispatchEvent(new Event('kf:reload'));
    return;
  }
  const q = new URLSearchParams(window.location.hash.split('?')[1] ?? '');
  q.set('month', saved.due_date ? saved.due_date.slice(0, 7) : 'backlog');
  q.set('new', saved.id);           // 여기 있다고 짚어 주는 표시
  window.location.hash = `#/project/tasks?${q.toString()}`;   // hashchange 가 다시 그린다
}

const moneyLocked = (what) => `
  <div class="page-head"><div><h1>${esc(what)}</h1>
    <div class="sub">경비·지급 금액이 있는 화면입니다</div></div></div>
  ${empty({
    title: '관리자만 볼 수 있습니다',
    hint: '관리자 코드를 넣으면 열립니다. 코드가 없으면 인보이싱 담당에게 요청해 주세요.',
    action: '<button class="btn btn-primary" data-open-gate>관리자 코드 넣기</button>',
  })}`;

function renderMePicker() {
  const sel = document.getElementById('me-select');
  sel.innerHTML = state.members
    .filter((m) => m.is_active)
    .map((m) => `<option value="${esc(m.slack_user_id)}"${m.slack_user_id === state.me ? ' selected' : ''}>${esc(m.display_name)}</option>`)
    .join('');
}

async function boot() {
  view.innerHTML = loading();
  paintGate();
  try {
    // 저장해 둔 코드가 있으면 조용히 다시 들어간다
    await resume().catch(() => null);
    paintGate();
    await loadBootstrap();
  } catch (err) {
    view.innerHTML = errorBox(`${err.message} — 서버가 실행 중인지 확인해 주세요.`);
    return;
  }
  renderMePicker();
  paintGate();
  await render();
}

document.getElementById('me-select').addEventListener('change', async (e) => {
  setMe(e.target.value);
  await render();
});

// 로그인 대신 현재 사용자를 고르는 구조이므로, 바뀌면 화면을 다시 그린다
document.getElementById('btn-new-task').addEventListener('click', () => {
  if (!canEdit()) return gatePanel();
  taskForm({ onSaved: revealTask });
});

// 각 뷰의 "+ 업무 등록" 버튼 (위임)
view.addEventListener('click', (e) => {
  if (e.target.closest('[data-open-gate]')) return void gatePanel();
  if (!canEdit() && e.target.closest('[data-new-task], [data-new-issue]')) {
    e.preventDefault();
    e.stopPropagation();
    return void gatePanel();
  }
  if (e.target.closest('[data-new-task]')) {
    taskForm({ onSaved: revealTask });
  } else if (e.target.closest('[data-new-issue]')) {
    issueForm({ onSaved: () => window.dispatchEvent(new Event('kf:reload')) });
  }
});

window.addEventListener('hashchange', render);
window.addEventListener('kf:reload', async () => {
  await loadBootstrap().catch(() => {});
  renderMePicker();
  paintGate();
  render();
});

boot();

</script>
