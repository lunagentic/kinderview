// ── 모달 ────────────────────────────────────────────────
let openModals = 0;

function modal({ title, body, footer, wide = false, onMount }) {
  const root = document.getElementById('modal-root');
  const backdrop = document.createElement('div');
  backdrop.className = 'backdrop';
  backdrop.innerHTML = `
    <div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head">
        <h2>${esc(title)}</h2>
        <button class="btn btn-ghost" data-close aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
    </div>`;
  root.appendChild(backdrop);
  openModals += 1;

  const close = () => {
    backdrop.remove();
    openModals -= 1;
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => { if (e.key === 'Escape' && openModals) close(); };

  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop || e.target.closest('[data-close]')) close();
  });
  document.addEventListener('keydown', onKey);

  const box = backdrop.querySelector('.modal');
  onMount?.({ root: box, close });
  box.querySelector('input,select,textarea,button:not([data-close])')?.focus();
  return { close, root: box };
}

function confirmModal(message, { confirmLabel = '확인', danger = false } = {}) {
  return new Promise((resolve) => {
    const m = modal({
      title: '확인',
      body: `<p>${esc(message)}</p>`,
      footer: `<div class="right">
          <button class="btn" data-close>취소</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(confirmLabel)}</button>
        </div>`,
      onMount({ root, close }) {
        root.querySelector('[data-ok]').addEventListener('click', () => { close(); resolve(true); });
        root.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) resolve(false); });
      },
    });
    void m;
  });
}

        <button type="button" data-remove="${esc(id)}" aria-label="제외">✕</button></span>`;
    }).join('');
    onChange?.(multi ? selected : selected[0] ?? null);
  };

  const renderList = (q = '') => {
    const term = q.trim().toLowerCase();
    const rows = activeMembers().filter((m) => {
      if (selected.includes(m.slack_user_id)) return false;
      if (exclude.includes(m.slack_user_id)) return false;
      if (!term) return true;
      return [m.display_name, m.real_name, m.email, m.slack_user_id]
        .filter(Boolean).some((v) => v.toLowerCase().includes(term));
    });
    listEl.innerHTML = rows.length
      ? rows.map((m) => `<button type="button" data-pick="${esc(m.slack_user_id)}">
          ${avatar(m, 'sm')}<span>${esc(m.display_name)}</span>
          <span style="color:var(--muted);font-size:.78rem">@${esc(m.email?.split('@')[0] ?? m.slack_user_id)}</span>
        </button>`).join('')
      : `<div class="none">일치하는 구성원이 없습니다.</div>`;
    listEl.hidden = false;
  };

  input.addEventListener('focus', () => renderList(input.value));
  input.addEventListener('input', () => renderList(input.value));
  input.addEventListener('blur', () => setTimeout(() => { listEl.hidden = true; }, 160));

  listEl.addEventListener('mousedown', (e) => {
    const btn = e.target.closest('[data-pick]');
    if (!btn) return;
    e.preventDefault();
    const id = btn.dataset.pick;
    selected = multi ? [...selected, id] : [id];
    input.value = '';
    listEl.hidden = true;
    renderSelected();
  });

  selectedEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-remove]');
    if (!btn) return;
    selected = selected.filter((id) => id !== btn.dataset.remove);
    renderSelected();
  });

  renderSelected();
  return {
    get value() { return multi ? selected : selected[0] ?? null; },
    setExclude(list) { exclude = list; },
    set(id) { selected = multi ? [...new Set([...selected, id])] : [id]; renderSelected(); },
  };
}

const pickerMarkup = (label, { required = false, placeholder = '이름 또는 Slack 핸들 검색' }) => `
  <label class="field member-pick">
    <span class="lab">${esc(label)}${required ? '<span class="req">*</span>' : ''}</span>
    <input type="search" data-search placeholder="🔍 ${esc(placeholder)}" autocomplete="off">
    <div class="pick-list" hidden></div>
    <div class="selected"></div>
  </label>`;

const opts = (list, selected, { value = 'code', label = 'label' } = {}) =>
  list.map((o) => `<option value="${esc(o[value])}"${o[value] === selected ? ' selected' : ''}>${esc(o[label])}</option>`).join('');

// ── 업무 등록 / 수정 ────────────────────────────────────
function taskForm({ task = null, defaults = {}, onSaved }) {
  const editing = Boolean(task);
  const area0 = task?.area ?? defaults.area ?? 'PLAN';

  const body = `
    ${editing ? '' : `
    <div class="capture">
      <div class="crow">
        <input type="text" id="capture-input" placeholder="예: 9/15까지 김OO 활동지 디자인 외주 검수, 콘텐츠 패키지">
        <button type="button" class="btn" data-capture>채우기</button>
      </div>
      <div class="chint">한 줄로 쓰면 아래 항목을 채워 줍니다. 채운 값은 그대로 고칠 수 있고, 저장은 직접 누릅니다.</div>
      <div class="cres" hidden></div>
    </div>`}
    <form id="task-form">
      <div class="form-grid">
        <label class="field span2">
          <span class="lab">업무명<span class="req">*</span></span>
          <input type="text" name="title" required maxlength="120" value="${esc(task?.title ?? '')}"
                 placeholder="예: 관찰·평가 UX 개선">
        </label>

        <label class="field">
          <span class="lab">프로젝트<span class="req">*</span></span>
          <select name="project_id" required>
            <option value="">선택</option>
            ${opts(activeProjects(), task?.project_id ?? defaults.project_id, { value: 'id', label: 'name' })}
          </select>
        </label>

        <label class="field">
          <span class="lab">업무 영역<span class="req">*</span></span>
          <select name="area" required>${opts(state.meta.areas, area0)}</select>
        </label>

        <label class="field">
          <span class="lab">담당 <span class="hint" style="font-weight:400">영역 리드가 맡습니다</span></span>
          <div class="lead-box" data-lead-box>영역을 선택해 주세요</div>
        </label>

        <label class="field">
          <span class="lab">마감일<span class="req">*</span></span>
          <input type="date" name="due_date" required value="${esc(task?.due_date ?? '')}">
        </label>

        <label class="field span2">
          <span class="lab">상태</span>
          <select name="status">${opts(statusesFor(area0), task?.status)}</select>
        </label>
      </div>

      <details class="more"${editing ? ' open' : ''}>
        <summary>추가 정보 (협업자 · 시작일 · 우선순위 · 설명)</summary>
        <div class="form-grid" style="margin-top:10px">
          <div class="span2" data-collab-slot>${pickerMarkup('협업자', { placeholder: '함께 참여하는 구성원' })}</div>
          <label class="field">
            <span class="lab">시작일</span>
            <input type="date" name="start_date" value="${esc(task?.start_date ?? '')}">
          </label>
          <label class="field">
            <span class="lab">우선순위</span>
            <select name="priority">${opts(state.meta.priorities, task?.priority ?? 'NORMAL')}</select>
          </label>
          <label class="field span2">
            <span class="lab">업무 설명</span>
            <textarea name="description" placeholder="필요한 배경이나 완료 기준">${esc(task?.description ?? '')}</textarea>
          </label>
        </div>
      </details>

      <fieldset class="fieldset" data-out hidden>
        <legend>외주 정보</legend>
        <div class="form-grid">
          <label class="field">
            <span class="lab">외주 업체<span class="req">*</span></span>
            <input type="text" name="vendor_name" list="vendor-list" value="${esc(task?.vendor_name ?? '')}"
                   placeholder="예: OO 디자인">
            <datalist id="vendor-list">${state.vendors.map((v) => `<option value="${esc(v.name)}">`).join('')}</datalist>
          </label>
          <label class="field">
            <span class="lab">외부 작업자</span>
            <input type="text" name="vendor_worker_name" value="${esc(task?.vendor_worker_name ?? '')}" placeholder="예: 홍길동">
          </label>
          <label class="field">
            <span class="lab">요청일</span>
            <input type="date" name="requested_at" value="${esc(task?.requested_at ?? '')}">
          </label>
          <label class="field">
            <span class="lab">납품 예정일<span class="req">*</span></span>
            <input type="date" name="delivery_due_date" value="${esc(task?.delivery_due_date ?? '')}">
          </label>
          <label class="field">
            <span class="lab">검수 상태</span>
            <select name="review_status">${opts(state.meta.review_statuses, task?.review_status ?? 'NOT_STARTED')}</select>
          </label>
          <label class="field">
            <span class="lab">작업 내용</span>
            <input type="text" name="work_scope" value="${esc(task?.work_scope ?? '')}">
          </label>
        </div>
        <p class="hint" style="margin-top:10px">외주 작업의 <b>내부 담당자</b>는 위의 담당자입니다. 외부 업체·작업자는 KinderFlow 계정이 아닙니다.</p>
      </fieldset>
    </form>`;

  const footer = `
    <label style="display:flex;align-items:center;gap:7px;font-size:.85rem;color:var(--muted)">
      ${editing ? '' : '<input type="checkbox" id="keep-open"> 저장 후 계속 등록'}
    </label>
    <div class="right">
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" data-save>${editing ? '저장' : '업무 등록'}</button>
    </div>`;

  modal({
    title: editing ? '업무 수정' : '업무 등록',
    body, footer, wide: true,
    onMount({ root, close }) {
      const form = root.querySelector('#task-form');
      const areaSel = form.querySelector('[name=area]');
      const statusSel = form.querySelector('[name=status]');
      const outBox = form.querySelector('[data-out]');
      const dueInput = form.querySelector('[name=due_date]');
      const deliveryInput = form.querySelector('[name=delivery_due_date]');

      // 담당자는 사람을 고르지 않는다 — 선택한 영역의 리드가 곧 담당이다
      const leadBox = form.querySelector('[data-lead-box]');
      const collabPicker = memberPicker(form.querySelector('[data-collab-slot] .member-pick'), {
        multi: true,
        value: (task?.collaborators ?? []).map((c) => c.slack_user_id),
      });

      const syncLead = () => {
        const lead = leadOf(areaSel.value);
        leadBox.innerHTML = lead
          ? `${avatar(lead, 'sm')}<span>${esc(lead.display_name)}</span>`
            + `${lead.is_active ? '' : '<span class="inactive">(비활성)</span>'}`
          : '<span class="lead-none">이 영역의 리드가 없습니다 · Overview에서 지정해 주세요</span>';
        collabPicker.setExclude(lead ? [lead.slack_user_id] : []);
      };

      const syncArea = () => {
        const area = areaSel.value;
        const isOut = area === 'OUT';
        outBox.hidden = !isOut;
        const list = statusesFor(area);
        const keep = list.some((s) => s.code === statusSel.value) ? statusSel.value : list[0].code;
        statusSel.innerHTML = opts(list, keep);
      };
      areaSel.addEventListener('change', () => { syncArea(); syncLead(); });
      syncArea();
      syncLead();

      // 납품 예정일을 넣으면 마감일 기본값으로 채운다
      deliveryInput.addEventListener('change', () => {
        if (deliveryInput.value && !dueInput.value) dueInput.value = deliveryInput.value;
      });

      // 빠른 입력 — 폼을 채워 줄 뿐, 저장하지 않는다
      const captureBtn = root.querySelector('[data-capture]');
      const captureInput = root.querySelector('#capture-input');
      const captureRes = root.querySelector('.capture .cres');
      const runCapture = async () => {
        const text = captureInput.value.trim();
        if (!text) return;
        captureBtn.disabled = true;
        captureBtn.textContent = '읽는 중…';
        try {
          const r = await api.post('/api/ai/capture', { text });
          const f = r.fields;
          if (f.title) form.querySelector('[name=title]').value = f.title;
          if (f.project_id) form.querySelector('[name=project_id]').value = f.project_id;
          if (f.area) { areaSel.value = f.area; syncArea(); syncLead(); }
          if (f.due_date) dueInput.value = f.due_date;
          if (f.priority) form.querySelector('[name=priority]').value = f.priority;
          captureRes.hidden = false;
          captureRes.innerHTML = r.matched.length
            ? r.matched.map((m) => `<span class="tok">${esc(m.field)} <b>${esc(String(m.value))}</b></span>`).join('')
              + `<span class="tok">${r.source === 'llm' ? 'AI 해석' : '규칙 해석'}</span>`
            : '<span class="tok">인식된 항목이 없습니다. 아래에서 직접 입력해 주세요.</span>';
        } catch (err) {
          toast(err.message, true);
        }
        captureBtn.disabled = false;
        captureBtn.textContent = '채우기';
      };
      captureBtn?.addEventListener('click', runCapture);
      captureInput?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); runCapture(); }
      });

      root.querySelector('[data-save]').addEventListener('click', async () => {
        const fd = new FormData(form);
        const payload = Object.fromEntries([...fd.entries()].map(([k, v]) => [k, v === '' ? null : v]));
        payload.collaborators = collabPicker.value;

        if (!payload.title?.trim()) return toast('업무명을 입력해 주세요.', true);
        if (!payload.project_id) return toast('프로젝트를 선택해 주세요.', true);
        if (!leadOf(payload.area)) return toast('이 영역의 리드가 지정되지 않았습니다. Overview에서 영역 리드를 먼저 설정해 주세요.', true);
        if (!payload.due_date && !payload.delivery_due_date) return toast('마감일을 입력해 주세요.', true);

        try {
          const saved = editing
            ? await api.patch(`/api/tasks/${task.id}`, payload)
            : await api.post('/api/tasks', payload);
          toast(editing ? '업무를 저장했습니다.' : '업무를 등록했습니다.');
          const keepOpen = root.querySelector('#keep-open')?.checked;
          if (!editing && keepOpen) {
            close();
            taskForm({
              defaults: { project_id: payload.project_id, area: payload.area, owner: payload.owner_slack_user_id },
              onSaved,
            });
          } else {
            close();
          }
          onSaved?.(saved);
        } catch (err) {
          toast(err.message, true);
        }
      });
    },
  });
}

          close();
          onSaved?.(saved);
        } catch (err) {
          toast(err.message, true);
        }
      });
    },
  });
}

function areaLeadsForm({ onSaved }) {
  const current = Object.fromEntries(state.areaLeads.map((l) => [l.area, l.slack_user_id]));
  const people = activeMembers();

  const body = `
    <p class="hint" style="margin-bottom:14px">
      업무를 등록할 때 담당자를 따로 고르지 않습니다. 선택한 <b>업무 영역의 리드</b>가 담당이 됩니다.

    </p>

      ${state.meta.areas.map((a) => `
        <div class="lead-row">
          <span class="lead-area">${esc(a.full)}</span>
          <select data-area="${esc(a.code)}">
            <option value="">지정 안 함</option>
            ${people.map((m) => `<option value="${esc(m.slack_user_id)}"${
              current[a.code] === m.slack_user_id ? ' selected' : ''}>${esc(m.display_name)}</option>`).join('')}
          </select>
        </div>`).join('')}
    </div>`;

  modal({
    title: '영역 리드',
    body,
    footer: `<div class="right"><button class="btn" data-close>취소</button>
             <button class="btn btn-primary" data-save>저장</button></div>`,
    onMount({ root, close }) {
      root.querySelector('[data-save]').addEventListener('click', async () => {
        const leads = [...root.querySelectorAll('[data-area]')]
          .filter((sel) => sel.value)
          .map((sel) => ({ area: sel.dataset.area, slack_user_id: sel.value }));
        if (!leads.length) return toast('리드를 한 명 이상 지정해 주세요.', true);
        try {
          const result = await api.patch('/api/area-leads', { leads });
          const moved = result.reduce((n, r) => n + (r.moved ?? 0), 0);
          toast(moved ? `영역 리드를 저장했습니다. 업무 ${moved}건의 담당이 함께 바뀌었습니다.` : '영역 리드를 저장했습니다.');
          close();
          onSaved?.();
        } catch (err) {
          toast(err.message, true);
        }
      });
    },
  });
}




const SEV_LABEL = { high: '높음', medium: '보통', low: '낮음' };

// 한눈에 볼 수 있는 만큼만 펼쳐 둔다. 나머지는 접어 두되 몇 건인지는 알려준다.
const VISIBLE = 3;

/** 위험 신호 섹션 마크업. 근거가 되는 업무·이슈로 바로 이동할 수 있어야 한다. */
function riskSection(rows, { source = 'rules' } = {}) {
  const head = `
    <div class="section-head">
      <h2>위험 신호</h2>
      <span class="meta">
        <span class="src-tag ${source === 'llm' ? 'llm' : ''}">${source === 'llm' ? 'AI' : '규칙'}</span>
        데이터에서 자동으로 찾아냅니다
      </span>
    </div>`;

  if (!rows.length) {
    return `<section class="section">${head}
      <div class="risks-ok"><b>지금 눈에 띄는 위험 신호가 없습니다.</b>
        마감이 반복해서 밀리거나, 진행이 멈추거나, 납품이 임박한 업무가 생기면 여기에 표시됩니다.</div>
    </section>`;
  }

  const card = (r) => `
        <article class="risk ${esc(r.severity)}">
          <div class="head">
            <span class="sev">${esc(SEV_LABEL[r.severity] ?? r.severity)}</span>
            <h3>${esc(r.title)}</h3>
            <span class="cnt">${r.count}건</span>
          </div>
          <p class="detail">${esc(r.detail)}</p>
          <ul>
            ${r.items.slice(0, 5).map((i) => {
              const inner = `
                <span class="lbl">${esc(i.label)}</span>
                <span class="sub">${esc(i.sub ?? '')}</span>
                <span class="note">${esc(i.note ?? '')}</span>`;
              const target = i.kind === 'task' ? `#/tasks/${i.id}`
                : i.kind === 'issue' ? `#/issues/${i.id}`
                : i.kind === 'owner' ? `#/tasks?owner=${encodeURIComponent(i.id)}&done=1`
                : i.kind === 'project' ? `#/tasks?project=${encodeURIComponent(i.id)}&done=1`
                : i.kind === 'area' ? `#/tasks?area=${encodeURIComponent(i.id)}&done=1`
                : null;
              return `<li>${target
                ? `<button type="button" data-jump="${esc(target)}">${inner}</button>`
                : `<span class="static">${inner}</span>`}</li>`;
            }).join('')}
            ${r.items.length > 5
              ? `<li><span class="static"><span class="sub">외 ${r.items.length - 5}건</span></span></li>` : ''}
          </ul>
        </article>`;

  const shown = rows.slice(0, VISIBLE);
  const hidden = rows.slice(VISIBLE);

  return `<section class="section">${head}
    <div class="risks">
      ${shown.map(card).join('')}
      ${hidden.length ? `
        <div class="risks-more" hidden>${hidden.map(card).join('')}</div>
        <button class="btn risks-toggle" data-more aria-expanded="false">
          위험 신호 ${hidden.length}건 더 보기
        </button>` : ''}
    </div>
  </section>`;
}

];

const paramsOf = (query) => {
  const p = new URLSearchParams(query);
  return p;
};

const matchesQuick = (p, quick) => {
  const entries = Object.entries(quick.params);
  return entries.every(([k, v]) => p.get(k) === v)
    && [...p.keys()].filter((k) => k !== 'done').length === entries.filter(([k]) => k !== 'done').length;
};

async function renderTasks(root, query) {
  const p = paramsOf(query);
  root.innerHTML = loading();

  let rows;
  try {
    rows = await api.get(`/api/tasks?${p.toString()}`);
  } catch (err) {
    root.innerHTML = errorBox(err.message);
    return;
  }

  const setParam = (patch) => {
    const next = new URLSearchParams(p);
    for (const [k, v] of Object.entries(patch)) {
      if (v === null || v === undefined || v === '') next.delete(k);
      else next.set(k, v);
    }
    go(`#/tasks?${next.toString()}`);
  };

  const projectOptions = activeProjects()
    .map((pr) => `<option value="${esc(pr.id)}"${p.get('project') === pr.id ? ' selected' : ''}>${esc(pr.name)}</option>`).join('');

    .map((a) => `<option value="${esc(a.code)}"${p.get('area') === a.code ? ' selected' : ''}>${esc(a.full)}</option>`).join('');
  const ownerOptions = state.members
    .map((m) => `<option value="${esc(m.slack_user_id)}"${p.get('owner') === m.slack_user_id ? ' selected' : ''}>${esc(m.display_name)}${m.is_active ? '' : ' (비활성)'}</option>`).join('');

    </div>

    <div class="filters">
      <div class="quick">
        ${QUICK.map((q) => `<button data-quick="${q.key}" class="${matchesQuick(p, q) ? 'on' : ''}">${esc(q.label)}</button>`).join('')}
      </div>
    </div>

    <div class="filter-row" style="margin-bottom:16px">

      <select data-f="area"><option value="">영역 전체</option>${areaOptions}</select>
      <select data-f="owner"><option value="">리드 전체</option><option value="me"${p.get('owner') === 'me' ? ' selected' : ''}>나</option>${ownerOptions}</select>
      <input type="search" data-f="q" value="${esc(p.get('q') ?? '')}" placeholder="업무명 검색">
      <label style="display:flex;align-items:center;gap:6px;font-size:.83rem;color:var(--muted)">
        <input type="checkbox" data-f="done" ${p.get('done') === '1' ? 'checked' : ''}> 완료 포함

              <th>업무</th>
              <th>프로젝트</th>
              <th>영역</th>
              <th>담당</th>
              <th class="nowrap">마감</th>
              <th class="nowrap">상태</th>
              <th class="nowrap">이슈</th>

                <td class="title-cell">${esc(t.title)} ${flags(t)}</td>
                <td data-label="프로젝트">${esc(t.project_name)}</td>
                <td data-label="영역">${areaChip(t.area)}</td>

                  ${shortDate(t.due_date)}
                  <span style="color:var(--muted);font-size:.76rem">${t.status === 'DONE' ? '' : dDay(t.d_day)}</span>
                </td>
                <td data-label="상태" class="nowrap">
                  <select class="status-select" data-status="${esc(t.id)}" data-area="${esc(t.area)}" aria-label="상태 변경">
                    ${(t.area === 'OUT' ? state.meta.out_statuses : state.meta.normal_statuses)
                      .map((s) => `<option value="${esc(s.code)}"${s.code === t.status ? ' selected' : ''}>${esc(s.label)}</option>`).join('')}
                  </select>
                </td>
                <td data-label="이슈" class="nowrap issue-cell">${t.has_open_issue ? `<span class="flag issue">🔥 ${t.open_issue_count}</span>` : '<span style="color:var(--muted)">-</span>'}</td>
              </tr>`).join('')}

        hint: [...p.keys()].length ? '' : '업무를 등록하면 전체 현황이 자동으로 집계됩니다.',
        action: [...p.keys()].length
          ? '<button class="btn" data-reset>필터 초기화</button>'
          : '<button class="btn btn-primary" data-new-task>+ 업무 등록</button>',
      })}`;

  root.addEventListener('change', async (e) => {
    const sel = e.target.closest('[data-status]');
    if (sel) {
      try {
        await api.patch(`/api/tasks/${sel.dataset.status}`, { status: sel.value });
        toast('상태를 변경했습니다.');
        window.dispatchEvent(new Event('kf:reload'));
      } catch (err) {
        toast(err.message, true);
        window.dispatchEvent(new Event('kf:reload'));
      }
      return;
    }
    const f = e.target.closest('[data-f]');
    if (f) {
      const key = f.dataset.f;
      setParam({ [key]: f.type === 'checkbox' ? (f.checked ? '1' : null) : f.value });
    }
  });

  root.addEventListener('keydown', (e) => {
    const f = e.target.closest('[data-f=q]');
    if (f && e.key === 'Enter') setParam({ q: f.value });
  });

  root.addEventListener('click', (e) => {
    if (e.target.closest('.status-select')) return;
    const quick = e.target.closest('[data-quick]');
    if (quick) {
      const q = QUICK.find((x) => x.key === quick.dataset.quick);
      go(`#/tasks?${new URLSearchParams(q.params).toString()}`);
      return;
    }
    if (e.target.closest('[data-reset]')) { go('#/tasks'); return; }
    const row = e.target.closest('[data-open]');
    if (row) go(`#/tasks/${row.dataset.open}`);
  });
}

      <div style="display:flex;flex-direction:column;gap:22px">
        <div class="panel">
          <h3>연결된 이슈 ${t.issues.length ? `(${t.issues.length})` : ''}
            <button class="btn btn-ghost" data-new-issue style="float:right">+ 이슈 등록</button></h3>
          ${t.issues.length ? t.issues.map((i) => `
            <div class="issue-mini">

              <span class="chip ${i.status === 'RESOLVED' ? 'done' : i.status === 'CHECKING' ? 'issue' : 'delay'}">
                ${esc(state.meta.issue_statuses.find((s) => s.code === i.status)?.label ?? i.status)}</span>
            </div>`).join('')
            : '<p style="color:var(--muted);font-size:.86rem">등록된 이슈가 없습니다. 진행을 막는 문제가 있으면 이슈로 남겨 주세요.</p>'}
        </div>

        <div class="panel">
          <h3>변경 이력</h3>
          <div class="timeline">
            ${t.events.map((e) => `
              <div class="ev">
                <span class="t">${dateTime(e.occurred_at)}</span>
                <span>${esc(e.actor_name)} · ${esc(EVENT_LABEL[e.event_type] ?? e.event_type)}
                  ${e.event_type === 'STATUS_CHANGED' ? `<b>${esc(statusLabel(e.from_value))} → ${esc(statusLabel(e.to_value))}</b>` : ''}
                  ${e.event_type === 'DUE_CHANGED' ? `<b>${shortDate(e.from_value)} → ${shortDate(e.to_value)}</b>` : ''}
                  ${e.event_type === 'REVIEW_STATUS_CHANGED' ? `<b>${esc(reviewLabel(e.from_value))} → ${esc(reviewLabel(e.to_value))}</b>` : ''}
                </span>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>`;

  root.addEventListener('change', async (e) => {
    if (e.target.closest('[data-status]')) {
      const next = e.target.value;
      if (t.status === 'DONE' && next !== 'DONE') {
        const ok = await confirmModal('완료된 업무입니다. 상태를 되돌리면 완료 시각이 지워집니다. 계속할까요?');
        if (!ok) return reload();
      }
      if (t.area === 'OUT' && next === 'DONE' && t.review_status !== 'APPROVED') {
        const ok = await confirmModal('검수 상태가 승인이 아닙니다. 그래도 완료 처리할까요?');
        if (!ok) return reload();
      }
      try {
        await api.patch(`/api/tasks/${t.id}`, { status: next });
        toast('상태를 변경했습니다.');
      } catch (err) { toast(err.message, true); }
      reload();
      return;
    }
    if (e.target.closest('[data-review]')) {
      const next = e.target.value;
      try {
        await api.patch(`/api/tasks/${t.id}`, { review_status: next });
        toast('검수 상태를 변경했습니다.');
        if (next === 'REJECTED' && t.status !== 'OUT_REVISION') {
          const ok = await confirmModal('반려 처리했습니다. 업무 상태를 "수정"으로 전환할까요?');
          if (ok) await api.patch(`/api/tasks/${t.id}`, { status: 'OUT_REVISION' });
        }
      } catch (err) { toast(err.message, true); }
      reload();
    }
  });

  root.addEventListener('click', async (e) => {
    if (e.target.closest('[data-edit]')) {
      taskForm({ task: t, onSaved: reload });
    } else if (e.target.closest('[data-new-issue]')) {
      issueForm({ defaults: { project_id: t.project_id, task_id: t.id }, onSaved: reload });
    } else if (e.target.closest('[data-delete]')) {
      const ok = await confirmModal('이 업무를 삭제할까요? 연결된 이슈는 남습니다.', { confirmLabel: '삭제', danger: true });
      if (!ok) return;
      await api.del(`/api/tasks/${t.id}`);
      toast('업무를 삭제했습니다.');
      go('#/tasks');
    }
  });
}







const severityLabel = (code) => state.meta.priorities.find((p) => p.code === code)?.label ?? code;

async function renderIssues(root, query) {
  const p = new URLSearchParams(query);
  root.innerHTML = loading();
  let rows;
  try {
    rows = await api.get(`/api/issues?${p.toString()}`);
  } catch (err) {
    root.innerHTML = errorBox(err.message);
    return;
  }

  const set = (patch) => {
    const next = new URLSearchParams(p);
    for (const [k, v] of Object.entries(patch)) {
      if (!v) next.delete(k); else next.set(k, v);
    }
    go(`#/issues?${next.toString()}`);
  };
  const on = (k, v) => (p.get(k) === v ? 'on' : '');

  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Issues</h1>
        <div class="sub">${rows.length}건 · 업무 상태와 이슈 상태는 분리해서 관리합니다</div>
      </div>
      <div class="page-actions"><button class="btn btn-primary" data-new-issue>+ 이슈 등록</button></div>
    </div>

    <div class="filters">
      <div class="quick">
        <button data-q="clear" class="${[...p.keys()].length === 0 ? 'on' : ''}">미해결</button>
        <button data-q="mine" class="${on('owner', 'me')}">내 담당 이슈</button>
        <button data-q="open" class="${on('status', 'OPEN')}">Open</button>
        <button data-q="checking" class="${on('status', 'CHECKING')}">확인중</button>
        <button data-q="high" class="${on('severity', 'HIGH')}">중요도 높음</button>
        <button data-q="resolved" class="${on('resolved', '1')}">해결 포함</button>
      </div>
    </div>

    ${rows.length ? `
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>이슈</th><th>프로젝트</th><th>관련 업무</th>
                <th>담당</th><th class="nowrap">중요도</th><th class="nowrap">목표일</th><th class="nowrap">상태</th></tr>
          </thead>
          <tbody>
            ${rows.map((i) => `
              <tr class="row-click" data-open="${esc(i.id)}">
                <td class="title-cell"><span class="sev-bar ${esc(i.severity)}"></span>${esc(i.title)}</td>
                <td data-label="프로젝트">${esc(i.project_name)}</td>
                <td data-label="관련 업무">${i.task_title ? esc(i.task_title) : '<span style="color:var(--muted)">-</span>'}</td>
                <td data-label="담당">${person(i.owner_slack_user_id, i.owner_name)}</td>
                <td data-label="중요도" class="nowrap">${esc(severityLabel(i.severity))}</td>
                <td data-label="목표일" class="nowrap num" style="${i.target_resolve_date && i.target_resolve_date < state.today && i.status !== 'RESOLVED' ? 'color:var(--s-delay)' : ''}">
                  ${shortDate(i.target_resolve_date)}</td>
                <td data-label="상태" class="nowrap">
                  <select data-status="${esc(i.id)}" class="status-select" aria-label="이슈 상태">
                    ${state.meta.issue_statuses.map((s) =>
                      `<option value="${esc(s.code)}"${s.code === i.status ? ' selected' : ''}>${esc(s.label)}</option>`).join('')}
                  </select>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>` : empty({
        title: [...p.keys()].length ? '조건에 맞는 이슈가 없습니다' : '등록된 이슈가 없습니다',
        hint: '업무 진행을 막는 문제와 블로커를 이슈로 남겨 주세요.',
        action: '<button class="btn btn-primary" data-new-issue>+ 이슈 등록</button>',
      })}`;

  root.addEventListener('change', async (e) => {
    const sel = e.target.closest('[data-status]');
    if (!sel) return;
    try {
      await api.patch(`/api/issues/${sel.dataset.status}`, { status: sel.value });
      toast('이슈 상태를 변경했습니다.');
    } catch (err) { toast(err.message, true); }
    window.dispatchEvent(new Event('kf:reload'));
  });

  root.addEventListener('click', (e) => {
    if (e.target.closest('.status-select')) return;
    const q = e.target.closest('[data-q]')?.dataset.q;
    if (q) {
      const map = {
        clear: '#/issues',
        mine: '#/issues?owner=me',
        open: '#/issues?status=OPEN',
        checking: '#/issues?status=CHECKING',
        high: '#/issues?severity=HIGH',
        resolved: '#/issues?resolved=1',
      };
      go(map[q]);
      return;
    }
    const row = e.target.closest('[data-open]');
    if (row) go(`#/issues/${row.dataset.open}`);
  });
}

const sec = (n, title, inner) => `
  <section class="rsec"><h3><span class="n">${n}</span>${esc(title)}</h3>${inner}</section>`;

const deltaTag = (d) => {
  if (d === null || d === undefined) return '<span class="delta flat">-</span>';
  if (d === 0) return '<span class="delta flat">±0%p</span>';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}%p</span>`;
};

const taskLine = (t, extra = '') => `
  <li><a href="#/tasks/${esc(t.id)}" style="text-decoration:underline">${esc(t.title)}</a>
    <span style="color:var(--muted)">· ${esc(t.project_name)} · ${esc(t.owner_name)} · ${esc(t.status_label)}${extra}</span></li>`;

        <div class="pill-row">
          <div class="pill"><div class="k">진행 외주</div><div class="v">${s.outsourcing.active}</div></div>
          <div class="pill"><div class="k">검수</div><div class="v">${s.outsourcing.review}</div></div>
          <div class="pill"><div class="k">수정</div><div class="v">${s.outsourcing.revision}</div></div>
          <div class="pill ${s.outsourcing.delivery_delayed ? 'bad' : ''}"><div class="k">납품 지연</div><div class="v">${s.outsourcing.delivery_delayed}</div></div>
        </div>
        ${s.outsourcing.delayed_rows.length ? `<ul style="margin-top:12px">
          ${s.outsourcing.delayed_rows.map((r) => `<li><a href="#/tasks/${esc(r.id)}" style="text-decoration:underline">${esc(r.title)}</a>
            <span style="color:var(--muted)">· ${esc(r.vendor_name ?? '-')} · ${esc(r.owner_name)} ·
            <b style="color:var(--s-delay)">${r.days_late}일 지연</b></span></li>`).join('')}
        </ul>` : ''}`)}

      ${sec('⑦', '주요 이슈', `
        <p class="hint" style="margin-bottom:10px">미해결 ${s.issues.open_count}건 · 이번 주 신규 ${s.issues.new_this_week}건 · 해결 ${s.issues.resolved_this_week}건</p>
        ${s.issues.rows.length ? `<ul>${s.issues.rows.map((i) => `
          <li><a href="#/issues/${esc(i.id)}" style="text-decoration:underline">${esc(i.title)}</a>
            <span style="color:var(--muted)">· ${esc(i.project_name)} · ${esc(i.owner_name)} ·
            ${i.severity === 'HIGH' ? '<b style="color:var(--s-delay)">높음</b>' : i.severity === 'LOW' ? '낮음' : '보통'}
            ${i.impact ? ` · ${esc(i.impact)}` : ''}</span></li>`).join('')}</ul>`
          : '<p class="hint">미해결 이슈가 없습니다.</p>'}`)}

      ${sec('⑧', '리드별 현황', `
        <div class="table-wrap">
          <table>
            <thead><tr><th>리드</th><th class="nowrap">담당 업무</th><th class="nowrap">진행</th>
              <th class="nowrap">이번 주 완료</th><th class="nowrap">지연</th><th class="nowrap">진행률</th></tr></thead>
            <tbody>
              ${s.owners.map((o) => `
                <tr><td>${person(o.slack_user_id, o.display_name)}</td>
                  <td class="num">${o.count}</td><td class="num">${o.in_progress}</td>
                  <td class="num">${o.completed_this_week}</td>
                  <td class="num" style="${o.delayed ? 'color:var(--s-delay)' : ''}">${o.delayed}</td>
                  <td class="num">${pctText(o.progress)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
        ${s.handover.length ? `<p class="hint" style="margin-top:10px">인수인계 필요 — ${esc(s.handover.map((h) => `${h.display_name} ${h.open}건`).join(' · '))}</p>` : ''}`)}

      ${sec('⑨', '다음 주 주요 업무', `
        <h4 style="font-size:.85rem;color:var(--muted);margin-bottom:7px">마감 예정 ${s.next_week.due.length}건 (${shortDate(s.next_week.period.start)} ~ ${shortDate(s.next_week.period.end)})</h4>
        ${s.next_week.due.length ? `<ul>${s.next_week.due.map((t) => taskLine(t, ` · 마감 ${shortDate(t.due_date)}`)).join('')}</ul>` : '<p class="hint">없습니다.</p>'}
        ${s.next_week.delivery.length ? `
          <h4 style="font-size:.85rem;color:var(--muted);margin:16px 0 7px">외주 납품 예정 ${s.next_week.delivery.length}건</h4>
          <ul>${s.next_week.delivery.map((t) => `<li>${esc(t.title)}
            <span style="color:var(--muted)">· ${esc(t.vendor_name ?? '-')} · ${shortDate(t.delivery_due_date)}</span></li>`).join('')}</ul>` : ''}`)}
    </div>`;

  root.addEventListener('click', async (e) => {
    const wk = e.target.closest('[data-week]');
    if (wk) return go(`#/weekly?week=${wk.dataset.week}`);

    if (e.target.closest('[data-generate]')) {
      try {
        await api.post('/api/weekly/generate', { week: report.period_start });
        toast('리포트를 생성했습니다.');
        window.dispatchEvent(new Event('kf:reload'));
      } catch (err) { toast(err.message, true); }
      return;
    }
    if (e.target.closest('[data-share]')) {
      try {
        const res = await api.post(`/api/weekly/${report.id}/share`);
        if (res.status === 'ALREADY_SHARED') toast('이미 공유한 리포트입니다.');
        else if (res.status === 'SENT') toast(`Slack ${res.channel} 채널에 공유했습니다.`);
        else if (!res.channel_configured) toast('SLACK_DEFAULT_CHANNEL 미설정 — 알림함에 기록했습니다.');
        else toast('Slack 미연동 — 알림함에 기록했습니다.');
        window.dispatchEvent(new Event('kf:reload'));
      } catch (err) { toast(err.message, true); }
      return;
    }
    if (e.target.closest('[data-digest]')) {
      const box = root.querySelector('#digest');
      const btn = box.querySelector('[data-digest]');
      btn.disabled = true;
      btn.textContent = '생성 중…';
      try {
        const d = await api.post('/api/ai/digest', { week: report.period_start });
        box.innerHTML = renderDigest(d);
      } catch (err) {
        toast(err.message, true);
        btn.disabled = false;
        btn.textContent = '요약문 생성';
      }
      return;
    }
    if (e.target.closest('[data-copy]')) {
      const text = toMarkdown(report);
      try {
        await navigator.clipboard.writeText(text);
        toast('마크다운으로 복사했습니다.');
      } catch {
        toast('복사에 실패했습니다. 브라우저 권한을 확인해 주세요.', true);
      }
    }
  });
}

function renderDigest(d) {
  return `
    <div class="dhead">
      <h3>요약문</h3>
      <span class="src-tag ${d.source === 'llm' ? 'llm' : ''}">${d.source === 'llm' ? 'AI 작성' : '규칙 작성'}</span>
      <button class="btn" data-digest>다시 생성</button>
    </div>
    <p class="sum">${esc(d.summary)}</p>
    ${d.highlights?.length ? `<div class="dsub">주목할 점</div>
      <ul class="dlist">${d.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}
    ${d.focus?.length ? `<div class="dsub">다음 주 초점</div>
      <ul class="dlist">${d.focus.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}`;
}

function shiftWeek(iso, days) {
  const d = new Date(`${iso}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function toMarkdown(report) {
  const s = report.snapshot;
  const L = [];
  L.push(`# KinderFlow Weekly Report (${report.period_start} ~ ${report.period_end})`, '');
  L.push('## ① 전체 업무 현황');
  L.push(`- 이번 주 완료 ${s.summary.completed_this_week} · 진행중 ${s.summary.in_progress} · 검토 ${s.summary.review} · 지연 ${s.summary.delayed} · 신규 ${s.summary.created_this_week}`, '');
  L.push('## ② 프로젝트별 진행');
  for (const p of s.projects) {
    const d = p.delta === null ? '-' : `${p.delta > 0 ? '+' : ''}${p.delta}%p`;
    L.push(`- ${p.name}: ${p.progress ?? '-'}% (${d}) · 이번 주 완료 ${p.completed_this_week}건`);
  }
  L.push('', '## ③ 업무 영역별 진행');
  for (const a of s.areas.filter((x) => x.count > 0)) L.push(`- ${a.label}: ${a.progress ?? '-'}% (업무 ${a.count}건)`);
  L.push('', '## ④ 주요 완료 업무');
  for (const t of s.completed.rows) L.push(`- ${t.title} (${t.project_name} · ${t.owner_name})`);
  if (s.completed.more) L.push(`- 외 ${s.completed.more}건`);
  L.push('', '## ⑤ 진행 및 지연 업무');
  for (const t of s.progressing.delayed) L.push(`- [지연 ${t.days_late}일] ${t.title} (${t.project_name} · ${t.owner_name})`);
  L.push('', '## ⑥ 외주 진행 현황');
  L.push(`- 진행 ${s.outsourcing.active}건 · 검수 ${s.outsourcing.review}건 · 수정 ${s.outsourcing.revision}건 · 납품 지연 ${s.outsourcing.delivery_delayed}건`);
  L.push('', '## ⑦ 주요 이슈');
  for (const i of s.issues.rows) L.push(`- [${i.severity}] ${i.title} (${i.project_name} · ${i.owner_name})${i.impact ? ` — ${i.impact}` : ''}`);
  L.push('', '## ⑧ 리드별 현황');
  for (const o of s.owners) L.push(`- ${o.display_name}: 담당 ${o.count} · 진행 ${o.in_progress} · 이번 주 완료 ${o.completed_this_week} · 지연 ${o.delayed}`);
  L.push('', '## ⑨ 다음 주 주요 업무');
  for (const t of s.next_week.due) L.push(`- ${t.title} (${t.project_name} · ${t.owner_name} · 마감 ${t.due_date})`);
  return L.join('\n');
}

  root.innerHTML = `
    <div class="page-head">
      <div>

    ${data.rows.length ? `
      <div class="noti-list">

              <span class="tag">${esc(n.channel)}</span>
              <span class="ttl">${esc(KIND_LABEL[n.kind] ?? n.kind)}</span>
              <span style="color:var(--muted);font-size:.82rem">→ ${
                n.channel === 'DM' ? person(n.target) : esc(n.target)}</span>
              <span class="tag ${esc(n.status)}">${esc(n.status)}</span>
              <span class="when">${dateTime(n.created_at)}</span>

      window.dispatchEvent(new Event('kf:reload'));
    } catch (err) { toast(err.message, true); }
  });
}












const view = document.getElementById('view');

const parseHash = () => {
  const raw = window.location.hash.replace(/^#/, '') || '/overview';
  const [path, query = ''] = raw.split('?');
  return { segments: path.split('/').filter(Boolean), query };
};

async function render() {
  const { segments, query } = parseHash();
  const [top, id] = segments;

  document.querySelectorAll('#gnb a').forEach((a) => {
    a.classList.toggle('active', a.dataset.nav === (top || 'overview'));
  });

  // 뷰마다 새 노드를 만들어 이전 리스너를 함께 버린다
  const fresh = document.createElement('div');
  view.replaceChildren(fresh);

  try {
    switch (top) {
      case undefined:
      case 'overview': await renderOverview(fresh); break;
      case 'tasks':
        if (id) await renderTaskDetail(fresh, id);
        else await renderTasks(fresh, query);
        break;
      case 'issues':
        if (id) await renderIssueDetail(fresh, id);
        else await renderIssues(fresh, query);
        break;
      case 'weekly': await renderWeekly(fresh, query); break;
      case 'notifications': await renderNotifications(fresh); break;
      default:
        fresh.innerHTML = errorBox('없는 화면입니다.');
    }
  } catch (err) {
    fresh.innerHTML = errorBox(err.message || '화면을 그리지 못했습니다.');
    console.error(err);
  }
}

function renderMePicker() {
  const sel = document.getElementById('me-select');
  sel.innerHTML = state.members
    .filter((m) => m.is_active)
    .map((m) => `<option value="${esc(m.slack_user_id)}"${m.slack_user_id === state.me ? ' selected' : ''}>${esc(m.display_name)}</option>`)
    .join('');
}

async function boot() {
  view.innerHTML = loading();
  try {
    await loadBootstrap();
  } catch (err) {
    view.innerHTML = errorBox(`${err.message} — 서버가 실행 중인지 확인해 주세요.`);
    return;
  }
  renderMePicker();
  await render();
}

document.getElementById('me-select').addEventListener('change', async (e) => {
  setMe(e.target.value);
  await render();
});

// 로그인 대신 현재 사용자를 고르는 구조이므로, 바뀌면 화면을 다시 그린다
document.getElementById('btn-new-task').addEventListener('click', () => {
  taskForm({ onSaved: () => window.dispatchEvent(new Event('kf:reload')) });
});

// 각 뷰의 "+ 업무 등록" 버튼 (위임)
view.addEventListener('click', (e) => {
  if (e.target.closest('[data-new-task]')) {
    taskForm({ onSaved: () => window.dispatchEvent(new Event('kf:reload')) });
  } else if (e.target.closest('[data-new-issue]')) {
    issueForm({ onSaved: () => window.dispatchEvent(new Event('kf:reload')) });
  }
});

window.addEventListener('hashchange', render);
window.addEventListener('kf:reload', async () => {
  await loadBootstrap().catch(() => {});
  renderMePicker();
  render();
});

boot();
