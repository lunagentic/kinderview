<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>KinderFlow</title>
<meta name="description" content="프로젝트의 업무와 담당을 명확히 정의하고 진행·이슈를 추적하는 업무 관리 도구">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/project">
      <span class="brand-char" aria-hidden="true"></span>
      <span class="brand-text">
      <span class="brand-mark">KinderFlow</span>
      <span class="brand-sub">문서보고 간소화</span>
      </span>
    </a>
    <nav class="gnb" id="gnb">
      <a href="#/project" data-nav="project">프로젝트 매니징</a>
      <!-- 타임트래킹은 상단 메뉴에서 숨긴 상태다 (2026-09-06).
           화면과 API 는 그대로 살아 있어 #/time 으로는 열린다.
           다시 꺼내려면 아래 한 줄의 주석을 풀면 된다.
      <a href="#/time" data-nav="time">타임트래킹</a>
      -->
      <a href="#/invoice" data-nav="invoice">인보이싱</a>
    </nav>
    <div class="topbar-right">
      <span class="sync-badge" id="sync-badge" hidden></span>
      <button class="gate-badge" id="gate-badge" title="편집 권한">보기 전용</button>
      <a class="topbar-util inbox-link" href="#/notifications" data-nav="notifications" title="알림함">알림함<span class="inbox-badge" id="inbox-badge" hidden></span></a>
      <button class="btn btn-primary" id="btn-new-task">+ 업무<span class="wide"> 등록</span></button>
      <label class="me-picker">
        <span class="me-label">현재 사용자</span>
        <select id="me-select" aria-label="현재 사용자"></select>
      </label>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
